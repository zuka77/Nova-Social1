<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA Social</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<style>
:root{--bg:#070709;--panel:#101014;--panel2:#17171c;--line:#292931;--muted:#8c8c98;--text:#fff;--accent:#7557ff;--danger:#ff4668;--ok:#38d996}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
button,input,textarea{font:inherit}
button{border:0;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.app{min-height:100dvh}
.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 1180px)/2));position:sticky;top:0;background:#070709ed;backdrop-filter:blur(18px);z-index:20}
.logo{background:none;font-size:24px;font-weight:950;letter-spacing:-1.5px}
.logo span{color:var(--accent)}
.top-actions{display:flex;gap:5px}
.icon{width:42px;height:42px;background:transparent;display:grid;place-items:center;border-radius:12px}
.icon:hover{background:#19191f}
.icon svg,.navbtn svg,.post-actions svg,.send svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:210px minmax(0,650px) 260px;gap:18px;padding:18px 14px 90px}
.side{position:sticky;top:82px;height:max-content}
.nav{display:grid;gap:5px}
.navbtn{background:transparent;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left}
.navbtn:hover,.navbtn.active{background:#15151a}
.navbtn .label{font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px}
.cardpad{padding:16px}
.section-title{font-size:24px;font-weight:900;margin:4px 2px 14px}
.empty{padding:50px 18px;text-align:center;color:var(--muted)}
.searchbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 13px;margin-bottom:12px}
.searchbox input{width:100%;height:46px;background:none;border:0;outline:0;color:#fff}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#25252c;display:inline-grid;place-items:center;font-weight:900;flex:none}
.avatar.sm{width:38px;height:38px}
.avatar.lg{width:92px;height:92px}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:11px}
.userrow{width:100%;background:transparent;display:flex;align-items:center;gap:11px;padding:12px 14px;text-align:left}
.userrow:hover{background:#17171c}
.userinfo{min-width:0;flex:1}
.userinfo b,.userinfo small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userinfo small{color:var(--muted);margin-top:3px}
.follow{padding:8px 13px;background:var(--accent);border-radius:10px;font-weight:800}
.follow.on{background:#24242c}
.posthead{display:flex;align-items:center;gap:11px;padding:14px}
.posthead .grow{flex:1}
.posttext{padding:0 16px 14px;white-space:pre-wrap;word-break:break-word}
.postmedia{display:block;width:100%;max-height:620px;object-fit:cover;background:#050506}
.postvideo{display:block;width:100%;max-height:620px;background:#050506}
.postactions{display:flex;border-top:1px solid var(--line);padding:4px}
.postactions button{background:none;flex:1;padding:11px 6px;display:flex;justify-content:center;align-items:center;gap:6px;border-radius:10px}
.postactions button:hover{background:#18181d}
.composer textarea,.chatbox textarea{width:100%;background:#16161b;border:1px solid var(--line);color:#fff;outline:0;border-radius:15px;padding:13px;resize:none}
.tools{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.primary{background:var(--accent);color:#fff;border-radius:12px;padding:11px 17px;font-weight:850}
.secondary{background:#24242b;border-radius:12px;padding:11px 14px;font-weight:750}
.filepick{display:none}
.preview{margin-top:10px}
.preview img,.preview video{width:100%;max-height:420px;object-fit:contain;background:#050506;border-radius:14px}
.stories{display:flex;gap:13px;overflow:auto;padding:13px}
.story{background:none;min-width:68px;text-align:center;font-size:11px}
.storyring{width:58px;height:58px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#8c65ff,#ff4f86,#ffb13d);margin:auto auto 5px}
.storyring .avatar{width:54px;height:54px;border:2px solid var(--panel)}
.addstory{width:54px;height:54px;border-radius:50%;background:#202027;display:grid;place-items:center;font-size:27px}
.profilecover{height:130px;background:linear-gradient(135deg,#17171e,#342553)}
.profilebody{padding:0 17px 18px}
.profileavatar{margin-top:-46px;border:4px solid var(--panel)}
.profilename{font-size:24px;font-weight:900;margin-top:8px}
.handle{color:var(--muted)}
.bio{margin-top:7px;white-space:pre-wrap}
.stats{display:flex;gap:28px;margin:16px 0}
.stats b,.stats span{display:block}
.stats span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px}
.chat{height:calc(100dvh - 92px);display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:8px;padding:7px 0 12px;border-bottom:1px solid var(--line)}
.chathead .grow{flex:1}
.messages{flex:1;overflow:auto;padding:14px 2px}
.msgrow{display:flex;margin:5px 0}
.msgrow.me{justify-content:flex-end}
.bubble{max-width:min(80%,460px);background:#1b1b22;border-radius:18px;padding:9px 11px;word-break:break-word;position:relative}
.msgrow.me .bubble{background:var(--accent)}
.bubble img,.bubble video{display:block;max-width:100%;max-height:380px;border-radius:12px;margin-bottom:5px}
.bubble audio{max-width:240px}
.bubbletime{display:block;font-size:10px;opacity:.55;margin-top:5px}
.reply{border-left:3px solid #aaa;padding:5px 8px;background:#0002;border-radius:8px;margin-bottom:6px;font-size:12px;opacity:.8}
.chatbox{display:flex;align-items:end;gap:6px;border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));background:var(--bg)}
.chatbox textarea{flex:1;min-height:42px;max-height:120px}
.sendbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.recording{background:#3b1621!important;color:#ff5575!important}
.modal{position:fixed;inset:0;background:#000a;z-index:100;display:grid;place-items:center;padding:15px}
.modalcard{width:min(520px,100%);max-height:90dvh;overflow:auto;background:#111116;border:1px solid var(--line);border-radius:20px;padding:17px}
.toast{position:fixed;z-index:200;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 15px;border-radius:13px;font-size:13px;box-shadow:0 10px 35px #0008;max-width:90vw}
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px}
.authcard{width:min(410px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px}
.authlogo{font-size:35px;font-weight:950;margin-bottom:6px}
.field{margin:10px 0}
.field input{width:100%;height:48px;border:1px solid var(--line);background:#17171c;color:#fff;border-radius:12px;padding:0 13px;outline:0}
.switch{margin-top:15px;text-align:center;color:var(--muted)}
.switch button{background:none;color:#a58fff}
.rightcard{padding:15px}
.righttitle{font-weight:900;margin-bottom:8px}
.danger{color:#ff5874}
.replybar{display:none;padding:8px 10px;background:#17171c;border-top:1px solid var(--line);font-size:12px}
.replybar.show{display:flex;align-items:center;gap:8px}
.replybar .grow{flex:1}
.typing{font-size:11px;color:var(--muted);padding:2px 10px}
.mediaLabel{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:#18181d;border-radius:12px;cursor:pointer}
.notice{font-size:12px;color:#aaa;padding:10px 14px;background:#15151a;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}

@media(max-width:1000px){
.layout{grid-template-columns:72px minmax(0,650px);justify-content:center}
.navbtn .label{display:none}
.navbtn{justify-content:center}
.rightside{display:none}
}

@media(max-width:680px){
.top{height:58px}
.layout{display:block;padding:9px 8px 80px}
.leftside{display:none}
.mobile{position:fixed;left:0;right:0;bottom:0;height:66px;padding-bottom:env(safe-area-inset-bottom);display:flex!important;justify-content:space-around;align-items:center;background:#08080aed;backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:30}
.mobile .icon{width:48px}
.chat{height:calc(100dvh - 58px - 66px)}
.postmedia,.postvideo{max-height:500px}
}
.mobile{display:none}
</style>
</head>

<body>
<div id="app"></div>

<script>
(()=>{
'use strict';

const CFG={
 endpoint:'https://fra.cloud.appwrite.io/v1',
 projectId:'6aa242bf00012f890e92',
 databaseId:'6aa41332002b049743d5',
 bucketId:'6aa421b20025a1b4aac8'
};

const T={
 profiles:'profiles',
 posts:'posts',
 conversations:'conversations',
 conversation_members:'conversation_members',
 messages:'messages',
 message_reactions:'message_reactions',
 comments:'comments',
 reactions:'reactions',
 follows:'follows',
 notifications:'notifications',
 stories:'stories',
 story_views:'story_views',
 story_reactions:'story_reactions',
 story_replies:'story_replies',
 user_presence:'user_presence',
 reports:'reports',
 post_media:'post_media',
 story_media:'story_media',
 verification:'verification',
 user_blocks:'user_blocks',
 comment_reactions:'comment_reactions'
};

const {
 Client,
 Account,
 TablesDB,
 Storage,
 ID,
 Query,
 Realtime,
 Channel
}=Appwrite;

const client=new Client()
 .setEndpoint(CFG.endpoint)
 .setProject(CFG.projectId);

const account=new Account(client);
const db=new TablesDB(client);
const storage=new Storage(client);
const realtime=new Realtime(client);

let me=null;
let myProfile=null;
let profiles=[];
let activeChat=null;
let activeUser=null;
let replyingTo=null;
let recording=null;
let chunks=[];
let subs=[];
let mediaState={};

const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(
 /[&<>"']/g,
 c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[c])
);

function toast(m){
 const x=document.createElement('div');
 x.className='toast';
 x.textContent=m;
 document.body.appendChild(x);
 setTimeout(()=>x.remove(),2800);
}

function fail(e){
 console.error(e);
 toast(e?.message||'Something went wrong');
}

function ago(v){
 const n=Math.max(
  0,
  Date.now()-new Date(v).getTime()
 );
 const m=Math.floor(n/60000);
 if(m<1)return'now';
 if(m<60)return m+'m';
 const h=Math.floor(m/60);
 if(h<24)return h+'h';
 return Math.floor(h/24)+'d';
}

function icon(n){
 const p={
  home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',

  heart:'<path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/>',

  comment:'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-4-.9L4 19l.9-3.8A7.5 7.5 0 1 1 20 11.5Z"/>',

  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',

  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',

  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

  back:'<path d="m15 18-6-6 6-6"/>',

  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',

  mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',

  more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',

  close:'<path d="M6 6l12 12M18 6 6 18"/>',

  play:'<path d="m8 5 11 7-11 7z"/>',

  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>'
 };

 return`<svg viewBox="0 0 24 24">${p[n]||p.more}</svg>`;
}

function av(p,cl=''){
 p=p||{};
 const letter=esc(
  (p.displayName||p.username||'?')
  .slice(0,1)
  .toUpperCase()
 );

 if(p.avatar){
  return`<img class="avatar ${cl}"
   src="${esc(p.avatar)}"
   onerror="this.outerHTML='<span class=\\'avatar ${cl}\\'>${letter}</span>'">`;
 }

 return`<span class="avatar ${cl}">${letter}</span>`;
}

async function list(table,queries=[]){
 const r=await db.listRows({
  databaseId:CFG.databaseId,
  tableId:table,
  queries
 });
 return r.rows||[];
}

async function one(table,id){
 return db.getRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId:id
 });
}

async function create(table,data){
 return db.createRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId:ID.unique(),
  data
 });
}

async function update(table,id,data){
 return db.updateRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId:id,
  data
 });
}

async function remove(table,id){
 return db.deleteRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId:id
 });
}

async function upload(file){
 if(!file)throw new Error('No file selected');

 const f=await storage.createFile({
  bucketId:CFG.bucketId,
  fileId:ID.unique(),
  file
 });

 return{
  id:f.$id,
  url:storage.getFileView({
   bucketId:CFG.bucketId,
   fileId:f.$id
  }).toString(),
  type:file.type,
  name:file.name
 };
}

function mediaMarkup(m,cls=''){
 if(!m)return'';

 let x=m;

 try{
  if(typeof x==='string'&&x.startsWith('{')){
   x=JSON.parse(x);
  }
 }catch{}

 if(typeof x==='string'){
  return`<img class="${cls||'postmedia'}" src="${esc(x)}">`;
 }

 const url=x.url||x.src||'';

 if((x.type||'').startsWith('video')){
  return`<video class="${cls||'postvideo'}" src="${esc(url)}" controls playsinline></video>`;
 }

 return`<img class="${cls||'postmedia'}" src="${esc(url)}">`;
}

async function getProfile(uid){
 try{
  return(
   await list(
    T.profiles,
    [
     Query.equal('userId',uid),
     Query.limit(1)
    ]
   )
  )[0]||null;
 }catch{
  return null;
 }
}

async function ensureProfile(){
 myProfile=await getProfile(me.$id);

 if(!myProfile){

  let base=(me.name||me.email.split('@')[0])
   .replace(/[^a-zA-Z0-9_]/g,'')
   .slice(0,25)||'user';

  let username=base;
  let i=1;

  while(
   (await list(
    T.profiles,
    [
     Query.equal('username',username),
     Query.limit(1)
    ]
   )).length
  ){
   username=base+i++;
  }

  myProfile=await create(
   T.profiles,
   {
    userId:me.$id,
    username,
    displayName:me.name||username,
    email:me.email,
    avatar:'',
    bio:'',
    verified:false,
    createdAt:new Date().toISOString()
   }
  );
 }
}

async function refreshProfiles(){
 profiles=await list(
  T.profiles,
  [
   Query.orderDesc('$createdAt'),
   Query.limit(200)
  ]
 );

 myProfile=
  profiles.find(x=>x.userId===me.$id)
  ||myProfile;
}

function auth(mode='login'){
 const sign=mode==='signup';

 $('#app').innerHTML=`
 <div class="auth">
  <div class="authcard">

   <div class="authlogo">
    NOVA<span style="color:var(--accent)">.</span>
   </div>

   <div style="color:#aaa;margin-bottom:18px">
    ${sign?'Create your NOVA account':'Welcome back to NOVA'}
   </div>

   ${
    sign
    ?`
     <div class="field">
      <input id="aName" placeholder="Name">
     </div>
    `
    :''
   }

   <div class="field">
    <input id="aEmail" type="email" placeholder="Email">
   </div>

   <div class="field">
    <input id="aPass" type="password" placeholder="Password">
   </div>

   <button
    class="primary"
    style="width:100%;margin-top:8px"
    id="aGo">
    ${sign?'Create account':'Log in'}
   </button>

   <div class="switch">
    ${sign?'Already have an account?':'Don’t have an account?'}
    <button id="aSwitch">
     ${sign?'Log in':'Sign up'}
    </button>
   </div>

  </div>
 </div>
 `;

 $('#aGo').onclick=async()=>{
  try{

   const email=$('#aEmail').value.trim();
   const password=$('#aPass').value;

   if(!email||!password){
    return toast('Enter email and password');
   }

   if(sign){

    const name=
     $('#aName').value.trim()
     ||email.split('@')[0];

    await account.create({
     userId:ID.unique(),
     email,
     password,
     name
    });

    await account.createEmailPasswordSession({
     email,
     password
    });

   }else{

    await account.createEmailPasswordSession({
     email,
     password
    });

   }

   await boot();

  }catch(e){
   fail(e);
  }
 };

 $('#aSwitch').onclick=()=>{
  auth(sign?'login':'signup');
 };
}

function shell(){

 const nav=`
 <div class="nav">

  <button class="navbtn" onclick="go('home')">
   ${icon('home')}
   <span class="label">Home</span>
  </button>

  <button class="navbtn" onclick="go('search')">
   ${icon('search')}
   <span class="label">Search</span>
  </button>

  <button class="navbtn" onclick="go('create')">
   ${icon('plus')}
   <span class="label">Create</span>
  </button>

  <button class="navbtn" onclick="go('messages')">
   ${icon('send')}
   <span class="label">Messages</span>
  </button>

  <button class="navbtn" onclick="go('notifications')">
   ${icon('bell')}
   <span class="label">Notifications</span>
  </button>

  <button class="navbtn" onclick="go('profile')">
   ${icon('user')}
   <span class="label">Profile</span>
  </button>

  <button class="navbtn" onclick="logout()">
   ${icon('more')}
   <span class="label">Log out</span>
  </button>

 </div>
 `;

 $('#app').innerHTML=`
 <div class="app">

  <header class="top">

   <button class="logo" onclick="go('home')">
    NOVA<span>.</span>
   </button>

   <div class="top-actions">

    <button class="icon" onclick="go('search')">
     ${icon('search')}
    </button>

    <button class="icon" onclick="go('notifications')">
     ${icon('bell')}
    </button>

    <button class="icon" onclick="go('profile')">
     ${icon('user')}
    </button>

   </div>

  </header>

  <div class="layout">

   <aside class="side leftside">
    ${nav}
   </aside>

   <main id="main"></main>

   <aside class="side rightside">
    <div class="card rightcard">
     <div class="righttitle">People on NOVA</div>
     <div id="people"></div>
    </div>
   </aside>

  </div>

  <nav class="mobile">

   <button class="icon" onclick="go('home')">
    ${icon('home')}
   </button>

   <button class="icon" onclick="go('search')">
    ${icon('search')}
   </button>

   <button class="icon" onclick="go('create')">
    ${icon('plus')}
   </button>

   <button class="icon" onclick="go('messages')">
    ${icon('send')}
   </button>

   <button class="icon" onclick="go('profile')">
    ${icon('user')}
   </button>

  </nav>

 </div>
 `;

 drawPeople();
}

function drawPeople(){

 const b=$('#people');

 if(!b)return;

 b.innerHTML=
  profiles
   .filter(p=>p.userId!==me.$id)
   .slice(0,8)
   .map(p=>`
    <button
     class="userrow"
     onclick="go('user','${p.userId}')">

     ${av(p,'sm')}

     <div class="userinfo">
      <b>${esc(p.displayName||p.username)}</b>
      <small>@${esc(p.username)}</small>
     </div>

    </button>
   `)
   .join('')
   ||'<div class="empty">No other users.</div>';
}

async function go(page,arg){

 try{

  if(page==='home')return home();
  if(page==='search')return search();
  if(page==='create')return createView();
  if(page==='messages')return messages();
  if(page==='chat')return openChat(arg);
  if(page==='profile')return profile(me.$id);
  if(page==='user')return profile(arg);
  if(page==='notifications')return notifications();
  if(page==='stories')return stories();

 }catch(e){
  fail(e);
 }
}

async function home(){

 const m=$('#main');

 m.innerHTML=`
  <div class="card stories" id="storyStrip">

   <button class="story" onclick="go('stories')">

    <div class="storyring">
     <div class="addstory">+</div>
    </div>

    <b>Your story</b>

   </button>

  </div>

  <div id="feed">
   <div class="empty">Loading…</div>
  </div>
 `;

 try{

  const rows=await list(
   T.posts,
   [
    Query.orderDesc('$createdAt'),
    Query.limit(100)
   ]
  );

function msg(m){

 const mine=m.senderId===me.$id;

 let media='';

 if(m.media){

  let x=m.media;

  try{
   if(
    typeof x==='string'&&
    x.startsWith('{')
   ){
    x=JSON.parse(x);
   }
  }catch{}

  const url=
   typeof x==='string'
   ?x
   :x.url||'';

  if(
   m.mediaType==='video'
   ||
   (x.type||'').startsWith('video')
  ){

   media=`
    <video
     src="${esc(url)}"
     controls
     playsinline>
    </video>
   `;

  }else if(
   m.mediaType==='audio'
  ){

   media=`
    <audio
     src="${esc(url)}"
     controls>
    </audio>
   `;

  }else{

   media=`
    <img
     src="${esc(url)}">
   `;
  }
 }

 const rep=
  m.replyTo
  ?`
   <div class="reply">
    Replying to a message
   </div>
  `
  :'';

 return`
 <div
  class="msgrow ${mine?'me':''}"
  data-mid="${m.$id}">

  <div class="bubble">

   ${rep}

   ${media}

   ${
    m.content
    ?`<div>${esc(m.content)}</div>`
    :''
   }

   <span class="bubbletime">
    ${ago(m.createdAt||m.$createdAt)}
    ${mine?'✓':''}
   </span>

  </div>

 </div>
 `;
}

function bindGestures(){

 document
  .querySelectorAll('.msgrow')
  .forEach(el=>{

   let sx=0;

   el.ontouchstart=e=>{
    sx=e.touches[0].clientX;
   };

   el.ontouchend=e=>{

    const dx=
     e.changedTouches[0].clientX-sx;

    if(Math.abs(dx)>55){
     setReply(el.dataset.mid);
    }
   };

   let timer;

   el.onpointerdown=()=>{
    timer=setTimeout(
     ()=>{
      setReply(el.dataset.mid);
     },
     600
    );
   };

   el.onpointerup=()=>{
    clearTimeout(timer);
   };

   el.onpointercancel=()=>{
    clearTimeout(timer);
   };

  });
}

async function toggleVoice(){

 if(recording){

  recording.stop();

  return;
 }

 if(
  !navigator.mediaDevices?.getUserMedia
 ){
  return toast(
   'Microphone is not available'
  );
 }

 try{

  const stream=
   await navigator.mediaDevices
    .getUserMedia({
     audio:true
    });

  chunks=[];

  recording=
   new MediaRecorder(stream);

  recording.ondataavailable=
   e=>chunks.push(e.data);

  recording.onstop=
   async()=>{

    stream
     .getTracks()
     .forEach(t=>t.stop());

    const blob=
     new Blob(
      chunks,
      {
       type:
        recording.mimeType
        ||'audio/webm'
      }
     );

    recording=null;

    $('#micBtn')
     ?.classList
     .remove('recording');

    try{

     const f=
      new File(
       [blob],
       'voice-'+Date.now()+'.webm',
       {
        type:blob.type
       }
      );

     const m=
      await upload(f);

     await create(
      T.messages,
      {
       conversationId:activeChat.$id,
       senderId:me.$id,
       content:'',
       media:JSON.stringify(m),
       mediaType:'audio',
       replyTo:replyingTo?.$id||'',
       createdAt:new Date().toISOString(),
       deleted:false
      }
     );

     cancelReply();

     await loadMessages();

    }catch(e){
     fail(e);
    }
   };

  recording.start();

  $('#micBtn')
   .classList
   .add('recording');

  toast(
   'Recording… tap mic again to send'
  );

 }catch(e){
  fail(e);
 }
}

  rows
   .filter(
    s=>
     !s.expiresAt||
     new Date(s.expiresAt)>new Date()
   )
   .map(
    s=>{

     const p=
      profiles.find(
       x=>x.userId===s.userId
      )||{};

     return`
     <article class="card">

      <div class="posthead">

       ${av(p,'sm')}

       <div class="grow">

        <b>
         ${esc(
          p.displayName||
          p.username||
          'user'
         )}
        </b>

        <div
         style="font-size:11px;color:var(--muted)">
         ${ago(
          s.createdAt||
          s.$createdAt
         )}
        </div>

       </div>

      </div>

      ${
       s.media
       ?mediaMarkup(s.media)
       :''
      }

      ${
       s.content
       ?`
        <div class="posttext">
         ${esc(s.content)}
        </div>
       `
       :''
      }

     </article>
     `;
    }
   )
   .join('')
  ||
  '<div class="card empty">No stories yet.</div>';
}

async function addStory(){

 const input=
  document.createElement('input');

 input.type='file';
 input.accept='image/*,video/*';

 input.onchange=async()=>{

  const f=input.files[0];

  if(!f)return;

  try{

   const m=await upload(f);

   const text=
    prompt(
     'Story text (optional)'
    )||'';

   await create(
    T.stories,
    {
     userId:me.$id,
     content:text,
     media:JSON.stringify(m),
     mediaType:f.type,
     createdAt:new Date().toISOString(),
     expiresAt:
      new Date(
       Date.now()+86400000
      ).toISOString()
    }
   );

   toast('Story added');

   stories();

  }catch(e){
   fail(e);
  }
 };

 input.click();
}

async function notifications(){

 const rows=
  await list(
   T.notifications,
   [
    Query.equal('userId',me.$id),
    Query.orderDesc('$createdAt'),
    Query.limit(100)
   ]
  ).catch(()=>[]);

 $('#main').innerHTML=`
 <div class="section-title">
  Notifications
 </div>

 <div class="card">

 ${
  rows
   .map(
    n=>`
     <div class="userrow">

      ${av(
       profiles.find(
        p=>p.userId===n.fromUserId
       ),
       'sm'
      )}

      <div class="userinfo">

       <b>
        ${esc(
         n.message||
         n.type||
         'Notification'
        )}
       </b>

       <small>
        ${ago(
         n.createdAt||
         n.$createdAt
        )}
       </small>

      </div>

     </div>
    `
   )
   .join('')
   ||
   '<div class="empty">No notifications.</div>'
 }

 </div>
 `;
}

async function logout(){

 try{

  unsubscribeAll();

  try{
   await realtime.disconnect();
  }catch{}

  await account.deleteSession({
   sessionId:'current'
  });

  location.reload();

 }catch(e){
  fail(e);
 }
}

async function boot(){

 try{

  me=await account.get();

 }catch{

  auth();

  return;
 }

 try{

  await ensureProfile();

  await refreshProfiles();

  shell();

  await home();

  subscribeGlobal();

 }catch(e){

  console.error(e);

  $('#main').innerHTML=`
   <div class="card empty">

    <b>
     NOVA connected, but Appwrite returned an error.
    </b>

    <br><br>

    ${esc(e.message||e)}

   </div>
  `;
 }
}

Object.assign(
 window,
 {
  go,
  logout,
  follow,
  sendText,
  sendMedia,
  toggleVoice,
  addStory,
  deletePost,
  reactPost,
  commentPost,
  sharePost,
  editProfile,
  setReply,
  cancelReply
 }
);

boot();

})();
</script>
