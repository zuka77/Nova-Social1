<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>NOVA Social</title>
<style>
:root{--bg:#050505;--panel:#0c0c0f;--panel2:#121216;--line:#24242a;--text:#f5f5f7;--muted:#8e8e98;--accent:#7c5cff;--danger:#ff4567;--green:#32d583}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{border:0;color:inherit;background:none;cursor:pointer}img,video{max-width:100%;display:block}
.hidden{display:none!important}.app{min-height:100dvh}.auth{min-height:100dvh;display:grid;place-items:center;padding:22px}
.auth-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 20px 80px #0008}
.logo{font-size:32px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--accent)}
.auth-sub{color:var(--muted);margin:7px 0 25px}.field{margin:10px 0}.field input,.field textarea,.search input,.composer textarea{width:100%;background:#17171c;border:1px solid #292930;color:var(--text);border-radius:14px;padding:13px 14px;outline:none}.field input:focus,.search input:focus,.composer textarea:focus{border-color:var(--accent)}
.primary{width:100%;padding:13px 16px;border-radius:14px;background:var(--accent);font-weight:800;margin-top:8px}.ghost{color:var(--muted)}.auth-switch{text-align:center;margin-top:18px;color:var(--muted);font-size:14px}.auth-switch button{color:var(--text);font-weight:700}
.top{position:sticky;top:0;z-index:30;height:62px;background:#050505ee;backdrop-filter:blur(20px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.top .logo{font-size:23px}.top-actions{display:flex;gap:6px}.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}.icon:hover{background:#17171b}.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.layout{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:230px minmax(0,620px) 250px;gap:18px;padding:18px 14px 90px}.side{position:sticky;top:80px;height:max-content}.navbtn{width:100%;display:flex;align-items:center;gap:13px;padding:12px 13px;border-radius:14px;color:#bdbdc5;text-align:left}.navbtn.active,.navbtn:hover{background:#151519;color:#fff}.navbtn svg{width:22px;height:22px}.badge{margin-left:auto;background:var(--danger);font-size:11px;border-radius:20px;padding:2px 6px;color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden}.card-pad{padding:15px}
.stories{display:flex;gap:13px;overflow:auto;padding:15px}.story{min-width:68px;text-align:center;font-size:11px;color:#aaa}.story-ring{width:60px;height:60px;padding:2px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#ff477e,#ffb14a);margin:auto}.story-ring img,.story-add{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #0c0c0f}.story-add{display:grid;place-items:center;background:#17171b;color:#aaa;font-size:27px}
.composer-head,.post-head{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#202026;display:grid;place-items:center;color:#aaa;font-weight:800}.avatar.sm{width:34px;height:34px}.composer textarea{resize:none;min-height:75px;margin-top:12px;background:#111115}.composer-tools{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.toolrow{display:flex;gap:4px}.toolrow .icon{width:38px;height:38px}.post-content{padding:0 15px 12px;white-space:pre-wrap;word-break:break-word}.post-media{width:100%;max-height:650px;object-fit:cover;background:#000}.post-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:0 15px 10px}.post-actions{display:flex;padding:2px 8px 9px;border-top:1px solid #1e1e23}.post-actions button{display:flex;align-items:center;gap:6px;padding:9px 8px;color:#aaa;border-radius:10px;font-size:13px}.post-actions button:hover{background:#17171b;color:#fff}
.user-row{display:flex;align-items:center;gap:11px;padding:11px 13px}.user-row:hover{background:#16161a}.user-info{min-width:0;flex:1}.user-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-info small{color:var(--muted)}.follow{padding:7px 12px;border-radius:10px;background:#24242b;font-size:12px;font-weight:700}.follow.on{background:#252038;color:#b8a9ff}
.search{padding:10px 0 14px}.section-title{font-size:18px;font-weight:850;margin:7px 0 12px}
.chat-shell{height:calc(100dvh - 80px);display:flex;flex-direction:column}.chat-head{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}.chat-head .info{flex:1}.chat-head small{color:var(--muted)}.messages{flex:1;overflow:auto;padding:15px 3px}.bubble-row{display:flex;margin:5px 0}.bubble-row.me{justify-content:flex-end}.bubble{max-width:min(78%,420px);padding:10px 12px;border-radius:18px;background:#19191f;position:relative;word-break:break-word}.me .bubble{background:#684ee5}.bubble small{display:block;font-size:10px;opacity:.55;margin-top:4px}.bubble img,.bubble video{border-radius:12px;margin:-2px -2px 5px;max-height:330px}.chat-compose{display:flex;align-items:end;gap:6px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.chat-compose textarea{flex:1;resize:none;max-height:120px;background:#151519;border:1px solid var(--line);border-radius:19px;padding:11px 13px;color:#fff;outline:none}.send{width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center}.recording{color:#ff4567!important;background:#27151b!important}
.empty{text-align:center;color:var(--muted);padding:40px 15px}.profile-cover{height:130px;background:linear-gradient(135deg,#16161d,#28203c)}.profile-main{padding:0 16px 18px}.profile-avatar{width:92px;height:92px;margin-top:-46px;border:4px solid var(--panel);border-radius:50%;object-fit:cover;background:#222}.profile-name{font-size:23px;font-weight:900;margin-top:8px}.profile-bio{color:#aaa;margin-top:5px}.stats{display:flex;gap:25px;margin:15px 0}.stats b{display:block}.stats span{font-size:12px;color:#888}.profile-actions{display:flex;gap:8px}.profile-actions button{padding:10px 15px;border-radius:12px;background:#202027;font-weight:700}.profile-actions .primary-small{background:var(--accent)}
.modal{position:fixed;inset:0;background:#0009;z-index:100;display:grid;place-items:center;padding:15px}.modal-card{width:min(520px,100%);max-height:90dvh;overflow:auto;background:#101014;border:1px solid var(--line);border-radius:22px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.toast{position:fixed;z-index:200;left:50%;bottom:25px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:13px;font-size:13px;box-shadow:0 10px 40px #0008}.mobile-nav{display:none}
@media(max-width:900px){.layout{grid-template-columns:70px minmax(0,620px);justify-content:center}.side .label,.side .badge{display:none}.navbtn{justify-content:center}.right-side{display:none}}
@media(max-width:680px){.top{height:58px}.layout{display:block;padding:10px 8px 82px}.left-side{display:none}.mobile-nav{position:fixed;display:flex;z-index:40;bottom:0;left:0;right:0;height:64px;background:#08080aee;backdrop-filter:blur(18px);border-top:1px solid var(--line);justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.mobile-nav .icon{width:48px}.card{border-radius:17px}.post-media{max-height:500px}.chat-shell{height:calc(100dvh - 68px)}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<script>
(() => {
"use strict";

/* =========================
   NOVA SOCIAL CONFIG
   ========================= */
const CONFIG = {
  endpoint: "https://cloud.appwrite.io/v1",
  projectId: "6aa242bf00012f890e92",
  databaseId: "6aa41332002b049743d5",
  bucketId: "6aa421b20025a1b4aac8",
  ownerId: "Carlos-2839"
};

const T = {
  profiles:"profiles", posts:"posts", conversations:"conversations",
  conversation_members:"conversation_members", messages:"messages",
  message_reactions:"message_reactions", comments:"comments",
  reactions:"reactions", follows:"follows", notifications:"notifications",
  stories:"stories", story_views:"story_views", story_reactions:"story_reactions",
  story_replies:"story_replies", user_presence:"user_presence", reports:"reports"
};

const {Client, Account, TablesDB, Storage, ID, Query, Permission, Role, Realtime, Channel} = Appwrite;
const client = new Client().setEndpoint(CONFIG.endpoint).setProject(CONFIG.projectId);
const account = new Account(client);
const db = new TablesDB(client);
const storage = new Storage(client);
const realtime = new Realtime(client);

let me = null, myProfile = null, profiles = [], activeChat = null, activeChatUser = null;
let mediaFile = null, voiceRecorder = null, voiceChunks = [], voiceStart = 0, voiceTimer = null;
let subscriptions = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const timeAgo = d => { const n=Date.now()-new Date(d).getTime(); const m=Math.floor(n/60000); if(m<1)return"now"; if(m<60)return m+"m"; const h=Math.floor(m/60); if(h<24)return h+"h"; return Math.floor(h/24)+"d"; };
const avatar = (p, cls="") => `<img class="avatar ${cls}" src="${esc(p?.avatar || "")}" onerror="this.style.display='none';this.nextElementSibling?.classList.remove('hidden')" /><span class="avatar ${cls} ${p?.avatar?'hidden':''}">${esc((p?.displayName||p?.username||"?").slice(0,1).toUpperCase())}</span>`;
const svg = (name) => {
 const paths = {
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 heart:'<path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/>',
 comment:'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-4-.9L4 19l.9-3.8A7.5 7.5 0 1 1 20 11.5Z"/>',
 send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',
 mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
 more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
 close:'<path d="M6 6l12 12M18 6 6 18"/>',
 play:'<path d="m8 5 11 7-11 7z"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>'
 };
 return `<svg viewBox="0 0 24 24">${paths[name]||paths.more}</svg>`;
};

function toast(msg){const x=document.createElement("div");x.className="toast";x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}
function err(e){console.error(e);toast(e?.message||"Something went wrong")}
function permissions(){return undefined}
async function list(table, queries=[]){return (await db.listRows({databaseId:CONFIG.databaseId,tableId:table,queries})).rows||[]}
async function create(table,data){return db.createRow({databaseId:CONFIG.databaseId,tableId:table,rowId:ID.unique(),data})}
async function update(table,rowId,data){return db.updateRow({databaseId:CONFIG.databaseId,tableId:table,rowId,data})}
async function remove(table,rowId){return db.deleteRow({databaseId:CONFIG.databaseId,tableId:table,rowId})}
async function upload(file){
 const f=await storage.createFile({bucketId:CONFIG.bucketId,fileId:ID.unique(),file});
 return storage.getFileView({bucketId:CONFIG.bucketId,fileId:f.$id}).toString();
}

async function getProfile(uid){
 const r=await list(T.profiles,[Query.equal("userId",uid),Query.limit(1)]);
 return r[0]||null;
}
async function ensureProfile(){
 myProfile=await getProfile(me.$id);
 if(!myProfile){
   const username=(me.name||me.email.split("@")[0]).replace(/[^a-zA-Z0-9_]/g,"").slice(0,30)||("user"+Date.now());
   myProfile=await create(T.profiles,{userId:me.$id,username,displayName:me.name||username,email:me.email,verified:false,createdAt:new Date().toISOString()});
 }
}
async function refreshProfiles(){
 profiles=await list(T.profiles,[Query.orderDesc("$createdAt"),Query.limit(100)]);
}

function authView(mode="login"){
 const signup=mode==="signup";
 $("#app").innerHTML=`<div class="auth"><div class="auth-card">
   <div class="logo">NOVA<span>.</span></div>
   <div class="auth-sub">${signup?"Create your NOVA account":"Welcome back to NOVA"}<div style="font-size:12px;color:#777;margin-top:6px">Email + password only · Owner ID is not required</div></div>
   ${signup?`<div class="field"><input id="authName" placeholder="Name"></div>`:""}
   <div class="field"><input id="authEmail" type="email" autocomplete="email" placeholder="Email"></div>
   <div class="field"><input id="authPass" type="password" autocomplete="${signup?"new-password":"current-password"}" placeholder="Password"></div>
   <button class="primary" id="authSubmit">${signup?"Create account":"Log in"}</button>
   <div class="auth-switch">${signup?"Already have an account?":"Don't have an account?"} <button id="authSwitch">${signup?"Log in":"Sign up"}</button></div>
 </div></div>`;
 $("#authSubmit").onclick=async()=>{
   try{
     const email=$("#authEmail").value.trim(), pass=$("#authPass").value;
     if(!email||!pass) return toast("Enter email and password");
     if(signup){
       const name=$("#authName").value.trim()||email.split("@")[0];
       await account.create({userId:ID.unique(),email,password:pass,name});
       await account.createEmailPasswordSession({email,password:pass});
     }else await account.createEmailPasswordSession({email,password:pass});
     await boot();
   }catch(e){err(e)}
 };
 $("#authSwitch").onclick=()=>authView(signup?"login":"signup");
}

async function boot(){
 try{me=await account.get()}catch{authView();return}
 await ensureProfile(); await refreshProfiles(); renderShell(); if(isOwnerAccount()){["ownerNavBtn","ownerTopBtn"].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display="";});} await loadFeed(); subscribeAll();
}

function renderShell(){
 $("#app").innerHTML=`<div class="app">
 <header class="top"><button class="logo" onclick="showPage('home')">NOVA<span>.</span></button><div class="top-actions">
 <button class="icon" title="Search" onclick="showPage('search')">${svg("search")}</button>
 <button class="icon" title="Notifications" onclick="showPage('notifications')">${svg("bell")}</button>
 <button class="icon" title="Profile" onclick="showPage('profile')">${svg("user")}</button>
   <button id="ownerTopBtn" class="icon" style="display:none" title="Owner" onclick="openOwnerDashboard()">👑</button>
 </div></header>
 <div class="layout">
  <aside class="side left-side">
   ${nav()}
  </aside>
  <main id="main"></main><main id="ownerDashboard" style="display:none">
  <section class="card" style="margin:16px">
    <div class="card-pad">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><h2 style="margin:0">👑 Owner Dashboard</h2><small>NOVA Social administration</small></div>
        <button onclick="closeOwnerDashboard()">Back</button>
      </div>
    </div>
  </section>
  <section class="card" style="margin:16px">
    <div class="card-pad">
      <input id="ownerUserSearch" placeholder="Search users..." style="width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #ccc;margin-bottom:10px">
      <button onclick="ownerLoadUsers()">Refresh users</button>
      <div id="ownerUsersList" style="margin-top:12px">Loading users...</div>
    </div>
  </section>
</main>

  <aside class="side right-side"><div class="card"><div class="card-pad"><b>People on NOVA</b><div id="peopleSide"></div></div></div></aside>
 </div>
 <nav class="mobile-nav">
  <button class="icon" onclick="showPage('home')">${svg("home")}</button>
  <button class="icon" onclick="showPage('search')">${svg("search")}</button>
  <button class="icon" onclick="showPage('create')">${svg("plus")}</button>
  <button class="icon" onclick="showPage('messages')">${svg("send")}</button>
  <button class="icon" onclick="showPage('profile')">${svg("user")}</button>
   <button class="icon" onclick="logout()" title="Log out">${svg("more")}</button>
 </nav>
 </div>`;
 renderPeopleSide();
}
function nav(){return `<button class="navbtn active" data-page="home" onclick="showPage('home')">${svg("home")}<span class="label">Home</span></button>
<button class="navbtn" onclick="showPage('search')">${svg("search")}<span class="label">Search</span></button>
<button class="navbtn" onclick="showPage('create')">${svg("plus")}<span class="label">Create</span></button>
<button class="navbtn" onclick="showPage('messages')">${svg("send")}<span class="label">Messages</span></button>
<button class="navbtn" onclick="showPage('notifications')">${svg("bell")}<span class="label">Notifications</span></button>
<button class="navbtn" onclick="showPage('profile')">${svg("user")}<span class="label">Profile</span></button>
 <button id="ownerNavBtn" class="navbtn" style="display:none" onclick="openOwnerDashboard()">👑<span class="label">Owner</span></button>
<button class="navbtn" onclick="logout()">${svg("more")}<span class="label">Log out</span></button>`}

async function showPage(page,arg=null){
 if(page==="home") return loadFeed();
 if(page==="search") return renderSearch();
 if(page==="create") return renderCreate();
 if(page==="messages") return renderMessages();
 if(page==="chat") return openChat(arg);
 if(page==="notifications") return renderNotifications();
 if(page==="profile") return renderProfile(me.$id);
 if(page==="user") return renderProfile(arg);
 if(page==="stories") return renderStories();
}

async function loadFeed(){
 const main=$("#main"); if(!main)return;
 main.innerHTML=`<div class="card stories" id="stories"><div class="story" onclick="showPage('stories')"><div class="story-ring"><div class="story-add">+</div></div><div>Your story</div></div></div><div id="feed"><div class="empty">Loading…</div></div>`;
 try{
   const posts=await list(T.posts,[Query.orderDesc("$createdAt"),Query.limit(50)]);
   const feed=$("#feed"); feed.innerHTML=posts.length?posts.map(renderPost).join(""):`<div class="card empty">No posts yet. Find people and create the first post.</div>`;
   await renderStoriesStrip();
 }catch(e){$("#feed").innerHTML=`<div class="card empty">Could not load feed.</div>`;err(e)}
}
async function renderStoriesStrip(){
 try{
  const stories=await list(T.stories,[Query.orderDesc("$createdAt"),Query.limit(40)]);
  const valid=stories.filter(s=>!s.expiresAt||new Date(s.expiresAt)>new Date());
  const box=$("#stories"); if(!box)return;
  for(const s of valid){
   const p=profiles.find(x=>x.userId===s.userId)||await getProfile(s.userId);
   if(!p)continue;
   box.insertAdjacentHTML("beforeend",`<button class="story" onclick="showPage('stories')"><div class="story-ring">${avatar(p,"")}</div><div>${esc(p.username)}</div></button>`);
  }
 }catch(e){console.warn(e)}
}
function renderPost(p){
 const u=profiles.find(x=>x.userId===p.userId)||{username:"user"};
 const media=p.media?`<img class="post-media" src="${esc(p.media)}" alt="">`:"";
 return `<article class="card" data-post="${p.$id}">
 <div class="card-pad post-head">${avatar(u,"sm")}<div style="flex:1"><b>${esc(u.displayName||u.username)}</b><div style="font-size:12px;color:#888">@${esc(u.username)} · ${timeAgo(p.createdAt||p.$createdAt)}</div></div>
 ${p.userId===me.$id?`<button class="icon" onclick="deletePost('${p.$id}')">${svg("more")}</button>`:""}</div>
 ${p.content?`<div class="post-content">${esc(p.content)}</div>`:""}${media}
 <div class="post-meta"><span>Public post</span><span>♡</span></div>
 <div class="post-actions"><button onclick="reactPost('${p.$id}','❤️')">${svg("heart")}Like</button><button onclick="commentPost('${p.$id}')">${svg("comment")}Comment</button><button onclick="sharePost('${p.$id}')">${svg("send")}Share</button></div>
 </article>`;
}

function renderCreate(){
 $("#main").innerHTML=`<div class="section-title">Create post</div><div class="card card-pad composer">
 <div class="composer-head">${avatar(myProfile)}<div><b>${esc(myProfile.displayName||myProfile.username)}</b><div style="font-size:12px;color:#888">Share with NOVA</div></div></div>
 <textarea id="postText" placeholder="What's happening?"></textarea>
 <div id="postPreview"></div>
 <div class="composer-tools"><div class="toolrow">
 <button class="icon" title="Photo / video" onclick="$('#mediaInput').click()">${svg("image")}</button>
 <input id="mediaInput" type="file" accept="image/*,video/*" hidden>
 </div><button class="primary" style="width:auto;margin:0;padding:10px 18px" onclick="createPost()">Post</button></div>
 </div>`;
 $("#mediaInput").onchange=e=>{mediaFile=e.target.files[0];$("#postPreview").innerHTML=mediaFile?`<div style="margin-top:10px;color:#aaa">${esc(mediaFile.name)}</div>`:""};
}
async function createPost(){
 try{
  const content=$("#postText").value.trim();
  if(!content&&!mediaFile)return toast("Write something or add media");
  let media=""; if(mediaFile)media=await upload(mediaFile);
  await create(T.posts,{userId:me.$id,content,media,createdAt:new Date().toISOString()});
  mediaFile=null; toast("Posted"); showPage("home");
 }catch(e){err(e)}
}
async function deletePost(id){if(!confirm("Delete this post?"))return;try{await remove(T.posts,id);toast("Deleted");loadFeed()}catch(e){err(e)}}
async function reactPost(postId,reaction){
 try{await create(T.reactions,{postId,userId:me.$id,reaction,createdAt:new Date().toISOString()});toast(reaction)}
 catch(e){err(e)}
}
async function commentPost(postId){
 const c=prompt("Comment"); if(!c?.trim())return;
 try{await create(T.comments,{postId,userId:me.$id,content:c.trim(),createdAt:new Date().toISOString()});toast("Comment added")}catch(e){err(e)}
}
async function sharePost(){navigator.clipboard?.writeText(location.href);toast("Link copied")}

function renderSearch(){
 $("#main").innerHTML=`<div class="section-title">Search</div><div class="search"><input id="userSearch" placeholder="Search people…"></div><div class="card" id="searchResults"></div>`;
 const run=()=>{const q=$("#userSearch").value.toLowerCase().trim();const arr=profiles.filter(p=>p.username.toLowerCase().includes(q)||(p.displayName||"").toLowerCase().includes(q));$("#searchResults").innerHTML=arr.length?arr.map(userRow).join(""):`<div class="empty">No users found.</div>`};
 $("#userSearch").oninput=run;run();
}
function userRow(p){
 if(p.userId===me.$id)return "";
 return `<button class="user-row" style="width:100%;text-align:left" onclick="showPage('user','${p.userId}')">${avatar(p)}<div class="user-info"><b>${esc(p.displayName||p.username)} ${p.verified?'✓':''}</b><small>@${esc(p.username)}</small></div><span class="follow" onclick="event.stopPropagation();toggleFollow('${p.userId}',this)">Follow</span></button>`;
}
async function toggleFollow(uid,el){
 try{
  const rows=await list(T.follows,[Query.equal("followerId",me.$id),Query.equal("followingId",uid),Query.limit(1)]);
  if(rows[0]){try{await remove(T.follows,rows[0].$id)}catch{toast("Unfollow requires Delete permission")};el.classList.remove("on");el.textContent="Follow"}
  else{await create(T.follows,{followerId:me.$id,followingId:uid,createdAt:new Date().toISOString()});el.classList.add("on");el.textContent="Following";await create(T.notifications,{userId:uid,fromUserId:me.$id,type:"follow",message:"started following you",createdAt:new Date().toISOString(),read:false})}
 }catch(e){err(e)}
}

async function renderProfile(uid){
 const p=uid===me.$id?myProfile:(profiles.find(x=>x.userId===uid)||await getProfile(uid));
 if(!p){toast("Profile not found");return}
 const followers=await list(T.follows,[Query.equal("followingId",uid),Query.limit(100)]).catch(()=>[]);
 const following=await list(T.follows,[Query.equal("followerId",uid),Query.limit(100)]).catch(()=>[]);
 const own=uid===me.$id;
 $("#main").innerHTML=`<div class="card"><div class="profile-cover"></div><div class="profile-main">${avatar(p,"profile-avatar")}
 <div class="profile-name">${esc(p.displayName||p.username)} ${p.verified?'✓':''}</div><div style="color:#888">@${esc(p.username)}</div><div class="profile-bio">${esc(p.bio||"")}</div>
 <div class="stats"><div><b>${followers.length}</b><span>Followers</span></div><div><b>${following.length}</b><span>Following</span></div></div>
 <div class="profile-actions">${own?`<button onclick="editProfile()">Edit profile</button>`:`<button class="primary-small" onclick="toggleFollow('${uid}',this)">Follow</button><button onclick="showPage('chat','${uid}')">Message</button>`}</div>
 </div></div><div class="section-title">Posts</div><div id="profilePosts"></div>`;
 const posts=await list(T.posts,[Query.equal("userId",uid),Query.orderDesc("$createdAt"),Query.limit(50)]).catch(()=>[]);
 $("#profilePosts").innerHTML=posts.length?posts.map(renderPost).join(""):`<div class="card empty">No posts.</div>`;
}
async function editProfile(){
 const name=prompt("Display name",myProfile.displayName||"");if(name===null)return;
 const bio=prompt("Bio",myProfile.bio||"");if(bio===null)return;
 try{myProfile=await update(T.profiles,myProfile.$id,{displayName:name,bio});await refreshProfiles();renderProfile(me.$id);toast("Profile updated")}catch(e){err(e)}
}

async function renderMessages(){
 $("#main").innerHTML=`<div class="section-title">Messages</div><div class="search"><input id="chatSearch" placeholder="Search people…"></div><div class="card" id="chatUsers"></div>`;
 const draw=()=>{const q=$("#chatSearch").value.toLowerCase();const arr=profiles.filter(p=>p.userId!==me.$id&&((p.username+" "+(p.displayName||"")).toLowerCase().includes(q)));$("#chatUsers").innerHTML=arr.map(p=>`<button class="user-row" style="width:100%;text-align:left" onclick="showPage('chat','${p.userId}')">${avatar(p)}<div class="user-info"><b>${esc(p.displayName||p.username)}</b><small>@${esc(p.username)}</small></div>${p.online?'<span style="color:var(--green)">●</span>':''}</button>`).join("")||`<div class="empty">No users yet.</div>`};
 $("#chatSearch").oninput=draw;draw();
}
async function openChat(uid){
 activeChatUser=profiles.find(x=>x.userId===uid)||await getProfile(uid); if(!activeChatUser)return;
 let conv=await findConversation(uid);
 if(!conv){
  conv=await create(T.conversations,{createdAt:new Date().toISOString(),type:"private",lastMessage:"",lastMessageAt:""});
  await create(T.conversation_members,{conversationId:conv.$id,userId:me.$id,joinedAt:new Date().toISOString(),isAdmin:true});
  await create(T.conversation_members,{conversationId:conv.$id,userId:uid,joinedAt:new Date().toISOString(),isAdmin:false});
 }
 activeChat=conv;
 $("#main").innerHTML=`<div class="chat-shell">
 <div class="chat-head"><button class="icon" onclick="showPage('messages')">${svg("back")}</button>${avatar(activeChatUser,"sm")}<div class="info"><b>${esc(activeChatUser.displayName||activeChatUser.username)}</b><small>${activeChatUser.online?"online":"@"+esc(activeChatUser.username)}</small></div><button class="icon">${svg("more")}</button></div>
 <div class="messages" id="messageList"><div class="empty">Loading…</div></div>
 <div class="chat-compose"><button class="icon" onclick="$('#chatMedia').click()">${svg("image")}</button><input id="chatMedia" type="file" accept="image/*,video/*" hidden><textarea id="chatText" rows="1" placeholder="Message…"></textarea><button class="icon" id="voiceBtn" title="Hold/press to record">${svg("mic")}</button><button class="send" onclick="sendText()">${svg("send")}</button></div>
 </div>`;
 $("#chatMedia").onchange=async e=>{if(e.target.files[0])await sendMedia(e.target.files[0])};
 $("#voiceBtn").onclick=toggleVoice;
 await loadMessages();
}
async function findConversation(uid){
 const mine=await list(T.conversation_members,[Query.equal("userId",me.$id),Query.limit(100)]).catch(()=>[]);
 const theirs=await list(T.conversation_members,[Query.equal("userId",uid),Query.limit(100)]).catch(()=>[]);
 const set=new Set(theirs.map(x=>x.conversationId));const shared=mine.find(x=>set.has(x.conversationId));
 return shared? (await list(T.conversations,[Query.equal("$id",shared.conversationId),Query.limit(1)]))[0] : null;
}
async function loadMessages(){
 const rows=await list(T.messages,[Query.equal("conversationId",activeChat.$id),Query.orderAsc("$createdAt"),Query.limit(100)]).catch(()=>[]);
 const box=$("#messageList");box.innerHTML=rows.length?rows.map(renderMessage).join(""):`<div class="empty">Start the conversation.</div>`;box.scrollTop=box.scrollHeight;
}
function renderMessage(m){
 const mine=m.senderId===me.$id;
 const media=m.media?(m.mediaType==="video"?`<video src="${esc(m.media)}" controls></video>`:`<img src="${esc(m.media)}">`):"";
 return `<div class="bubble-row ${mine?"me":""}"><div class="bubble">${media}${m.content?esc(m.content):""}${m.mediaType==="audio"?`<audio controls src="${esc(m.media)}"></audio>`:""}<small>${timeAgo(m.createdAt||m.$createdAt)} ${mine?"✓":""}</small></div></div>`;
}
async function sendText(){
 const el=$("#chatText"), text=el.value.trim();if(!text||!activeChat)return;
 try{await create(T.messages,{conversationId:activeChat.$id,senderId:me.$id,content:text,media:"",mediaType:"",replyTo:"",createdAt:new Date().toISOString(),deleted:false});await update(T.conversations,activeChat.$id,{lastMessage:text,lastMessageAt:new Date().toISOString()}).catch(()=>{});el.value="";await loadMessages()}catch(e){err(e)}
}
async function sendMedia(file){
 try{const url=await upload(file);const type=file.type.startsWith("video")?"video":"image";await create(T.messages,{conversationId:activeChat.$id,senderId:me.$id,content:"",media:url,mediaType:type,replyTo:"",createdAt:new Date().toISOString(),deleted:false});await loadMessages()}catch(e){err(e)}
}
async function toggleVoice(){
 if(voiceRecorder&&voiceRecorder.state==="recording"){voiceRecorder.stop();return}
 if(!navigator.mediaDevices?.getUserMedia)return toast("Voice recording is not supported");
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  voiceChunks=[];voiceRecorder=new MediaRecorder(stream);voiceStart=Date.now();$("#voiceBtn").classList.add("recording");
  voiceRecorder.ondataavailable=e=>voiceChunks.push(e.data);
  voiceRecorder.onstop=async()=>{
   clearInterval(voiceTimer);$("#voiceBtn").classList.remove("recording");stream.getTracks().forEach(t=>t.stop());
   const blob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||"audio/webm"});const file=new File([blob],"voice-"+Date.now()+".webm",{type:blob.type});
   try{const url=await upload(file);await create(T.messages,{conversationId:activeChat.$id,senderId:me.$id,content:"",media:url,mediaType:"audio",replyTo:"",createdAt:new Date().toISOString(),deleted:false});await loadMessages()}catch(e){err(e)}
  };
  voiceRecorder.start();
 }catch(e){err(e)}
}

async function renderNotifications(){
 $("#main").innerHTML=`<div class="section-title">Notifications</div><div class="card" id="notifs"><div class="empty">Loading…</div></div>`;
 try{
  const rows=await list(T.notifications,[Query.equal("userId",me.$id),Query.orderDesc("$createdAt"),Query.limit(100)]);
  $("#notifs").innerHTML=rows.length?rows.map(n=>`<div class="user-row">${avatar(profiles.find(p=>p.userId===n.fromUserId))}<div class="user-info"><b>${esc(n.message||n.type)}</b><small>${timeAgo(n.createdAt||n.$createdAt)}</small></div></div>`).join(""):`<div class="empty">No notifications.</div>`;
 }catch(e){err(e)}
}
async function renderStories(){
 $("#main").innerHTML=`<div class="section-title">Stories</div><div class="card card-pad"><button class="primary" onclick="createStory()">＋ Add story</button></div><div id="storyViewer"></div>`;
 try{
  const rows=await list(T.stories,[Query.orderDesc("$createdAt"),Query.limit(50)]);const box=$("#storyViewer");
  box.innerHTML=rows.map(s=>{const p=profiles.find(x=>x.userId===s.userId)||{};return `<article class="card"><div class="card-pad post-head">${avatar(p,"sm")}<div><b>${esc(p.username||"user")}</b><div style="font-size:12px;color:#888">${timeAgo(s.createdAt||s.$createdAt)}</div></div></div>${s.media?`<img class="post-media" src="${esc(s.media)}">`:""}${s.content?`<div class="post-content">${esc(s.content)}</div>`:""}</article>`}).join("")||`<div class="card empty">No stories.</div>`;
 }catch(e){err(e)}

async function createStory(){
 const text=prompt("Story text (optional)")||"";const input=document.createElement("input");input.type="file";input.accept="image/*,video/*";input.onchange=async()=>{try{let media="";if(input.files[0])media=await upload(input.files[0]);await create(T.stories,{userId:me.$id,content:text,media,mediaType:input.files[0]?.type||"",createdAt:new Date().toISOString(),expiresAt:new Date(Date.now()+86400000).toISOString()});toast("Story added");renderStories()}catch(e){err(e)}};input.click();
}
function renderPeopleSide(){const x=$("#peopleSide");if(x)x.innerHTML=profiles.filter(p=>p.userId!==me.$id).slice(0,5).map(p=>`<button class="user-row" style="width:100%;padding:8px 0" onclick="showPage('user','${p.userId}')">${avatar(p,"sm")}<div class="user-info"><b>${esc(p.username)}</b></div></button>`).join("")||`<small style="color:#888">No other users yet.</small>`}

async function subscribeAll(){
 subscriptions.forEach(s=>{try{s.unsubscribe()}catch{}});subscriptions=[];
 try{
  const s=realtime.subscribe([Channel.tablesdb(CONFIG.databaseId).table(T.messages).row().create()],()=>{if(activeChat)loadMessages()});
  subscriptions.push(s);
 }catch(e){console.warn("Realtime subscription unavailable",e)}
}

async function ownerCall(action,extra={}){

  const d=await r.json().catch(()=>({}));

async function ownerLoadUsers(){

  box.innerHTML="Loading users...";
  try{const d=await ownerCall("listUsers");ownerUsersCache=d.users||[];ownerRenderUsers();}

function ownerRenderUsers(){
