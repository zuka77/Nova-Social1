<head>
<meta charset="utf-8">

<title>SHIFT — Nox</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;touch-action:none;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;color:#fff;pointer-events:none}
#logo{position:absolute;top:15px;left:22px;font-size:27px;font-weight:900;letter-spacing:6px;text-shadow:0 0 20px #7b50ff}
#energyBox{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:230px;height:13px;border:1px solid #8063c7;border-radius:20px;background:#090813;overflow:hidden}
#energy{height:100%;width:25%;background:linear-gradient(90deg,#693cff,#d39bff);box-shadow:0 0 18px #8d5cff}
#timer{position:absolute;top:41px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:3px;opacity:.75}
#state{position:absolute;top:67px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:3px;opacity:.45}
#joystick{position:absolute;left:25px;bottom:24px;width:122px;height:122px;border-radius:50%;border:1px solid #ffffff24;background:#14162988;backdrop-filter:blur(7px);pointer-events:auto}
#stick{position:absolute;left:33px;top:33px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b59aff,#5131b9);box-shadow:0 0 24px #7950ff99}
#abilities{position:absolute;right:22px;bottom:22px;display:flex;align-items:end;gap:10px}
.skill{width:62px;height:62px;border-radius:50%;border:1px solid #a783ff99;background:#0e1020dd;color:#fff;font-weight:800;font-size:10px;letter-spacing:1px;pointer-events:auto;box-shadow:0 0 20px #7146ff33}
#ultimate{width:78px;height:78px;border-color:#b98fff;box-shadow:0 0 28px #814dff66}
.skill:active{transform:scale(.9)}
#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle,#211443 0%,#080914 43%,#03040a 100%)}
#start h1{margin:0;font-size:70px;letter-spacing:15px;text-shadow:0 0 40px #7e4cff}
#start p{opacity:.55;letter-spacing:4px;margin:8px 0 32px}
#play{border:1px solid #a17dff;border-radius:40px;padding:16px 48px;background:linear-gradient(135deg,#4d28bb,#8750ff);color:#fff;font-weight:900;letter-spacing:2px;font-size:16px;box-shadow:0 0 30px #7847ff66}
#portrait{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;text-align:center;color:#fff;background:#03040a;font-size:20px;letter-spacing:2px}
@media(orientation:portrait){#portrait{display:flex}}
</style>
</head>

<canvas id="game"></canvas>
<div id="start"><h1>SHIFT</h1><p>THE ARENA IS NEVER THE SAME</p><button id="play">ENTER ARENA</button></div>
<div id="portrait">ROTATE YOUR PHONE<br><small>SHIFT IS LANDSCAPE ONLY</small></div>

  <div id="logo">SHIFT</div>
  <div id="energyBox"><div id="energy"></div></div>

  <div id="joystick"><div id="stick"></div></div>

    <button class="skill" id="shot">SHOT</button>
    <button class="skill" id="dash">DASH</button>
    <button class="skill" id="shield">SHIELD</button>
    <button class="skill" id="ultimate">ULTIMATE</button>
  </div>
</div>

const c=document.getElementById("game"),x=c.getContext("2d");
let W=innerWidth,H=innerHeight,D=Math.min(devicePixelRatio||1,2);
const img=new Image();img.src=NOX_SRC;

const p={x:0,y:0,angle:0,scale:1,walk:0,dash:0,shield:0,attack:0,ult:0};
let playing=false,time=240,energy=0,last=performance.now(),shake=0;
let cores=[],shots=[],parts=[];
const joy={active:false,x:0,y:0};

function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);if(!p.x){p.x=W/2;p.y=H/2}}
addEventListener("resize",resize);resize();

function core(){cores.push({x:60+Math.random()*(W-120),y:85+Math.random()*(H-140),t:Math.random()*6.28})}
function coresReset(){cores=[];for(let i=0;i<8;i++)core()}

const joyEl=document.getElementById("joystick"),stick=document.getElementById("stick");
function jm(e){
 const r=joyEl.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,m=42,d=Math.hypot(dx,dy);
 if(d>m){dx=dx/d*m;dy=dy/d*m}
 joy.x=dx/m;joy.y=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`
}
joyEl.addEventListener("pointerdown",e=>{joy.active=true;joyEl.setPointerCapture(e.pointerId);jm(e)});
joyEl.addEventListener("pointermove",e=>joy.active&&jm(e));
joyEl.addEventListener("pointerup",()=>{joy.active=false;joy.x=joy.y=0;stick.style.transform="translate(0,0)"});

function burst(px,py,col="#a56cff",n=15){
 for(let i=0;i<n;i++){let a=Math.random()*6.28,s=35+Math.random()*170;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.35+Math.random()*.45,m:.8,z:1+Math.random()*3,c:col})}
}
function magicShot(){
 if(!playing)return;
 let a=p.angle;shots.push({x:p.x+Math.cos(a)*45,y:p.y+Math.sin(a)*45,vx:Math.cos(a)*650,vy:Math.sin(a)*650,l:1});
 p.attack=.22;burst(p.x+Math.cos(a)*42,p.y+Math.sin(a)*42,"#c99cff",10);
}
function dash(){
 if(!playing||p.dash>0)return;
 let dx=joy.x,dy=joy.y;if(Math.hypot(dx,dy)<.1){dx=Math.cos(p.angle);dy=Math.sin(p.angle)}
 p.x+=dx*125;p.y+=dy*125;p.x=Math.max(45,Math.min(W-45,p.x));p.y=Math.max(80,Math.min(H-45,p.y));
 p.dash=.75;shake=10;burst(p.x,p.y,"#8b65ff",28);
}
function shield(){if(playing&&p.shield<=0){p.shield=3;burst(p.x,p.y,"#63d9ff",25)}}
function ultimate(){if(playing&&p.ult>=100){p.ult=0;shake=20;burst(p.x,p.y,"#fff",80)}}
shot.onpointerdown=magicShot;dash.onpointerdown=dash;shield.onpointerdown=shield;ultimate.onpointerdown=ultimate;

function update(dt){
 if(!playing)return;
 time-=dt;if(time<=0){time=0;playing=false;start.style.display="flex";play.textContent="PLAY AGAIN"}
 let moving=Math.hypot(joy.x,joy.y)>.05;
 if(moving){p.angle=Math.atan2(joy.y,joy.x);p.walk+=dt*10}else p.walk+=dt*2.7;
 p.x+=joy.x*220*dt;p.y+=joy.y*220*dt;
 p.x=Math.max(45,Math.min(W-45,p.x));p.y=Math.max(75,Math.min(H-45,p.y));
 p.dash=Math.max(0,p.dash-dt);p.shield=Math.max(0,p.shield-dt);p.attack=Math.max(0,p.attack-dt);
 for(let i=cores.length-1;i>=0;i--){let q=cores[i];q.t+=dt*4;if(Math.hypot(q.x-p.x,q.y-p.y)<43){energy=Math.min(100,energy+12);p.ult=Math.min(100,p.ult+12);burst(q.x,q.y,"#c48aff",20);cores.splice(i,1);setTimeout(core,400)}}
 for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;if(s.l<=0||s.x<-50||s.x>W+50||s.y<-50||s.y>H+50)shots.splice(i,1)}
 for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;if(q.l<=0)parts.splice(i,1)}
 energy=Math.min(100,energy);
 document.getElementById("energy").style.width=energy+"%";
 document.getElementById("timer").textContent=`0${Math.floor(time/60)}:${Math.floor(time%60).toString().padStart(2,"0")}`;
 document.getElementById("state").textContent=`NOX • ${moving?"WALK":"IDLE"}`;
}

function arena(){
 let g=x.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.75);
 g.addColorStop(0,"#1a1231");g.addColorStop(.55,"#090b17");g.addColorStop(1,"#020308");x.fillStyle=g;x.fillRect(0,0,W,H);
 let s=72;
 for(let xx=0;xx<W;xx+=s)for(let yy=0;yy<H;yy+=s){x.fillStyle="rgba(80,62,130,.09)";x.fillRect(xx+1,yy+1,s-2,s-2);x.strokeStyle="rgba(150,120,220,.06)";x.strokeRect(xx,yy,s,s)}
 x.strokeStyle="rgba(143,101,255,.24)";x.lineWidth=2;x.strokeRect(25,62,W-50,H-87);
}
function draw(){
 arena();
 for(const q of cores){let z=1+Math.sin(q.t)*.15;x.save();x.translate(q.x,q.y);x.shadowBlur=25;x.shadowColor="#9b5cff";x.fillStyle="#c998ff";x.beginPath();x.moveTo(0,-12*z);x.lineTo(9*z,0);x.lineTo(0,12*z);x.lineTo(-9*z,0);x.closePath();x.fill();x.restore()}
 for(const s of shots){x.save();x.shadowBlur=22;x.shadowColor="#ad6cff";x.fillStyle="#e1c7ff";x.beginPath();x.arc(s.x,s.y,6,0,6.28);x.fill();x.restore()}
 for(const q of parts){x.globalAlpha=Math.max(0,q.l/q.m);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.z,0,6.28);x.fill()}x.globalAlpha=1;

 if(img.complete&&img.naturalWidth){
   const moving=Math.hypot(joy.x,joy.y)>.05;
   const bob=moving?Math.sin(p.walk)*2.5:Math.sin(performance.now()*.003)*1.2;
   const squash=moving?1+Math.sin(p.walk*2)*.015:1;
   const w=150*squash,h=w*img.naturalHeight/img.naturalWidth;
   x.save();x.translate(p.x,p.y+bob);
   x.globalAlpha=.42;x.fillStyle="#000";x.beginPath();x.ellipse(0,w*.38,w*.28,w*.09,0,0,6.28);x.fill();x.globalAlpha=1;
   if(p.shield>0){x.strokeStyle="#65d9ff";x.lineWidth=3;x.shadowBlur=22;x.shadowColor="#55d9ff";x.beginPath();x.arc(0,0,w*.48+Math.sin(performance.now()*.008)*3,0,6.28);x.stroke()}
   x.save();x.scale(p.angle>Math.PI/2||p.angle< -Math.PI/2?-1:1,1);x.shadowBlur=14;x.shadowColor="#744cff66";x.drawImage(img,-w/2,-h*.56,w,h);x.restore();
   if(p.attack>0){x.strokeStyle="#d8b7ff";x.lineWidth=4;x.shadowBlur=16;x.shadowColor="#c088ff";x.beginPath();x.arc(0,0,w*.55,-.6,.6);x.stroke()}
   x.restore();
 }
 requestAnimationFrame(draw);
}
play.onclick=()=>{start.style.display="none";playing=true;time=240;energy=0;p.x=W/2;p.y=H/2;p.ult=0;coresReset()};
draw();requestAnimationFrame(function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);requestAnimationFrame(loop)});
</script>
</body>
