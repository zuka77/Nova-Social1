<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>NOVA Social</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<style>
:root{--bg:#05070b;--panel:#0b0f16;--panel2:#141a24;--line:#202735;--text:#f5f7fb;--muted:#929cad;--blue:#4f7cff;--red:#ff304f;--nav:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;min-height:100%;overscroll-behavior-y:none}button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}img,video{display:block;max-width:100%}.hidden{display:none!important}.app{min-height:100vh}.shell{min-height:100vh}.page{width:min(680px,100%);margin:auto;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
.topbar{height:62px;position:sticky;top:0;z-index:30;background:rgba(5,7,11,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.055);display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{font-weight:900;font-size:25px;letter-spacing:-1.2px}.top-actions{display:flex;gap:2px}.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.icon-btn:active{background:#171d27}.icon{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.bottom-nav{position:fixed;z-index:50;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(5,7,11,.97);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.06)}.nav-inner{height:var(--nav);width:min(680px,100%);margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav-item{position:relative;display:grid;place-items:center;color:#dce2eb}.nav-item.active{color:#fff}.nav-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid #697386}.nav-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);bottom:12px;right:calc(50% - 17px);border:1px solid var(--bg)}
.auth{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#182238 0,#080b11 42%,#05070b 75%)}.auth-card{width:min(420px,100%);padding:30px 24px;border:1px solid var(--line);border-radius:28px;background:rgba(11,15,22,.95);box-shadow:0 30px 90px #0009}.logo{font-size:42px;font-weight:900;letter-spacing:-2.5px;text-align:center}.auth-sub{text-align:center;color:var(--muted);margin:6px 0 26px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field textarea{width:100%;border:1px solid #2a3342;background:#151b25;border-radius:14px;padding:13px 14px;outline:none}.field input:focus,.field textarea:focus{border-color:#68758a}.primary{background:#f6f7fa;color:#05070b;font-weight:800;border-radius:13px;padding:13px 16px}.primary.full{width:100%;margin-top:8px}.secondary{width:100%;padding:12px;color:#aeb8c8}.auth-error{min-height:18px;text-align:center;color:#ff718a;font-size:13px;margin-top:6px}
.stories{display:flex;gap:13px;overflow:auto;padding:12px 10px 8px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 66px;text-align:center;color:#c9d0db;font-size:11px;position:relative}.story-ring{width:66px;height:66px;padding:2px;border-radius:50%;background:linear-gradient(135deg,#ffb300,#ff2f69,#8247ff)}.story-ring.seen{background:#3a424f}.story-ring img,.story-ring video{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid var(--bg)}.story-plus{position:absolute;right:-1px;bottom:17px;width:22px;height:22px;border-radius:50%;background:#fff;color:#05070b;border:2px solid var(--bg);display:grid;place-items:center;font-weight:900}
.post{border-top:1px solid rgba(255,255,255,.045);padding-bottom:10px}.post-head{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#222a38}.post-meta{flex:1;min-width:0}.username{font-weight:750;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:12px;color:#858f9f;margin-top:2px}.media-wrap{background:#000;position:relative}.post-media{width:100%;max-height:780px;object-fit:cover}.post-actions{display:flex;align-items:center;padding:6px 9px 2px}.post-actions .icon-btn{width:43px;height:43px}.save{margin-left:auto}.liked{color:var(--red)}.count-row{padding:0 14px;font-size:14px;font-weight:700}.caption{padding:5px 14px 0;font-size:14px;line-height:1.42}.caption b{margin-right:5px}.comments-link{padding:6px 14px;color:#8993a3;font-size:14px}.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.search-title{font-size:25px;font-weight:850;padding:16px 14px 5px}.search-box{margin:8px 14px 12px;background:#171d27;border-radius:14px;padding:10px 13px;display:flex;gap:9px;align-items:center}.search-box input{border:0;background:none;outline:0;width:100%;font-size:16px}.user-row{display:flex;align-items:center;gap:11px;padding:11px 14px}.user-info{flex:1;min-width:0}.user-name{font-weight:750}.user-sub{color:var(--muted);font-size:13px;margin-top:2px}.small-btn{background:#27303c;border-radius:10px;padding:8px 13px;font-weight:750}
.profile-head{padding:8px 14px 0}.profile-top{display:flex;align-items:center;justify-content:space-between}.profile-title{font-size:20px;font-weight:850}.profile-summary{display:flex;align-items:center;gap:18px;padding:18px 0 12px}.profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover}.stats{display:flex;flex:1;justify-content:space-around;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}.bio{font-size:14px;line-height:1.4;white-space:pre-wrap}.profile-buttons{display:grid;grid-template-columns:1fr 1fr 44px;gap:7px;margin:14px 0}.profile-buttons button{background:#252d39;border-radius:9px;padding:10px;font-weight:750}.highlights{display:flex;gap:15px;overflow:auto;padding:4px 0 17px}.highlight{flex:0 0 70px;text-align:center;font-size:11px}.highlight-circle{width:66px;height:66px;border-radius:50%;border:2px solid #303846;display:grid;place-items:center;margin:auto;font-size:29px}.tabs{height:48px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}.tabs button{display:grid;place-items:center;color:#8993a3}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid-item{aspect-ratio:1;background:#101318;overflow:hidden;position:relative}.grid-item img,.grid-item video{width:100%;height:100%;object-fit:cover}
.create{padding:14px}.create-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.create-title{font-size:18px;font-weight:850}.create textarea{width:100%;min-height:150px;background:transparent;border:0;outline:0;resize:none;font-size:17px}.media-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.media-preview img,.media-preview video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}.create-bar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.file-btn{position:relative}.file-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.messages-head{padding:10px 14px 4px}.messages-title{display:flex;align-items:center;justify-content:space-between}.messages-title h2{font-size:25px;margin:0}.inbox-search{background:#171d27;border-radius:13px;padding:10px 12px;margin:12px 0}.inbox-search input{width:100%;border:0;background:none;outline:0}.message-row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px}.message-row:active{background:#111722}.message-info{flex:1;min-width:0}.message-name{font-weight:750}.message-preview{color:#8d97a7;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted)}.small{font-size:12px}
.chat{height:calc(100dvh - 62px - var(--nav));display:flex;flex-direction:column}.chat-head{height:58px;display:flex;align-items:center;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line)}.chat-head .chat-user{flex:1;text-align:center}.chat-body{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px}.bubble-row{display:flex;align-items:flex-end}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(78%,390px);padding:9px 12px;border-radius:18px;background:#222a36;line-height:1.35;font-size:15px;word-break:break-word}.mine .bubble{background:#f7f8fb;color:#05070b;border-bottom-right-radius:5px}.bubble-row:not(.mine) .bubble{border-bottom-left-radius:5px}.bubble img,.bubble video{max-width:240px;border-radius:12px;margin-bottom:5px}.voice{display:flex;align-items:center;gap:10px;min-width:170px}.voice button{width:34px;height:34px;border-radius:50%;background:#ffffff22}.voice-line{height:4px;background:#ffffff44;border-radius:99px;flex:1}.reply-mini{font-size:11px;color:#8f98a7;border-left:2px solid #777;padding-left:6px;margin-bottom:5px}.mine .reply-mini{color:#667080}.chat-compose{min-height:58px;border-top:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:6px 8px;background:#080a0f}.chat-compose input[type=text]{flex:1;min-width:0;border:0;outline:0;background:#171d27;border-radius:22px;padding:10px 13px}.chat-compose .media-file{position:relative}.chat-compose .media-file input{position:absolute;inset:0;opacity:0}.recording{color:var(--red);background:#25111a}.send-circle{width:42px;height:42px;display:grid;place-items:center}.record-time{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:#111722;border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:#ff6b83;font-size:13px}
.story-viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}.story-stage{position:relative;width:100%;height:100%;max-width:680px;background:#000;overflow:hidden}.story-stage>img,.story-stage>video{width:100%;height:100%;object-fit:contain}.story-progress{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px}.story-progress span{height:3px;background:#ffffff55;flex:1;border-radius:9px}.story-progress span.active{background:#fff}.story-user{position:absolute;top:22px;left:15px;display:flex;align-items:center;gap:8px}.story-user .avatar{width:34px;height:34px}.story-close{position:absolute;top:20px;right:8px}.story-bottom{position:absolute;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:7px;align-items:center}.story-bottom input{flex:1;border:1px solid #ffffff88;border-radius:24px;background:#0006;padding:11px 15px;outline:0}.story-bottom button{width:43px;height:43px;display:grid;place-items:center}
.modal{position:fixed;inset:0;z-index:90;background:#0008;display:flex;align-items:flex-end}.sheet{width:min(680px,100%);margin:auto 0 0;background:#111722;border-radius:22px 22px 0 0;padding:16px;max-height:78vh;overflow:auto}.sheet h3{margin:4px 0 15px}.sheet button.action-row{display:block;width:100%;text-align:left;padding:15px 3px;border-top:1px solid #222a35}.danger{color:#ff637d}.comment-row{padding:9px 0;border-bottom:1px solid #202735}.comment-compose{display:flex;gap:7px;margin-top:10px}.comment-compose input{flex:1;border:0;outline:0;background:#171d27;border-radius:22px;padding:10px 13px}
.toast{position:fixed;z-index:200;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,10px);background:#fff;color:#05070b;border-radius:18px;padding:9px 14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){body{background:#000}.shell{width:680px;margin:auto;background:var(--bg);min-height:100vh;border-left:1px solid #121722;border-right:1px solid #121722}.topbar{position:sticky}.bottom-nav{left:50%;right:auto;transform:translateX(-50%);width:680px}.chat{height:calc(100dvh - 62px - var(--nav))}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script>
(()=>{"use strict";
const {Client,Account,TablesDB,Storage,ID,Query}=window.Appwrite;
const CFG=Object.freeze({endpoint:"https://fra.cloud.appwrite.io/v1",projectId:"6aa242bf00012f890e92",databaseId:"6aa41332002b049743d5",bucketId:"6aa421b20025a1b4aac8",t:Object.freeze({profiles:"profiles",posts:"posts",post_media:"post_media",comments:"comments",comment_reactions:"comment_reactions",reactions:"reactions",follows:"follows",notifications:"notifications",stories:"stories",story_media:"story_media",story_views:"story_views",story_reactions:"story_reactions",story_replies:"story_replies",conversations:"conversations",conversation_members:"conversation_members",messages:"messages",message_reactions:"message_reactions",user_presence:"user_presence",reports:"reports",verification:"verification",admin_actions:"admin_actions",user_blocks:"user_blocks"})});
const client=new Client().setEndpoint(CFG.endpoint).setProject(CFG.projectId),account=new Account(client),db=new TablesDB(client),storage=new Storage(client);
const S={user:null,profile:null,route:"home",arg:null,auth:"login",search:"",chat:null,chatUser:null,recording:null,recordChunks:[],recordStream:null,replyTo:null,stories:[],posts:[]};
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[c])), attr=esc;
const now=()=>new Date().toISOString(), uid=()=>S.user?.$id||"", ago=d=>{if(!d)return"";const n=Math.max(0,Date.now()-new Date(d).getTime()),m=Math.floor(n/60000);if(m<1)return"now";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";const days=Math.floor(h/24);if(days<7)return days+"d";return new Date(d).toLocaleDateString()};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),2200)}
const svg={
 home:`<svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>`,reels:`<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m10 8 6 4-6 4z"/></svg>`,send:`<svg class="icon" viewBox="0 0 24 24"><path d="m3 4 18 8-18 8 3-8z"/><path d="M6 12h15"/></svg>`,search:`<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,heart:`<svg class="icon" viewBox="0 0 24 24"><path d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/></svg>`,comment:`<svg class="icon" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8.4 8 9.7 9.7 0 0 1-4.1-.9L4 20l1.2-3.1A7.8 7.8 0 0 1 4 11.5a8 8 0 0 1 16 0Z"/></svg>`,bookmark:`<svg class="icon" viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.8L6 21z"/></svg>`,plus:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,edit:`<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>`,settings:`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a2 2 0 0 0 .4 2.2l.1.1-2.1 2.1-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.2h-3v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2.1-2.1.1-.1A2 2 0 0 0 6.2 15 2 2 0 0 0 4.4 14h-.2v-3h.2A2 2 0 0 0 6.2 9a2 2 0 0 0-.4-2.2l-.1-.1 2.1-2.1.1.1a2 2 0 0 0 2.2.4A2 2 0 0 0 11.4 3v-.2h3V3a2 2 0 0 0 1.2 1.8 2 2 0 0 0 2.2-.4l.1-.1L20 6.4l-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 21.3 10h.2v3h-.2a2 2 0 0 0-1.9 2z"/></svg>`,image:`<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 5-5 3 3 2-2 6 5"/></svg>`,mic:`<svg class="icon" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>`,close:`<svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>`,back:`<svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>`,more:`<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>`,user:`<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`};
function avatar(p,cls="avatar"){const letter=(p?.displayName||p?.username||"N").trim().slice(0,1).toUpperCase();return p?.avatar?`<img class="${cls}" src="${attr(p.avatar)}" alt="" onerror="this.style.display='none';this.nextElementSibling?.classList.remove('hidden')"><span class="${cls} hidden" style="display:grid;place-items:center;font-weight:800;background:#222a38">${esc(letter)}</span>`:`<span class="${cls}" style="display:grid;place-items:center;font-weight:800;background:#222a38">${esc(letter)}</span>`}
async function list(table,queries=[]){try{const r=await db.listRows({databaseId:CFG.databaseId,tableId:table,queries:[...queries,Query.limit(100)]});return r.rows||[]}catch(e){console.error(table,e);return[]}}
async function one(table,queries=[]){const a=await list(table,queries);return a[0]||null}
async function create(table,data){return db.createRow({databaseId:CFG.databaseId,tableId:table,rowId:ID.unique(),data})}
async function update(table,rowId,data){return db.updateRow({databaseId:CFG.databaseId,tableId:table,rowId,data})}
async function remove(table,rowId){return db.deleteRow({databaseId:CFG.databaseId,tableId:table,rowId})}
function fileView(id){try{return id?String(storage.getFileView({bucketId:CFG.bucketId,fileId:id})):""}catch{return""}}
async function upload(file){return storage.createFile({bucketId:CFG.bucketId,fileId:ID.unique(),file})}
async function currentUser(){try{return await account.get()}catch{return null}}
async function profileFor(id){return one(CFG.t.profiles,[Query.equal("userId",id)])}
async function ensureProfile(u){let p=await profileFor(u.$id);if(p)return p;const base=(u.name||u.email?.split("@")[0]||"novauser").replace(/[^a-zA-Z0-9_.]/g,"").slice(0,30)||"novauser";try{return await create(CFG.t.profiles,{userId:u.$id,username:base,displayName:u.name||base,avatar:"",bio:"",email:u.email||"",verified:false,createdAt:now()})}catch(e){console.error(e);return null}}
async function followState(target){return !!await one(CFG.t.follows,[Query.equal("followerId",uid()),Query.equal("followingId",target)])}
async function toggleFollow(target){if(target===uid())return;const f=await one(CFG.t.follows,[Query.equal("followerId",uid()),Query.equal("followingId",target)]);if(f)await remove(CFG.t.follows,f.$id);else{await create(CFG.t.follows,{followerId:uid(),followingId:target,createdAt:now()});await create(CFG.t.notifications,{userId:target,fromUserId:uid(),type:"follow",message:"started following you",createdAt:now(),read:false,postId:""}).catch(()=>{})}await render()}
async function count(table,q){return (await list(table,q)).length}
function nav(){return `<nav class="bottom-nav"><div class="nav-inner"><button class="nav-item ${S.route==='home'?'active':''}" onclick="go('home')">${svg.home}</button><button class="nav-item ${S.route==='reels'?'active':''}" onclick="go('reels')">${svg.reels}</button><button class="nav-item ${['messages','chat'].includes(S.route)?'active':''}" onclick="go('messages')">${svg.send}</button><button class="nav-item ${S.route==='search'?'active':''}" onclick="go('search')">${svg.search}</button><button class="nav-item ${S.route==='profile'?'active':''}" onclick="go('profile',uid())">${avatar(S.profile,'nav-avatar')}</button></div></nav>`}
function top(title,action=""){return `<header class="topbar"><button class="brand" onclick="go('home')">${title||'NOVA'}</button><div class="top-actions">${action}</div></header>`}
function shell(content){return `<div class="shell">${content}${nav()}</div>`}
async function render(){if(!S.user){renderAuth();return}if(!S.profile)S.profile=await ensureProfile(S.user);let c='';try{if(S.route==='home')c=await home();else if(S.route==='search')c=await searchPage();else if(S.route==='reels')c=await reels();else if(S.route==='profile')c=await profilePage(S.arg||uid());else if(S.route==='followers')c=await renderPeople(S.arg,'followers');else if(S.route==='following')c=await renderPeople(S.arg,'following');else if(S.route==='create')c=createPage();else if(S.route==='messages')c=await messagesPage();else if(S.route==='chat')c=await chatPage(S.chat);else if(S.route==='post')c=await renderPost();else c=await home();$("app").innerHTML=shell(c);afterRender()}catch(e){console.error(e);$("app").innerHTML=shell(`<div class="empty">Something went wrong.<br><button class="primary" style="margin-top:12px" onclick="go('home')">Reload</button></div>`);}}
function go(route,arg=null){S.route=route;S.arg=arg;if(route!=='chat')S.chat=null;render()}
function renderAuth(){const createMode=S.auth==='register';$("app").innerHTML=`<div class="auth"><div class="auth-card"><div class="logo">NOVA</div><div class="auth-sub">Social, reimagined.</div>${createMode?`<div class="field"><label>Name</label><input id="authName" autocomplete="name"></div>`:''}<div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div><button class="primary full" onclick="authSubmit()">${createMode?'Create account':'Log in'}</button><button class="secondary" onclick="S.auth='${createMode?'login':'register'}';renderAuth()">${createMode?'I already have an account':'Create new account'}</button><div id="authError" class="auth-error"></div></div></div>`}
async function authSubmit(){const email=$("authEmail")?.value.trim(),pass=$("authPassword")?.value,name=$("authName")?.value.trim();if(!email||!pass||pass.length<8){$("authError").textContent='Enter a valid email and an 8+ character password.';return}try{if(S.auth==='register'){const u=await account.create({userId:ID.unique(),email,password:pass,name:name||'NOVA user'});await account.createEmailPasswordSession({email,password:pass});S.user=await account.get();S.profile=await ensureProfile(S.user)}else{await account.createEmailPasswordSession({email,password:pass});S.user=await account.get();S.profile=await ensureProfile(S.user)}S.route='home';render()}catch(e){console.error(e);$("authError").textContent=e?.message||'Authentication failed.'}}
async function home(){const stories=await list(CFG.t.stories,[Query.orderDesc('createdAt')]);S.stories=stories.filter(s=>!s.expiresAt||new Date(s.expiresAt)>new Date()).slice(0,30);let posts=await list(CFG.t.posts,[Query.orderDesc('createdAt')]);S.posts=await enrichPosts(posts);posts=S.posts;return `${top('NOVA',`<button class="icon-btn" onclick="go('create')">${svg.plus}</button>`)}<main class="page"><div class="stories"><div class="story" onclick="newStory()"><div class="story-ring">${avatar(S.profile,'avatar')}</div><span class="story-plus">+</span><div>Your story</div></div>${S.stories.map(s=>`<button class="story" onclick="openStory('${attr(s.$id)}')"><div class="story-ring">${s.media?`<img src="${attr(fileView(s.media)||s.media)}" alt="">`:avatar(S.profile,'avatar')}</div><div>${s.userId===uid()?'You':'Story'}</div></button>`).join('')}</div><section>${posts.length?posts.map(postCard).join(''):`<div class="empty">No posts yet.<br>Create the first post.</div>`}</section></main>`}
function mediaList(p){if(!p.media)return[];try{const a=JSON.parse(p.media);return Array.isArray(a)?a:[]}catch{return p.media?[p.media]:[]}}
function mediaInfo(x){if(typeof x==='string')return{id:x,type:''};return x||{id:'',type:''}}
function mediaMarkup(p){return mediaList(p).map(x=>{const m=mediaInfo(x),src=fileView(m.id)||m.id;return m.type==='video'||/\.(mp4|mov|webm|m4v)(\?|$)/i.test(src)?`<video class="post-media" src="${attr(src)}" controls playsinline preload="metadata"></video>`:`<img class="post-media" src="${attr(src)}" alt="" loading="lazy">`}).join('')}
function postCard(p){return `<article class="post"><div class="post-head">${avatar(p._profile||S.profile)}<div class="post-meta"><div class="username">${esc(p._profile?.username||'NOVA user')} ${p._profile?.verified?'✓':''}</div><div class="time">${ago(p.createdAt)}</div></div><button class="icon-btn" onclick="postMenu('${attr(p.$id)}')">${svg.more}</button></div><div class="media-wrap">${mediaMarkup(p)}</div><div class="post-actions"><button class="icon-btn" id="like-${attr(p.$id)}" onclick="toggleLike('${attr(p.$id)}')">${svg.heart}</button><button class="icon-btn" onclick="comments('${attr(p.$id)}')">${svg.comment}</button><button class="icon-btn" onclick="sharePost('${attr(p.$id)}')">${svg.send}</button><button class="icon-btn save" onclick="toast('Saved')">${svg.bookmark}</button></div><div class="count-row" id="count-${attr(p.$id)}">Loading likes…</div><div class="caption"><b>${esc(p._profile?.username||'NOVA user')}</b>${esc(p.content||'')}</div><button class="comments-link" onclick="comments('${attr(p.$id)}')">View comments</button></article>`}
async function enrichPosts(posts){for(const p of posts){p._profile=await profileFor(p.userId);const liked=await one(CFG.t.reactions,[Query.equal('postId',p.$id),Query.equal('userId',uid())]);const n=await count(CFG.t.reactions,[Query.equal('postId',p.$id)]);setTimeout(()=>{const c=$("count-"+p.$id);if(c)c.textContent=n+' likes';const b=$("like-"+p.$id);if(b&&liked)b.classList.add('liked')},0)}return posts}
async function toggleLike(pid){const old=await one(CFG.t.reactions,[Query.equal('postId',pid),Query.equal('userId',uid())]);try{if(old)await remove(CFG.t.reactions,old.$id);else await create(CFG.t.reactions,{postId:pid,userId:uid(),reaction:'❤️',createdAt:now()});const n=await count(CFG.t.reactions,[Query.equal('postId',pid)]);const c=$("count-"+pid);if(c)c.textContent=n+' likes';const b=$("like-"+pid);if(b)b.classList.toggle('liked',!old)}catch(e){console.error(e);toast('Could not update like')}}
async function searchPage(){return `${top('NOVA')}<main class="page"><div class="search-title">Search</div><div class="search-box">${svg.search}<input id="searchInput" value="${attr(S.search)}" placeholder="Search"></div><div id="searchResults"><div class="empty" style="padding-top:25px">Search for people</div></div></main>`}
async function runSearch(v){S.search=v.trim();const out=$("searchResults");if(!out)return;if(!S.search){out.innerHTML='<div class="empty" style="padding-top:25px">Search for people</div>';return}let rows=await list(CFG.t.profiles,[Query.search('username',S.search)]);if(!rows.length)rows=await list(CFG.t.profiles,[Query.search('displayName',S.search)]);out.innerHTML=rows.map(p=>`<button class="user-row" onclick="go('profile','${attr(p.userId)}')">${avatar(p)}<span class="user-info"><span class="user-name">${esc(p.username)} ${p.verified?'✓':''}</span><span class="user-sub">${esc(p.displayName||'')}</span></span>${p.userId!==uid()?`<span class="small-btn">View</span>`:''}</button>`).join('')||'<div class="empty">No users found.</div>'}
async function profilePage(id){const p=id===uid()?S.profile:await profileFor(id);if(!p)return `${top('NOVA')}<main class="page"><div class="empty">Profile not found.</div></main>`;const posts=await list(CFG.t.posts,[Query.equal('userId',id),Query.orderDesc('createdAt')]);const followers=await count(CFG.t.follows,[Query.equal('followingId',id)]),following=await count(CFG.t.follows,[Query.equal('followerId',id)]);const isSelf=id===uid(),followingMe=!isSelf&&await followState(id);posts.forEach(x=>x._profile=p);return `${top('NOVA',isSelf?`<button class="icon-btn" onclick="editProfile()">${svg.settings}</button>`:`<button class="icon-btn" onclick="go('messages')">${svg.send}</button>`)}<main class="page"><section class="profile-head"><div class="profile-top"><button class="icon-btn" onclick="go('home')">${svg.back}</button><div class="profile-title">${esc(p.username)}</div><button class="icon-btn" onclick="profileMenu('${attr(id)}')">${svg.more}</button></div><div class="profile-summary">${avatar(p,'profile-avatar')}<div class="stats"><button class="stat" onclick="people('${attr(id)}','followers')"><b>${followers}</b><span>followers</span></button><button class="stat" onclick="people('${attr(id)}','following')"><b>${following}</b><span>following</span></button><div class="stat"><b>${posts.length}</b><span>posts</span></div></div></div><div class="bio">${esc(p.bio||'')}</div><div class="profile-buttons">${isSelf?`<button onclick="editProfile()">Edit profile</button><button onclick="shareProfile('${attr(id)}')">Share profile</button><button onclick="newStory()">${svg.plus}</button>`:`<button onclick="toggleFollow('${attr(id)}')">${followingMe?'Following':'Follow'}</button><button onclick="startChat('${attr(id)}')">Message</button><button onclick="shareProfile('${attr(id)}')">${svg.send}</button>`}</div><div class="highlights"><div class="highlight"><div class="highlight-circle">+</div><div>New</div></div></div></section><div class="tabs"><button class="active">${svg.image}</button><button onclick="go('reels')">${svg.reels}</button><button>${svg.user}</button></div><div class="grid">${posts.map(p=>`<button class="grid-item" onclick="postPage('${attr(p.$id)}')">${mediaMarkup(p)||''}</button>`).join('')}</div></main>`}
function people(id,type){go(type,id)}
async function renderPeople(id,type){const q=type==='followers'?[Query.equal('followingId',id)]:[Query.equal('followerId',id)];const rows=await list(CFG.t.follows,q);const people=[];for(const r of rows){const pid=type==='followers'?r.followerId:r.followingId;const p=await profileFor(pid);if(p)people.push(p)}return `${top(type==='followers'?'Followers':'Following')}<main class="page">${people.map(p=>`<button class="user-row" onclick="go('profile','${attr(p.userId)}')">${avatar(p)}<span class="user-info"><span class="user-name">${esc(p.username)}</span><span class="user-sub">${esc(p.displayName||'')}</span></span></button>`).join('')||'<div class="empty">No users yet.</div>'}</main>`}
function createPage(){return `${top('NOVA',`<button class="primary" onclick="publish()">Share</button>`)}<main class="page create"><div class="create-head"><button class="icon-btn" onclick="go('home')">${svg.close}</button><span class="create-title">New post</span><span></span></div><textarea id="postText" maxlength="5000" placeholder="Share something..."></textarea><div id="mediaPreview" class="media-preview"></div><div class="create-bar"><label class="icon-btn file-btn">${svg.image}<input id="postFiles" type="file" accept="image/*,video/*" multiple></label><span class="muted">Photo or video</span></div></main>`}
async function publish(){const text=$("postText")?.value.trim()||'';const files=[...($("postFiles")?.files||[])];if(!text&&!files.length){toast('Add text or media');return}try{const ids=[];for(const f of files.slice(0,10)){const up=await upload(f);ids.push({id:up.$id,type:f.type.startsWith('video/')?'video':'image',name:f.name})}await create(CFG.t.posts,{userId:uid(),content:text,media:JSON.stringify(ids),createdAt:now()});toast('Posted');go('home')}catch(e){console.error(e);toast(e?.message||'Could not publish')}}
async function newStory(){const input=document.createElement('input');input.type='file';input.accept='image/*,video/*';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{const up=await upload(f);await create(CFG.t.stories,{userId:uid(),content:'',media:up.$id,mediaType:f.type.startsWith('video/')?'video':'image',createdAt:now(),expiresAt:new Date(Date.now()+86400000).toISOString()});toast('Story added');go('home')}catch(e){console.error(e);toast('Could not add story')}};input.click()}
async function openStory(id){const s=S.stories.find(x=>x.$id===id);if(!s)return;const p=s.userId===uid()?S.profile:await profileFor(s.userId);const src=fileView(s.media)||s.media;document.body.insertAdjacentHTML('beforeend',`<div class="story-viewer" id="storyViewer"><div class="story-stage">${s.mediaType==='video'?`<video src="${attr(src)}" autoplay playsinline controls></video>`:`<img src="${attr(src)}" alt="">`}<div class="story-progress"><span class="active"></span></div><div class="story-user">${avatar(p)}<b>${esc(p?.username||'NOVA')}</b><span class="muted">${ago(s.createdAt)}</span></div><button class="icon-btn story-close" onclick="closeStory()">${svg.close}</button><div class="story-bottom"><input id="storyReply" placeholder="Send message..."><button onclick="storyReact('${attr(id)}','❤️')">${svg.heart}</button><button onclick="sendStoryReply('${attr(id)}')">${svg.send}</button></div></div></div>`);await create(CFG.t.storyViews,{storyId:id,userId:uid(),createdAt:now()}).catch(()=>{})}
function closeStory(){$('storyViewer')?.remove()}
async function storyReact(id,reaction){await create(CFG.t.storyReactions,{storyId:id,userId:uid(),reaction,createdAt:now()}).catch(()=>{});toast('Reaction sent')}
async function sendStoryReply(id){const text=$("storyReply")?.value.trim();if(!text)return;await create(CFG.t.storyReplies,{storyId:id,userId:uid(),content:text,createdAt:now()});$("storyReply").value='';toast('Reply sent')}
async function comments(pid){const rows=await list(CFG.t.comments,[Query.equal('postId',pid),Query.orderDesc('createdAt')]);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="commentsModal"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Comments</h3><button class="icon-btn" onclick="closeComments()">${svg.close}</button></div><div id="commentsList">${rows.length?rows.map(c=>`<div class="comment-row"><b>${esc(c.userId===uid()?'You':c.userId)}</b> ${esc(c.content)}</div>`).join(''):'<div class="muted">No comments yet.</div>'}</div><div class="comment-compose"><input id="commentInput" placeholder="Add a comment..."><button class="send-circle" onclick="sendComment('${attr(pid)}')">${svg.send}</button></div></div></div>`)}
function closeComments(){$('commentsModal')?.remove()}
async function sendComment(pid){const i=$("commentInput"),text=i?.value.trim();if(!text)return;try{await create(CFG.t.comments,{postId:pid,userId:uid(),content:text,createdAt:now()});i.value='';closeComments();await comments(pid)}catch{toast('Could not comment')}}
function sharePost(pid){const p=S.posts.find(x=>x.$id===pid);if(navigator.share)navigator.share({title:'NOVA',text:p?.content||'NOVA post'}).catch(()=>{});else toast('Share link ready')}
function shareProfile(id){const url=location.href.split('#')[0]+'#profile/'+encodeURIComponent(id);if(navigator.share)navigator.share({title:'NOVA profile',url}).catch(()=>{});else navigator.clipboard?.writeText(url).then(()=>toast('Profile link copied')).catch(()=>toast('Profile link ready'))}
async function postPage(pid){S.route='post';S.arg=pid;await render()}
async function renderPost(){const p=await one(CFG.t.posts,[Query.equal('$id',S.arg)]);if(!p)return `${top('NOVA')}<main class="page"><div class="empty">Post not found.</div></main>`;p._profile=await profileFor(p.userId);return `${top('NOVA')}<main class="page">${postCard(p)}</main>`}
async function postMenu(pid){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="menuModal"><div class="sheet"><h3>Post</h3><button class="action-row" onclick="reportPost('${attr(pid)}')">Report</button><button class="action-row" onclick="closeMenu()">Cancel</button></div></div>`)}
function closeMenu(){$('menuModal')?.remove()}
async function reportPost(pid){await create(CFG.t.reports,{reporterId:uid(),reportedUserId:'',postId:pid,messageId:'',reason:'User report',createdAt:now(),status:'open'}).catch(()=>{});closeMenu();toast('Report sent')}
async function messagesPage(){const members=await list(CFG.t.conversationMembers,[Query.equal('userId',uid())]);const rows=[];for(const m of members){const c=await one(CFG.t.conversations,[Query.equal('$id',m.conversationId)]);if(!c)continue;const other=await one(CFG.t.conversationMembers,[Query.equal('conversationId',c.$id),Query.notEqual('userId',uid())]);const p=other?await profileFor(other.userId):null;if(p)rows.push({c,p})}const all=await list(CFG.t.profiles);const existing=new Set(rows.map(x=>x.p.userId));return `${top(S.profile?.username||'NOVA',`<button class="icon-btn" onclick="newChat()">${svg.edit}</button>`)}<main class="page"><div class="messages-head"><div class="inbox-search">${svg.search}<input id="messageSearch" placeholder="Search"></div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800"><span>Messages</span><span class="muted">Requests</span></div></div><div id="conversationList">${rows.map(x=>conversationRow(x)).join('')}</div><div style="padding:14px;color:#7f8999;font-size:12px;font-weight:800">PEOPLE ON NOVA</div>${all.filter(p=>p.userId!==uid()&&!existing.has(p.userId)).slice(0,30).map(p=>`<button class="message-row" onclick="startChat('${attr(p.userId)}')">${avatar(p)}<span class="message-info"><span class="message-name">${esc(p.username)}</span><span class="message-preview">Start chatting</span></span></button>`).join('')}</main>`}
function conversationRow(x){return `<button class="message-row" onclick="go('chat','${attr(x.c.$id)}')">${avatar(x.p)}<span class="message-info"><span class="message-name">${esc(x.p.username)} ${x.p.verified?'✓':''}</span><span class="message-preview">${esc(x.c.lastMessage||'Start chatting')}</span></span><span class="muted small">${ago(x.c.lastMessageAt)}</span></button>`}
async function newChat(){const users=(await list(CFG.t.profiles)).filter(p=>p.userId!==uid());document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="newChatModal"><div class="sheet"><div style="display:flex;justify-content:space-between"><h3>New message</h3><button class="icon-btn" onclick="$('newChatModal')?.remove()">${svg.close}</button></div>${users.map(p=>`<button class="user-row" onclick="startChat('${attr(p.userId)}')">${avatar(p)}<span class="user-info"><span class="user-name">${esc(p.username)}</span><span class="user-sub">${esc(p.displayName||'')}</span></span></button>`).join('')||'<div class="empty">No other users yet.</div>'}</div></div>`)}
async function startChat(target){let members=await list(CFG.t.conversationMembers,[Query.equal('userId',uid())]);for(const m of members){const other=await one(CFG.t.conversationMembers,[Query.equal('conversationId',m.conversationId),Query.equal('userId',target)]);if(other){$('newChatModal')?.remove();S.chat=m.conversationId;S.chatUser=target;go('chat',m.conversationId);return}}try{const c=await create(CFG.t.conversations,{createdAt:now(),type:'direct',lastMessage:'',lastMessageAt:now()});await create(CFG.t.conversationMembers,{conversationId:c.$id,userId:uid(),joinedAt:now(),isAdmin:true});await create(CFG.t.conversationMembers,{conversationId:c.$id,userId:target,joinedAt:now(),isAdmin:false});$('newChatModal')?.remove();S.chat=c.$id;S.chatUser=target;go('chat',c.$id)}catch(e){console.error(e);toast('Could not start chat')}}
async function chatPage(cid){const members=await list(CFG.t.conversationMembers,[Query.equal('conversationId',cid)]);const other=members.find(m=>m.userId!==uid());S.chatUser=other?.userId||S.chatUser;const p=S.chatUser?await profileFor(S.chatUser):null;const msgs=await list(CFG.t.messages,[Query.equal('conversationId',cid),Query.orderAsc('createdAt')]);return `<div class="chat"><div class="chat-head"><button class="icon-btn" onclick="go('messages')">${svg.back}</button>${avatar(p||S.profile)}<div class="chat-user"><b>${esc(p?.username||'Conversation')}</b><div class="muted small">NOVA</div></div><button class="icon-btn" onclick="toast('Chat options')">${svg.more}</button></div><div class="chat-body" id="chatBody">${msgs.map(messageHtml).join('')}</div><div id="recordTime" class="record-time hidden">00:00</div><div class="chat-compose"><label class="icon-btn media-file">${svg.image}<input id="chatFile" type="file" accept="image/*,video/*"></label><input id="chatText" type="text" placeholder="Message..." autocomplete="off"><button class="icon-btn" id="recordBtn" onclick="toggleRecording()">${svg.mic}</button><button class="send-circle" onclick="sendMessage()">${svg.send}</button></div></div>`}
function messageHtml(m){const mine=m.senderId===uid();let media='';if(m.media){const src=fileView(m.media)||m.media;media=m.mediaType==='video'?`<video src="${attr(src)}" controls playsinline></video>`:m.mediaType==='audio'?`<div class="voice"><button onclick="playVoice('${attr(src)}')">▶</button><div class="voice-line"></div></div>`:`<img src="${attr(src)}" alt="">`}return `<div class="bubble-row ${mine?'mine':''}" data-mid="${attr(m.$id)}" data-mcontent="${attr(m.content||'')}"><div class="bubble">${m.replyTo?'<div class="reply-mini">Replying to a message</div>':''}${media}${m.content?`<div>${esc(m.content)}</div>`:''}</div></div>`}
function playVoice(src){new Audio(src).play().catch(()=>toast('Audio could not play'))}
async function sendMessage(){const input=$("chatText"),file=$("chatFile")?.files?.[0],text=input?.value.trim()||'';if(!text&&!file&&!S.replyTo)return;try{let media='',type='';if(file){const up=await upload(file);media=up.$id;type=file.type.startsWith('video/')?'video':'image'}await create(CFG.t.messages,{conversationId:S.chat,senderId:uid(),content:text,media,mediaType:type,replyTo:S.replyTo||'',createdAt:now(),deleted:false});await updateConversationPreview(S.chat,text||({image:'Photo',video:'Video'}[type]||'Voice message'));S.replyTo=null;render()}catch(e){console.error(e);toast(e?.message||'Message failed')}}
async function updateConversationPreview(cid,text){const c=await one(CFG.t.conversations,[Query.equal('$id',cid)]);if(c)await update(CFG.t.conversations,c.$id,{lastMessage:text,lastMessageAt:now()})}
async function toggleRecording(){if(S.recording){S.recording.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Voice recording is not supported');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const opts=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{};const rec=new MediaRecorder(stream,opts);S.recording=rec;S.recordChunks=[];S.recordStart=Date.now();S.recordStream=stream;$("recordBtn")?.classList.add('recording');$("recordTime")?.classList.remove('hidden');S.recordTimer=setInterval(()=>{const sec=Math.floor((Date.now()-S.recordStart)/1000);const m=String(Math.floor(sec/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');if($("recordTime"))$("recordTime").textContent=m+':'+s},250);rec.ondataavailable=e=>{if(e.data.size)S.recordChunks.push(e.data)};rec.onstop=async()=>{clearInterval(S.recordTimer);S.recordStream?.getTracks().forEach(t=>t.stop());S.recordStream=null;S.recording=null;$("recordBtn")?.classList.remove('recording');$("recordTime")?.classList.add('hidden');const blob=new Blob(S.recordChunks,{type:rec.mimeType||'audio/webm'});try{const file=new File([blob],'voice-'+Date.now()+'.webm',{type:blob.type});const up=await upload(file);await create(CFG.t.messages,{conversationId:S.chat,senderId:uid(),content:'',media:up.$id,mediaType:'audio',replyTo:S.replyTo||'',createdAt:now(),deleted:false});await updateConversationPreview(S.chat,'Voice message');S.replyTo=null;render()}catch(e){console.error(e);toast('Voice message failed')}};rec.start()}catch(e){console.error(e);toast('Microphone permission is required')}}
async function reels(){const posts=await list(CFG.t.posts,[Query.orderDesc('createdAt')]);const vids=[];for(const p of posts){if(mediaList(p).length){p._profile=await profileFor(p.userId);for(const x of mediaList(p)){const m=mediaInfo(x),src=fileView(m.id)||m.id;if(m.type==='video'||/\.(mp4|mov|webm|m4v)(\?|$)/i.test(src))vids.push({p,src})}}}return `${top('NOVA')}<main class="page" style="background:#000;min-height:calc(100vh - 62px)">${vids.map(v=>`<div style="height:calc(100dvh - 126px);position:relative;border-bottom:1px solid #20242b"><video src="${attr(v.src)}" controls playsinline loop style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;left:14px;bottom:18px;font-weight:800">${esc(v.p._profile?.username||'NOVA')}</div></div>`).join('')||'<div class="empty">No videos yet.</div>'}</main>`}
async function editProfile(){const p=S.profile;document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="profileModal"><div class="sheet"><div style="display:flex;justify-content:space-between"><h3>Edit profile</h3><button class="icon-btn" onclick="$('profileModal')?.remove()">${svg.close}</button></div><div class="field"><label>Username</label><input id="epUser" value="${attr(p?.username||'')}"></div><div class="field"><label>Display name</label><input id="epName" value="${attr(p?.displayName||'')}"></div><div class="field"><label>Bio</label><textarea id="epBio">${esc(p?.bio||'')}</textarea></div><label class="primary" style="display:block;text-align:center;position:relative;overflow:hidden">Change photo<input id="epAvatar" type="file" accept="image/*" style="position:absolute;inset:0;opacity:0"></label><button class="primary full" onclick="saveProfile()">Save</button><button class="secondary" onclick="logout()">Log out</button></div></div>`)}
async function saveProfile(){try{let avatarUrl=S.profile.avatar||'';const f=$("epAvatar")?.files?.[0];if(f){const up=await upload(f);avatarUrl=fileView(up.$id)}S.profile=await update(CFG.t.profiles,S.profile.$id,{username:$("epUser").value.trim(),displayName:$("epName").value.trim(),bio:$("epBio").value,avatar:avatarUrl});$("profileModal")?.remove();render()}catch(e){console.error(e);toast('Could not save profile')}}
async function profileMenu(id){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="profileMenu"><div class="sheet"><button class="action-row" onclick="shareProfile('${attr(id)}');$('profileMenu')?.remove()">Share profile</button>${id!==uid()?`<button class="action-row danger" onclick="blockUser('${attr(id)}')">Block</button>`:''}<button class="action-row" onclick="$('profileMenu')?.remove()">Cancel</button></div></div>`)}
async function blockUser(id){await create(CFG.t.user_blocks,{userId:uid(),blockedUserId:id,createdAt:now()}).catch(()=>{});$("profileMenu")?.remove();toast('User blocked')}
async function logout(){try{await account.deleteSession({sessionId:'current'})}catch(e){}S.user=null;S.profile=null;S.route='home';render()}
function bindMessageGestures(){document.querySelectorAll('[data-mid]').forEach(el=>{let timer=null,startX=0;const start=e=>{startX=(e.touches?e.touches[0].clientX:e.clientX);timer=setTimeout(()=>{S.replyTo=el.dataset.mid;const input=$("chatText");if(input){input.placeholder='Replying…';input.focus()}toast('Reply selected')},520)};const cancel=e=>{if(timer){clearTimeout(timer);timer=null}if(e){const x=e.changedTouches?e.changedTouches[0].clientX:e.clientX;if(Math.abs(x-startX)>60){S.replyTo=el.dataset.mid;const input=$("chatText");if(input){input.placeholder='Replying…';input.focus()}toast('Reply selected')}}};el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchend',cancel,{passive:true});el.addEventListener('mousedown',start);el.addEventListener('mouseup',cancel);el.addEventListener('mouseleave',()=>{if(timer)clearTimeout(timer)})})}
function afterRender(){const si=$("searchInput");if(si){si.oninput=()=>{clearTimeout(afterRender.t);afterRender.t=setTimeout(()=>runSearch(si.value),220)}}const pf=$("postFiles");if(pf)pf.onchange=()=>{const out=$("mediaPreview");out.innerHTML=[...pf.files].slice(0,10).map(f=>f.type.startsWith('video/')?`<video src="${attr(URL.createObjectURL(f))}" controls></video>`:`<img src="${attr(URL.createObjectURL(f))}" alt="">`).join('')};const body=$("chatBody");if(body)body.scrollTop=body.scrollHeight;bindMessageGestures()}
window.go=go;window.uid=uid;window.authSubmit=authSubmit;window.renderAuth=renderAuth;window.newStory=newStory;window.openStory=openStory;window.closeStory=closeStory;window.storyReact=storyReact;window.sendStoryReply=sendStoryReply;window.toggleLike=toggleLike;window.comments=comments;window.closeComments=closeComments;window.sendComment=sendComment;window.sharePost=sharePost;window.shareProfile=shareProfile;window.postPage=postPage;window.postMenu=postMenu;window.closeMenu=closeMenu;window.reportPost=reportPost;window.startChat=startChat;window.newChat=newChat;window.sendMessage=sendMessage;window.toggleRecording=toggleRecording;window.playVoice=playVoice;window.publish=publish;window.editProfile=editProfile;window.saveProfile=saveProfile;window.profileMenu=profileMenu;window.blockUser=blockUser;window.logout=logout;window.people=people;
(async()=>{S.user=await currentUser();if(S.user)S.profile=await ensureProfile(S.user);if(location.hash.startsWith('#profile/')){S.route='profile';S.arg=decodeURIComponent(location.hash.slice(9))}await render()})();
})();
