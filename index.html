<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>NewGen</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<style>
:root{
  --bg:#07070a;--panel:#0d0e13;--panel2:#111218;--line:#20222b;
  --text:#f7f7fa;--muted:#8d909d;--accent:#8b5cf6;--accent2:#5eead4;
  --danger:#ff5d73;--shadow:0 18px 60px rgba(0,0,0,.35);--r:24px
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{border:0;color:inherit;cursor:pointer}
.hidden{display:none!important}
#app{min-height:100vh}
.screen{min-height:100vh}
.auth{display:grid;place-items:center;padding:24px;background:
 radial-gradient(circle at 20% 10%,rgba(139,92,246,.18),transparent 32%),
 radial-gradient(circle at 90% 90%,rgba(94,234,212,.10),transparent 30%),var(--bg)}
.auth-card{width:min(430px,100%);padding:34px;border:1px solid var(--line);background:rgba(13,14,19,.86);backdrop-filter:blur(20px);border-radius:32px;box-shadow:var(--shadow)}
.brand{font-size:42px;font-weight:900;letter-spacing:-2px}.brand i{font-style:normal;color:var(--accent)}
.tag{color:var(--muted);margin:8px 0 28px}
.field{margin:12px 0}.field input,.field textarea,.searchbox input{
 width:100%;background:#090a0e;border:1px solid var(--line);border-radius:16px;padding:15px;color:var(--text);outline:none}
.field input:focus,.field textarea:focus{border-color:#6d4bc2}
.primary{width:100%;padding:15px 18px;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#6d5dfc);font-weight:800;margin-top:8px}
.ghost{padding:12px 15px;border-radius:14px;background:#171820;border:1px solid var(--line)}
.switch{color:var(--muted);text-align:center;margin-top:18px}.switch b{color:#b99cff;cursor:pointer}
.layout{display:grid;grid-template-columns:250px minmax(0,760px) 290px;gap:22px;max-width:1320px;margin:auto;padding:22px}
.sidebar,.rightbar{position:sticky;top:22px;height:calc(100vh - 44px)}
.sidebar{display:flex;flex-direction:column}
.logo{font-size:31px;font-weight:950;letter-spacing:-1.8px;padding:14px 12px 30px}.logo i{color:var(--accent);font-style:normal}
.nav{display:grid;gap:7px}.nav button{display:flex;align-items:center;gap:13px;padding:13px 15px;background:transparent;border-radius:15px;color:#a8abb6;text-align:left}
.nav button.active,.nav button:hover{background:#14151b;color:#fff}.nav svg{width:22px;height:22px}
.sidebar-bottom{margin-top:auto;display:grid;gap:7px}
.main{min-width:0;padding-bottom:90px}
.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.topbar h1{font-size:25px;margin:0;letter-spacing:-.7px}.top-actions{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#111218;border:1px solid var(--line);display:grid;place-items:center}
.iconbtn svg{width:21px;height:21px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 35px rgba(0,0,0,.16)}
.composer{padding:16px;margin-bottom:14px}.composer-row{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:#242630;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}.composer-open{flex:1;text-align:left;padding:14px 16px;border-radius:17px;background:#171820;color:#858895}
.quick{display:flex;gap:8px;margin-top:12px}.quick button{flex:1;background:#111218;border:1px solid var(--line);padding:10px;border-radius:13px;color:#aeb0bb}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:#747784;margin:24px 3px 10px}
.moments{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.moment{min-width:145px;height:78px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#14151d,#0c0d11);padding:12px;display:flex;align-items:center;gap:10px}.moment .avatar{width:42px;height:42px}.moment small{color:var(--muted);display:block;margin-top:2px}
.post{padding:0;margin:14px 0;overflow:hidden}.post-head{display:flex;align-items:center;gap:11px;padding:16px 16px 12px}.post-user{flex:1}.post-user strong{display:block}.post-user small{color:var(--muted)}.more{font-size:22px;background:transparent;padding:5px 8px}
.post-body{padding:4px 16px 16px}.post-text{font-size:17px;line-height:1.5;white-space:pre-wrap}.media{margin:0 0 0;max-height:560px;width:100%;object-fit:cover;background:#08090c}.post-media{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.post-actions{display:flex;align-items:center;gap:8px;padding:9px 12px}.post-actions button{background:transparent;color:#9a9da8;padding:9px 12px;border-radius:12px}.post-actions button:hover{background:#171820;color:#fff}.like.on{color:#c6a8ff!important}.post-meta{padding:0 16px 15px;color:#777b87;font-size:13px}
.empty{padding:45px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:#fff;font-size:18px;margin-bottom:6px}
.rightbar .panel{padding:16px}.right-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.right-title b{font-size:15px}.person{display:flex;align-items:center;gap:10px;padding:10px 0}.person .avatar{width:40px;height:40px}.person-info{flex:1;min-width:0}.person-info strong,.person-info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-info small{color:var(--muted)}.follow{padding:8px 10px;background:#191621;border:1px solid #30244b;border-radius:11px;color:#c5aaff;font-weight:700}
.mobile-nav{display:none}
.searchbox{display:flex;gap:9px;margin-bottom:14px}.searchbox input{flex:1}
.search-results{display:grid;gap:9px}.result{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:17px}
.profile-cover{height:145px;border-radius:25px 25px 0 0;background:linear-gradient(135deg,#1c1630,#0d2827);position:relative}.profile-main{padding:0 20px 20px}.profile-avatar{margin-top:-38px;width:88px;height:88px;border:4px solid var(--bg);border-radius:50%}.profile-info{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.profile-name{font-size:24px;font-weight:850}.verified{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#4d8dff;color:white;font-size:12px;font-weight:900;margin-left:5px;vertical-align:2px}.bio{color:#9a9da8;margin-top:6px;line-height:1.45}.profile-actions{display:flex;gap:8px;margin-top:16px}.profile-actions button{flex:1}.create-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.create-choice{padding:25px 15px;border-radius:20px;background:#14151c;border:1px solid var(--line);text-align:left}.create-choice b{display:block;font-size:18px;margin-bottom:6px}.create-choice span{color:var(--muted);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(12px);display:grid;place-items:end center;padding:18px;z-index:50}.sheet{width:min(600px,100%);background:#101117;border:1px solid #292b35;border-radius:27px;padding:18px;max-height:88vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet-head h2{margin:0;font-size:20px}.close{background:#1b1c23;width:38px;height:38px;border-radius:12px}
.modal textarea{min-height:130px;resize:vertical}.filebox{border:1px dashed #363844;border-radius:17px;padding:20px;text-align:center;color:#9699a5;margin:12px 0}.filebox input{display:none}.filebox label{display:block;cursor:pointer}.preview{display:grid;gap:8px;margin:10px 0}.preview img,.preview video{width:100%;max-height:300px;object-fit:cover;border-radius:15px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#f5f5f7;color:#09090b;padding:11px 15px;border-radius:14px;font-weight:700;z-index:80;box-shadow:var(--shadow)}
.chat-layout{height:calc(100vh - 84px);display:flex;flex-direction:column}.chat-head{padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.chat-head .back{display:none}.chat-head-info{flex:1}.chat-head-info strong{display:block}.chat-head-info small{color:#66d7b8}.messages{flex:1;overflow:auto;padding:18px 8px}.bubble-row{display:flex;gap:8px;margin:6px 0;align-items:flex-end}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(72%,470px);padding:11px 14px;border-radius:18px 18px 18px 5px;background:#171920;border:1px solid #252732;position:relative}.mine .bubble{background:#6f50c9;border-color:#7656d0;border-radius:18px 18px 5px 18px}.bubble small{display:block;opacity:.65;margin-top:4px;font-size:10px}.replybox{display:none;padding:9px 12px;background:#121319;border-top:1px solid var(--line);color:#aaa}.replybox.on{display:flex;align-items:center;gap:8px}.replybox span{flex:1}.chat-compose{display:flex;gap:8px;padding:10px 8px;background:#0a0b0f;border-top:1px solid var(--line)}.chat-compose textarea{flex:1;max-height:110px;resize:none;border:1px solid var(--line);background:#14151b;color:#fff;border-radius:18px;padding:12px;outline:none}.send{width:46px;height:46px;border-radius:15px;background:#8058dd}.attach{width:46px;height:46px;border-radius:15px;background:#15161c}
.voicebar{display:flex;align-items:center;gap:9px}.voicebar audio{width:180px;max-width:100%}
.settings-row{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.settings-row div{flex:1}.settings-row small{display:block;color:var(--muted);margin-top:3px}
@media(max-width:1050px){.layout{grid-template-columns:76px minmax(0,760px);justify-content:center}.sidebar .logo{font-size:0;text-align:center}.sidebar .logo:after{content:"N";font-size:31px}.nav button span,.sidebar-bottom span{display:none}.nav button{justify-content:center}.rightbar{display:none}}
@media(max-width:720px){
 .layout{display:block;padding:0 12px}.sidebar{display:none}.main{padding-bottom:84px}.topbar{padding:9px 3px;margin-bottom:5px}.topbar h1{font-size:22px}.rightbar{display:none}
 .mobile-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;height:68px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,8,11,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:30}.mobile-nav button{background:transparent;color:#7f828d;border-radius:14px}.mobile-nav button.active{background:#181920;color:#fff}.mobile-nav svg{width:22px;height:22px}.panel{border-radius:20px}.moments{margin-right:-12px;padding-right:12px}.composer{padding:13px}.quick button{font-size:12px}.profile-cover{height:120px}.modal{padding:0}.sheet{border-radius:27px 27px 0 0}.create-grid{grid-template-columns:1fr}.chat-layout{height:calc(100vh - 10px)}.chat-head .back{display:grid}.chat-head{margin:0 -12px}.messages{padding-left:2px;padding-right:2px}.bubble{max-width:82%}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const {Client,Account,Databases,Storage,ID,Query,Permission,Role} = Appwrite;

const CFG={
 endpoint:"https://fra.cloud.appwrite.io/v1",
 projectId:"6aa242bf00012f890e92",
 databaseId:"6aa41332002b049743d5",
 bucketId:"6aa421b20025a1b4aac8",
 cloudName:"ael6mcwb",
 uploadPreset:"newgen_upload",
 ownerCode:"Carlos-2839",
 ownerFunction:"https://6aa476550001ca179b26.fra.appwrite.run/"
};

const client=new Client().setEndpoint(CFG.endpoint).setProject(CFG.projectId);
const account=new Account(client);
const db=new Databases(client);
const storage=new Storage(client);

const C={
 profiles:"profiles",posts:"posts",conversations:"conversations",members:"conversation_members",
 messages:"messages",messageReactions:"message_reactions",comments:"comments",reactions:"reactions",
 follows:"follows",notifications:"notifications",stories:"stories",storyViews:"story_views",
 storyReactions:"story_reactions",storyReplies:"story_replies",presence:"user_presence",
 reports:"reports",postMedia:"post_media",storyMedia:"story_media",verification:"verification",
 admin:"admin_actions",blocks:"user_blocks",commentReactions:"comment_reactions"
};

let me=null, myProfile=null, currentPage="home", currentChat=null, replyTo=null;
let realtimeUnsubs=[];

const $=id=>document.getElementById(id);
function esc(v=""){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function icon(name){
 const p={
 home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="m22 2-11 11"/>',
 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
 user:'<circle cx="12" cy="7" r="4"/><path d="M4 21c.8-4 3.3-6 8-6s7.2 2 8 6"/>',
 settings:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M4.9 4.9 7 7m10 0 2.1-2.1M7 17l-2.1 2.1M17 17l2.1 2.1M12 2v3m0 14v3M2 12h3m14 0h3"/>',
 message:'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.5 8.5 0 0 1-4-.9L3 20l1.9-4A7.4 7.4 0 0 1 4.5 12 7.5 7.5 0 0 1 12 4.5a7.5 7.5 0 0 1 8 7Z"/>',
 spark:'<path d="m12 2 1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7Z"/>',
 logout:'<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',
 back:'<path d="m15 18-6-6 6-6"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/>'
 };
 return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p[name]||p.spark}</svg>`;
}
function svg(name){return icon(name)}
function avatar(p,size=""){let a=p?.avatar;return `<div class="avatar ${size}">${a?`<img src="${esc(a)}">`:esc((p?.displayName||p?.username||"?").slice(0,1).toUpperCase())}</div>`}
function verified(p){return p?.verified?'<span class="verified">✓</span>':''}
function timeAgo(date){
 const d=new Date(date||Date.now()),s=Math.max(0,(Date.now()-d.getTime())/1000);
 if(s<60)return "now"; if(s<3600)return Math.floor(s/60)+"m"; if(s<86400)return Math.floor(s/3600)+"h";
 if(s<604800)return Math.floor(s/86400)+"d"; return d.toLocaleDateString();
}
function toast(msg){
 $("toastRoot").innerHTML=`<div class="toast">${esc(msg)}</div>`;
 setTimeout(()=>$("toastRoot").innerHTML="",2300);
}
function modal(html){
 $("modalRoot").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`;
}
function closeModal(){$("modalRoot").innerHTML=""}
async function upload(file){
 if(!file)throw new Error("No file selected");
 const fd=new FormData();
 fd.append("file",file);fd.append("upload_preset",CFG.uploadPreset);
 const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.cloudName}/auto/upload`,{method:"POST",body:fd});
 const data=await r.json();
 if(!r.ok)throw new Error(data?.error?.message||"Upload failed");
 return {id:data.public_id||"",url:data.secure_url||data.url,type:file.type,name:file.name};
}
async function safe(fn){try{return await fn()}catch(e){console.error(e);toast(e.message||"Something went wrong");return null}}
async function getProfile(uid){
 try{
  const r=await db.listDocuments(CFG.databaseId,C.profiles,[Query.equal("userId",uid),Query.limit(1)]);
  return r.documents[0]||null;
 }catch{return null}
}
async function ensureProfile(){
 myProfile=await getProfile(me.$id);
 if(!myProfile){
  myProfile=await db.createDocument(CFG.databaseId,C.profiles,ID.unique(),{
   userId:me.$id,username:(me.email||"newgen").split("@")[0],displayName:(me.name||"NewGen User"),
   avatar:"",bio:"",email:me.email||"",verified:false,createdAt:new Date().toISOString()
  });
 }
}
async function boot(){
 try{me=await account.get()}catch{renderAuth(false);return}
 await ensureProfile();
 renderApp();
 subscribeRealtime();
}
function renderAuth(register){
 $("app").innerHTML=`<div class="screen auth"><div class="auth-card">
  <div class="brand">NewGen<i>.</i></div>
  <div class="tag">${register?"Create your identity. No noise.":"A new way to connect."}</div>
  <form onsubmit="authSubmit(event,${register})">
   ${register?'<div class="field"><input id="authName" placeholder="Display name" autocomplete="name" required></div>':''}
   <div class="field"><input id="authEmail" type="email" placeholder="Email" autocomplete="email" required></div>
   <div class="field"><input id="authPass" type="password" placeholder="Password" autocomplete="${register?"new-password":"current-password"}" minlength="8" required></div>
   <button class="primary">${register?"Create NewGen account":"Enter NewGen"}</button>
  </form>
  <div class="switch">${register?"Already have an account?":"New here?"} <b onclick="renderAuth(${!register})">${register?"Sign in":"Create account"}</b></div>
 </div></div>`;
}
async function authSubmit(e,reg){
 e.preventDefault();
 const email=$("authEmail").value.trim(),pass=$("authPass").value;
 await safe(async()=>{
  if(reg){
   const name=$("authName").value.trim();
   await account.create(ID.unique(),email,pass,name);
   await account.createEmailPasswordSession(email,pass);
  }else await account.createEmailPasswordSession(email,pass);
  me=await account.get();await ensureProfile();renderApp();subscribeRealtime();
 });
}
function navButton(id,ico,label){
 return `<button class="${currentPage===id?"active":""}" onclick="go('${id}')">${svg(ico)}<span>${label}</span></button>`;
}
function renderApp(){
 $("app").innerHTML=`<div class="layout">
  <aside class="sidebar">
   <div class="logo">NewGen<i>.</i></div>
   <div class="nav">
    ${navButton("home","home","Home")}
    ${navButton("inbox","message","Inbox")}
    ${navButton("discover","search","Discover")}
    ${navButton("create","plus","Create")}
    ${navButton("profile","user","Me")}
    ${navButton("notifications","bell","Alerts")}
   </div>
   <div class="sidebar-bottom">${navButton("settings","settings","Settings")}
    <button onclick="logout()">${svg("logout")}<span>Log out</span></button>
   </div>
  </aside>
  <main class="main" id="main"></main>
  <aside class="rightbar" id="rightbar"></aside>
 </div>
 <nav class="mobile-nav">
  ${navButton("home","home","")}
  ${navButton("inbox","message","")}
  ${navButton("create","plus","")}
  ${navButton("discover","search","")}
  ${navButton("profile","user","")}
 </nav>`;
 go(currentPage);
}
async function go(page){
 currentPage=page;
 if(!me)return;
 document.querySelectorAll(".nav button,.mobile-nav button").forEach(b=>b.classList.remove("active"));
 const main=$("main");
 if(page==="home")await homePage(main);
 else if(page==="inbox")await inboxPage(main);
 else if(page==="discover")await discoverPage(main);
 else if(page==="create")openCreateMenu();
 else if(page==="profile")await profilePage(main,me.$id);
 else if(page==="notifications")await notificationsPage(main);
 else if(page==="settings")settingsPage(main);
}
function top(title,actions=""){
 return `<div class="topbar"><h1>${title}</h1><div class="top-actions">${actions}</div></div>`;
}
async function homePage(main){
 main.innerHTML=top("NewGen",`<button class="iconbtn" onclick="go('discover')">${svg("search")}</button><button class="iconbtn" onclick="go('notifications')">${svg("bell")}</button>`) +
 `<div id="homeBody"><div class="empty">Loading NewGen…</div></div>`;
 const body=$("homeBody");
 const [posts,people]=await Promise.all([
  safe(()=>db.listDocuments(CFG.databaseId,C.posts,[Query.orderDesc("createdAt"),Query.limit(30)])),
  safe(()=>db.listDocuments(CFG.databaseId,C.profiles,[Query.orderDesc("createdAt"),Query.limit(8)]))
 ]);
 const docs=posts?.documents||[];
 let profiles={}; for(const p of (people?.documents||[]))profiles[p.userId]=p;
 body.innerHTML=`<div class="panel composer">
  <div class="composer-row">${avatar(myProfile)}<button class="composer-open" onclick="openPostModal()">What’s happening, ${esc((myProfile.displayName||"you").split(" ")[0])}?</button></div>
  <div class="quick"><button onclick="openPostModal()">${svg("spark")} Post</button><button onclick="openStoryModal()">${svg("image")} Moment</button><button onclick="openChatPicker()">${svg("message")} Message</button></div>
 </div>
 <div class="section-title">People on NewGen</div>
 <div class="moments">${(people?.documents||[]).map(p=>`<button class="moment" onclick="profilePage($('main'),'${esc(p.userId)}')">${avatar(p)}<div><b>${esc(p.displayName||p.username)}</b><small>@${esc(p.username||"user")}</small></div></button>`).join("")||'<div class="empty">No people yet.</div>'}</div>
 <div class="section-title">The latest</div>
 <div id="feed">${docs.map(p=>postCard(p,profiles[p.userId]||null)).join("")||`<div class="panel empty"><b>Your NewGen starts here.</b>Create the first post.</div>`}</div>`;
}
function postCard(p,pr){
 const owner=p.userId===me.$id;
 let media="";
 if(p.media){
  if((p.mediaType||"").startsWith("video")||p.media.includes(".mp4")||p.media.includes("/video/"))
   media=`<div class="post-media"><video class="media" src="${esc(p.media)}" controls playsinline></video></div>`;
  else media=`<div class="post-media"><img class="media" src="${esc(p.media)}" loading="lazy"></div>`;
 }
 return `<article class="panel post" data-post="${esc(p.$id)}">
  <div class="post-head">${avatar(pr)}<div class="post-user"><strong>${esc(pr?.displayName||pr?.username||"NewGen user")}${verified(pr)}</strong><small>@${esc(pr?.username||"user")} · ${timeAgo(p.createdAt)}</small></div>
  <button class="more" onclick="postMenu('${esc(p.$id)}','${esc(p.userId)}')">•••</button></div>
  <div class="post-body">${p.content?`<div class="post-text">${esc(p.content)}</div>`:""}${media}</div>
  <div class="post-actions"><button class="like" onclick="reactPost('${esc(p.$id)}','❤️')">♡ Like</button><button onclick="commentPost('${esc(p.$id)}')">Comment</button><button onclick="sharePost('${esc(p.$id)}')">Share</button></div>

 </article>`;
}
async function reactPost(postId,reaction){
 await safe(async()=>{
  const q=await db.listDocuments(CFG.databaseId,C.reactions,[Query.equal("postId",postId),Query.equal("userId",me.$id),Query.limit(1)]);

  else await db.createDocument(CFG.databaseId,C.reactions,ID.unique(),{postId,userId:me.$id,reaction,createdAt:new Date().toISOString()});

 });
}

 <textarea id="storyText" placeholder="Optional message…"></textarea>

async function inboxPage(main){
 main.innerHTML=top("Inbox",`<button class="iconbtn" onclick="openChatPicker()">${svg("plus")}</button>`) + `<div id="inboxBody"><div class="empty">Loading conversations…</div></div>`;
 const body=$("inboxBody");
 const m=await safe(()=>db.listDocuments(CFG.databaseId,C.members,[Query.equal("userId",me.$id),Query.limit(100)]));
 const members=m?.documents||[];
 if(!members.length){body.innerHTML=`<div class="panel empty"><b>No conversations yet.</b>Start a NewGen message.</div>`;return}
 const convs=[];for(const x of members){const q=await safe(()=>db.getDocument(CFG.databaseId,C.conversations,x.conversationId));if(q)convs.push(q)}
 convs.sort((a,b)=>new Date(b.lastMessageAt||b.createdAt)-new Date(a.lastMessageAt||a.createdAt));
 let html="";
 for(const c of convs){
  const mm=await safe(()=>db.listDocuments(CFG.databaseId,C.members,[Query.equal("conversationId",c.$id),Query.limit(20)]));
  const other=(mm?.documents||[]).find(x=>x.userId!==me.$id);
  const p=other?await getProfile(other.userId):null;
  html+=`<button class="result" style="width:100%;text-align:left" onclick="openChat('${c.$id}','${other?.userId||""}')">${avatar(p)}<div class="person-info"><strong>${esc(p?.displayName||p?.username||"Conversation")}${verified(p)}</strong><small>${esc(c.lastMessage||"Start a conversation")} · ${timeAgo(c.lastMessageAt||c.createdAt)}</small></div>${svg("send")}</button>`;
 }
 body.innerHTML=`<div class="search-results">${html}</div>`;
}
async function openChatPicker(){
 const people=await safe(()=>db.listDocuments(CFG.databaseId,C.profiles,[Query.limit(100)]));
 modal(`<div class="sheet-head"><h2>New message</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="searchbox"><input id="chatSearch" placeholder="Find a person…" oninput="filterPeople()"></div>
 <div id="peoplePicker" class="search-results">${(people?.documents||[]).filter(p=>p.userId!==me.$id).map(p=>`<button class="result" data-name="${esc((p.displayName||"")+" "+(p.username||""))}" onclick="startChat('${p.userId}')">${avatar(p)}<div class="person-info"><strong>${esc(p.displayName||p.username)}${verified(p)}</strong><small>@${esc(p.username||"user")}</small></div></button>`).join("")}</div>`);
}
function filterPeople(){const q=$("chatSearch").value.toLowerCase();document.querySelectorAll("#peoplePicker .result").forEach(x=>x.style.display=x.dataset.name.toLowerCase().includes(q)?"flex":"none")}
async function startChat(uid){
 closeModal();
 await safe(async()=>{
  const mine=await db.listDocuments(CFG.databaseId,C.members,[Query.equal("userId",me.$id),Query.limit(100)]);
  for(const m of mine.documents){
   const others=await db.listDocuments(CFG.databaseId,C.members,[Query.equal("conversationId",m.conversationId),Query.equal("userId",uid),Query.limit(1)]);
   if(others.documents[0]){openChat(m.conversationId,uid);return}
  }
  const c=await db.createDocument(CFG.databaseId,C.conversations,ID.unique(),{createdAt:new Date().toISOString(),type:"direct",lastMessage:"",lastMessageAt:new Date().toISOString()});
  await db.createDocument(CFG.databaseId,C.members,ID.unique(),{conversationId:c.$id,userId:me.$id,joinedAt:new Date().toISOString(),isAdmin:false});
  await db.createDocument(CFG.databaseId,C.members,ID.unique(),{conversationId:c.$id,userId:uid,joinedAt:new Date().toISOString(),isAdmin:false});
  openChat(c.$id,uid);
 });
}
async function openChat(convId,uid){
 currentChat={convId,uid};
 const p=await getProfile(uid);
 $("main").innerHTML=`<div class="chat-layout"><div class="panel chat-head"><button class="iconbtn back" onclick="go('inbox')">${svg("back")}</button>${avatar(p)}<div class="chat-head-info"><strong>${esc(p?.displayName||p?.username||"NewGen user")}${verified(p)}</strong><small>NewGen chat</small></div><button class="iconbtn">${svg("settings")}</button></div>
 <div id="messages" class="messages"><div class="empty">Loading…</div></div>
 <div id="replybox" class="replybox"><span id="replyText"></span><button onclick="cancelReply()">×</button></div>
 <form class="chat-compose" onsubmit="sendMessage(event)"><label class="attach" style="display:grid;place-items:center">${svg("plus")}<input id="chatFile" type="file" accept="image/*,video/*" hidden></label><textarea id="chatText" rows="1" placeholder="Message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit()}"></textarea><button type="button" class="attach" onclick="recordVoice()">${svg("mic")}</button><button class="send">${svg("send")}</button></form></div>`;
 await loadMessages();subscribeChat(convId);
}
async function loadMessages(){
 const r=await safe(()=>db.listDocuments(CFG.databaseId,C.messages,[Query.equal("conversationId",currentChat.convId),Query.orderAsc("createdAt"),Query.limit(100)]));
 const arr=r?.documents||[];const box=$("messages");if(!box)return;
 box.innerHTML=arr.map(messageHTML).join("")||`<div class="empty"><b>Start the conversation.</b>No noise. Just NewGen.</div>`;
 box.scrollTop=box.scrollHeight;
}
function messageHTML(m){
 const mine=m.senderId===me.$id,media=m.media?((m.mediaType||"").startsWith("video")?`<video src="${esc(m.media)}" controls playsinline style="max-width:100%;border-radius:12px"></video>`:`<img src="${esc(m.media)}" style="max-width:100%;border-radius:12px">`):"";
 return `<div class="bubble-row ${mine?"mine":""}" data-mid="${m.$id}" ontouchstart="touchStart(event,'${m.$id}')" ontouchend="touchEnd(event,'${m.$id}')"><div class="bubble">${m.replyTo?`<div style="font-size:11px;opacity:.6;border-left:2px solid #aaa;padding-left:7px;margin-bottom:5px">Reply</div>`:""}${media}${m.content?`<div>${esc(m.content)}</div>`:""}<small>${timeAgo(m.createdAt)}${m.deleted?" · deleted":""}</small></div></div>`;
}
async function sendMessage(e){
 e.preventDefault();if(!currentChat)return;
 const text=$("chatText").value.trim(),file=$("chatFile").files[0];if(!text&&!file)return;
 await safe(async()=>{
  let up={};if(file)up=await upload(file);
  await db.createDocument(CFG.databaseId,C.messages,ID.unique(),{conversationId:currentChat.convId,senderId:me.$id,content:text,media:up.url||"",mediaType:up.type||"",replyTo:replyTo?.id||"",createdAt:new Date().toISOString(),deleted:false});
  await db.updateDocument(CFG.databaseId,C.conversations,currentChat.convId,{lastMessage:text||"Media",lastMessageAt:new Date().toISOString()});
  $("chatText").value="";$("chatFile").value="";cancelReply();
  await loadMessages();
 });
}
function touchStart(e,id){window._touch={id,x:e.changedTouches[0].clientX,t:Date.now()}}
function touchEnd(e,id){
 const t=window._touch;if(!t||t.id!==id)return;
 const dx=e.changedTouches[0].clientX-t.x;
 if(dx>70&&Date.now()-t.t<800){const el=document.querySelector(`[data-mid="${id}"] .bubble`);replyMessage(id,el?.innerText||"Message")}
 window._touch=null;
}
function replyMessage(id,text){replyTo={id};$("replybox").classList.add("on");$("replyText").textContent="Replying to: "+text.slice(0,80);$("chatText").focus()}
function cancelReply(){replyTo=null;$("replybox")?.classList.remove("on")}
function longPressMessage(id){const m=prompt("Reaction: ❤️ 😂 🔥 👍");if(m)reactMessage(id,m)}
async function reactMessage(id,reaction){await safe(async()=>{await db.createDocument(CFG.databaseId,C.messageReactions,ID.unique(),{messageId:id,userId:me.$id,reaction,createdAt:new Date().toISOString()});toast("Reaction sent")})}
let recorder=null,recordChunks=[];
async function recordVoice(){
 if(recorder?.state==="recording"){recorder.stop();return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};
  recorder.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());
   const blob=new Blob(recordChunks,{type:recorder.mimeType||"audio/webm"}),file=new File([blob],"voice.webm",{type:blob.type});
   await safe(async()=>{const up=await upload(file);await db.createDocument(CFG.databaseId,C.messages,ID.unique(),{conversationId:currentChat.convId,senderId:me.$id,content:"",media:up.url,mediaType:"audio/webm",replyTo:"",createdAt:new Date().toISOString(),deleted:false});await db.updateDocument(CFG.databaseId,C.conversations,currentChat.convId,{lastMessage:"Voice message",lastMessageAt:new Date().toISOString()});await loadMessages()});
  };recorder.start();toast("Recording… tap mic again to send");
 }catch{toast("Microphone permission is required")}
}
async function discoverPage(main){
 main.innerHTML=top("Discover")+`<div class="searchbox"><input id="discoverInput" placeholder="Search people…" oninput="discoverSearch()"></div><div id="discoverResults" class="search-results"><div class="empty">Search NewGen users.</div></div>`;
}
async function discoverSearch(){
 const q=$("discoverInput").value.trim();if(!q){$("discoverResults").innerHTML=`<div class="empty">Search NewGen users.</div>`;return}
 const r=await safe(()=>db.listDocuments(CFG.databaseId,C.profiles,[Query.search("username",q),Query.limit(30)]));
 let docs=r?.documents||[];
 if(!docs.length){const r2=await safe(()=>db.listDocuments(CFG.databaseId,C.profiles,[Query.limit(100)]));docs=(r2?.documents||[]).filter(p=>(p.username||"").toLowerCase().includes(q.toLowerCase())||(p.displayName||"").toLowerCase().includes(q.toLowerCase())).slice(0,30)}
 $("discoverResults").innerHTML=docs.map(p=>`<button class="result" style="text-align:left" onclick="profilePage($('main'),'${esc(p.userId)}')">${avatar(p)}<div class="person-info"><strong>${esc(p.displayName||p.username)}${verified(p)}</strong><small>@${esc(p.username||"user")}${p.bio?" · "+esc(p.bio):""}</small></div></button>`).join("")||`<div class="empty">No users found.</div>`;
}
async function profilePage(main,uid){
 const p=await getProfile(uid);if(!p){main.innerHTML=`<div class="empty">Profile not found.</div>`;return}
 const posts=await safe(()=>db.listDocuments(CFG.databaseId,C.posts,[Query.equal("userId",uid),Query.orderDesc("createdAt"),Query.limit(30)]));
 const own=uid===me.$id;
 main.innerHTML=top(own?"Me":"Profile",own?`<button class="iconbtn" onclick="openCreateMenu()">${svg("plus")}</button>`:`<button class="iconbtn" onclick="startChat('${uid}')">${svg("message")}</button>`) +
 `<div class="panel"><div class="profile-cover"></div><div class="profile-main">${avatar(p)}<div class="profile-info"><div><div class="profile-name">${esc(p.displayName||p.username)}${verified(p)}</div><div style="color:#858894">@${esc(p.username||"user")}</div><div class="bio">${esc(p.bio||"No bio yet.")}</div></div></div>
 <div class="profile-actions">${own?`<button class="ghost" onclick="editProfile()">Edit profile</button><button class="ghost" onclick="openCreateMenu()">Create</button>`:`<button class="primary" onclick="startChat('${uid}')">Message</button>`}</div></div></div>
 <div class="section-title">${own?"Your posts":"Posts"}</div><div>${(posts?.documents||[]).map(x=>postCard(x,p)).join("")||`<div class="panel empty"><b>Nothing here yet.</b></div>`}</div>`;
}

 modal(`<div class="sheet-head"><h2>Create</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="create-grid"><button class="create-choice" onclick="openPostModal()"><b>Post</b><span>Share text, photo or video with NewGen.</span></button>

 modal(`<div class="sheet-head"><h2>Edit profile</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="field"><input id="editName" value="${esc(myProfile.displayName||"")}" placeholder="Display name"></div>

 main.innerHTML=top("Alerts")+`<div class="search-results">${(r?.documents||[]).map(n=>`<div class="result">${svg("bell")}<div class="person-info"><strong>${esc(n.message||n.type||"New activity")}</strong><small>${timeAgo(n.createdAt)}</small></div></div>`).join("")||`<div class="panel empty"><b>All quiet.</b>Your NewGen alerts will appear here.</div>`}</div>`;

function settingsPage(main){
 main.innerHTML=top("Settings")+`<div class="panel" style="padding:18px">

 <div class="settings-row">${svg("spark")}<div><b>NewGen identity</b><small>Your profile, posts and messages stay connected to your NewGen account.</small></div></div>

function ownerLogin(){
 modal(`<div class="sheet-head"><h2>Owner access</h2><button class="close" onclick="closeModal()">×</button></div>
 <p style="color:#9295a1">Enter the NewGen owner code.</p><div class="field"><input id="ownerCodeInput" type="password" placeholder="Owner code"></div><button class="primary" onclick="checkOwner()">Continue</button>`);
}
async function checkOwner(){
 if($("ownerCodeInput").value!==CFG.ownerCode){toast("Wrong owner code");return}
 closeModal();await ownerPanel();
}
async function ownerPanel(){
 modal(`<div class="sheet-head"><h2>NewGen Owner</h2><button class="close" onclick="closeModal()">×</button></div>
 <div class="panel" style="padding:14px;margin-bottom:10px"><b>Owner controls</b><p style="color:#8f929e;font-size:13px">Moderation actions use the NewGen Owner Function.</p></div>
 <button class="ghost" style="width:100%;margin:5px 0" onclick="ownerUsers()">Manage users</button>
 <button class="ghost" style="width:100%;margin:5px 0" onclick="ownerReports()">View reports</button>`);

async function ownerCall(action,body={}){
 const r=await fetch(CFG.ownerFunction,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,...body})});
 const d=await r.json();if(!r.ok)throw new Error(d.message||"Owner function error");return d;
}
async function ownerUsers(){
 await safe(async()=>{
  const d=await ownerCall("listUsers");
  modal(`<div class="sheet-head"><h2>Users</h2><button class="close" onclick="ownerPanel()">×</button></div><div class="search-results">${(d.users||[]).map(u=>`<div class="result"><div class="person-info"><strong>${esc(u.name||"Unnamed")}</strong><small>${esc(u.email||u.$id)}</small></div><button class="ghost" onclick="ownerVerify('${esc(u.$id)}')">Verify</button></div>`).join("")||`<div class="empty">No users.</div>`}</div>`);
 });
}
async function ownerVerify(uid){await safe(async()=>{await ownerCall("verifyUser",{userId:uid});toast("User verified");ownerUsers()})}
async function ownerReports(){
 await safe(async()=>{
  const d=await ownerCall("listReports");
  modal(`<div class="sheet-head"><h2>Reports</h2><button class="close" onclick="ownerPanel()">×</button></div><div class="search-results">${(d.reports||[]).map(x=>`<div class="result"><div class="person-info"><strong>${esc(x.reason||"Report")}</strong><small>${esc(x.status||"open")} · ${timeAgo(x.createdAt)}</small></div></div>`).join("")||`<div class="empty">No reports.</div>`}</div>`);
 });
}
function subscribeRealtime(){
 realtimeUnsubs.forEach(x=>{try{x()}catch{}});
 realtimeUnsubs=[];
 try{
  const unsub=client.subscribe(`databases.${CFG.databaseId}.collections.${C.posts}.documents`,()=>{if(currentPage==="home")homePage($("main"))});
  realtimeUnsubs.push(unsub);
 }catch(e){console.log(e)}
}
function subscribeChat(convId){
 try{
  const u=client.subscribe(`databases.${CFG.databaseId}.collections.${C.messages}.documents`,res=>{
   if(res.payload?.conversationId===convId&&currentChat?.convId===convId)loadMessages();
  });realtimeUnsubs.push(u);
 }catch{}
}
async function logout(){try{await account.deleteSession("current")}catch{}me=null;myProfile=null;renderAuth(false)}
boot();
