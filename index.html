<script>
(()=>{
'use strict';
const CFG={endpoint:'https://fra.cloud.appwrite.io/v1',projectId:'6aa242bf00012f890e92',databaseId:'6aa41332002b049743d5',bucketId:'6aa421b20025a1b4aac8',ownerCode:'Carlos-2839',ownerFunction:'https://6aa476550001ca179b26.fra.appwrite.run/'};
const T={profiles:'profiles',posts:'posts',post_media:'post_media',comments:'comments',comment_reactions:'comment_reactions',reactions:'reactions',follows:'follows',notifications:'notifications',stories:'stories',story_views:'story_views',story_reactions:'story_reactions',story_replies:'story_replies',conversations:'conversations',conversation_members:'conversation_members',messages:'messages',message_reactions:'message_reactions',user_presence:'user_presence',reports:'reports',story_media:'story_media',verification:'verification',admin_actions:'admin_actions',user_blocks:'user_blocks'};
if(!window.Appwrite){document.getElementById('app').innerHTML='<div class="auth"><div class="authcard"><div class="authlogo">NewGen<span style="color:var(--accent2)">.</span></div><p style="color:#aaa;line-height:1.5">Appwrite SDK could not load. Please refresh the page.</p></div></div>';throw new Error('Appwrite SDK failed to load')}
const {Client,Account,TablesDB,Storage,ID,Query,Realtime,Channel}=Appwrite;
const client=new Client().setEndpoint(CFG.endpoint).setProject(CFG.projectId);const account=new Account(client);const db=new TablesDB(client);const storage=new Storage(client);const realtime=new Realtime(client);
let me=null,myProfile=null,profiles=[],activeChat=null,activeUser=null,replyingTo=null,recording=null,chunks=[],subs=[],chatCache=[],longTimer=null,storyTimer=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),now=()=>new Date().toISOString();
function toast(m){const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}function fail(e){console.error(e);toast(e?.message||'Something went wrong')}function ago(v){const n=Math.max(0,Date.now()-new Date(v).getTime()),m=Math.floor(n/60000);if(m<1)return'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';const d=Math.floor(h/24);return d<7?d+'d':Math.floor(d/7)+'w'}

function icon(n){const p={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',plus:'<path d="M12 5v14M5 12h14"/>',heart:'<path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/>',comment:'<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-4-.9L4 19l.9-3.8A7.5 7.5 0 1 1 20 11.5Z"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',back:'<path d="m15 18-6-6 6-6"/>',image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.5 1.5-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21h-2.1v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.5-1.5.1-.1A1.7 1.7 0 0 0 9.1 15a1.7 1.7 0 0 0-1.5-1H7.4v-2.1h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.5-1.5.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V6h2.1v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.5 1.5-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z"/>',play:'<path d="m8 5 11 7-11 7z"/>',check:'<path d="m5 12 4 4L19 6"/>'};return`<svg viewBox="0 0 24 24">${p[n]||p.more}</svg>`}
function av(p,cl=''){p=p||{};const l=esc((p.displayName||p.username||'?').slice(0,1).toUpperCase());return p.avatar?`<img class="avatar ${cl}" src="${esc(p.avatar)}" onerror="this.outerHTML='<span class=\'avatar ${cl}\'>${l}</span>'">`:`<span class="avatar ${cl}">${l}</span>`}
async function list(t,q=[]){const r=await db.listRows({databaseId:CFG.databaseId,tableId:t,queries:q});return r.rows||[]}async function one(t,id){return db.getRow({databaseId:CFG.databaseId,tableId:t,rowId:id})}async function create(t,data){return db.createRow({databaseId:CFG.databaseId,tableId:t,rowId:ID.unique(),data})}async function update(t,id,data){return db.updateRow({databaseId:CFG.databaseId,tableId:t,rowId:id,data})}async function remove(t,id){return db.deleteRow({databaseId:CFG.databaseId,tableId:t,rowId:id})}
async function upload(file,onProgress){if(!file)throw Error('No file selected');if(file.size>1024*1024*1024)throw Error('File is too large (max 1 GB)');const r=await storage.createFile({bucketId:CFG.bucketId,fileId:ID.unique(),file});onProgress?.(100);return{id:r.$id,url:storage.getFileView({bucketId:CFG.bucketId,fileId:r.$id}).toString(),type:file.type,name:file.name}}
async function getProfile(uid){try{return(await list(T.profiles,[Query.equal('userId',uid),Query.limit(1)]))[0]||null}catch{return null}}
async function ensureProfile(){myProfile=await getProfile(me.$id);if(!myProfile){let base=(me.name||me.email.split('@')[0]).replace(/[^a-zA-Z0-9_]/g,'').slice(0,25)||'user',u=base,i=1;while((await list(T.profiles,[Query.equal('username',u),Query.limit(1)])).length)u=base+i++;myProfile=await create(T.profiles,{userId:me.$id,username:u,displayName:me.name||u,email:me.email,avatar:'',bio:'',verified:false,createdAt:now()})}}
async function refreshProfiles(){profiles=await list(T.profiles,[Query.orderDesc('$createdAt'),Query.limit(500)]);myProfile=profiles.find(p=>p.userId===me.$id)||myProfile}
function auth(mode='login'){const s=mode==='signup';$('#app').innerHTML=`<div class="auth"><div class="authcard"><div class="authlogo">NewGen<span style="color:var(--accent2)">.</span></div><div style="color:#aaa;margin-bottom:18px">${s?'Create your NewGen account':'Welcome back to NewGen'}</div>${s?'<div class="field"><input id="aName" placeholder="Display name"></div>':''}<div class="field"><input id="aEmail" type="email" placeholder="Email"></div><div class="field"><input id="aPass" type="password" placeholder="Password"></div><button class="primary" style="width:100%;margin-top:8px" id="aGo">${s?'Create account':'Log in'}</button><div class="switch">${s?'Already have an account?':'Don’t have an account?'} <button id="aSwitch">${s?'Log in':'Sign up'}</button></div></div></div>`;$('#aGo').onclick=async()=>{try{const email=$('#aEmail').value.trim(),pass=$('#aPass').value;if(!email||!pass)return toast('Enter email and password');if(s){const name=$('#aName').value.trim()||email.split('@')[0];await account.create({userId:ID.unique(),email,password:pass,name});await account.createEmailPasswordSession({email,password:pass})}else await account.createEmailPasswordSession({email,password:pass});await boot()}catch(e){fail(e)}};$('#aSwitch').onclick=()=>auth(s?'login':'signup')}
function shell(){const nav=`<div class="nav"><button class="navbtn" onclick="go('home')">${icon('home')}<span class="label">Home</span></button><button class="navbtn" onclick="go('search')">${icon('search')}<span class="label">Search</span></button><button class="navbtn" onclick="go('messages')">${icon('send')}<span class="label">Messages</span></button><button class="navbtn" onclick="go('notifications')">${icon('bell')}<span class="label">Notifications</span></button><button class="navbtn" onclick="go('profile')">${icon('user')}<span class="label">Profile</span></button><button class="navbtn" onclick="go('settings')">${icon('settings')}<span class="label">Settings</span></button></div>`;$('#app').innerHTML=`<div class="app"><header class="top"><button class="logo" onclick="go('messages')">NewGen<span>.</span></button><div class="top-actions"><button class="icon" onclick="go('search')">${icon('search')}</button><button class="icon" onclick="go('notifications')">${icon('bell')}</button><button class="icon" onclick="go('settings')">${icon('settings')}</button></div></header><div class="layout"><aside class="side leftside">${nav}</aside><main id="main"></main><aside class="side rightside"><div class="card cardpad"><b>NewGen Messages</b><div style="color:var(--muted);font-size:13px;margin-top:6px">Realtime conversations</div></div></aside></div><nav class="mobile"><button class="icon" onclick="go('messages')">${icon('home')}</button><button class="icon" onclick="go('search')">${icon('search')}</button><button class="icon" onclick="go('notifications')">${icon('bell')}</button><button class="icon" onclick="go('profile')">${icon('user')}</button></nav></div>`}
async function go(p,a){try{if(p==='home')return messages();if(p==='search')return search();if(p==='messages')return messages();if(p==='chat')return openChat(a);if(p==='profile')return profile(me.$id);if(p==='user')return profile(a);if(p==='notifications')return notifications();if(p==='settings')return settings();if(p==='stories')return storyList()}catch(e){fail(e)}}
async function findConv(uid){const mine=await list(T.conversation_members,[Query.equal('userId',me.$id),Query.limit(500)]).catch(()=>[]),theirs=await list(T.conversation_members,[Query.equal('userId',uid),Query.limit(500)]).catch(()=>[]),set=new Set(theirs.map(x=>x.conversationId)),m=mine.find(x=>set.has(x.conversationId));return m?(await one(T.conversations,m.conversationId).catch(()=>null)):null}
async function getChatRows(){const mine=await list(T.conversation_members,[Query.equal('userId',me.$id),Query.limit(500)]).catch(()=>[]);const out=[];for(const cm of mine){const c=await one(T.conversations,cm.conversationId).catch(()=>null);if(!c)continue;const mem=await list(T.conversation_members,[Query.equal('conversationId',c.$id),Query.limit(10)]).catch(()=>[]);const other=mem.find(x=>x.userId!==me.$id);if(!other)continue;const p=profiles.find(x=>x.userId===other.userId)||await getProfile(other.userId);let last=c.lastMessageAt?null:null;if(c.lastMessageAt){last={content:c.lastMessage||'',createdAt:c.lastMessageAt,kind:c.lastMessageType||''}}if(!last){const ms=await list(T.messages,[Query.equal('conversationId',c.$id),Query.orderDesc('$createdAt'),Query.limit(1)]).catch(()=>[]);if(ms[0])last={content:previewMessage(ms[0]),createdAt:ms[0].createdAt||ms[0].$createdAt,kind:ms[0].mediaType||''}}out.push({c,p,otherId:other.userId,last})}return out.sort((a,b)=>new Date(b.last?.createdAt||b.c.$createdAt)-new Date(a.last?.createdAt||a.c.$createdAt))}
function previewMessage(m){if(!m)return'';if(m.deleted)return'Message deleted';if(m.mediaType==='audio')return'Voice message';if(m.mediaType==='video')return'Video';if(m.media)return'Photo';return m.content||'Message'}
function chatReadKey(id){return'newgen_read_'+id}function isUnread(c,last){if(!last)return false;const r=localStorage.getItem(chatReadKey(c.$id));return !r||new Date(last.createdAt)>new Date(r)}function markRead(id){localStorage.setItem(chatReadKey(id),now())}
async function messages(){const m=$('#main');m.innerHTML=`<div class="section-title">Messages</div><div class="searchbox"><input id="chatq" placeholder="Search people..."></div><div class="card chat-list" id="chatList"><div class="empty">Loading...</div></div>`;chatCache=await getChatRows();renderChatList();$('#chatq').oninput=renderChatList}
function renderChatList(){const q=($('#chatq')?.value||'').trim().toLowerCase(),arr=chatCache.filter(x=>!q||((x.p?.username||'')+' '+(x.p?.displayName||'')).toLowerCase().includes(q));$('#chatList').innerHTML=arr.map(x=>{const unread=isUnread(x.c,x.last),pr=esc(x.last?.content||'Open chat');return`<button class="chat-item ${unread?'unread':''}" onclick="go('chat','${x.otherId}')">${av(x.p)}<div class="userinfo"><div class="chat-name">${esc(x.p?.displayName||x.p?.username||'User')}${badge(x.p)}</div><div class="chat-preview">${pr}</div></div><div class="chat-time">${x.last?.createdAt?ago(x.last.createdAt):''}</div>${unread?'<i class="unread-dot"></i>':''}</button>`}).join('')||'<div class="empty">No chats yet. Search for a person to start a chat.</div>'}
function openCreateMenu(){const old=$('#createModal');if(old)old.remove();const d=document.createElement('div');d.id='createModal';d.className='modal';d.innerHTML=`<div class="modalcard"><div class="row"><b style="font-size:20px">Create</b><button class="icon" style="margin-left:auto" onclick="this.closest('.modal').remove()">${icon('close')}</button></div><div style="display:grid;gap:9px;margin-top:15px"><button class="primary" onclick="this.closest('.modal').remove();createPost()">＋ Create Post</button><button class="secondary" onclick="this.closest('.modal').remove();createStory()">＋ Create Story</button></div></div>`;document.body.appendChild(d)}
function createPost(){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modalcard"><div class="row"><b>Create Post</b><button class="icon" style="margin-left:auto" onclick="this.closest('.modal').remove()">${icon('close')}</button></div><div class="field"><textarea id="cpText" placeholder="Write something..."></textarea></div><div id="cpPrev"></div><div class="tools"><label class="mediaLabel">${icon('image')}<input id="cpFile" class="filepick" type="file" accept="image/*,video/*"></label><button class="primary" id="cpGo">Post</button></div></div>`;document.body.appendChild(d);$('#cpFile').onchange=e=>previewFile(e.target.files[0],'cpPrev');$('#cpGo').onclick=async()=>{try{const f=$('#cpFile').files[0],c=$('#cpText').value.trim();if(!c&&!f)return toast('Write something or choose media');const x=f?await upload(f):null;await create(T.posts,{userId:me.$id,content:c,media:x?JSON.stringify(x):'',createdAt:now()});d.remove();toast('Posted')}catch(e){fail(e)}}}
function createStory(){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modalcard"><div class="row"><b>Create Story</b><button class="icon" style="margin-left:auto" onclick="this.closest('.modal').remove()">${icon('close')}</button></div><div class="field"><input id="csText" placeholder="Story text (optional)"></div><div id="csPrev"></div><div class="uploadbox" id="storyUpload"><div>Uploading…</div><div class="uploadtrack"><i id="storyUploadBar"></i></div></div><div class="tools"><label class="mediaLabel">${icon('image')}<input id="csFile" class="filepick" type="file" accept="image/*,video/*"></label><button class="primary" id="csGo">Add story</button></div></div>`;document.body.appendChild(d);const f=$('#csFile');f.onchange=e=>previewFile(e.target.files[0],'csPrev');$('#csGo').onclick=async()=>{try{const file=f.files[0];if(!file)return toast('Choose a photo or video');$('#storyUpload').classList.add('show');const x=await upload(file,p=>$('#storyUploadBar').style.width=p+'%');await create(T.stories,{userId:me.$id,content:$('#csText').value.trim(),media:JSON.stringify(x),mediaType:file.type,createdAt:now(),expiresAt:new Date(Date.now()+86400000).toISOString()});d.remove();toast('Story added')}catch(e){fail(e)}};setTimeout(()=>f.click(),80)}
function previewFile(f,id){if(!f)return;const u=URL.createObjectURL(f);$('#'+id).innerHTML=f.type.startsWith('video')?`<video class="postvideo" src="${u}" controls playsinline></video>`:`<img class="postmedia" src="${u}">`}
function mediaHtml(media,type){if(!media)return'';let x=media;try{if(typeof x==='string'&&x.startsWith('{'))x=JSON.parse(x)}catch{}const u=typeof x==='string'?x:x?.url||'';if(type==='video'||x?.type?.startsWith('video'))return`<video class="postvideo" src="${esc(u)}" controls playsinline preload="metadata"></video>`;return`<img class="postmedia" src="${esc(u)}">`}
function post(p){const u=profiles.find(x=>x.userId===p.userId)||{};return`<article class="card" id="post-${p.$id}"><div class="posthead">${av(u,'sm')}<div class="grow"><b>${esc(u.displayName||u.username||'User')}${badge(u)}</b><div style="font-size:11px;color:var(--muted)">@${esc(u.username||'user')} · ${ago(p.createdAt||p.$createdAt)}</div></div>${p.userId===me.$id?`<button class="icon" onclick="deletePost('${p.$id}')">${icon('more')}</button>`:''}</div>${p.content?`<div class="posttext">${esc(p.content)}</div>`:''}${mediaHtml(p.media,p.mediaType)}<div class="post-actions"><button onclick="reactPost('${p.$id}')">${icon('heart')}Like</button><button onclick="commentPost('${p.$id}')">${icon('comment')}Comment</button><button onclick="sharePost('${p.$id}')">${icon('send')}Share</button></div></article>`}
async function deletePost(id){if(!confirm('Delete this post?'))return;try{await remove(T.posts,id);toast('Deleted')}catch(e){fail(e)}}async function reactPost(id){try{const old=await list(T.reactions,[Query.equal('postId',id),Query.equal('userId',me.$id),Query.limit(1)]);if(old[0])await remove(T.reactions,old[0].$id);else await create(T.reactions,{postId:id,userId:me.$id,reaction:'❤️',createdAt:now()});toast('Done')}catch(e){fail(e)}}async function commentPost(id){const c=prompt('Comment');if(!c?.trim())return;try{await create(T.comments,{postId:id,userId:me.$id,content:c.trim(),createdAt:now()});toast('Comment added')}catch(e){fail(e)}}async function sharePost(id){try{await navigator.clipboard?.writeText(location.href+'#post-'+id);toast('Link copied')}catch{toast('Share link ready')}}
async function search(){const m=$('#main');m.innerHTML=`<div class="section-title">Search</div><div class="searchbox"><input id="q" placeholder="Search people..."></div><div class="card" id="results"></div>`;const run=()=>{const q=($('#q').value||'').trim().toLowerCase(),a=profiles.filter(p=>p.userId!==me.$id&&((p.username||'')+' '+(p.displayName||'')).toLowerCase().includes(q));$('#results').innerHTML=a.map(p=>`<button class="userrow" onclick="go('user','${p.userId}')">${av(p)}<div class="userinfo"><b>${esc(p.displayName||p.username)}${badge(p)}</b><small>@${esc(p.username)}</small></div><button class="follow" onclick="event.stopPropagation();go('chat','${p.userId}')">Message</button></button>`).join('')||'<div class="empty">No users found.</div>'};$('#q').oninput=run;run()}
async function profile(uid){const p=uid===me.$id?myProfile:(profiles.find(x=>x.userId===uid)||await getProfile(uid));if(!p)return toast('Profile not found');const followers=await list(T.follows,[Query.equal('followingId',uid),Query.limit(500)]).catch(()=>[]),following=await list(T.follows,[Query.equal('followerId',uid),Query.limit(500)]).catch(()=>[]),rows=await list(T.posts,[Query.equal('userId',uid),Query.orderDesc('$createdAt'),Query.limit(100)]).catch(()=>[]);$('#main').innerHTML=`<div class="card"><div class="profilecover"></div><div class="profilebody"><div class="profiletop">${av(p,'lg profileavatar')}${uid===me.$id?`<button class="profile-plus" onclick="openCreateMenu()">${icon('plus')}</button>`:''}</div><div class="profilename">${esc(p.displayName||p.username)}${badge(p)}</div><div class="handle">@${esc(p.username)}</div><div class="bio">${esc(p.bio||'')}</div><div class="stats"><div><b>${followers.length}</b><span>Followers</span></div><div><b>${following.length}</b><span>Following</span></div><div><b>${rows.length}</b><span>Posts</span></div></div><div class="actions">${uid===me.$id?`<button class="secondary" onclick="editProfile()">Edit profile</button>`:`<button class="primary" onclick="go('chat','${uid}')">Message</button><button class="secondary" onclick="follow('${uid}',this)">Follow</button>`}</div></div></div><div class="section-title">Posts</div>${rows.map(post).join('')||'<div class="card empty">No posts.</div>'}`}
async function follow(uid,el){try{const r=await list(T.follows,[Query.equal('followerId',me.$id),Query.equal('followingId',uid),Query.limit(1)]);if(r[0]){await remove(T.follows,r[0].$id);if(el)el.textContent='Follow'}else{await create(T.follows,{followerId:me.$id,followingId:uid,createdAt:now()});if(el)el.textContent='Following';await create(T.notifications,{userId:uid,fromUserId:me.$id,type:'follow',message:'started following you',postId:'',createdAt:now(),read:false})}}catch(e){fail(e)}}
function editProfile(){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modalcard"><div class="row"><b>Edit profile</b><button class="icon" style="margin-left:auto" onclick="this.closest('.modal').remove()">${icon('close')}</button></div><div class="field"><input id="epName" value="${esc(myProfile.displayName||'')}" placeholder="Display name"></div><div class="field"><textarea id="epBio" placeholder="Bio">${esc(myProfile.bio||'')}</textarea></div><div class="tools"><label class="mediaLabel">${icon('image')}<input id="epFile" class="filepick" type="file" accept="image/*"></label><button class="primary" id="epGo">Save</button></div></div>`;document.body.appendChild(d);$('#epGo').onclick=async()=>{try{let avatar=myProfile.avatar;if($('#epFile').files[0])avatar=(await upload($('#epFile').files[0])).url;myProfile=await update(T.profiles,myProfile.$id,{displayName:$('#epName').value.trim()||myProfile.username,bio:$('#epBio').value.trim(),avatar});await refreshProfiles();d.remove();profile(me.$id);toast('Profile updated')}catch(e){fail(e)}}}
async function openChat(uid){activeUser=profiles.find(x=>x.userId===uid)||await getProfile(uid);if(!activeUser)return toast('User not found');activeChat=await findConv(uid);if(!activeChat){activeChat=await create(T.conversations,{createdAt:now(),type:'private',lastMessage:'',lastMessageAt:'',lastMessageType:''});await create(T.conversation_members,{conversationId:activeChat.$id,userId:me.$id,joinedAt:now(),isAdmin:true});await create(T.conversation_members,{conversationId:activeChat.$id,userId:uid,joinedAt:now(),isAdmin:false})}markRead(activeChat.$id);replyingTo=null;renderChat();await loadMessages();subscribeChatAndList()}
function renderChat(){$('#main').innerHTML=`<div class="chat"><div class="chathead"><button class="icon" onclick="go('messages')">${icon('back')}</button><button style="background:none;display:flex;align-items:center;gap:9px;text-align:left" onclick="go('user','${activeUser.userId}')">${av(activeUser,'sm')}<div class="grow"><b>${esc(activeUser.displayName||activeUser.username)}${badge(activeUser)}</b><div style="font-size:11px;color:var(--muted)">@${esc(activeUser.username)}</div></div></button></div><div class="messages" id="msgs"></div><div id="replybar" class="replybar"><div class="grow" id="replytext"></div><button class="icon" onclick="cancelReply()">${icon('close')}</button></div><div class="chatbox"><label class="mediaLabel">${icon('image')}<input id="chatFile" class="filepick" type="file" accept="image/*,video/*"></label><textarea id="chatText" rows="1" placeholder="Message..."></textarea><button class="icon" id="micBtn">${icon('mic')}</button><button class="sendbtn" id="sendBtn">${icon('send')}</button></div></div>`;$('#chatFile').onchange=e=>e.target.files[0]&&sendMedia(e.target.files[0]);$('#sendBtn').onclick=sendText;$('#chatText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}});$('#micBtn').onclick=toggleVoice}
async function loadMessages(){if(!activeChat)return;const rows=await list(T.messages,[Query.equal('conversationId',activeChat.$id),Query.orderAsc('$createdAt'),Query.limit(500)]).catch(()=>[]);const reactions=await list(T.message_reactions,[Query.limit(500)]).catch(()=>[]);const by={};reactions.forEach(r=>(by[r.messageId]||(by[r.messageId]=[])).push(r));const b=$('#msgs');if(!b)return;b.innerHTML=rows.map(m=>msg(m,by[m.$id]||[])).join('')||'<div class="empty">Start the conversation.</div>';b.scrollTop=b.scrollHeight;bindGestures(rows)}
async function reactionsFor(id){return list(T.message_reactions,[Query.equal('messageId',id),Query.limit(100)]).catch(()=>[])}
function msg(m,reactions=[]){const mine=m.senderId===me.$id;let x=m.media,url='',type=m.mediaType||'';try{if(typeof x==='string'&&x.startsWith('{'))x=JSON.parse(x)}catch{}if(x)url=typeof x==='string'?x:x.url||'';let media='';if(type==='audio')media=`<audio src="${esc(url)}" controls preload="metadata"></audio>`;else if(type==='video'||x?.type?.startsWith('video'))media=`<video src="${esc(url)}" controls playsinline preload="metadata"></video>`;else if(url)media=`<img src="${esc(url)}">`;const rep=m.replyTo?`<div class="reply">↩ Reply to message</div>`:'';const rr=reactions.length?`<div class="reactionbar">${[...new Set(reactions.map(r=>r.reaction).filter(Boolean))].slice(0,6).map(e=>`<span class="reactionchip">${esc(e)}</span>`).join('')}</div>`:'';return`<div class="msgrow ${mine?'me':''}" data-mid="${m.$id}"><div class="bubblewrap"><div class="bubble" data-mid="${m.$id}">${m.deleted?'<div style="opacity:.55;font-style:italic">Message deleted</div>':rep+media+(m.content?`<div>${esc(m.content)}</div>`:'')}<span class="bubbletime">${ago(m.createdAt||m.$createdAt)} ${mine?'✓':''}</span></div>${rr}</div></div>`}
function bindGestures(rows){document.querySelectorAll('.msgrow').forEach(el=>{let sx=0,sy=0,moved=false;el.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false;clearTimeout(longTimer);longTimer=setTimeout(()=>openLongPress(el.dataset.mid),650)};el.ontouchmove=e=>{if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10){moved=true;clearTimeout(longTimer)};const dx=e.touches[0].clientX-sx;if(Math.abs(dx)>12&&Math.abs(dx)<90){el.querySelector('.bubble').style.transform=`translateX(${Math.sign(dx)*Math.min(35,Math.abs(dx)/2)}px)`}};el.ontouchend=e=>{clearTimeout(longTimer);el.querySelector('.bubble').style.transform='';const dx=e.changedTouches[0].clientX-sx;if(!moved&&Math.abs(dx)<35&&e.changedTouches[0].clientY-sy<25){ }else if(Math.abs(dx)>55){setReply(el.dataset.mid)}};el.oncontextmenu=e=>{e.preventDefault();openLongPress(el.dataset.mid)}})}
async function setReply(id){try{replyingTo=await one(T.messages,id);$('#replybar')?.classList.add('show');$('#replytext').textContent=previewMessage(replyingTo).slice(0,90);$('#chatText')?.focus()}catch(e){fail(e)}}function cancelReply(){replyingTo=null;$('#replybar')?.classList.remove('show')}
async function reactMessage(id,emoji){try{const old=await list(T.message_reactions,[Query.equal('messageId',id),Query.equal('userId',me.$id),Query.limit(1)]);if(old[0])await update(T.message_reactions,old[0].$id,{reaction:emoji});else await create(T.message_reactions,{messageId:id,userId:me.$id,reaction:emoji,createdAt:now()});const m=await one(T.messages,id).catch(()=>null);if(m&&m.senderId!==me.$id)await create(T.notifications,{userId:m.senderId,fromUserId:me.$id,type:'message_reaction',message:'reacted '+emoji+' to your message',postId:'',createdAt:now(),read:false});closeOverlays();await loadMessages()}catch(e){fail(e)}}
async function openLongPress(id){const m=await one(T.messages,id).catch(()=>null);if(!m)return;closeOverlays();const d=document.createElement('div');d.id='lp';d.className='longpress-backdrop';d.innerHTML=`<div class="longpress-card"><div class="selected-message">${esc(previewMessage(m))}</div><div class="lp-actions"><button onclick="reactionMenu('${id}')">❤️ 😂 😮 😢 👍 🔥</button><button onclick="setReply('${id}');closeOverlays()">Reply</button>${m.senderId===me.$id&&!m.deleted?`<button class="danger" onclick="deleteMessage('${id}')">Delete message</button>`:''}<button onclick="closeOverlays()">Cancel</button></div></div>`;document.body.appendChild(d);d.onclick=e=>{if(e.target===d)closeOverlays()}}
function reactionMenu(id){closeOverlays();const d=document.createElement('div');d.id='reactionPop';d.className='reaction-pop';['❤️','😂','😮','😢','👍','🔥','👏','😍'].forEach(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>reactMessage(id,x);d.appendChild(b)});document.body.appendChild(d);const r=document.querySelector(`[data-mid="${id}"] .bubble`);if(r){const q=r.getBoundingClientRect();d.style.left=Math.max(8,Math.min(innerWidth-290,q.left))+'px';d.style.top=Math.max(8,q.top-58)+'px'}}
function closeOverlays(){document.querySelectorAll('#lp,#reactionPop').forEach(x=>x.remove())}
async function deleteMessage(id){closeOverlays();if(!confirm('Delete this message?'))return;try{await update(T.messages,id,{deleted:true,content:'',media:'',mediaType:''});await loadMessages()}catch(e){fail(e)}}
async function sendText(){const el=$('#chatText');if(!el||!activeChat)return;const text=el.value.trim();if(!text)return;try{await create(T.messages,{conversationId:activeChat.$id,senderId:me.$id,content:text,media:'',mediaType:'',replyTo:replyingTo?.$id||'',createdAt:now(),deleted:false});await update(T.conversations,activeChat.$id,{lastMessage:text,lastMessageAt:now(),lastMessageType:'text'}).catch(()=>{});el.value='';cancelReply();await loadMessages()}catch(e){fail(e)}}
async function sendMedia(file){if(!activeChat)return;const d=document.createElement('div');d.className='modal';const url=URL.createObjectURL(file);d.innerHTML=`<div class="modalcard"><div class="row"><b>Send ${file.type.startsWith('video')?'video':'photo'}</b><button class="icon" style="margin-left:auto" onclick="this.closest('.modal').remove()">${icon('close')}</button></div><div class="preview">${file.type.startsWith('video')?`<video src="${url}" controls playsinline></video>`:`<img src="${url}">`}</div><div class="uploadbox" id="msgUpload"><div>Uploading…</div><div class="uploadtrack"><i id="msgUploadBar"></i></div></div><div class="tools"><button class="secondary" onclick="this.closest('.modal').remove()">Cancel</button><button class="primary" id="sendMediaGo">Send</button></div></div>`;document.body.appendChild(d);$('#sendMediaGo').onclick=async()=>{try{$('#msgUpload').classList.add('show');const m=await upload(file,p=>$('#msgUploadBar').style.width=p+'%'),type=file.type.startsWith('video')?'video':'image',label=type==='video'?'Video':'Photo';await create(T.messages,{conversationId:activeChat.$id,senderId:me.$id,content:'',media:JSON.stringify(m),mediaType:type,replyTo:replyingTo?.$id||'',createdAt:now(),deleted:false});await update(T.conversations,activeChat.$id,{lastMessage:label,lastMessageAt:now(),lastMessageType:type}).catch(()=>{});cancelReply();d.remove();URL.revokeObjectURL(url);await loadMessages();chatCache=await getChatRows();renderChatList()}catch(e){fail(e)}}}
async function toggleVoice(){if(recording){recording.stop();return}if(!navigator.mediaDevices?.getUserMedia)return toast('Microphone is not available');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recording=new MediaRecorder(stream);recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:recording.mimeType||'audio/webm'});const f=new File([blob],'voice-'+Date.now()+'.webm',{type:blob.type});recording=null;$('#micBtn')?.classList.remove('recording');try{const m=await upload(f);await create(T.messages,{conversationId:activeChat.$id,senderId:me.$id,content:'',media:JSON.stringify(m),mediaType:'audio',replyTo:replyingTo?.$id||'',createdAt:now(),deleted:false});await update(T.conversations,activeChat.$id,{lastMessage:'Voice message',lastMessageAt:now(),lastMessageType:'audio'}).catch(()=>{});cancelReply();await loadMessages()}catch(e){fail(e)}};recording.start();$('#micBtn').classList.add('recording');toast('Recording... tap mic again to send')}catch(e){fail(e)}}
function subscribeChatAndList(){unsubscribeAll();try{const s=realtime.subscribe([Channel.tablesdb(CFG.databaseId).table(T.messages).row().create(),Channel.tablesdb(CFG.databaseId).table(T.messages).row().update(),Channel.tablesdb(CFG.databaseId).table(T.message_reactions).row().create(),Channel.tablesdb(CFG.databaseId).table(T.message_reactions).row().update(),Channel.tablesdb(CFG.databaseId).table(T.conversations).row().update(),Channel.tablesdb(CFG.databaseId).table(T.conversation_members).row().create()],async p=>{const r=p?.payload;if(r?.conversationId===activeChat?.$id){await loadMessages();if(r.senderId!==me.$id)markRead(activeChat.$id)}if($('#chatList')){chatCache=await getChatRows();renderChatList()}});subs.push(s)}catch(e){console.warn(e)}}
function subscribeGlobal(){unsubscribeAll();try{const s=realtime.subscribe([Channel.tablesdb(CFG.databaseId).table(T.profiles).row().create(),Channel.tablesdb(CFG.databaseId).table(T.profiles).row().update(),Channel.tablesdb(CFG.databaseId).table(T.notifications).row().create(),Channel.tablesdb(CFG.databaseId).table(T.stories).row().create(),Channel.tablesdb(CFG.databaseId).table(T.messages).row().create(),Channel.tablesdb(CFG.databaseId).table(T.messages).row().update(),Channel.tablesdb(CFG.databaseId).table(T.conversations).row().update(),Channel.tablesdb(CFG.databaseId).table(T.conversation_members).row().create()],async()=>{await refreshProfiles();if($('#chatList')){chatCache=await getChatRows();renderChatList()}});subs.push(s)}catch(e){console.warn(e)}}function unsubscribeAll(){subs.forEach(s=>{try{s.unsubscribe()}catch{}});subs=[]}
async function notifications(){const r=await list(T.notifications,[Query.equal('userId',me.$id),Query.orderDesc('$createdAt'),Query.limit(200)]).catch(()=>[]);$('#main').innerHTML=`<div class="section-title">Notifications</div><div class="card">${r.map(n=>`<div class="userrow">${av(profiles.find(p=>p.userId===n.fromUserId),'sm')}<div class="userinfo"><b>${esc(n.message||n.type||'Notification')}</b><small>${ago(n.createdAt||n.$createdAt)}</small></div></div>`).join('')||'<div class="empty">No notifications.</div>'}</div>`}
async function storyList(){const r=await list(T.stories,[Query.orderDesc('$createdAt'),Query.limit(200)]).catch(()=>[]);const active=r.filter(s=>!s.expiresAt||new Date(s.expiresAt)>new Date());$('#main').innerHTML=`<div class="section-title">Stories</div><div class="card stories"><button class="story" onclick="createStory()"><div class="storyring"><div class="story-add">${icon('plus')}</div></div><b>Your story</b></button>${active.map(s=>{const p=profiles.find(x=>x.userId===s.userId)||{};return`<button class="story" onclick="viewStory('${s.$id}')"><div class="storyring">${av(p)}</div><b>${esc(p.username||'user')}</b></button>`}).join('')}</div>`}
async function viewStory(id){const s=await one(T.stories,id).catch(()=>null);if(!s)return;const p=profiles.find(x=>x.userId===s.userId)||await getProfile(s.userId)||{};let x=s.media;try{x=JSON.parse(x)}catch{}const u=x?.url||x||'';const video=(s.mediaType||x?.type||'').startsWith('video');const d=document.createElement('div');d.id='storyViewer';d.className='story-viewer';d.innerHTML=`<div class="story-stage"><div class="story-progress"><i id="storyProg"></i></div><div class="story-head">${av(p,'sm')}<b>${esc(p.displayName||p.username||'User')}${badge(p)}</b><button class="icon story-close" onclick="closeStory()">${icon('close')}</button></div>${video?`<video id="storyMedia" class="story-media" src="${esc(u)}" playsinline autoplay></video>`:`<img id="storyMedia" class="story-media" src="${esc(u)}">`}${s.content?`<div style="position:absolute;left:15px;right:15px;bottom:75px;text-align:center;font-size:18px;font-weight:700">${esc(s.content)}</div>`:''}<div class="story-footer"><input id="storyReply" placeholder="Reply..."><button onclick="storyReact('${id}','❤️')">❤️</button><button onclick="sendStoryReply('${id}')">Send</button></div></div>`;document.body.appendChild(d);await create(T.story_views,{storyId:id,userId:me.$id,createdAt:now()}).catch(()=>{});const dur=video?Math.max(4,Math.min(30,document.getElementById('storyMedia').duration||5)):5;requestAnimationFrame(()=>{const st=Date.now();clearInterval(storyTimer);storyTimer=setInterval(()=>{const pgr=Math.min(100,(Date.now()-st)/(dur*1000)*100);$('#storyProg').style.width=pgr+'%';if(pgr>=100)closeStory()},80)});if(video)document.getElementById('storyMedia').onloadedmetadata=()=>{try{document.getElementById('storyMedia').play()}catch{}}}
function closeStory(){clearInterval(storyTimer);$('#storyViewer')?.remove()}
async function storyReact(id,e){try{const old=await list(T.story_reactions,[Query.equal('storyId',id),Query.equal('userId',me.$id),Query.limit(1)]);if(old[0])await update(T.story_reactions,old[0].$id,{reaction:e});else await create(T.story_reactions,{storyId:id,userId:me.$id,reaction:e,createdAt:now()});const s=await one(T.stories,id);if(s.userId!==me.$id)await create(T.notifications,{userId:s.userId,fromUserId:me.$id,type:'story_reaction',message:'reacted '+e+' to your story',postId:'',createdAt:now(),read:false});toast('Reaction sent')}catch(e2){fail(e2)}}
async function sendStoryReply(id){const v=$('#storyReply')?.value.trim();if(!v)return;try{await create(T.story_replies,{storyId:id,userId:me.$id,content:v,createdAt:now()});const s=await one(T.stories,id);if(s.userId!==me.$id)await create(T.notifications,{userId:s.userId,fromUserId:me.$id,type:'story_reply',message:'replied to your story',postId:'',createdAt:now(),read:false});$('#storyReply').value='';toast('Reply sent')}catch(e){fail(e)}}
function settings(){const owner=localStorage.getItem('newgen_owner_ok')==='1';$('#main').innerHTML=`<div class="section-title">Settings</div><div class="card cardpad"><button class="secondary" style="width:100%;margin-bottom:9px" onclick="editProfile()">Edit profile</button>${owner?`<button class="primary" style="width:100%;margin-bottom:9px" onclick="ownerPanel()">Owner controls</button>`:`<div class="field"><input id="ownerCode" type="password" placeholder="Owner access code"></div><button class="secondary" style="width:100%" onclick="activateOwner()">Unlock Owner</button>`}<button class="dangerbtn" style="width:100%;margin-top:9px" onclick="logout()">Log out</button></div>`}
function activateOwner(){if($('#ownerCode')?.value.trim()!==CFG.ownerCode)return toast('Wrong owner code');localStorage.setItem('newgen_owner_ok','1');toast('Owner controls unlocked');settings()}
async function ownerPanel(){if(localStorage.getItem('newgen_owner_ok')!=='1')return settings();const ps=await list(T.profiles,[Query.orderAsc('$createdAt'),Query.limit(500)]).catch(()=>[]);const cms=await list(T.conversations,[Query.orderDesc('$createdAt'),Query.limit(500)]).catch(()=>[]);$('#main').innerHTML=`<div class="section-title">Owner</div><div class="card cardpad"><b>Accounts</b><div class="admin-grid" style="margin-top:10px">${ps.map(p=>`<div class="admin-user">${av(p,'sm')}<div class="userinfo"><b>${esc(p.displayName||p.username)}${badge(p)}</b><small>@${esc(p.username)}</small></div><button class="${p.verified?'secondary':'primary'}" onclick="toggleVerify('${p.$id}',${!!p.verified})">${p.verified?'Remove badge':'Verify'}</button></div>`).join('')}</div></div><div class="card cardpad"><b>All chats</b><div style="color:var(--muted);font-size:12px;margin:5px 0 10px">Owner can inspect conversations.</div>${cms.map(c=>`<div class="chat-admin"><b>${esc(c.$id)}</b><div class="small">${esc(c.lastMessage||'No messages')} · ${c.lastMessageAt?ago(c.lastMessageAt):''}</div><button class="secondary" style="margin-top:8px" onclick="inspectChat('${c.$id}')">Open chat</button></div>`).join('')||'<div class="empty">No conversations.</div>'}</div><div class="card cardpad"><b class="danger">Danger zone</b><p style="color:var(--muted);font-size:13px">Delete all chats or reset the database. Your Owner account/profile is kept.</p><button class="dangerbtn" style="width:100%;margin-bottom:8px" onclick="ownerDeleteAllChats()">Delete All Chats</button><button class="dangerbtn" style="width:100%" onclick="ownerResetAll()">Reset All Data</button></div>`}
async function toggleVerify(id,next){try{await update(T.profiles,id,{verified:!next});await refreshProfiles();toast(!next?'Verified':'Badge removed');ownerPanel()}catch(e){fail(e)}}
async function inspectChat(cid){const ms=await list(T.messages,[Query.equal('conversationId',cid),Query.orderAsc('$createdAt'),Query.limit(500)]).catch(()=>[]),mem=await list(T.conversation_members,[Query.equal('conversationId',cid),Query.limit(10)]).catch(()=>[]);const names=[];for(const x of mem){const p=profiles.find(z=>z.userId===x.userId)||await getProfile(x.userId);names.push(p?.displayName||p?.username||x.userId)}const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="modalcard"><div class="row"><b>Chat inspection</b><button class="icon" style="margin-left:auto" onclick="this.closest('.modal').remove()">${icon('close')}</button></div><div style="color:var(--muted);font-size:12px;margin:8px 0">${names.map(esc).join(' ↔ ')}</div><div style="display:grid;gap:7px">${ms.map(m=>`<div style="padding:9px;background:#17171c;border-radius:12px"><b>${esc(profiles.find(p=>p.userId===m.senderId)?.displayName||m.senderId)}</b><div>${m.deleted?'Message deleted':esc(previewMessage(m))}</div><small style="color:var(--muted)">${esc(m.createdAt||m.$createdAt)}</small></div>`).join('')||'<div class="empty">No messages.</div>'}</div></div>`;document.body.appendChild(d)}
async function deleteRows(t,exceptIds=[]){let rows=await list(t,[Query.limit(500)]).catch(()=>[]);for(const r of rows){if(!exceptIds.includes(r.$id))await remove(t,r.$id).catch(()=>{})}while(rows.length===500){rows=await list(t,[Query.limit(500)]).catch(()=>[]);for(const r of rows){if(!exceptIds.includes(r.$id))await remove(t,r.$id).catch(()=>{})}if(!rows.length)break}}
async function callOwner(action,payload={}){const r=await fetch(CFG.ownerFunction,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw Error(data?.message||('Owner Function '+r.status));return data}
async function ownerDeleteAllChats(){if(!confirm('Delete ALL chats, members, messages and reactions?'))return;try{try{await callOwner('deleteAllChats',{ownerUserId:me.$id})}catch{await deleteRows(T.message_reactions);await deleteRows(T.messages);await deleteRows(T.conversation_members);await deleteRows(T.conversations)}chatCache=[];activeChat=null;await messages();subscribeGlobal();toast('All chats deleted') }catch(e){fail(e)}}
async function ownerResetAll(){if(!confirm('RESET EVERYTHING? All users except the Owner, profiles, chats, messages, posts, stories, reactions and notifications will be removed.'))return;if(prompt('Type RESET to continue')!=='RESET')return;try{try{await callOwner('resetAll',{ownerUserId:me.$id})}catch{toast('Owner Function resetAll is not deployed; clearing database tables now.')}for(const t of [T.message_reactions,T.messages,T.conversation_members,T.conversations,T.story_views,T.story_reactions,T.story_replies,T.story_media,T.stories,T.comment_reactions,T.comments,T.reactions,T.follows,T.notifications,T.post_media,T.posts,T.reports,T.verification,T.admin_actions,T.user_blocks,T.user_presence])await deleteRows(t);await deleteRows(T.profiles,[myProfile.$id]);localStorage.clear();activeChat=null;activeUser=null;chatCache=[];profiles=[];await account.deleteSession({sessionId:'current'}).catch(()=>{});location.reload()}catch(e){fail(e)}}
async function logout(){try{unsubscribeAll();await realtime.disconnect();await account.deleteSession({sessionId:'current'});location.reload()}catch(e){fail(e)}}
async function boot(){try{me=await account.get()}catch{auth();return}try{await ensureProfile();await refreshProfiles();shell();await messages();subscribeGlobal()}catch(e){console.error(e);$('#main').innerHTML=`<div class="card empty"><b>NewGen connected, but Appwrite returned an error.</b><br><br>${esc(e.message||e)}</div>`}}
window.go=go;window.openCreateMenu=openCreateMenu;window.createPost=createPost;window.createStory=createStory;window.profile=profile;window.editProfile=editProfile;window.follow=follow;window.openChat=openChat;window.sendText=sendText;window.sendMedia=sendMedia;window.toggleVoice=toggleVoice;window.setReply=setReply;window.cancelReply=cancelReply;window.deleteMessage=deleteMessage;window.reactMessage=reactMessage;window.reactionMenu=reactionMenu;window.closeOverlays=closeOverlays;window.deletePost=deletePost;window.reactPost=reactPost;window.commentPost=commentPost;window.sharePost=sharePost;window.viewStory=viewStory;window.closeStory=closeStory;window.storyReact=storyReact;window.sendStoryReply=sendStoryReply;window.settings=settings;window.activateOwner=activateOwner;window.ownerPanel=ownerPanel;window.toggleVerify=toggleVerify;window.inspectChat=inspectChat;window.ownerDeleteAllChats=ownerDeleteAllChats;window.ownerResetAll=ownerResetAll;window.logout=logout;boot();
})();
</script>
</body>
