<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA Social</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<style>
:root{--bg:#fff;--text:#111;--muted:#737373;--line:#dbdbdb;--card:#fff;--accent:#0095f6;--danger:#ed4956;--soft:#f5f5f5;--nav:64px;--max:980px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}a{text-decoration:none;color:inherit}
body{min-height:100vh}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:64px;border-bottom:1px solid var(--line);position:fixed;top:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);z-index:50}
.topbar-inner{height:100%;max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-size:24px;font-weight:800;letter-spacing:-.7px}.top-actions{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px}.icon-btn:hover{background:var(--soft)}
.main{padding-top:84px;padding-bottom:90px;max-width:1100px;margin:auto}.page{max-width:680px;margin:auto}.grid-page{max-width:980px;margin:auto}.bottomnav{position:fixed;bottom:0;left:0;right:0;height:68px;border-top:1px solid var(--line);background:rgba(255,255,255,.98);z-index:50;display:flex;justify-content:center}.bottomnav-inner{width:min(680px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.navbtn{display:grid;place-items:center;font-size:24px;position:relative}.navbtn small{font-size:10px;margin-top:-2px}.badge{position:absolute;top:9px;right:calc(50% - 19px);background:var(--danger);color:white;border-radius:12px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;border:2px solid white}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:#fafafa}.auth-card{width:min(390px,100%);background:#fff;border:1px solid var(--line);padding:36px 30px;border-radius:12px}.auth-logo{text-align:center;font-size:38px;font-weight:800;margin-bottom:30px}.field{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;background:#fafafa;padding:0 12px;outline:none;margin-bottom:9px}.field:focus{border-color:#aaa;background:#fff}.primary{width:100%;height:42px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;margin-top:8px}.secondary{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 15px;font-weight:600}.textbtn{color:var(--accent);font-weight:700}.switch{text-align:center;margin-top:22px;font-size:14px;color:var(--muted)}.error{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0}
.stories{display:flex;gap:15px;overflow:auto;padding:12px 2px 18px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 74px;text-align:center;font-size:11px;overflow:hidden}.story-avatar{width:66px;height:66px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#d62976,#4f5bd5);margin:auto}.story-avatar>div{width:100%;height:100%;border-radius:50%;background:#fff;padding:2px}.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#eee}.story-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.story.add .story-avatar{background:var(--soft);font-size:30px;display:grid;place-items:center}
.post{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}.post-head{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px}.avatar-sm{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#eee}.post-user{font-weight:700;font-size:14px}.post-time{font-size:12px;color:var(--muted)}.spacer{flex:1}.media{width:100%;max-height:720px;object-fit:cover;display:block;background:#111}.post-body{padding:10px 12px}.actions{display:flex;align-items:center;gap:5px}.action{font-size:25px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%}.action:hover{background:var(--soft)}.liked{color:var(--danger)}.caption{font-size:14px;line-height:1.45;margin:6px 0}.meta{font-size:12px;color:var(--muted)}.comment-row{display:flex;gap:8px;border-top:1px solid var(--line);padding:8px 12px}.comment-input{flex:1;border:0;outline:none}.send{font-weight:700;color:var(--accent)}
.section{padding:10px 0}.section-title{font-size:22px;font-weight:800;margin:12px 0}.composer{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.composer textarea{width:100%;border:0;resize:none;min-height:100px;outline:none;font-size:16px}.composer-foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}.media-chip{border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:13px}.preview-row{display:flex;gap:8px;overflow:auto;margin:10px 0}.preview{width:90px;height:90px;object-fit:cover;border-radius:8px;background:#111}
.profile-head{display:flex;gap:30px;align-items:center;padding:20px 0}.profile-big{width:110px;height:110px;border-radius:50%;object-fit:cover;background:#eee}.profile-info{flex:1}.profile-title{font-size:24px;font-weight:500}.stats{display:flex;gap:30px;margin:18px 0}.stat b{display:block;text-align:center}.stat span{font-size:13px;color:var(--muted)}.bio{font-size:14px;line-height:1.45}.profile-actions{display:flex;gap:8px;margin-top:12px}.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.tile{aspect-ratio:1;position:relative;background:#eee;overflow:hidden}.tile img,.tile video{width:100%;height:100%;object-fit:cover}.tile .play{position:absolute;right:8px;top:8px;color:white;font-size:20px;text-shadow:0 1px 5px #000}
.searchbox{display:flex;gap:8px;margin-bottom:15px}.searchbox input{flex:1;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;outline:none}.user-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}.user-row .uavatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#eee}.user-row .uinfo{flex:1}.username{font-weight:700}.display{font-size:13px;color:var(--muted)}
.chat-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.chat-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}.chat-row:last-child{border-bottom:0}.chat-row:hover{background:#fafafa}.chat-row .last{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat{height:calc(100vh - 154px);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}.chat-head{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 12px}.messages{flex:1;overflow:auto;padding:14px;background:#fff}.bubble-row{display:flex;margin:4px 0}.bubble-row.me{justify-content:flex-end}.bubble{max-width:72%;padding:9px 12px;border-radius:18px;background:#efefef;font-size:14px;position:relative}.me .bubble{background:#3797f0;color:#fff}.bubble img,.bubble video{max-width:240px;border-radius:12px;display:block}.bubble audio{max-width:230px}.replybar{background:#fafafa;border-top:1px solid var(--line);padding:8px 12px;font-size:12px;display:flex;gap:8px}.chat-input{display:flex;gap:8px;border-top:1px solid var(--line);padding:9px}.chat-input input{flex:1;height:42px;border:1px solid var(--line);border-radius:22px;padding:0 15px;outline:none}.round-send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff}.recording{background:var(--danger)!important}
.notice{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111;color:#fff;border-radius:10px;padding:11px 15px;z-index:100;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:grid;place-items:center;padding:15px}.modal-card{background:#fff;border-radius:12px;width:min(700px,100%);max-height:95vh;overflow:auto}.modal-head{height:55px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 15px;font-weight:700}.modal-body{padding:15px}
.story-viewer{position:fixed;inset:0;background:#000;z-index:90;color:#fff;display:flex;align-items:center;justify-content:center}.story-stage{width:min(500px,100%);height:100%;position:relative;background:#111;display:flex;align-items:center;justify-content:center}.story-stage img,.story-stage video{width:100%;height:100%;object-fit:contain}.story-top{position:absolute;left:10px;right:10px;top:10px;z-index:3}.progress{display:flex;gap:3px}.progress i{height:3px;background:rgba(255,255,255,.4);flex:1;border-radius:3px;overflow:hidden}.progress i b{display:block;height:100%;background:#fff;width:0}.story-user{display:flex;align-items:center;gap:9px;margin-top:10px}.story-user img{width:32px;height:32px;border-radius:50%;object-fit:cover}.story-close{position:absolute;right:12px;top:35px;font-size:30px;z-index:4}.story-left,.story-right{position:absolute;top:0;bottom:0;width:30%;z-index:2}.story-left{left:0}.story-right{right:0}.story-bottom{position:absolute;left:12px;right:12px;bottom:16px;z-index:4;display:flex;gap:8px}.story-bottom input{flex:1;height:42px;border:1px solid rgba(255,255,255,.7);background:rgba(0,0,0,.35);color:#fff;border-radius:22px;padding:0 14px;outline:none}.quick{font-size:25px;background:rgba(255,255,255,.12);border-radius:50%;width:42px;height:42px}
.owner{background:#111;color:#fff;border-radius:14px;padding:18px}.owner h2{margin:0 0 12px}.owner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.owner-stat{background:#1c1c1c;padding:15px;border-radius:10px}.owner-stat b{font-size:24px;display:block}.admin-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #333}.admin-row .admin-main{flex:1}.danger{color:#ff5a68}
.empty{text-align:center;color:var(--muted);padding:50px 10px}.loading{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:700px){.main{padding-left:10px;padding-right:10px}.topbar-inner{padding:0 12px}.brand{font-size:22px}.post{border-left:0;border-right:0;border-radius:0;margin-left:-10px;margin-right:-10px}.profile-head{gap:18px}.profile-big{width:84px;height:84px}.stats{gap:16px}.profile-title{font-size:20px}.owner-grid{grid-template-columns:1fr 1fr}.chat{border-radius:0;border-left:0;border-right:0}.page{width:100%}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {Client,Account,Databases,Storage,ID,Query,Permission,Role} = Appwrite;
const CONFIG={
 endpoint:"https://fra.cloud.appwrite.io/v1",
 project:"6aa242bf00012f890e92",
 database:"6aa41332002b049743d5",
 bucket:"6aa421b20025a1b4aac8",
 ownerCode:"Carlos-2839",
 ownerFunction:"https://6aa476550001ca179b26.fra.appwrite.run/"
};
const T={
 profiles:"profiles",posts:"posts",post_media:"post_media",conversations:"conversations",
 conversation_members:"conversation_members",messages:"messages",message_reactions:"message_reactions",
 comments:"comments",comment_reactions:"comment_reactions",reactions:"reactions",follows:"follows",
 notifications:"notifications",stories:"stories",story_media:"story_media",story_views:"story_views",
 story_reactions:"story_reactions",story_replies:"story_replies",user_presence:"user_presence",
 reports:"reports",verification:"verification",admin_actions:"admin_actions",user_blocks:"user_blocks"
};
const client=new Client().setEndpoint(CONFIG.endpoint).setProject(CONFIG.project);
const account=new Account(client), db=new Databases(client), storage=new Storage(client);
const S={me:null,profile:null,route:"home",params:{},profiles:new Map(),feed:[],stories:[],messages:[],activeChat:null,replyTo:null,media:[],recorder:null,recording:false,notifications:0};
const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const iso=()=>new Date().toISOString(), timeAgo=d=>{let n=Date.now()-new Date(d).getTime(),m=Math.floor(n/60000);if(m<1)return"now";if(m<60)return m+"m";let h=Math.floor(m/60);if(h<24)return h+"h";let day=Math.floor(h/24);return day+"d"};
function toast(x){let e=document.createElement("div");e.className="notice";e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function nav(r,p={}){S.route=r;S.params=p;render()}
function fileUrl(id){return storage.getFileView(CONFIG.bucket,id).toString()}
async function q(table,queries=[],limit=100){return (await db.listDocuments(CONFIG.database,table,[...queries,Query.limit(limit),Query.orderDesc("$createdAt")])).documents}
async function one(table,id){return db.getDocument(CONFIG.database,table,id)}
async function dbCreate(table,data){return db.createDocument(CONFIG.database,table,ID.unique(),data)}
async function update(table,id,data){return db.updateDocument(CONFIG.database,table,id,data)}
async function del(table,id){return db.deleteDocument(CONFIG.database,table,id)}
async function upload(file){let f=await storage.createFile(CONFIG.bucket,ID.unique(),file);return {id:f.$id,url:fileUrl(f.$id)}}
async function profile(id){if(S.profiles.has(id))return S.profiles.get(id);try{let a=await q(T.profiles,[Query.equal("userId",id),Query.limit(1)]),p=a[0]||{userId:id,username:"user_"+id.slice(0,6),displayName:"User"};S.profiles.set(id,p);return p}catch{return{userId:id,username:"user_"+id.slice(0,6)}}}
async function ensureProfile(){let a=await q(T.profiles,[Query.equal("userId",S.me.$id),Query.limit(1)]);if(a[0]){S.profile=a[0];S.profiles.set(S.me.$id,a[0]);return a[0]}let p=await dbCreate(T.profiles,{userId:S.me.$id,username:(S.me.name||"user").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30)||"user"+S.me.$id.slice(0,5),displayName:S.me.name||"User",email:S.me.email,createdAt:iso(),verified:false});S.profile=p;S.profiles.set(S.me.$id,p);return p}
async function owner(){return S.me?.prefs?.ownerCode===CONFIG.ownerCode}
async function notify(userId,type,message,from=S.me.$id,postId=""){if(!userId||userId===S.me.$id)return;try{await dbCreate(T.notifications,{userId,fromUserId:from,type,message,postId,createdAt:iso(),read:false})}catch{}}
async function follow(userId){let a=await q(T.follows,[Query.equal("followerId",S.me.$id),Query.equal("followingId",userId),Query.limit(1)]);if(a[0]){await del(T.follows,a[0].$id);toast("Unfollowed")}else{await dbCreate(T.follows,{followerId:S.me.$id,followingId:userId,createdAt:iso()});await notify(userId,"follow","started following you");toast("Following")}render()}
async function isFollowing(userId){return !!(await q(T.follows,[Query.equal("followerId",S.me.$id),Query.equal("followingId",userId),Query.limit(1)])).length}
async function getMedia(postId){return q(T.post_media,[Query.equal("postId",postId),Query.orderAsc("sortOrder"),Query.limit(20)])}
async function getStoryMedia(storyId){return q(T.story_media,[Query.equal("storyId",storyId),Query.orderAsc("sortOrder"),Query.limit(20)])}
async function renderShell(content){let p=S.profile||await ensureProfile();$("#root").innerHTML=`<div class="app"><header class="topbar"><div class="topbar-inner"><button class="brand" onclick="nav('home')">NOVA</button><div class="top-actions"><button class="icon-btn" onclick="nav('messages')">✉️</button><button class="icon-btn" onclick="nav('notifications')">♡${S.notifications?`<span class="badge">${S.notifications>9?"9+":S.notifications}</span>`:""}</button></div></div></header><main class="main">${content}</main><nav class="bottomnav"><div class="bottomnav-inner"><button class="navbtn" onclick="nav('home')">⌂<small>Home</small></button><button class="navbtn" onclick="nav('search')">⌕<small>Search</small></button><button class="navbtn" onclick="nav('create')">＋<small>Create</small></button><button class="navbtn" onclick="nav('activity')">♡<small>Activity</small></button><button class="navbtn" onclick="nav('profile',{id:S.me.$id})">◉<small>Profile</small></button></div></nav></div>`;if(content)$("#root").querySelector(".main").innerHTML=content}
async function home(){let posts=await q(T.posts,[Query.limit(60)]);let out=`<div class="page"><div class="stories" id="storiesStrip">${await storiesStrip()}</div><div id="feed">${posts.length?`<div class="loading">Loading posts…</div>`:`<div class="empty">No posts yet.<br>Create the first one.</div>`}</div></div>`;await renderShell(out);S.feed=posts;await renderFeed()}
async function storiesStrip(){let st=await q(T.stories,[Query.greaterThan("expiresAt",iso()),Query.limit(50)]);S.stories=st;let groups=[];for(let x of st){let p=await profile(x.userId);if(!groups.some(g=>g.userId===x.userId))groups.push({userId:x.userId,p,story:x})}return `<div class="story add" onclick="nav('create',{kind:'story'})"><div class="story-avatar">＋</div><div class="story-name">Your story</div></div>`+groups.map(g=>`<button class="story" onclick="openStory('${g.userId}')"><div class="story-avatar"><div><img class="avatar" src="${esc(g.p.avatar||"")}" onerror="this.style.visibility='hidden'"></div></div><div class="story-name">${esc(g.p.username)}</div></button>`).join("")}
async function renderFeed(){let f=$("#feed");if(!f)return;let posts=S.feed;f.innerHTML="";for(let p of posts)f.insertAdjacentHTML("beforeend",await postHTML(p))}
async function postHTML(p){let u=await profile(p.userId), media=await getMedia(p.$id), reactions=await q(T.reactions,[Query.equal("postId",p.$id),Query.limit(100)]),mine=reactions.some(x=>x.userId===S.me.$id),comments=await q(T.comments,[Query.equal("postId",p.$id),Query.limit(3)]);let first=media[0];let med=first?first.media:"";let type=first?.mediaType||"";let body=type.startsWith("video")?`<video class="media" src="${esc(med)}" controls playsinline></video>`:med?`<img class="media" src="${esc(med)}">`:"";return `<article class="post"><div class="post-head"><img class="avatar-sm" src="${esc(u.avatar||"")}" onerror="this.style.visibility='hidden'"><button class="post-user" onclick="nav('profile',{id:'${p.userId}'})">${esc(u.username)}</button><span class="post-time">${timeAgo(p.createdAt||p.$createdAt)}</span><span class="spacer"></span><button class="icon-btn" onclick="reportPost('${p.$id}')">•••</button></div>${body}<div class="post-body"><div class="actions"><button class="action ${mine?"liked":""}" onclick="reactPost('${p.$id}')">${mine?"♥":"♡"}</button><button class="action" onclick="focusComment('${p.$id}')">◯</button><button class="action" onclick="sharePost('${p.$id}')">➤</button><span class="spacer"></span><button class="action">⌑</button></div><b>${reactions.length} likes</b>${p.content?`<div class="caption"><b>${esc(u.username)}</b> ${esc(p.content)}</div>`:""}<div class="meta">View all comments (${comments.length})</div></div><div class="comment-row"><input id="comment-${p.$id}" class="comment-input" placeholder="Add a comment…"><button class="send" onclick="addComment('${p.$id}')">Post</button></div></article>`}
async function reactPost(id){let a=await q(T.reactions,[Query.equal("postId",id),Query.equal("userId",S.me.$id),Query.limit(1)]);let p=await one(T.posts,id);if(a[0])await del(T.reactions,a[0].$id);else{await dbCreate(T.reactions,{postId:id,userId:S.me.$id,reaction:"❤️",createdAt:iso()});await notify(p.userId,"like","liked your post",S.me.$id,id)}await refreshRoute()}
async function addComment(id){let e=$("#comment-"+id),v=e?.value.trim();if(!v)return;let p=await one(T.posts,id);await dbCreate(T.comments,{postId:id,userId:S.me.$id,content:v,createdAt:iso()});await notify(p.userId,"comment","commented on your post",S.me.$id,id);e.value="";await refreshRoute()}
function focusComment(id){$("#comment-"+id)?.focus()}
function sharePost(id){navigator.clipboard?.writeText(location.href+"#post="+id);toast("Post link copied")}
async function reportPost(id){let reason=prompt("Reason for report?");if(reason)await dbCreate(T.reports,{reporterId:S.me.$id,postId:id,reason,createdAt:iso(),status:"open"}),toast("Report sent")}
async function createPage(kind="post"){let story=kind==="story";return `<div class="page"><div class="section-title">${story?"Create story":"Create post"}</div><div class="composer"><textarea id="composeText" placeholder="${story?"Add a caption or text…":"Write a caption…"}"></textarea><div id="previewRow" class="preview-row"></div><div class="composer-foot"><label class="media-chip">▣ Photo<input id="mediaInput" type="file" accept="image/*,video/*" multiple hidden onchange="previewFiles(event)"></label><button class="media-chip" onclick="document.getElementById('mediaInput').click()">🎬 Video</button><span class="spacer"></span><button class="primary" style="width:auto;padding:0 20px" onclick="publish('${story?"story":"post"}')">Share</button></div></div><p class="meta">Photos and videos can be selected together.</p></div>`}
async function create(){let kind=S.params.kind||"post";await renderShell(await createPage(kind))}
async function previewFiles(e){S.media=[...e.target.files];let row=$("#previewRow");row.innerHTML="";for(let f of S.media){let url=URL.createObjectURL(f);row.insertAdjacentHTML("beforeend",f.type.startsWith("video")?`<video class="preview" src="${url}" muted></video>`:`<img class="preview" src="${url}">`)}}
async function publish(kind){let text=$("#composeText")?.value.trim()||"";if(kind==="post"){let p=await db.createDocument(CONFIG.database,T.posts,ID.unique(),{userId:S.me.$id,content:text,media:"",createdAt:iso()});for(let i=0;i<S.media.length;i++){let u=await upload(S.media[i]);await db.createDocument(CONFIG.database,T.post_media,ID.unique(),{postId:p.$id,media:u.url,mediaType:S.media[i].type,sortOrder:i,createdAt:iso()})}toast("Posted");S.media=[];nav("home")}else{let s=await db.createDocument(CONFIG.database,T.stories,ID.unique(),{userId:S.me.$id,content:text,media:"",mediaType:"",createdAt:iso(),expiresAt:new Date(Date.now()+86400000).toISOString()});for(let i=0;i<S.media.length;i++){let u=await upload(S.media[i]);await db.createDocument(CONFIG.database,T.story_media,ID.unique(),{storyId:s.$id,media:u.url,mediaType:S.media[i].type,sortOrder:i,createdAt:iso()})}toast("Story shared");S.media=[];nav("home")}}
async function search(){await renderShell(`<div class="page"><div class="section-title">Search</div><div class="searchbox"><input id="searchInput" placeholder="Search users" oninput="doSearch()"><button class="secondary">Search</button></div><div id="results"></div></div>`)}
let searchTimer;
async function doSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{let v=$("#searchInput")?.value.trim();if(!v){$("#results").innerHTML="";return}let a=await q(T.profiles,[Query.search("username",v),Query.limit(30)]);$("#results").innerHTML=a.map(p=>`<div class="user-row"><img class="uavatar" src="${esc(p.avatar||"")}"><div class="uinfo"><div class="username">${esc(p.username)}${p.verified?" ✓":""}</div><div class="display">${esc(p.displayName||"")}</div></div><button class="secondary" onclick="nav('profile',{id:'${p.userId}'})">View</button></div>`).join("")||`<div class="empty">No users found</div>`},250)}
async function profilePage(id){let p=await profile(id),posts=await q(T.posts,[Query.equal("userId",id),Query.limit(60)]),followers=(await q(T.follows,[Query.equal("followingId",id),Query.limit(100)])).length,following=(await q(T.follows,[Query.equal("followerId",id),Query.limit(100)])).length,me=id===S.me.$id,followingMe=!me&&await isFollowing(id);let tiles=[];for(let x of posts){let m=await getMedia(x.$id),z=m[0];if(z)tiles.push(z)}await renderShell(`<div class="grid-page"><div class="profile-head"><img class="profile-big" src="${esc(p.avatar||"")}"><div class="profile-info"><div class="profile-title">${esc(p.username)}${p.verified?" ✓":""}</div><div class="stats"><button class="stat"><b>${posts.length}</b><span>posts</span></button><button class="stat" onclick="userList('${id}','followers')"><b>${followers}</b><span>followers</span></button><button class="stat" onclick="userList('${id}','following')"><b>${following}</b><span>following</span></button></div><div class="profile-actions">${me?`<button class="secondary" onclick="editProfile()">Edit profile</button><button class="secondary" onclick="changeAvatar()">Profile photo</button>${await owner()?`<button class="secondary" onclick="ownerPage()">Owner</button>`:""}<button class="secondary" onclick="logout()">Log out</button>`:`<button class="secondary" onclick="follow('${id}')">${followingMe?"Following":"Follow"}</button><button class="secondary" onclick="openDirect('${id}')">Message</button>`}</div></div></div><div class="bio">${esc(p.bio||"")}</div><div class="profile-grid">${tiles.map(x=>x.mediaType?.startsWith("video")?`<div class="tile"><video src="${esc(x.media)}"></video><span class="play">▶</span></div>`:`<div class="tile"><img src="${esc(x.media)}"></div>`).join("")}</div></div>`)}
async function userList(id,type){let rows=type==="followers"?await q(T.follows,[Query.equal("followingId",id),Query.limit(100)]):await q(T.follows,[Query.equal("followerId",id),Query.limit(100)]);let html=`<div class="page"><button class="secondary" onclick="nav('profile',{id:'${id}'})">← Back</button><div class="section-title">${type}</div>`;for(let r of rows){let uid=type==="followers"?r.followerId:r.followingId,p=await profile(uid);html+=`<div class="user-row"><img class="uavatar" src="${esc(p.avatar||"")}"><div class="uinfo"><div class="username">${esc(p.username)}</div><div class="display">${esc(p.displayName||"")}</div></div><button class="secondary" onclick="nav('profile',{id:'${uid}'})">View</button></div>`}html+="</div>";await renderShell(html)}
async function editProfile(){let p=S.profile;let name=prompt("Display name",p.displayName||"");if(name===null)return;let bio=prompt("Bio",p.bio||"");if(bio===null)return;await update(T.profiles,p.$id,{displayName:name,bio});S.profile=await profile(S.me.$id);S.profiles.set(S.me.$id,S.profile);nav("profile",{id:S.me.$id})}
async function changeAvatar(){let input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=async()=>{let f=input.files?.[0];if(!f)return;try{let u=await upload(f);let p=await update(T.profiles,S.profile.$id,{avatar:u.url});S.profile=p;S.profiles.set(S.me.$id,p);toast("Profile photo updated");nav("profile",{id:S.me.$id})}catch(e){toast("Could not update profile photo")}};input.click()}
async function messages(){let rows=await q(T.conversation_members,[Query.equal("userId",S.me.$id),Query.limit(100)]);let users=await q(T.profiles,[Query.limit(100)]);let out=`<div class="page"><div class="section-title">Messages</div><div class="meta" style="margin-bottom:8px">Registered users</div><div class="chat-list">`;for(let p of users.filter(x=>x.userId!==S.me.$id)){out+=`<button class="chat-row" style="width:100%;text-align:left" onclick="openDirect('${p.userId}')"><img class="uavatar" src="${esc(p.avatar||"")}"><div class="uinfo"><div class="username">${esc(p.username)}${p.verified?" ✓":""}</div><div class="last">${esc(p.displayName||"Tap to message")}</div></div><span>›</span></button>`}out+=`</div><div class="section-title" style="font-size:18px;margin-top:24px">Chats</div><div class="chat-list">`;for(let r of rows){let members=await q(T.conversation_members,[Query.equal("conversationId",r.conversationId),Query.limit(10)]),other=members.find(x=>x.userId!==S.me.$id);if(!other)continue;let p=await profile(other.userId),c=await one(T.conversations,r.conversationId);out+=`<button class="chat-row" style="width:100%;text-align:left" onclick="openChat('${r.conversationId}','${other.userId}')"><img class="uavatar" src="${esc(p.avatar||"")}"><div class="uinfo"><div class="username">${esc(p.username)}</div><div class="last">${esc(c.lastMessage||"Start a conversation")}</div></div></button>`}out+="</div></div>";await renderShell(out)}
async function openDirect(userId){let mine=await q(T.conversation_members,[Query.equal("userId",S.me.$id),Query.limit(100)]);for(let r of mine){let m=await q(T.conversation_members,[Query.equal("conversationId",r.conversationId),Query.equal("userId",userId),Query.limit(1)]);if(m.length)return openChat(r.conversationId,userId)}let c=await dbCreate(T.conversations,{createdAt:iso(),type:"direct",lastMessage:"",lastMessageAt:iso()});await dbCreate(T.conversation_members,{conversationId:c.$id,userId:S.me.$id,joinedAt:iso(),isAdmin:true});await dbCreate(T.conversation_members,{conversationId:c.$id,userId,joinedAt:iso(),isAdmin:false});return openChat(c.$id,userId)}
async function openChat(cid,uid){S.activeChat={cid,uid};let p=await profile(uid),msgs=await q(T.messages,[Query.equal("conversationId",cid),Query.limit(200)]);await renderShell(`<div class="page"><div class="chat"><div class="chat-head"><button class="icon-btn" onclick="nav('messages')">‹</button><img class="avatar-sm" src="${esc(p.avatar||"")}"><b>${esc(p.username)}</b><span class="spacer"></span><button class="icon-btn" onclick="nav('profile',{id:'${uid}'})">◉</button></div><div class="messages" id="messageList">${msgs.map(renderMessage).join("")}</div>${S.replyTo?`<div class="replybar">Replying to ${esc(S.replyTo.content||"media")} <button onclick="S.replyTo=null;openChat('${cid}','${uid}')">×</button></div>`:""}<div class="chat-input"><button class="icon-btn" onclick="document.getElementById('chatFile').click()">＋</button><input id="chatFile" type="file" accept="image/*,video/*" hidden onchange="sendMedia(event)"><input id="chatText" placeholder="Message…" onkeydown="if(event.key==='Enter')sendText()"><button id="voiceBtn" class="icon-btn" onclick="toggleVoice()">🎙️</button><button class="round-send" onclick="sendText()">➤</button></div></div></div>`);let box=$("#messageList");box.scrollTop=box.scrollHeight}
async function sendText(){let e=$("#chatText"),v=e?.value.trim();if(!v||!S.activeChat)return;let m=await dbCreate(T.messages,{conversationId:S.activeChat.cid,senderId:S.me.$id,content:v,media:"",mediaType:"",replyTo:S.replyTo?.$id||"",createdAt:iso(),deleted:false});await update(T.conversations,S.activeChat.cid,{lastMessage:v,lastMessageAt:iso()});await notify(S.activeChat.uid,"message","sent you a message");S.replyTo=null;e.value="";openChat(S.activeChat.cid,S.activeChat.uid)}
async function sendMedia(e){let f=e.target.files?.[0];if(!f||!S.activeChat)return;let u=await upload(f);await dbCreate(T.messages,{conversationId:S.activeChat.cid,senderId:S.me.$id,content:"",media:u.url,mediaType:f.type,replyTo:"",createdAt:iso(),deleted:false});await update(T.conversations,S.activeChat.cid,{lastMessage:f.type.startsWith("video")?"Video":"Photo",lastMessageAt:iso()});await notify(S.activeChat.uid,"message","sent you media");openChat(S.activeChat.cid,S.activeChat.uid)}
function renderMessage(m){let me=m.senderId===S.me.$id,content=m.media?(m.mediaType?.startsWith("video")?`<video src="${esc(m.media)}" controls playsinline></video>`:m.mediaType?.startsWith("audio")?`<audio src="${esc(m.media)}" controls></audio>`:`<img src="${esc(m.media)}">`):esc(m.content);return `<div class="bubble-row ${me?"me":""}" onclick="messageMenu('${m.$id}','${m.senderId}')"><div class="bubble">${content}</div></div>`}
async function messageMenu(id,sender){let a=prompt("Reply, react, or cancel. Type ❤️ / 😂 / 👍 or reply");if(!a)return;let m=await one(T.messages,id);if(a==="❤️"||a==="😂"||a==="👍"){await dbCreate(T.message_reactions,{messageId:id,userId:S.me.$id,reaction:a,createdAt:iso()});await notify(sender,"reaction","reacted to your message");toast("Reaction sent")}else{S.replyTo=m;openChat(S.activeChat.cid,S.activeChat.uid)}}
async function toggleVoice(){if(S.recording){S.recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia)return toast("Voice recording is not supported here");try{let stream=await navigator.mediaDevices.getUserMedia({audio:true}),mime=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"].find(x=>MediaRecorder.isTypeSupported(x))||"";let chunks=[];S.recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);S.recording=true;$("#voiceBtn").classList.add("recording");S.recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);S.recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());S.recording=false;$("#voiceBtn")?.classList.remove("recording");let blob=new Blob(chunks,{type:mime||"audio/webm"}),f=new File([blob],"voice."+((mime||"audio/webm").includes("mp4")?"m4a":"webm"),{type:blob.type}),u=await upload(f);await dbCreate(T.messages,{conversationId:S.activeChat.cid,senderId:S.me.$id,content:"",media:u.url,mediaType:"audio",replyTo:"",createdAt:iso(),deleted:false});await update(T.conversations,S.activeChat.cid,{lastMessage:"Voice message",lastMessageAt:iso()});await notify(S.activeChat.uid,"message","sent you a voice message");openChat(S.activeChat.cid,S.activeChat.uid)};S.recorder.start();toast("Recording… tap again to send")}catch(e){toast("Microphone permission is required")}}
async function notifications(){let n=await q(T.notifications,[Query.equal("userId",S.me.$id),Query.limit(100)]);S.notifications=n.filter(x=>!x.read).length;let html=`<div class="page"><div class="section-title">Activity</div>`;for(let x of n){let p=await profile(x.fromUserId);html+=`<button class="user-row" style="width:100%;text-align:left" onclick="openNotification('${x.$id}','${x.type}','${x.postId||""}')"><img class="uavatar" src="${esc(p.avatar||"")}"><div class="uinfo"><div><b>${esc(p.username)}</b> ${esc(x.message||"")}</div><div class="display">${timeAgo(x.createdAt)}</div></div>${x.read?"":"<b>•</b>"}</button>`}html+="</div>";await renderShell(html);for(let x of n.filter(x=>!x.read))update(T.notifications,x.$id,{read:true});S.notifications=0}
async function openNotification(id,type,postId){if(type==="message")nav("messages");else if(postId)nav("home");else toast("Notification")}
async function openStory(userId){let stories=await q(T.stories,[Query.equal("userId",userId),Query.greaterThan("expiresAt",iso()),Query.limit(20)]);let items=[];for(let s of stories){let m=await getStoryMedia(s.$id);if(m.length)for(let x of m)items.push({story:s,media:x});else items.push({story:s,media:null})}if(!items.length)return;let p=await profile(userId),i=0;const show=()=>{let x=items[i],el=document.createElement("div");el.className="story-viewer";el.id="storyViewer";el.innerHTML=`<div class="story-stage">${x.media?(x.media.mediaType?.startsWith("video")?`<video id="storyMedia" src="${esc(x.media.media)}" autoplay playsinline></video>`:`<img id="storyMedia" src="${esc(x.media.media)}">`):`<div style="padding:30px;font-size:24px">${esc(x.story.content||"")}</div>`}<div class="story-top"><div class="progress">${items.map((_,j)=>`<i><b style="width:${j<i?"100%":j===i?"0":"0"}"></b></i>`).join("")}</div><div class="story-user"><img src="${esc(p.avatar||"")}"><b>${esc(p.username)}</b></div></div><button class="story-close" onclick="document.getElementById('storyViewer')?.remove()">×</button><div class="story-left" onclick="storyPrev()"></div><div class="story-right" onclick="storyNext()"></div><div class="story-bottom"><input id="storyReplyInput" placeholder="Reply…"><button class="quick" onclick="storyReact('${x.story.$id}','❤️')">❤️</button><button class="quick" onclick="storyReact('${x.story.$id}','😂')">😂</button><button class="quick" onclick="storyReact('${x.story.$id}','🔥')">🔥</button><button class="quick" onclick="storyReply('${x.story.$id}','${userId}')">➤</button></div></div>`;document.body.appendChild(el);let media=el.querySelector("#storyMedia");if(media?.tagName==="VIDEO")media.onended=()=>storyNext();window.storyNext=()=>{if(i<items.length-1){i++;document.getElementById("storyViewer")?.remove();show()}else document.getElementById("storyViewer")?.remove()};window.storyPrev=()=>{if(i>0){i--;document.getElementById("storyViewer")?.remove();show()}};if(media?.tagName==="IMG")setTimeout(()=>{if(document.getElementById("storyViewer"))storyNext()},5000);};show()}
async function storyReact(storyId,reaction){let s=await one(T.stories,storyId);let a=await q(T.story_reactions,[Query.equal("storyId",storyId),Query.equal("userId",S.me.$id),Query.limit(1)]);if(a[0])await del(T.story_reactions,a[0].$id);else{await dbCreate(T.story_reactions,{storyId,userId:S.me.$id,reaction,createdAt:iso()});await notify(s.userId,"story_reaction","reacted to your story")}toast("Reaction sent")}
async function storyReply(storyId,userId){let e=$("#storyReplyInput"),v=e?.value.trim();if(!v)return;let mine=await q(T.conversation_members,[Query.equal("userId",S.me.$id),Query.limit(100)]),cid=null;for(let r of mine){let m=await q(T.conversation_members,[Query.equal("conversationId",r.conversationId),Query.equal("userId",userId),Query.limit(1)]);if(m.length){cid=r.conversationId;break}}if(!cid){let c=await dbCreate(T.conversations,{createdAt:iso(),type:"direct",lastMessage:"",lastMessageAt:iso()});cid=c.$id;await dbCreate(T.conversation_members,{conversationId:cid,userId:S.me.$id,joinedAt:iso(),isAdmin:true});await dbCreate(T.conversation_members,{conversationId:cid,userId,joinedAt:iso(),isAdmin:false})}await dbCreate(T.story_replies,{storyId,userId:S.me.$id,content:v,createdAt:iso()});await dbCreate(T.messages,{conversationId:cid,senderId:S.me.$id,content:v,media:"",mediaType:"",replyTo:"",createdAt:iso(),deleted:false});await update(T.conversations,cid,{lastMessage:v,lastMessageAt:iso()});await notify(userId,"message","replied to your story");toast("Reply sent");document.getElementById("storyViewer")?.remove()}
async function activity(){return notifications()}
async function ownerPage(){if(!await owner())return toast("Owner access only");let users=await q(T.profiles,[Query.limit(100)]),reports=await q(T.reports,[Query.limit(100)]);await renderShell(`<div class="grid-page"><div class="owner"><h2>Owner dashboard</h2><div class="owner-grid"><div class="owner-stat"><b>${users.length}</b>Users</div><div class="owner-stat"><b>${reports.length}</b>Reports</div><div class="owner-stat"><b>${(await q(T.posts,[Query.limit(100)])).length}</b>Posts</div></div><h3>Users</h3><div id="ownerUsers">${users.map(u=>`<div class="admin-row"><img class="avatar-sm" src="${esc(u.avatar||"")}"><div class="admin-main"><b>${esc(u.username)}</b><div>${esc(u.displayName||"")}</div></div><button class="secondary" onclick="ownerVerify('${u.userId}',${!u.verified})">${u.verified?"Unverify":"Verify"}</button></div>`).join("")}</div><h3>Reports</h3>${reports.map(r=>`<div class="admin-row"><div class="admin-main"><b>${esc(r.reason)}</b><div>${esc(r.postId||r.messageId||r.reportedUserId||"")}</div></div></div>`).join("")||"<div>No reports</div>"}</div></div>`)}
async function ownerVerify(uid,on){try{await fetch(CONFIG.ownerFunction,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ownerId:CONFIG.ownerCode,action:on?"verifyUser":"unverifyUser",userId:uid})});S.profiles.delete(uid);toast(on?"Verified":"Unverified");ownerPage()}catch{toast("Owner function error")}}
async function loginPage(mode="login"){let reg=mode==="register";$("#root").innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-logo">NOVA</div><div id="authError" class="error"></div>${reg?`<input id="authName" class="field" placeholder="Name">`:""}<input id="authEmail" class="field" type="email" placeholder="Email"><input id="authPass" class="field" type="password" placeholder="Password">${reg?`<input id="authOwner" class="field" placeholder="Owner ID (optional)">`:""}<button class="primary" onclick="${reg?"register()":"login()"}">${reg?"Create account":"Log in"}</button><div class="switch">${reg?"Already have an account?":"Don't have an account?"} <button class="textbtn" onclick="loginPage('${reg?"login":"register"}')">${reg?"Log in":"Sign up"}</button></div></div></div>`}
async function login(){try{await account.createEmailPasswordSession($("#authEmail").value.trim(),$("#authPass").value);await boot()}catch(e){$("#authError").textContent=e.message||"Login failed"}}
async function register(){try{let name=$("#authName").value.trim(),email=$("#authEmail").value.trim(),pass=$("#authPass").value,code=$("#authOwner").value.trim();if(pass.length<8)throw Error("Password must be at least 8 characters");let u=await account.create(ID.unique(),email,pass,name);await account.createEmailPasswordSession(email,pass);if(code)await account.updatePrefs({ownerCode:code});await ensureProfile();if(code===CONFIG.ownerCode)toast("Owner account created");await boot()}catch(e){$("#authError").textContent=e.message||"Registration failed"}}
async function logout(){try{await account.deleteSession("current")}catch{}S.me=null;S.profile=null;loginPage("login")}
async function refreshRoute(){return render()}
async function render(){if(!S.me)return loginPage("login");if(S.route==="home")return home();if(S.route==="search")return search();if(S.route==="create")return create();if(S.route==="profile")return profilePage(S.params.id||S.me.$id);if(S.route==="messages")return messages();if(S.route==="notifications"||S.route==="activity")return notifications();if(S.route==="owner")return ownerPage();return home()}
async function boot(){try{S.me=await account.get();await ensureProfile();let n=await q(T.notifications,[Query.equal("userId",S.me.$id),Query.equal("read",false),Query.limit(100)]);S.notifications=n.length;await render()}catch{S.me=null;loginPage("login")}}
Object.assign(window,{nav,loginPage,login,register,logout,previewFiles,publish,follow,reactPost,addComment,focusComment,sharePost,reportPost,doSearch,editProfile,changeAvatar,userList,openDirect,openChat,sendText,sendMedia,toggleVoice,messageMenu,storyReact,storyReply,openStory,ownerPage,ownerVerify});
window.addEventListener("error",e=>console.error("NOVA",e.error||e.message));
boot();
</script>
