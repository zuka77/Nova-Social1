<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SHIFT — Nox</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a;font-family:Arial,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;color:#fff;pointer-events:none}
#logo{position:absolute;top:16px;left:22px;font-weight:900;font-size:27px;letter-spacing:6px;text-shadow:0 0 20px #7d55ff}
#energyBox{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:230px;height:13px;border:1px solid #8063c7;border-radius:20px;background:#090813;overflow:hidden}
#energy{height:100%;width:25%;background:linear-gradient(90deg,#693cff,#d39bff);box-shadow:0 0 18px #8d5cff}
#timer{position:absolute;top:41px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:3px;opacity:.75}
#event{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:14px;letter-spacing:3px;color:#c7a9ff;opacity:0;transition:.2s}
#event.show{opacity:1}
#joystick{position:absolute;left:25px;bottom:24px;width:122px;height:122px;border-radius:50%;border:1px solid #ffffff24;background:#14162988;backdrop-filter:blur(7px);pointer-events:auto}
#stick{position:absolute;left:33px;top:33px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b59aff,#5131b9);box-shadow:0 0 24px #7950ff99}
#abilities{position:absolute;right:22px;bottom:22px;display:flex;align-items:end;gap:10px;pointer-events:none}
.skill{width:62px;height:62px;border-radius:50%;border:1px solid #a783ff99;background:#0e1020dd;color:#fff;font-weight:800;font-size:10px;letter-spacing:1px;pointer-events:auto;box-shadow:0 0 20px #7146ff33}
#ultimate{width:78px;height:78px;border-color:#b98fff;box-shadow:0 0 28px #814dff66}
.skill:active{transform:scale(.9)}
#start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;background:radial-gradient(circle,#211443 0%,#080914 43%,#03040a 100%)}
#start h1{margin:0;font-size:70px;letter-spacing:15px;text-shadow:0 0 40px #7e4cff}
#start p{opacity:.55;letter-spacing:4px;margin:8px 0 32px}
#play{border:1px solid #a17dff;border-radius:40px;padding:16px 48px;background:linear-gradient(135deg,#4d28bb,#8750ff);color:#fff;font-weight:900;letter-spacing:2px;font-size:16px;box-shadow:0 0 30px #7847ff66}
#portrait{display:none;position:fixed;inset:0;z-index:20;align-items:center;justify-content:center;text-align:center;color:#fff;background:#03040a;font-size:20px;letter-spacing:2px}
@media(orientation:portrait){#portrait{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start">
  <h1>SHIFT</h1>
  <p>THE ARENA IS NEVER THE SAME</p>
  <button id="play">ENTER ARENA</button>
</div>

<div id="portrait">ROTATE YOUR PHONE<br><small>SHIFT IS LANDSCAPE ONLY</small></div>

<div id="hud">
  <div id="logo">SHIFT</div>
  <div id="energyBox"><div id="energy"></div></div>
  <div id="timer">04:00</div>
  <div id="event"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="abilities">
    <button class="skill" id="shot">SHOT</button>
    <button class="skill" id="dash">DASH</button>
    <button class="skill" id="shield">SHIELD</button>
    <button class="skill" id="ultimate">ULTIMATE</button>
  </div>
</div>

const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);if(!player.started){player.x=W/2;player.y=H/2}}
addEventListener("resize",resize);

const noxImg=new Image(); noxImg.src=NOX_SRC;

const player={x:W/2,y:H/2,size:150,angle:0,shield:0,dash:0,attack:0,ultimate:0,started:false,walk:0};
let playing=false,time=240,energy=0,shake=0,last=performance.now(),eventTimer=12;
let cores=[],shots=[],particles=[];
const joy={active:false,x:0,y:0};

function makeCores(){cores=[];for(let i=0;i<9;i++)spawnCore()}
function spawnCore(){cores.push({x:70+Math.random()*(W-140),y:85+Math.random()*(H-145),p:Math.random()*6.28})}

const joystick=document.getElementById("joystick"),stick=document.getElementById("stick");
function joyMove(e){
  const r=joystick.getBoundingClientRect();let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
  const d=Math.hypot(dx,dy),m=42;if(d>m){dx=dx/d*m;dy=dy/d*m}
  joy.x=dx/m;joy.y=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joystick.addEventListener("pointerdown",e=>{joy.active=true;joystick.setPointerCapture(e.pointerId);joyMove(e)});
joystick.addEventListener("pointermove",e=>{if(joy.active)joyMove(e)});
joystick.addEventListener("pointerup",()=>{joy.active=false;joy.x=joy.y=0;stick.style.transform="translate(0,0)"});

function burst(x,y,color="#a56cff",n=18){
  for(let i=0;i<n;i++){let a=Math.random()*6.28,s=40+Math.random()*180;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.35+Math.random()*.5,m:.8,z:1+Math.random()*3,c:color})}
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.l<=0)particles.splice(i,1)}
}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.z,0,6.28);ctx.fill()}ctx.globalAlpha=1}

function magicShot(){
  if(!playing)return;
  const a=player.angle;shots.push({x:player.x+Math.cos(a)*45,y:player.y+Math.sin(a)*45,vx:Math.cos(a)*650,vy:Math.sin(a)*650,l:1});
  burst(player.x+Math.cos(a)*40,player.y+Math.sin(a)*40,"#c99cff",8);player.attack=.2;
}
function dash(){
  if(!playing||player.dash>0)return;
  let dx=joy.x,dy=joy.y;if(Math.hypot(dx,dy)<.1){dx=Math.cos(player.angle);dy=Math.sin(player.angle)}
  player.x+=dx*125;player.y+=dy*125;player.x=Math.max(50,Math.min(W-50,player.x));player.y=Math.max(80,Math.min(H-50,player.y));
  player.dash=.75;shake=9;burst(player.x,player.y,"#8b65ff",30)
}
function shield(){if(playing&&player.shield<=0){player.shield=3;burst(player.x,player.y,"#63d9ff",25)}}
function ultimate(){if(playing&&player.ultimate>=100){player.ultimate=0;shake=20;burst(player.x,player.y,"#fff",90);for(const c of cores){c.x=player.x+(Math.random()-.5)*300;c.y=player.y+(Math.random()-.5)*220}}}
shot.onpointerdown=magicShot;dash.onpointerdown=dash;shield.onpointerdown=shield;ultimate.onpointerdown=ultimate;

function shiftEvent(){
  const list=["FLOOR SHIFT","GRAVITY PULSE","VOID TILES","ENERGY SURGE","REALITY BREAK"];
  const e=document.getElementById("event");e.textContent=list[Math.floor(Math.random()*list.length)];e.classList.add("show");
  shake=13;burst(W/2,H/2,"#b88aff",55);setTimeout(()=>e.classList.remove("show"),1600);
  if(e.textContent==="ENERGY SURGE")for(let i=0;i<4;i++)spawnCore();
}

function update(dt){
  if(!playing)return;
  time-=dt;if(time<=0){time=0;playing=false;document.getElementById("start").style.display="flex";document.getElementById("play").textContent="PLAY AGAIN"}
  eventTimer-=dt;if(eventTimer<=0){eventTimer=13+Math.random()*8;shiftEvent()}
  const dx=joy.x,dy=joy.y,len=Math.hypot(dx,dy);
  if(len>.05){player.angle=Math.atan2(dy,dx);player.x+=dx*230*dt;player.y+=dy*230*dt;player.walk+=dt*12}else player.walk+=dt*3;
  player.x=Math.max(42,Math.min(W-42,player.x));player.y=Math.max(72,Math.min(H-42,player.y));
  player.dash=Math.max(0,player.dash-dt);player.shield=Math.max(0,player.shield-dt);player.attack=Math.max(0,player.attack-dt);
  for(let i=cores.length-1;i>=0;i--){let c=cores[i];c.p+=dt*4;if(Math.hypot(c.x-player.x,c.y-player.y)<45){energy=Math.min(100,energy+12);player.ultimate=Math.min(100,player.ultimate+12);burst(c.x,c.y,"#c48aff",20);cores.splice(i,1);setTimeout(spawnCore,350)}}
  for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;if(s.l<=0||s.x<-50||s.x>W+50||s.y<-50||s.y>H+50)shots.splice(i,1)}
  updateParticles(dt);
  document.getElementById("energy").style.width=energy+"%";
  document.getElementById("timer").textContent=`0${Math.floor(time/60)}:${Math.floor(time%60).toString().padStart(2,"0")}`;
}

function drawArena(){
  const g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.7);
  g.addColorStop(0,"#1b1433");g.addColorStop(.55,"#090b17");g.addColorStop(1,"#020308");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const s=72;
  for(let x=0;x<W;x+=s)for(let y=0;y<H;y+=s){ctx.fillStyle="rgba(80,62,130,.09)";ctx.fillRect(x+1,y+1,s-2,s-2);ctx.strokeStyle="rgba(150,120,220,.06)";ctx.strokeRect(x,y,s,s)}
  ctx.strokeStyle="rgba(143,101,255,.24)";ctx.lineWidth=2;ctx.strokeRect(25,62,W-50,H-87);
  ctx.save();ctx.translate(W/2,H/2);ctx.rotate(performance.now()*.00012);ctx.strokeStyle="rgba(150,100,255,.13)";ctx.beginPath();ctx.arc(0,0,120,0,6.28);ctx.stroke();ctx.beginPath();ctx.arc(0,0,78,0,6.28);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-105);ctx.lineTo(91,53);ctx.lineTo(-91,53);ctx.closePath();ctx.stroke();ctx.restore();
}
function drawCores(){
  for(const c of cores){let q=1+Math.sin(c.p)*.14;ctx.save();ctx.translate(c.x,c.y);ctx.shadowBlur=26;ctx.shadowColor="#9b5cff";ctx.fillStyle="#c998ff";ctx.beginPath();ctx.moveTo(0,-12*q);ctx.lineTo(9*q,0);ctx.lineTo(0,12*q);ctx.lineTo(-9*q,0);ctx.closePath();ctx.fill();ctx.restore()}
}
function drawShots(){
  for(const s of shots){ctx.save();ctx.shadowBlur=22;ctx.shadowColor="#ad6cff";ctx.fillStyle="#e1c7ff";ctx.beginPath();ctx.arc(s.x,s.y,6,0,6.28);ctx.fill();ctx.restore()}
}
function drawNox(){
  if(!noxImg.complete||!noxImg.naturalWidth)return;
  const moving=Math.hypot(joy.x,joy.y)>.05,bob=moving?Math.sin(player.walk)*2:Math.sin(performance.now()*.003)*1;
  const w=player.size,h=player.size*noxImg.naturalHeight/noxImg.naturalWidth;
  ctx.save();ctx.translate(player.x,player.y+bob);
  if(player.shield>0){ctx.strokeStyle="#65d9ff";ctx.lineWidth=3;ctx.shadowBlur=22;ctx.shadowColor="#55d9ff";ctx.beginPath();ctx.arc(0,0,player.size*.48+Math.sin(performance.now()*.008)*3,0,6.28);ctx.stroke()}
  ctx.globalAlpha=.45;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(0,player.size*.37,player.size*.27,player.size*.09,0,0,6.28);ctx.fill();ctx.globalAlpha=1;
  ctx.save();ctx.scale(player.angle>Math.PI/2||player.angle< -Math.PI/2?-1:1,1);
  ctx.shadowBlur=18;ctx.shadowColor="#744cff66";
  ctx.drawImage(noxImg,-w/2,-h*.56,w,h);
  ctx.restore();
  if(player.attack>0){ctx.strokeStyle="#d8b7ff";ctx.lineWidth=4;ctx.shadowBlur=16;ctx.shadowColor="#c088ff";ctx.beginPath();ctx.arc(0,0,player.size*.55,-.6,.6);ctx.stroke()}
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.2)shake=0}
  drawArena();drawCores();drawShots();drawParticles();drawNox();ctx.restore();
  requestAnimationFrame(render);
}
document.getElementById("play").addEventListener("pointerdown",()=>{
  document.getElementById("start").style.display="none";playing=true;time=240;energy=0;player.ultimate=0;player.started=true;player.x=W/2;player.y=H/2;makeCores()
});
resize();render();
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
