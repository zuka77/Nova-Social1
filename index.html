<body>
<div id="auth" class="auth">
  <div class="authbox">
    <div class="authlogo">NOVA</div><div class="authsub">A social space for real people.</div>
    <div class="tabs"><button id="loginTab" class="tab active">Login</button><button id="registerTab" class="tab">Register</button></div>
    <form id="authForm">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required>
      <div id="registerFields" style="display:none">
        <input id="username" placeholder="Username" autocomplete="username">
        <input id="displayName" placeholder="Display name">
      </div>
      <button class="primary" style="width:100%;margin-top:4px" id="authSubmit">Login</button>
    </form>
    <p id="authMessage" class="muted small" style="text-align:center"></p>
  </div>
</div>

<div id="app" class="app" style="display:none">
<header class="topbar">
  <button class="iconbtn" id="topBack" style="visibility:hidden"><svg class="icon"><use href="#i-back"/></svg></button>
  <div class="brand">NOVA Social</div>
  <div class="row gap8">
    <button class="iconbtn" id="searchBtn"><svg class="icon"><use href="#i-search"/></svg></button>
    <button class="iconbtn" id="notifBtn" style="position:relative"><svg class="icon"><use href="#i-bell"/></svg><span id="notifBadge" class="badge" style="display:none"></span></button>
  </div>
</header>

<main class="page">
<section id="homeView" class="view active">
  <div id="storyBar" class="storybar"></div>
  <div id="feed"></div>
</section>
<section id="searchView" class="view">
  <div class="searchbox"><svg class="icon"><use href="#i-search"/></svg><input id="searchInput" placeholder="Search username or name"></div>
  <div id="searchResults" class="card"></div>
</section>
<section id="notificationsView" class="view">
  <h2 style="margin:8px 2px">Notifications</h2><div id="notifications" class="card"></div>
</section>
<section id="profileView" class="view"></section>
<section id="settingsView" class="view"></section>
<section id="ownerView" class="view"></section>
</main>

<button class="fab" id="createBtn"><svg class="icon" style="width:25px;height:25px"><use href="#i-plus"/></svg></button>
<nav class="bottomnav"><div class="navinner">
  <button class="navbtn active" data-view="homeView"><svg class="icon"><use href="#i-home"/></svg>Home</button>
  <button class="navbtn" data-view="searchView"><svg class="icon"><use href="#i-search"/></svg>Search</button>
  <button class="navbtn" data-view="chat"><svg class="icon"><use href="#i-chat"/></svg>Chats</button>
  <button class="navbtn" data-view="profileView"><svg class="icon"><use href="#i-user"/></svg>Profile</button>
</div></nav>
</div>

<div id="chatView" class="chatView">
  <div class="chatHead">
    <button class="iconbtn" id="chatBack"><svg class="icon"><use href="#i-back"/></svg></button>
    <div id="chatAvatar"></div><div class="grow"><div id="chatName" class="name"></div><div id="chatPresence" class="tiny muted"></div></div>
    <button class="iconbtn" id="chatMore"><svg class="icon"><use href="#i-more"/></svg></button>
  </div>
  <div id="typing" class="typing"></div><div id="chatMessages" class="chatMessages"></div>
  <div id="replyBar" style="display:none;padding:7px 10px;background:#11111a;border-top:1px solid var(--line)"></div>
  <div class="chatInputBar">
    <button class="circle" id="attachBtn"><svg class="icon"><use href="#i-paper"/></svg></button>
    <textarea id="chatInput" class="chatInput" rows="1" placeholder="Message"></textarea>
    <button class="circle" id="voiceBtn"><svg class="icon"><use href="#i-mic"/></svg></button>
    <button class="circle" id="sendBtn" style="background:linear-gradient(135deg,var(--purple),var(--pink))"><svg class="icon"><use href="#i-send"/></svg></button>
  </div>
  <input id="chatFile" type="file" accept="image/*,video/*" hidden>
</div>

<div id="modal" class="modal"><div id="sheet" class="sheet"><div class="handle"></div><div id="modalBody"></div></div></div>
<div id="storyOverlay" class="overlay"><div class="overlayContent">
  <div class="viewerTop"><div id="storyProgress" class="progresses"></div><div class="viewerHead"><div id="storyOwner" class="row gap8"></div><button class="iconbtn" id="storyClose"><svg class="icon"><use href="#i-close"/></svg></button></div></div>
  <div class="storyStage"><div class="tapZone left" id="storyPrev"></div><div class="tapZone right" id="storyNext"></div><div id="storyMedia"></div></div>
  <div class="storyBottom"><div id="storyActions" class="row gap8" style="margin-bottom:8px"></div><div class="storyReply"><input id="storyReply" placeholder="Reply to story"><button class="circle" id="storySend"><svg class="icon"><use href="#i-send"/></svg></button></div></div>
</div></div>
<div id="lightbox" class="lightbox"><button class="iconbtn" id="lightboxClose" style="position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:2"><svg class="icon"><use href="#i-close"/></svg></button><div id="lightboxMedia"></div></div>
<div id="toast" class="toast"></div>

<input id="postFiles" type="file" accept="image/*,video/*" multiple hidden>
<input id="storyFiles" type="file" accept="image/*,video/*" multiple hidden>

$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});

async function safeQuery(make,quiet=false){
  try{const r=await make();if(r.error)throw r.error;return r.data}catch(e){if(!quiet)console.error(e);return null}
}
async function tryInsert(table,candidates){
  for(const data of candidates){
    const r=await sb.from(table).insert(data).select("*").maybeSingle();
    if(!r.error)return r.data;
  }
  return null;
}
async function tryUpdate(table,filter,candidates){
  for(const data of candidates){
    const r=await sb.from(table).update(data).match(filter).select("*").maybeSingle();
    if(!r.error)return r.data;
  }
  return null;
}
function pick(o,...keys){for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return o[k];return null}
function profileId(p){return pick(p,"id","user_id")}
function mediaUrl(m){return pick(m,"url","media_url","file_url","storage_url","path")}
function mediaType(m){return String(pick(m,"media_type","type","mime_type","content_type")||"").toLowerCase()}
function authorOf(row){return row?.profiles||row?.profile||null}

async function getProfile(uid){
  let d=await safeQuery(()=>sb.from("profiles").select("*").eq("id",uid).maybeSingle(),true);
  if(!d)d=await safeQuery(()=>sb.from("profiles").select("*").eq("user_id",uid).maybeSingle(),true);
  return d;
}
async function ensureProfile(){
  if(!state.user)return;
  let p=await getProfile(state.user.id);
  if(!p){
    const username=state.user.email?.split("@")[0].replace(/[^a-zA-Z0-9_]/g,"").slice(0,22)||("nova_"+state.user.id.slice(0,8));
    p=await tryInsert("profiles",[
      {id:state.user.id,username,display_name:username},
      {user_id:state.user.id,username,display_name:username}
    ]);
  }
  state.profile=p||{id:state.user.id,username:state.user.email?.split("@")[0],display_name:state.user.email?.split("@")[0]};
}

function showApp(on){$("auth").style.display=on?"none":"grid";$("app").style.display=on?"block":"none"}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){state.user=session.user;await ensureProfile();showApp(true);await startApp()}
  else showApp(false);
  sb.auth.onAuthStateChange(async(_e,s)=>{
    if(s?.user){state.user=s.user;await ensureProfile();showApp(true);await startApp()}
    else{state.user=null;state.profile=null;showApp(false)}
  });
}
async function startApp(){
  renderProfile();
  await Promise.all([loadFeed(),loadStories(),loadUnread(),updatePresence()]);
  subscribeGlobal();
}
function nav(view){
  if(view==="chat"){openChats();return}
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  const x=$(view);if(x)x.classList.add("active");
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  $("createBtn").style.display=view==="homeView"?"grid":"none";
  if(view==="profileView")renderProfile();
  if(view==="notificationsView")loadNotifications();
}
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=()=>nav(b.dataset.view));
$("searchBtn").onclick=()=>nav("searchView");
$("notifBtn").onclick=()=>nav("notificationsView");
$("topBack").onclick=()=>nav("homeView");

$("loginTab").onclick=()=>setAuthMode("login");$("registerTab").onclick=()=>setAuthMode("register");
function setAuthMode(m){state.authMode=m;$("loginTab").classList.toggle("active",m==="login");$("registerTab").classList.toggle("active",m==="register");$("registerFields").style.display=m==="register"?"block":"none";$("authSubmit").textContent=m==="register"?"Create account":"Login";$("authMessage").textContent=""}
$("authForm").onsubmit=async e=>{
  e.preventDefault();$("authSubmit").disabled=true;$("authMessage").textContent="Working…";
  try{
    const email=$("email").value.trim(),password=$("password").value;
    if(state.authMode==="login"){
      const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;
    }else{
      const username=$("username").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
      const display_name=$("displayName").value.trim()||username;
      if(!username)throw new Error("Username is required");
      const {data,error}=await sb.auth.signUp({email,password});if(error)throw error;
      if(data.user)await tryInsert("profiles",[{id:data.user.id,username,display_name},{user_id:data.user.id,username,display_name}]);
      $("authMessage").textContent=data.session?"Account created.":"Account created. Check your email if confirmation is enabled.";
    }
  }catch(e){$("authMessage").textContent=e.message||"Authentication failed"}
  finally{$("authSubmit").disabled=false}
};

async function loadFeed(){
  $("feed").innerHTML='<div class="loading">Loading NOVA feed…</div>';
  let data=await safeQuery(()=>sb.from("posts").select("*,profiles(*)").order("created_at",{ascending:false}).limit(50));
  if(!data)data=await safeQuery(()=>sb.from("posts").select("*").order("created_at",{ascending:false}).limit(50));
  state.posts=data||[];
  if(!state.posts.length){$("feed").innerHTML='<div class="empty"><h3>Your NOVA feed is quiet</h3><div>Follow people or create the first post.</div></div>';return}
  $("feed").innerHTML=state.posts.map(renderPost).join("");
  await hydratePostMediaAndReactions();
}
function renderPost(p){
  const a=authorOf(p)||p.author||null, id=pick(p,"id","post_id"), own=profileId(a)===state.user.id||p.user_id===state.user.id||p.author_id===state.user.id;
  return `<article class="card post" data-post="${esc(id)}">
    <div class="posthead row gap12"><button class="userOpen" data-user="${esc(profileId(a)||pick(p,"user_id","author_id")||"")}">${avatarHTML(a,"avatar sm")}</button>
    <div class="grow"><button class="userOpen name" data-user="${esc(profileId(a)||pick(p,"user_id","author_id")||"")}">${esc(a?.display_name||a?.username||"NOVA user")}${verifiedHTML(a)}</button><div class="tiny muted">${esc(a?.username?"@"+a.username:"")} · ${timeAgo(p.created_at||p.inserted_at)}</div></div>
    <button class="iconbtn postMenu" data-id="${esc(id)}"><svg class="icon"><use href="#i-more"/></svg></button></div>
    <div class="postbody">${esc(p.caption||p.content||p.text||"")}</div><div class="postMediaSlot"></div>
    <div class="actions"><button class="action reactBtn" data-id="${esc(id)}">❤️ <span class="reactionCount">0</span></button><button class="action commentBtn" data-id="${esc(id)}"><svg class="icon"><use href="#i-comment"/></svg><span>Comment</span></button><button class="action shareBtn" data-id="${esc(id)}"><svg class="icon"><use href="#i-share"/></svg><span>Share</span></button></div>
  </article>`;
}
async function hydratePostMediaAndReactions(){
  for(const p of state.posts){
    const id=pick(p,"id","post_id");const el=document.querySelector(`[data-post="${CSS.escape(String(id))}"]`);if(!el)continue;
    let media=await safeQuery(()=>sb.from("post_media").select("*").eq("post_id",id).order("created_at",{ascending:true}),true);
    const slot=el.querySelector(".postMediaSlot");
    if(media?.length){
      slot.innerHTML=`<div class="mediaGrid ${media.length===2?"n2":media.length>=3?"n3":""}">${media.map(m=>renderMedia(m,"post")).join("")}</div>`;
    }else if(p.media_url||p.image_url||p.video_url){
      slot.innerHTML=renderMedia({url:p.media_url||p.image_url||p.video_url,type:p.video_url?"video":"image"},"post");
    }
    const rx=await safeQuery(()=>sb.from("reactions").select("*").eq("post_id",id),true);
    if(rx)el.querySelector(".reactionCount").textContent=rx.length;
    if(rx?.some(r=>pick(r,"user_id","profile_id","author_id")===state.user.id))el.querySelector(".reactBtn").classList.add("active");
  }
  bindPostEvents();
}
function renderMedia(m,kind){const u=mediaUrl(m);if(!u)return"";const t=mediaType(m);const video=t.includes("video")||/\.(mp4|mov|webm|m4v)(\?|$)/i.test(u);return video?`<video class="postmedia" src="${esc(u)}" controls playsinline preload="metadata" data-lightbox="${esc(u)}"></video>`:`<img class="postmedia" src="${esc(u)}" loading="lazy" alt="" data-lightbox="${esc(u)}">`}
function bindPostEvents(){
  document.querySelectorAll(".userOpen").forEach(b=>b.onclick=()=>openProfile(b.dataset.user));
  document.querySelectorAll(".reactBtn").forEach(b=>b.onclick=()=>togglePostReaction(b.dataset.id,b));
  document.querySelectorAll(".commentBtn").forEach(b=>b.onclick=()=>openComments(b.dataset.id));
  document.querySelectorAll(".shareBtn").forEach(b=>b.onclick=async()=>{try{await navigator.share({title:"NOVA Social",text:"Check this NOVA post"});}catch(_){toast("Share cancelled")}})
  document.querySelectorAll(".postMenu").forEach(b=>b.onclick=()=>postMenu(b.dataset.id));
  document.querySelectorAll("[data-lightbox]").forEach(x=>x.onclick=()=>openLightbox(x.dataset.lightbox,x.tagName==="VIDEO"));
}
async function togglePostReaction(id,btn){
  const existing=await safeQuery(()=>sb.from("reactions").select("*").eq("post_id",id).eq("user_id",state.user.id).maybeSingle(),true);
  if(existing){await sb.from("reactions").delete().eq("id",existing.id)}
  else{const r=await tryInsert("reactions",[{post_id:id,user_id:state.user.id,type:"like"},{post_id:id,user_id:state.user.id,reaction:"❤️"},{post_id:id,user_id:state.user.id,emoji:"❤️"}]);if(!r)toast("Failed to react")}
  await hydratePostMediaAndReactions();
}
async function postMenu(id){
  const p=state.posts.find(x=>String(pick(x,"id","post_id"))===String(id));const own=p&&(p.user_id===state.user.id||p.author_id===state.user.id||profileId(authorOf(p))===state.user.id);
  openModal(`<h3>Post</h3><div class="formgrid">${own?`<button class="secondary danger" id="deletePost">Delete post</button>`:""}<button class="secondary" id="reportPost">Report post</button><button class="secondary" id="closeM">Cancel</button></div>`);
  $("closeM").onclick=closeModal;$("reportPost").onclick=()=>report("post",id);if(own)$("deletePost").onclick=async()=>{const {error}=await sb.from("posts").delete().eq("id",id);if(error)toast("Failed to delete post");else{closeModal();loadFeed()}};
}
async function report(type,target){
  closeModal();openModal(`<h3>Report</h3><p class="muted small">Tell us why you are reporting this ${type}.</p><textarea id="reportReason" class="textarea" style="min-height:110px" placeholder="Reason"></textarea><button id="sendReport" class="primary" style="width:100%;margin-top:10px">Submit report</button>`);
  $("sendReport").onclick=async()=>{const reason=$("reportReason").value.trim();const r=await tryInsert("reports",[{reporter_id:state.user.id,target_type:type,target_id:target,reason},{user_id:state.user.id,content_type:type,content_id:target,reason},{reporter_id:state.user.id,type,target_id:target,reason}]);if(!r)toast("Failed to submit report");else{closeModal();toast("Report submitted")}};
}

async function openComments(postId){
  let comments=await safeQuery(()=>sb.from("comments").select("*,profiles(*)").eq("post_id",postId).order("created_at",{ascending:true}),true);
  if(!comments)comments=[];
  openModal(`<h3>Comments</h3><div id="commentList">${comments.length?comments.map(c=>`<div class="userrow"><div class="grow"><div class="name">${esc(authorOf(c)?.display_name||authorOf(c)?.username||"User")}${verifiedHTML(authorOf(c))}</div><div class="small">${esc(c.content||c.text||"")}</div><div class="tiny muted">${timeAgo(c.created_at)}</div></div>${pick(c,"user_id","author_id")===state.user.id?`<button class="iconbtn delComment" data-id="${esc(c.id)}">×</button>`:""}</div>`).join(""):'<div class="empty">No comments yet.</div>'}</div><div class="row gap8" style="margin-top:10px"><input id="commentInput" class="input" placeholder="Write a comment"><button id="sendComment" class="primary">Send</button></div>`);
  $("sendComment").onclick=async()=>{const text=$("commentInput").value.trim();if(!text)return;const r=await tryInsert("comments",[{post_id:postId,user_id:state.user.id,content:text},{post_id:postId,author_id:state.user.id,content:text},{post_id:postId,user_id:state.user.id,text}]);if(!r)toast("Failed to add comment");else openComments(postId)};
  document.querySelectorAll(".delComment").forEach(b=>b.onclick=async()=>{await sb.from("comments").delete().eq("id",b.dataset.id);openComments(postId)});
}

$("createBtn").onclick=()=>openModal(`<h3>Create on NOVA</h3><div class="formgrid"><button class="secondary" id="newPost">Create post</button><button class="secondary" id="newStory">Create story</button></div>`);
document.addEventListener("click",e=>{
  if(e.target.id==="newPost"){closeModal();openPostComposer()}
  if(e.target.id==="newStory"){closeModal();$("storyFiles").click()}
});
function openPostComposer(){
  openModal(`<h3>Create post</h3><textarea id="postCaption" class="textarea" placeholder="What's happening?"></textarea><div class="row between" style="margin-top:10px"><button class="secondary" id="choosePost">Add photos/video</button><span id="postFileName" class="tiny muted">No media</span></div><button class="primary" id="publishPost" style="width:100%;margin-top:10px">Publish</button>`);
  $("choosePost").onclick=()=>$("postFiles").click();
  $("postFiles").onchange=()=>{$("postFileName").textContent=$("postFiles").files.length?`${$("postFiles").files.length} file(s) selected`:"No media"};
  $("publishPost").onclick=publishPost;
}
async function uploadFile(file,folder){
  const ext=(file.name.split(".").pop()||"bin").toLowerCase();const path=`${folder}/${state.user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw error;const {data}=sb.storage.from(BUCKET).getPublicUrl(path);return {url:data.publicUrl,path,type:file.type,name:file.name};
}
async function publishPost(){
  const caption=$("postCaption").value.trim(),files=[...$("postFiles").files];$("publishPost").disabled=true;
  try{
    const p=await tryInsert("posts",[
      {user_id:state.user.id,caption,created_at:iso()},
      {author_id:state.user.id,caption,created_at:iso()},
      {profile_id:state.user.id,content:caption,created_at:iso()},
      {user_id:state.user.id,content:caption,created_at:iso()}
    ]);
    if(!p)throw new Error("Failed to create post");
    for(const f of files){const u=await uploadFile(f,"posts");const r=await tryInsert("post_media",[{post_id:p.id,user_id:state.user.id,url:u.url,media_url:u.url,media_type:f.type},{post_id:p.id,url:u.url,type:f.type},{post_id:p.id,media_url:u.url,mime_type:f.type}]);if(!r)throw new Error("Post created, but media could not be saved")}
    closeModal();$("postFiles").value="";loadFeed();toast("Post published");
  }catch(e){toast(e.message||"Failed to publish post")}finally{$("publishPost").disabled=false}
}
$("storyFiles").onchange=async()=>{if(!$("storyFiles").files.length)return;openStoryComposer([...$("storyFiles").files])};
function openStoryComposer(files){
  openModal(`<h3>Create story</h3><p class="muted small">${files.length} item(s) selected. Stories expire according to the existing database rules.</p><button class="primary" id="publishStory" style="width:100%">Publish story</button>`);
  $("publishStory").onclick=async()=>{try{
    const s=await tryInsert("stories",[
      {user_id:state.user.id,created_at:iso()},
      {author_id:state.user.id,created_at:iso()},
      {profile_id:state.user.id,created_at:iso()}
    ]);if(!s)throw new Error("Failed to create story");
    for(const f of files){const u=await uploadFile(f,"stories");const r=await tryInsert("story_media",[{story_id:s.id,user_id:state.user.id,url:u.url,media_url:u.url,media_type:f.type},{story_id:s.id,url:u.url,type:f.type},{story_id:s.id,media_url:u.url,mime_type:f.type}]);if(!r)throw new Error("Story created, but media could not be saved")}
    closeModal();$("storyFiles").value="";loadStories();toast("Story published");
  }catch(e){toast(e.message||"Failed to publish story")}};
}
async function loadStories(){
  let data=await safeQuery(()=>sb.from("stories").select("*,profiles(*)").order("created_at",{ascending:false}).limit(100),true);
  if(!data)data=await safeQuery(()=>sb.from("stories").select("*").order("created_at",{ascending:false}).limit(100),true);
  const groups=new Map();
  for(const s of data||[]){
    const expires=pick(s,"expires_at","expires_on");if(expires&&new Date(expires)<=new Date())continue;
    const uid=pick(s,"user_id","author_id","profile_id");if(!uid)continue;
    if(!groups.has(uid))groups.set(uid,{owner:authorOf(s)||null,items:[]});groups.get(uid).items.push(s);
  }
  state.stories=[...groups.values()];
  const bar=$("storyBar");bar.innerHTML=`<div class="storyitem" id="myStory"><div class="storyring"><div>${avatarHTML(state.profile)}</div></div><div style="margin-top:4px;color:#fff">Your story</div></div>`+
    state.stories.map((g,i)=>`<div class="storyitem storyOpen" data-index="${i}"><div class="storyring"><div>${avatarHTML(g.owner)}</div></div><div style="margin-top:4px">${esc(g.owner?.username||g.owner?.display_name||"User")}</div></div>`).join("");
  $("myStory").onclick=()=>{const g=state.stories.find(x=>profileId(x.owner)===state.user.id);if(g){state.activeStory=g;state.storyIndex=0;showStory()}else $("storyFiles").click()};
  document.querySelectorAll(".storyOpen").forEach(x=>x.onclick=()=>{state.activeStory=state.stories[+x.dataset.index];state.storyIndex=0;showStory()});
}
async function getStoryMedia(story){
  let m=await safeQuery(()=>sb.from("story_media").select("*").eq("story_id",pick(story,"id","story_id")).order("created_at",{ascending:true}),true);
  return m||[];
}
async function showStory(){
  if(!state.activeStory)return;
  const items=[];for(const s of state.activeStory.items)items.push(...await getStoryMedia(s));
  state.activeStory._media=items;if(!items.length){toast("This story has no available media");return}
  if(state.storyIndex>=items.length)state.storyIndex=0;
  $("storyOverlay").classList.add("open");$("storyPaused").textContent="";
  renderStoryItem();trackStoryView(items[state.storyIndex]);
}
async function renderStoryItem(){
  const items=state.activeStory._media,i=state.storyIndex,m=items[i],u=mediaUrl(m),video=mediaType(m).includes("video")||/\.(mp4|mov|webm|m4v)(\?|$)/i.test(u);
  $("storyProgress").innerHTML=items.map((_,j)=>`<div class="progress"><i style="width:${j<i?"100%":"0"}"></i></div>`).join("");
  $("storyOwner").innerHTML=avatarHTML(state.activeStory.owner,"avatar sm")+`<div><div class="name">${esc(state.activeStory.owner?.display_name||"User")}${verifiedHTML(state.activeStory.owner)}</div><div class="tiny muted">${timeAgo(state.activeStory.items[0]?.created_at)}</div></div>`;
  $("storyMedia").innerHTML=video?`<video id="storyVideo" src="${esc(u)}" autoplay playsinline></video>`:`<img id="storyImage" src="${esc(u)}" alt="">`;
  $("storyActions").innerHTML=["❤️","😂","😮","😢","😡","👍"].map(x=>`<button class="circle storyReact" data-r="${x}">${x}</button>`).join("");
  document.querySelectorAll(".storyReact").forEach(b=>b.onclick=()=>reactStory(m,b.dataset.r));
  clearTimeout(state.storyTimer);
  const bar=$("storyProgress").children[i]?.firstElementChild;
  if(video){const v=$("storyVideo");v.onloadedmetadata=()=>{v.onended=nextStory};v.onplay=()=>animateStory(bar,v.duration*1000);v.onpause=()=>{}}
  else{animateStory(bar,5000)}
}
function animateStory(bar,dur){if(state.storyPaused)return;requestAnimationFrame(()=>{bar.style.transition=`width ${dur}ms linear`;bar.style.width="100%"});state.storyTimer=setTimeout(nextStory,dur)}
function nextStory(){if(state.storyPaused)return;const max=state.activeStory._media.length;if(state.storyIndex<max-1){state.storyIndex++;renderStoryItem();trackStoryView(state.activeStory._media[state.storyIndex])}else closeStory()}
function prevStory(){if(state.storyIndex>0){state.storyIndex--;renderStoryItem()}else closeStory()}
function closeStory(){clearTimeout(state.storyTimer);$("storyOverlay").classList.remove("open");$("storyMedia").innerHTML=""}
$("storyNext").onclick=nextStory;$("storyPrev").onclick=prevStory;$("storyClose").onclick=closeStory;
let touchY=0;$("storyOverlay").addEventListener("touchstart",e=>touchY=e.touches[0].clientY,{passive:true});$("storyOverlay").addEventListener("touchend",e=>{const dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dy)>55){if(dy<0)nextStory();else prevStory()}},{passive:true});
$("storyOverlay").addEventListener("click",e=>{if(e.target.id==="storyMedia"||e.target.id==="storyImage"||e.target.id==="storyVideo"){state.storyPaused=!state.storyPaused;const v=$("storyVideo");if(v){state.storyPaused?v.pause():v.play().catch(()=>{})}else if(!state.storyPaused)renderStoryItem()}});
async function trackStoryView(m){const sid=pick(m,"story_id");if(!sid)return;await tryInsert("story_views",[{story_id:sid,user_id:state.user.id,viewed_at:iso()},{story_id:sid,viewer_id:state.user.id,created_at:iso()}])}
async function reactStory(m,r){const sid=pick(m,"story_id");const old=await safeQuery(()=>sb.from("story_reactions").select("*").eq("story_id",sid).eq("user_id",state.user.id).maybeSingle(),true);if(old)await sb.from("story_reactions").delete().eq("id",old.id);else await tryInsert("story_reactions",[{story_id:sid,user_id:state.user.id,reaction:r},{story_id:sid,user_id:state.user.id,emoji:r}]);toast("Reaction sent")}
$("storySend").onclick=async()=>{const text=$("storyReply").value.trim(),m=state.activeStory?._media?.[state.storyIndex];if(!text||!m)return;const sid=pick(m,"story_id");const r=await tryInsert("story_replies",[{story_id:sid,user_id:state.user.id,content:text},{story_id:sid,sender_id:state.user.id,message:text}]);if(!r)toast("Failed to send reply");else{$("storyReply").value="";toast("Reply sent")}};

async function openProfile(uid){
  if(!uid)return;nav("profileView");$("profileView").innerHTML='<div class="loading">Loading profile…</div>';
  const p=await getProfile(uid);if(!p){$("profileView").innerHTML='<div class="empty"><h3>Profile unavailable</h3></div>';return}
  state.viewedProfile=p;
  const followers=await safeQuery(()=>sb.from("follows").select("*").eq("following_id",uid),true)||[];
  const following=await safeQuery(()=>sb.from("follows").select("*").eq("follower_id",uid),true)||[];
  const posts=await safeQuery(()=>sb.from("posts").select("*").or(`user_id.eq.${uid},author_id.eq.${uid}`).order("created_at",{ascending:false}),true)||[];
  const followingMe=!!(await safeQuery(()=>sb.from("follows").select("*").eq("follower_id",state.user.id).eq("following_id",uid).maybeSingle(),true));

  const stories=await safeQuery(()=>sb.from("stories").select("*"),true)||[];
  const reports=await safeQuery(()=>sb.from("reports").select("*").order("created_at",{ascending:false}),true)||[];
  $("ownerView").innerHTML=`<div class="row between"><h2>Owner Dashboard</h2><button class="secondary" id="ownerHome">Home</button></div><div class="adminGrid"><div class="adminStat"><b>${users.length}</b><div class="tiny muted">Users</div></div><div class="adminStat"><b>${posts.length}</b><div class="tiny muted">Posts</div></div><div class="adminStat"><b>${stories.length}</b><div class="tiny muted">Stories</div></div><div class="adminStat"><b>${reports.length}</b><div class="tiny muted">Reports</div></div></div><div class="searchbox" style="margin-top:12px"><svg class="icon"><use href="#i-search"/></svg><input id="adminSearch" placeholder="Search users"></div><div id="adminUsers" class="card"></div><h3>Reports</h3><div class="card">${reports.length?reports.map(r=>`<div class="report"><b>${esc(r.type||r.target_type||"Report")}</b><div class="small">${esc(r.reason||r.content||"")}</div><div class="tiny muted">${timeAgo(r.created_at)}</div></div>`).join(""):'<div class="empty">No reports.</div>'}</div>`;
  $("ownerHome").onclick=()=>nav("homeView");const renderUsers=q=>{$("adminUsers").innerHTML=users.filter(p=>!q||(p.username||"").toLowerCase().includes(q)||(p.display_name||"").toLowerCase().includes(q)).map(p=>`<div class="userrow"><div class="grow">${avatarHTML(p,"avatar sm")} <span class="name">${esc(p.display_name||p.username)}${verifiedHTML(p)}</span><div class="tiny muted">@${esc(p.username||"")}</div></div><button class="secondary adminVerify" data-id="${esc(profileId(p))}" data-v="${p.verified?"0":"1"}">${p.verified?"Unverify":"Verify"}</button><button class="secondary adminDisable" data-id="${esc(profileId(p))}">Disable</button></div>`).join("")||'<div class="empty">No users.</div>';bindAdmin()};
  renderUsers("");$("adminSearch").oninput=()=>renderUsers($("adminSearch").value.toLowerCase());
}
function bindAdmin(){
  document.querySelectorAll(".adminVerify").forEach(b=>b.onclick=async()=>{const uid=b.dataset.id;if(uid===OWNER_ID){toast("Owner remains protected");return}let r=await sb.from("profiles").update({verified:b.dataset.v==="1"}).eq("id",uid);if(r.error)r=await sb.from("profiles").update({is_verified:b.dataset.v==="1"}).eq("id",uid);if(r.error)toast("Failed to update verification");else renderOwner()});
  document.querySelectorAll(".adminDisable").forEach(b=>b.onclick=async()=>{if(b.dataset.id===OWNER_ID){toast("Owner remains protected");return}let r=await sb.from("profiles").update({disabled:true}).eq("id",b.dataset.id);if(r.error)r=await sb.from("profiles").update({is_disabled:true}).eq("id",b.dataset.id);if(r.error)toast("Disable failed: database permissions/columns may restrict this action");else renderOwner()});
}
$("chatMore").onclick=()=>openModal(`<h3>Conversation</h3><div class="formgrid"><button class="secondary" id="chatProfile">View profile</button><button class="secondary" id="chatClose">Cancel</button></div>`);document.addEventListener("click",e=>{if(e.target.id==="chatProfile"){closeModal();openProfile(profileId(state.chatUser))}if(e.target.id==="chatClose")closeModal()});

boot();
})();
</script>
</body>
</html>
