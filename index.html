<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA Social</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.app{max-width:680px;margin:auto;min-height:100vh;background:#000;border-left:1px solid #181818;border-right:1px solid #181818;padding-bottom:62px}
header{height:58px;border-bottom:1px solid #262626;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;background:#000;z-index:10}header .brand{font-size:24px;font-weight:700;letter-spacing:-1px}button{border:0;background:none;color:inherit;cursor:pointer}.icon{width:25px;height:25px;display:block}.icon.sm{width:21px;height:21px}.icon path,.icon circle,.icon line,.icon polyline,.icon rect{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.page{display:none}.page.active{display:block}.empty{padding:70px 24px;text-align:center;color:#aaa}.stories{display:flex;gap:14px;padding:14px 12px;overflow-x:auto;border-bottom:1px solid #171717}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 68px;text-align:center;font-size:11px;color:#ddd}.story-ring{width:62px;height:62px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);margin:auto auto 5px}.story-ring span{display:flex;width:100%;height:100%;border-radius:50%;background:#111;align-items:center;justify-content:center;border:2px solid #000;font-weight:600}.post{border-bottom:1px solid #262626}.post-head{height:52px;display:flex;align-items:center;padding:0 13px;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#242424;display:grid;place-items:center;font-weight:700;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.post-user{font-size:14px;font-weight:650}.post-media{width:100%;aspect-ratio:1/1;background:#111;object-fit:cover;display:block}.post-body{padding:9px 13px 14px}.actions{display:flex;align-items:center;gap:15px;margin-bottom:8px}.actions .push{margin-left:auto}.likes{font-size:14px;font-weight:650;margin-bottom:7px}.caption{font-size:14px;line-height:1.35}.caption b{margin-right:5px}.time{font-size:11px;color:#777;margin-top:8px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);height:62px;background:#000;border-top:1px solid #262626;display:flex;align-items:center;justify-content:space-around;z-index:20}.nav{width:25%;height:100%;display:grid;place-items:center;color:#eee}.nav.active{color:#fff}.nav.active .icon{stroke-width:2.4}
.profile-top{padding:22px 18px 12px}.profile-row{display:flex;gap:22px;align-items:center}.profile-avatar{width:86px;height:86px;border-radius:50%;background:#222;display:grid;place-items:center;font-size:30px;font-weight:700;overflow:hidden}.profile-avatar img{width:100%;height:100%;object-fit:cover}.profile-stats{display:flex;justify-content:space-between;flex:1;text-align:center}.stat strong{display:block;font-size:17px}.stat span{font-size:12px;color:#aaa}.profile-name{margin-top:14px;font-weight:700}.profile-bio{font-size:14px;color:#ccc;margin-top:4px}.profile-actions{display:flex;gap:8px;margin-top:14px}.profile-actions button{flex:1;border:1px solid #363636;border-radius:8px;height:34px;font-weight:650;background:#171717}
.messages-head{height:58px;padding:0 16px;border-bottom:1px solid #262626;display:flex;align-items:center;justify-content:space-between}.messages-head h2{font-size:20px;margin:0}.searchbox{margin:12px;background:#1b1b1b;border-radius:10px;height:38px;display:flex;align-items:center;padding:0 11px;color:#888;gap:8px}.user-list{padding:0 8px}.user-row{display:flex;align-items:center;gap:12px;padding:10px 8px}.user-row .avatar{width:54px;height:54px}.user-info{flex:1}.user-info strong{font-size:14px}.user-info small{display:block;color:#888;margin-top:3px}.chat{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}.chat.open{display:flex}.chat-head{height:58px;border-bottom:1px solid #262626;display:flex;align-items:center;padding:0 12px;gap:12px}.chat-head .user-title{flex:1}.chat-head strong{display:block;font-size:15px}.chat-head small{color:#777}.chat-body{flex:1;overflow:auto;padding:16px}.bubble-row{display:flex;margin:7px 0}.bubble-row.me{justify-content:flex-end}.bubble{max-width:75%;padding:9px 12px;border-radius:18px;background:#262626;font-size:14px;line-height:1.35}.me .bubble{background:#3797f0}.chat-input{padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;border-top:1px solid #222}.chat-input input{flex:1;border:1px solid #333;background:#151515;color:#fff;border-radius:22px;padding:11px 15px;outline:none}.send{width:44px;height:44px;border-radius:50%;background:#3797f0;display:grid;place-items:center}
.auth{min-height:100vh;display:grid;place-items:center;padding:25px}.auth-card{width:min(380px,100%);text-align:center}.auth-brand{font-size:42px;font-weight:800;letter-spacing:-2px;margin-bottom:35px}.auth-card input{display:block;width:100%;height:46px;margin:8px 0;background:#121212;border:1px solid #333;border-radius:7px;color:#fff;padding:0 12px}.primary{width:100%;height:44px;background:#3797f0;border-radius:8px;color:#fff;font-weight:700;margin-top:8px}.switch{margin-top:22px;color:#aaa;font-size:13px}.switch button{color:#3797f0;font-weight:700}.hidden{display:none!important}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card">
    <div class="auth-brand">NOVA</div>
    <form id="authForm">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" minlength="8" required>
      <input id="username" class="hidden" type="text" placeholder="Username" maxlength="30">
      <button class="primary" id="authBtn">Log in</button>
    </form>
    <div class="switch"><span id="switchText">Don't have an account?</span> <button id="switchBtn" type="button">Sign up</button></div>
    <div id="authMsg" style="margin-top:14px;color:#f66;font-size:13px"></div>
  </div>
</div>

<div id="app" class="app hidden">
<header><div class="brand">NOVA</div><button id="headerAction" aria-label="Messages"><svg class="icon" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4.2-1.1L3.5 20.5l1.1-4.3A8.5 8.5 0 1 1 20.5 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></button></header>

<main id="home" class="page active">
  <div class="stories" id="stories"></div>
  <div id="feed"></div>
</main>
<main id="search" class="page"><div class="searchbox"><svg class="icon sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><span>Search</span></div><div id="searchResults" class="user-list"></div></main>
<main id="create" class="page"><div class="empty"><h2>Create</h2><p>Post creation will connect to Appwrite here.</p></div></main>
<main id="profile" class="page">
  <div class="profile-top"><div class="profile-row"><div class="profile-avatar" id="profileAvatar">N</div><div class="profile-stats"><div class="stat"><strong id="postCount">0</strong><span>Posts</span></div><div class="stat"><strong id="followers">0</strong><span>Followers</span></div><div class="stat"><strong id="following">0</strong><span>Following</span></div></div></div><div class="profile-name" id="profileName">NOVA User</div><div class="profile-bio" id="profileBio"></div><div class="profile-actions"><button>Edit profile</button><button>Share profile</button></div></div><div id="profilePosts"></div>
</main>
<main id="messages" class="page"><div class="messages-head"><h2>Messages</h2><button aria-label="New message"><svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div><div class="searchbox"><svg class="icon sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><span>Search</span></div><div id="messageUsers" class="user-list"></div></main>

<nav class="bottom">
<button class="nav active" data-page="home" aria-label="Home"><svg class="icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg></button>
<button class="nav" data-page="search" aria-label="Search"><svg class="icon" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><line x1="16" y1="16" x2="21" y2="21"/></svg></button>
<button class="nav" data-page="create" aria-label="Create"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></button>
<button class="nav" data-page="messages" aria-label="Messages"><svg class="icon" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4.2-1.1L3.5 20.5l1.1-4.3A8.5 8.5 0 1 1 20.5 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></button>
<button class="nav" data-page="profile" aria-label="Profile"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
</nav>
</div>

<div id="chat" class="chat">
 <div class="chat-head"><button id="closeChat" aria-label="Back"><svg class="icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><div class="avatar" id="chatAvatar">N</div><div class="user-title"><strong id="chatName">User</strong><small>Messages</small></div><button aria-label="Info"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></div>
 <div id="chatBody" class="chat-body"></div>
 <form id="chatForm" class="chat-input"><input id="chatInput" autocomplete="off" placeholder="Message..."><button class="send" aria-label="Send"><svg class="icon sm" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></form>
</div>

<script type="module">
/*
 NOVA Social — clean Appwrite foundation.
 The Appwrite Web SDK is loaded dynamically below.
 IDs already supplied:
 project: 6aa242bf00012f890e92
 database: 6aa41332002b049743d5
 bucket: 6aa421b20025a1b4aac8
 Table IDs are the names supplied by the project.
*/
const CFG={
 endpoint:"https://cloud.appwrite.io/v1",
 projectId:"6aa242bf00012f890e92",
 databaseId:"6aa41332002b049743d5",
 bucketId:"6aa421b20025a1b4aac8",
 tables:{
  profiles:"profiles",posts:"posts",conversations:"conversations",conversation_members:"conversation_members",
  messages:"messages",message_reactions:"message_reactions",comments:"comments",reactions:"reactions",follows:"follows",
  notifications:"notifications",stories:"stories",story_views:"story_views",story_reactions:"story_reactions",
  story_replies:"story_replies",user_presence:"user_presence",reports:"reports"
 }
};

let sdk, account, databases, storage, realtime;
let currentUser=null, users=[], activeChatUser=null, messages=[];
let activeConversationId=null, realtimeUnsubscribe=null;
let signup=false;

const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function initials(name){return (name||"N").trim().slice(0,1).toUpperCase()}
function avatarHTML(u,cls="avatar"){return `<div class="${cls}">${u?.avatar?`<img src="${esc(u.avatar)}" alt="">`:esc(initials(u?.displayName||u?.username))}</div>`}

async function loadSDK(){
 const m=await import("https://cdn.jsdelivr.net/npm/appwrite@21.0.0/+esm");
 sdk=m; const client=new m.Client().setEndpoint(CFG.endpoint).setProject(CFG.projectId);
 account=new m.Account(client);
 databases=new m.Databases(client);
 storage=new m.Storage(client);
 realtime=new m.Realtime(client);
}

async function getSession(){
 try{const s=await account.get();currentUser=s;return true}catch{return false}
}
async function loadUsers(){
 try{
  const r=await databases.listDocuments(CFG.databaseId,CFG.tables.profiles,[]);
  users=r.documents;
 }catch(e){console.warn("profiles read:",e.message);users=[]}
 renderUsers(); renderMessages(); renderSearch(); renderFeed();
}
function normalize(u){return {id:u.$id,userId:u.userId,username:u.username||"user",displayName:u.displayName||u.username||"NOVA User",avatar:u.avatar||"",bio:u.bio||""}}
function renderUsers(){
 users=users.map(normalize);
 const others=users.filter(u=>u.userId!==currentUser?.$id);
 $("messageUsers").innerHTML=others.length?others.map(u=>`<button class="user-row" data-user="${esc(u.userId)}">${avatarHTML(u)}<div class="user-info"><strong>${esc(u.displayName)}</strong><small>@${esc(u.username)}</small></div><svg class="icon sm" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>`).join(""):`<div class="empty">No other registered users yet.</div>`;
 $("messageUsers").querySelectorAll(".user-row").forEach(b=>b.onclick=()=>openChat(users.find(u=>u.userId===b.dataset.user)));
}
function renderSearch(){
 const others=users.filter(u=>u.userId!==currentUser?.$id);
 $("searchResults").innerHTML=others.map(u=>`<button class="user-row" data-user="${esc(u.userId)}">${avatarHTML(u)}<div class="user-info"><strong>${esc(u.displayName)}</strong><small>@${esc(u.username)}</small></div></button>`).join("")||`<div class="empty">No users yet.</div>`;
 $("searchResults").querySelectorAll(".user-row").forEach(b=>b.onclick=()=>openChat(users.find(u=>u.userId===b.dataset.user)));
}
function renderMessages(){/* all registered profiles are intentionally shown in Messages */}
function renderFeed(){
 $("stories").innerHTML=`<div class="story"><div class="story-ring"><span>${initials(currentUser?.name)}</span></div>Your story</div>`;
 $("feed").innerHTML=`<div class="empty"><h3>Welcome to NOVA</h3><p>Your real Appwrite feed will appear here.</p></div>`;
}
function setPage(p){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 $(p).classList.add("active");
 document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("active",x.dataset.page===p));
}
async function ensureProfile(){
 try{
  const r=await databases.listDocuments(CFG.databaseId,CFG.tables.profiles,[]);
  const found=r.documents.find(x=>x.userId===currentUser.$id);
  if(!found){
   const uname=(currentUser.name||currentUser.email.split("@")[0]).replace(/[^a-zA-Z0-9_]/g,"").slice(0,30)||"novauser";
   await databases.createDocument(CFG.databaseId,CFG.tables.profiles,sdk.ID.unique(),{
    userId:currentUser.$id,username:uname,displayName:currentUser.name||uname,email:currentUser.email,verified:false,createdAt:new Date().toISOString()
   });
  }
 }catch(e){console.warn("profile:",e.message)}
}
async function login(){
 $("authMsg").textContent="";
 try{
  await account.createEmailPasswordSession($("email").value.trim(),$("password").value);
  await boot();
 }catch(e){$("authMsg").textContent=e.message}
}
async function register(){
 $("authMsg").textContent="";
 try{
  const email=$("email").value.trim(),pass=$("password").value,uname=$("username").value.trim();
  await account.create(sdk.ID.unique(),email,pass,uname||email.split("@")[0]);
  await account.createEmailPasswordSession(email,pass);
  await boot();
 }catch(e){$("authMsg").textContent=e.message}
}
async function boot(){
 currentUser=await account.get();
 $("auth").classList.add("hidden");$("app").classList.remove("hidden");
 await ensureProfile();await loadUsers();
 const me=users.find(u=>u.userId===currentUser.$id);
 if(me){$("profileName").textContent=me.displayName;$("profileBio").textContent=me.bio||"";$("profileAvatar").innerHTML=me.avatar?`<img src="${esc(me.avatar)}" alt="">`:esc(initials(me.displayName))}
}
function conversationIdFor(a,b){
 const x=[String(a),String(b)].sort().join(":");
 let h=2166136261;
 for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619)}
 return "conv_"+(h>>>0).toString(16).padStart(8,"0");
}
async function ensureConversation(otherUserId){
 const cid=conversationIdFor(currentUser.$id,otherUserId);
 try{
  await databases.createDocument(CFG.databaseId,CFG.tables.conversations,cid,{
   createdAt:new Date().toISOString(),type:"direct",lastMessage:"",lastMessageAt:""
  });
 }catch(e){
  if(!String(e.message||"").toLowerCase().includes("already exists") && !String(e.code||"").includes("409")) console.warn("conversation:",e.message);
 }
 for(const uid of [currentUser.$id,otherUserId]){
  const memberId=conversationIdFor(cid,uid);
  try{
   await databases.createDocument(CFG.databaseId,CFG.tables.conversation_members,memberId,{
    conversationId:cid,userId:uid,joinedAt:new Date().toISOString(),isAdmin:uid===currentUser.$id
   });
  }catch(e){
   if(!String(e.message||"").toLowerCase().includes("already exists") && !String(e.code||"").includes("409")) console.warn("member:",e.message);
  }
 }
 return cid;
}
function renderChatMessages(){
 const body=$("chatBody");
 if(!messages.length){body.innerHTML=`<div class="empty">Start a conversation with ${esc(activeChatUser.displayName)}.</div>`;return}
 body.innerHTML=messages.map(m=>{
  const mine=m.senderId===currentUser.$id;
  return `<div class="bubble-row ${mine?"me":""}"><div class="bubble">${esc(m.content||"")}</div></div>`;
 }).join("");
 body.scrollTop=body.scrollHeight;
}
async function loadConversationMessages(){
 activeConversationId=await ensureConversation(activeChatUser.userId);
 try{
  const r=await databases.listDocuments(CFG.databaseId,CFG.tables.messages,[
   sdk.Query.equal("conversationId",activeConversationId),
   sdk.Query.orderAsc("createdAt"),
   sdk.Query.limit(100)
  ]);
  messages=r.documents;
 }catch(e){
  console.warn("messages read:",e.message);
  messages=[];
 }
 renderChatMessages();
 subscribeToMessages();
}
function subscribeToMessages(){
 if(realtimeUnsubscribe)try{realtimeUnsubscribe()}catch{}
 try{
  realtimeUnsubscribe=realtime.subscribe(
   [`databases.${CFG.databaseId}.tables.${CFG.tables.messages}.documents`],
   event=>{
    const m=event.payload;
    if(!m || m.conversationId!==activeConversationId)return;
    const idx=messages.findIndex(x=>x.$id===m.$id);
    if(event.events.some(x=>x.includes(".delete"))){
      messages=messages.filter(x=>x.$id!==m.$id);
    }else if(idx>=0){
      messages[idx]=m;
    }else{
      messages.push(m);
      messages.sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
    }
    renderChatMessages();
   }
  );
 }catch(e){console.warn("realtime:",e.message)}
}
$("authForm").onsubmit=e=>{e.preventDefault();signup?register():login()};
$("switchBtn").onclick=()=>{signup=!signup;$("username").classList.toggle("hidden",!signup);$("authBtn").textContent=signup?"Sign up":"Log in";$("switchText").textContent=signup?"Already have an account?":"Don't have an account?";$("switchBtn").textContent=signup?"Log in":"Sign up";$("authMsg").textContent=""};
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
$("headerAction").onclick=()=>setPage("messages");
$("closeChat").onclick=()=>{
 $("chat").classList.remove("open");
 if(realtimeUnsubscribe){try{realtimeUnsubscribe()}catch{}realtimeUnsubscribe=null}
 activeConversationId=null;messages=[];
};
$("chatForm").onsubmit=async e=>{
 e.preventDefault();
 const v=$("chatInput").value.trim();
 if(!v||!activeChatUser||!currentUser)return;
 const btn=$("chatForm").querySelector(".send");
 btn.disabled=true;
 try{
  if(!activeConversationId)activeConversationId=await ensureConversation(activeChatUser.userId);
  await databases.createDocument(CFG.databaseId,CFG.tables.messages,sdk.ID.unique(),{
   conversationId:activeConversationId,
   senderId:currentUser.$id,
   content:v,
   media:"",
   mediaType:"",
   replyTo:"",
   createdAt:new Date().toISOString(),
   deleted:false
  });
  $("chatInput").value="";
 }catch(err){
  alert("Message could not be sent: "+err.message);
 }finally{btn.disabled=false}
};

(async()=>{try{await loadSDK();if(await getSession())await boot()}catch(e){$("authMsg").textContent="Appwrite connection error: "+e.message}})();
</script>
</body>
</html>
