<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>NOVA Social</title>
<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0"></script>
<style>
:root{--bg:#05070b;--panel:#0b0f16;--panel2:#111722;--line:#202735;--text:#f5f7fb;--muted:#98a2b3;--accent:#fff;--blue:#4f7cff;--danger:#ff496b;--radius:18px;--nav:66px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;min-height:100%;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}img,video{max-width:100%;display:block}
.app{min-height:100vh}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#182036 0,#080b11 38%,#05070b 72%)}
.auth-card{width:min(430px,100%);padding:30px 24px;border:1px solid var(--line);border-radius:28px;background:rgba(11,15,22,.92);box-shadow:0 30px 80px #0008}
.logo{font-size:38px;font-weight:800;letter-spacing:-2px;text-align:center;margin:4px 0 8px}.sub{text-align:center;color:var(--muted);margin:0 0 26px}
.field{display:flex;flex-direction:column;gap:8px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}.field input,.field textarea{width:100%;background:#151b25;border:1px solid #293140;border-radius:14px;padding:14px 15px;outline:none}.field input:focus,.field textarea:focus{border-color:#5a667b}
.primary{width:100%;padding:14px;border-radius:14px;background:#f7f8fb;color:#05070b;font-weight:750;margin-top:8px}.secondary{color:#aeb8c8;margin-top:14px;width:100%;padding:10px}.auth-error{min-height:20px;color:#ff718a;text-align:center;font-size:13px;margin-top:8px}
.shell{width:100%;min-height:100vh}.topbar{position:sticky;top:0;z-index:20;height:62px;background:rgba(5,7,11,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100vw - 680px)/2));}
.brand{font-weight:850;font-size:24px;letter-spacing:-1px}.top-actions{display:flex;gap:6px}.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}.icon-btn:active{background:#161c26}.icon{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.icon.fill{fill:currentColor;stroke:none}
.main{width:min(680px,100%);margin:0 auto;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 20px)}.page{min-height:calc(100vh - 62px)}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(5,7,11,.96);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:center}.nav-inner{width:min(680px,100%);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}.nav-item{height:100%;display:grid;place-items:center;position:relative;color:#dfe4ec}.nav-item.active{color:#fff}.nav-avatar{width:25px;height:25px;border-radius:50%;object-fit:cover;border:1px solid #667080}.dot{position:absolute;width:7px;height:7px;background:#ff304f;border-radius:50%;bottom:13px;right:calc(50% - 16px);border:1px solid var(--bg)}
.stories{padding:12px 10px 6px;display:flex;gap:13px;overflow:auto;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 66px;text-align:center;font-size:11px;color:#c7ced9}.story-ring{width:66px;height:66px;padding:2px;border-radius:50%;background:linear-gradient(135deg,#ffb300,#ff2e6a,#8247ff);margin:auto}.story-ring.seen{background:#3a424f}.story-ring>img{width:100%;height:100%;object-fit:cover;border:2px solid var(--bg);border-radius:50%}.story-add{position:relative}.story-add .plus{position:absolute;right:-1px;bottom:-1px;background:#fff;color:#05070b;border:3px solid var(--bg);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:800}
.post{border-top:1px solid rgba(255,255,255,.045);padding-bottom:10px}.post-head{height:56px;display:flex;align-items:center;gap:10px;padding:8px 12px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#202633}.post-meta{flex:1;min-width:0}.username{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{color:#8993a3;font-size:12px}.more{font-size:24px}.media-wrap{position:relative;background:#000}.post-media{width:100%;max-height:780px;object-fit:cover}.post-actions{display:flex;align-items:center;padding:8px 10px 3px;gap:4px}.post-actions .icon-btn{width:42px;height:42px}.save{margin-left:auto}.count-row{padding:0 14px;font-size:14px;font-weight:650}.caption{padding:5px 14px 0;line-height:1.4;font-size:14px}.caption b{margin-right:5px}.comments-link{padding:5px 14px;color:#8f98a7;font-size:14px}.create-bar{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.create-input{flex:1;background:#111722;border:1px solid #252d3a;border-radius:25px;padding:11px 14px;color:#8e98a8}
.compose{padding:16px;border-bottom:1px solid var(--line)}.compose textarea{width:100%;min-height:120px;background:transparent;border:0;outline:0;resize:none;font-size:17px}.compose-row{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}.compose-row .primary{width:auto;margin:0;padding:10px 17px;margin-left:auto}.media-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.media-preview>*{aspect-ratio:1;object-fit:cover;border-radius:10px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px}.section-title{font-size:21px;font-weight:800}.muted{color:var(--muted)}
.search-box{margin:10px 14px;background:#171d27;border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:center}.search-box input{border:0;outline:0;background:none;width:100%}.search-results{padding:0 14px}.user-row{display:flex;align-items:center;gap:12px;padding:11px 0}.user-row .info{flex:1}.user-row .follow{padding:8px 14px;border-radius:10px;background:#2a3341;font-weight:700}
.profile-head{padding:12px 14px 0}.profile-title{display:flex;align-items:center;justify-content:space-between}.profile-title .name{font-size:20px;font-weight:800}.profile-actions{display:flex;gap:8px}.profile-summary{display:flex;gap:18px;align-items:center;padding:18px 0}.profile-avatar{width:88px;height:88px;border-radius:50%;object-fit:cover}.stats{display:flex;justify-content:space-around;flex:1;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}.bio{font-size:14px;line-height:1.4}.profile-buttons{display:grid;grid-template-columns:1fr 1fr 44px;gap:7px;margin:14px 0}.profile-buttons button{background:#252d39;border-radius:9px;padding:10px;font-weight:700}.highlights{display:flex;gap:15px;overflow:auto;padding:4px 0 18px}.highlight{flex:0 0 72px;text-align:center;font-size:11px}.highlight img,.highlight .new{width:66px;height:66px;border-radius:50%;margin:auto;object-fit:cover;border:2px solid #303846}.highlight .new{display:grid;place-items:center;border-color:#333c4b;font-size:30px;font-weight:300}.tabs{height:48px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr)}.tabs button{display:grid;place-items:center;color:#8993a3}.tabs button.active{color:#fff;border-bottom:2px solid #fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid-item{aspect-ratio:1;background:#111;overflow:hidden;position:relative}.grid-item img,.grid-item video{width:100%;height:100%;object-fit:cover}.play-badge{position:absolute;right:7px;top:7px}
.activity-item{display:flex;gap:11px;padding:13px 14px;align-items:center}.activity-item .text{flex:1;font-size:14px;line-height:1.35}.activity-item .action{padding:8px 12px;background:#27303c;border-radius:9px;font-size:13px;font-weight:700}
.inbox-head{padding:8px 14px 4px}.inbox-title{display:flex;align-items:center;justify-content:space-between}.inbox-title h2{font-size:24px;margin:0}.inbox-search{background:#171d27;border-radius:12px;padding:9px 12px;margin:12px 0}.inbox-search input{width:100%;border:0;background:none;outline:0}.note-row{display:flex;gap:18px;overflow:auto;padding:8px 0 15px}.note{flex:0 0 72px;text-align:center;font-size:11px}.note img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:auto}.message-row{display:flex;align-items:center;gap:12px;padding:11px 14px}.message-row .m-info{flex:1;min-width:0}.message-row .m-name{font-weight:700}.message-row .m-preview{color:#8d97a7;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:#4f7cff;color:white;min-width:8px;height:8px;border-radius:50%}
.chat{height:calc(100vh - 62px - var(--nav));display:flex;flex-direction:column}.chat-head{height:58px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}.chat-head .info{flex:1;text-align:center}.chat-body{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:5px}.bubble-row{display:flex;align-items:flex-end;gap:6px}.bubble-row.mine{justify-content:flex-end}.bubble{max-width:min(76%,390px);padding:9px 12px;border-radius:18px;background:#222a36;word-break:break-word;line-height:1.35;font-size:15px}.mine .bubble{background:#fff;color:#05070b;border-bottom-right-radius:5px}.bubble-row:not(.mine) .bubble{border-bottom-left-radius:5px}.bubble img,.bubble video{border-radius:13px;max-height:320px;object-fit:cover;margin:-2px}.reply-mini{border-left:3px solid #5a6cff;background:#ffffff12;padding:6px 8px;border-radius:8px;font-size:11px;margin-bottom:5px}.voice{display:flex;align-items:center;gap:8px;min-width:180px}.voice button{width:34px;height:34px;border-radius:50%;background:#111722;display:grid;place-items:center}.mine .voice button{background:#e2e5eb}.voicebar{height:4px;border-radius:4px;background:#8993a3;flex:1}.chat-compose{display:flex;gap:7px;align-items:center;padding:8px 9px;background:#080b11;border-top:1px solid var(--line)}.chat-compose input{flex:1;min-width:0;background:#171d27;border:1px solid #29313e;border-radius:22px;padding:10px 13px;outline:0}.recording{color:#ff536e}.media-btn{position:relative;overflow:hidden}.media-btn input{position:absolute;inset:0;opacity:0}.send-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#05070b}
.story-viewer{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}.story-stage{width:min(100%,620px);height:100%;position:relative;background:#111;overflow:hidden}.story-stage video,.story-stage img{width:100%;height:100%;object-fit:cover}.story-top{position:absolute;left:12px;right:12px;top:9px;z-index:2}.progresses{display:flex;gap:3px}.progresses span{height:3px;background:#ffffff66;border-radius:4px;flex:1}.progresses span.active{background:#fff}.story-user{display:flex;align-items:center;gap:8px;margin-top:10px}.story-user img{width:34px;height:34px;border-radius:50%;object-fit:cover}.story-close{position:absolute;right:5px;top:38px;color:#fff}.story-bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}.story-reply{flex:1;border:1px solid #ffffff88;border-radius:22px;padding:11px 15px;background:#0005}.story-bottom button{width:42px;height:42px}.toast{position:fixed;z-index:200;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:#f4f6fa;color:#05070b;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:90;background:#0009;display:grid;place-items:end center}.sheet{width:min(680px,100%);background:#0e131b;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));border:1px solid var(--line)}.sheet h3{margin:2px 0 16px}.sheet button{width:100%;text-align:left;padding:14px 8px;border-bottom:1px solid #202734}.sheet button:last-child{border:0}
@media(min-width:800px){.bottom-nav{left:50%;right:auto;width:680px;transform:translateX(-50%);border-radius:18px 18px 0 0}.topbar{padding-left:calc((100vw - 680px)/2);padding-right:calc((100vw - 680px)/2)}.main{border-left:1px solid #10151e;border-right:1px solid #10151e}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>

<script>
"use strict";
const {Client,Account,Databases,Storage,ID,Query} = window.Appwrite;

const CFG={
  endpoint:"https://fra.cloud.appwrite.io/v1",
  projectId:"6aa242bf00012f890e92",
  databaseId:"6aa41332002b049743d5",
  bucketId:"6aa421b20025a1b4aac8",
  collections:{
    profiles:"profiles",posts:"posts",conversations:"conversations",members:"conversation_members",
    messages:"messages",messageReactions:"message_reactions",comments:"comments",reactions:"reactions",
    follows:"follows",notifications:"notifications",stories:"stories",storyViews:"story_views",
    storyReactions:"story_reactions",storyReplies:"story_replies",presence:"user_presence",
    reports:"reports",postMedia:"post_media",storyMedia:"story_media",verification:"verification",
    adminActions:"admin_actions",blocks:"user_blocks",commentReactions:"comment_reactions"
  }
};
const client=new Client().setEndpoint(CFG.endpoint).setProject(CFG.projectId);
const account=new Account(client), db=new Databases(client), storage=new Storage(client);
const S={user:null,profile:null,route:"home",posts:[],stories:[],feedUsers:[],chat:null,chatUser:null,media:[],recording:null,recChunks:[],recTimer:null,replyTo:null,search:"",tab:"grid"};

const svg={
home:`<svg class="icon" viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.2a1 1 0 0 1-1 1h-5.2v-6.5H9.2V21H4a1 1 0 0 1-1-1z"/></svg>`,
play:`<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m10 8 6 4-6 4z"/></svg>`,
send:`<svg class="icon" viewBox="0 0 24 24"><path d="m3 4 18 8-18 8 3-8z"/><path d="M6 12h15"/></svg>`,
search:`<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>`,
heart:`<svg class="icon" viewBox="0 0 24 24"><path d="M20.8 8.6c0 5.5-8.8 11-8.8 11S3.2 14.1 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/></svg>`,
comment:`<svg class="icon" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8.4 8 9.7 9.7 0 0 1-4.1-.9L4 20l1.2-3.1A7.8 7.8 0 0 1 4 11.5a8 8 0 0 1 16 0Z"/></svg>`,
bookmark:`<svg class="icon" viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-3.8L6 21z"/></svg>`,
plus:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>`,
settings:`<svg class="icon" viewBox="0 0 24 24"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"/><path d="m19.4 15 .1.1a2 2 0 0 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4v.2a2 2 0 0 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1A2 2 0 0 1 3 15.1l.1-.1A2 2 0 0 0 1.7 11.6h-.2a2 2 0 0 1 0-4h.2A2 2 0 0 0 3.1 4.2L3 4.1A2 2 0 0 1 5.8 1.3l.1.1A2 2 0 0 0 9.3 0h.2a2 2 0 0 1 4 0h.2a2 2 0 0 0 3.4 1.4l.1-.1A2 2 0 0 1 20 4.1l-.1.1a2 2 0 0 0 1.4 3.4h.2a2 2 0 0 1 0 4h-.2a2 2 0 0 0-1.4 3.4Z"/></svg>`,
edit:`<svg class="icon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>`,
image:`<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 5-5 3 3 2-2 6 5"/></svg>`,
mic:`<svg class="icon" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>`,
close:`<svg class="icon" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>`,
back:`<svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>`,
more:`<svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>`
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{if(!d)return "";const x=new Date(d),diff=Date.now()-x.getTime(),m=Math.floor(diff/60000);if(m<1)return"now";if(m<60)return m+"m";const h=Math.floor(m/60);if(h<24)return h+"h";const days=Math.floor(h/24);if(days<7)return days+"d";return x.toLocaleDateString()};
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2400)};
const fileUrl=id=>id?String(storage.getFileView(CFG.bucketId,id)):"";
const qsafe=fn=>{try{return fn()}catch(e){console.error(e);return null}};
async function list(col,queries=[]){try{return (await db.listDocuments(CFG.databaseId,col,[...queries,Query.limit(100)])).documents}catch(e){console.error("list",col,e);return[]}}
async function create(col,data){return db.createDocument(CFG.databaseId,col,ID.unique(),data)}
async function update(col,id,data){return db.updateDocument(CFG.databaseId,col,id,data)}
async function upload(file){return storage.createFile(CFG.bucketId,ID.unique(),file)}
async function current(){try{return await account.get()}catch{return null}}
async function getProfile(uid){const a=await list(CFG.collections.profiles,[Query.equal("userId",uid)]);return a[0]||null}
async function ensureProfile(user){let p=await getProfile(user.$id);if(!p){try{p=await create(CFG.collections.profiles,{userId:user.$id,username:(user.name||user.email.split("@")[0]).replace(/[^a-zA-Z0-9_.]/g,"").slice(0,30)||"novauser",displayName:user.name||"NOVA user",avatar:"",bio:"",email:user.email,verified:false,createdAt:new Date().toISOString()})}catch(e){console.error(e)}}return p}
function avatar(p,cls="avatar"){return `<img class="${cls}" src="${esc(p?.avatar||"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80")}" alt="">`}
function nav(){return `<nav class="bottom-nav"><div class="nav-inner">
<button class="nav-item ${S.route==="home"?"active":""}" data-route="home">${svg.home}</button>
<button class="nav-item ${S.route==="reels"?"active":""}" data-route="reels">${svg.play}</button>
<button class="nav-item ${S.route==="inbox"||S.route==="chat"?"active":""}" data-route="inbox">${svg.send}<i class="dot hidden" id="msgdot"></i></button>
<button class="nav-item ${S.route==="search"?"active":""}" data-route="search">${svg.search}</button>
<button class="nav-item ${S.route==="profile"?"active":""}" data-route="profile">${avatar(S.profile,"nav-avatar")}</button>
</div></nav>`}
function shell(content){return `<div class="shell"><header class="topbar"><button class="brand" data-route="home">NOVA</button><div class="top-actions">${S.route==="home"?`<button class="icon-btn" data-action="create">${svg.plus}</button>`:""}${S.route==="profile"?`<button class="icon-btn" data-action="settings">${svg.settings}</button>`:""}${S.route==="inbox"?`<button class="icon-btn" data-action="newchat">${svg.edit}</button>`:""}</div></header><main class="main"><div class="page">${content}</div></main>${nav()}</div>`}
async function render(){if(!S.user){renderAuth();return}if(!S.profile)S.profile=await ensureProfile(S.user);let c="";if(S.route==="home")c=await home();else if(S.route==="search")c=await searchPage();else if(S.route==="profile")c=await profilePage(S.user.$id);else if(S.route==="activity")c=await activity();else if(S.route==="inbox")c=await inbox();else if(S.route==="chat")c=await chatPage();else if(S.route==="reels")c=await reels();else if(S.route==="create")c=composePage();document.getElementById("app").innerHTML=shell(c);bind();if(S.route==="home")loadPosts();if(S.route==="inbox")loadInbox()}
function renderAuth(){document.getElementById("app").innerHTML=`<div class="auth"><div class="auth-card"><div class="logo">NOVA</div><p class="sub">Social, reimagined.</p><div id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="primary" data-action="login">Log in</button><button class="secondary" data-action="toggleAuth">Create new account</button></div><div id="authError" class="auth-error"></div></div></div>`;bind()}
function composePage(){return `<div class="compose"><div class="section-head" style="padding:0 0 14px"><button class="icon-btn" data-route="home">${svg.close}</button><b style="font-size:18px">Create post</b><span></span></div><textarea id="postText" placeholder="Share something..."></textarea><div id="mediaPreview" class="media-preview"></div><div class="compose-row"><label class="icon-btn media-btn">${svg.image}<input id="postMedia" type="file" accept="image/*,video/*" multiple></label><button class="primary" data-action="publish">Share</button></div></div>`}
async function home(){return `<section><div class="stories" id="stories">${avatar(S.profile,"story-ring")}</div><div id="feed"><div class="section-head"><span class="muted">Loading your feed…</span></div></div></section>`}
async function loadStories(){const docs=await list(CFG.collections.stories,[Query.orderDesc("createdAt")]);S.stories=docs.filter(x=>!x.expiresAt||new Date(x.expiresAt)>new Date());const html=`<div class="story story-add" data-action="newstory"><div class="story-ring"><img src="${esc(S.profile?.avatar||"https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80")}"></div><span class="plus">+</span><div>Your story</div></div>`+S.stories.slice(0,15).map((s,i)=>`<div class="story" data-story="${esc(s.$id)}"><div class="story-ring"><img src="${esc(fileUrl(s.media)||s.media||S.profile.avatar)}"></div><div>${esc(s.userId===S.user?.$id?"You":"Story")}</div></div>`).join("");const el=document.getElementById("stories");if(el)el.innerHTML=html;document.querySelectorAll("[data-story]").forEach(x=>x.onclick=()=>openStory(x.dataset.story))}
async function loadPosts(){const docs=await list(CFG.collections.posts,[Query.orderDesc("createdAt")]);S.posts=docs;const feed=document.getElementById("feed");if(!feed)return;if(!docs.length){feed.innerHTML=`<div class="section-head"><span class="muted">No posts yet. Create the first one.</span></div>`;loadStories();return}feed.innerHTML="";for(const p of docs){const prof=await getProfile(p.userId);feed.insertAdjacentHTML("beforeend",postHTML(p,prof))}bindPostActions();loadStories()}
function mediaHTML(p){if(!p.media)return"";let arr=[];try{arr=Array.isArray(p.media)?p.media:JSON.parse(p.media)}catch{arr=[p.media]}return arr.slice(0,10).map((m,i)=>{const src=fileUrl(m)||m;const isVid=/\.(mp4|mov|webm|m4v)(\?|$)/i.test(src);return isVid?`<video class="post-media" src="${esc(src)}" controls playsinline preload="metadata"></video>`:`<img class="post-media" src="${esc(src)}" alt="" loading="lazy">`}).join("")}
async function countReactions(pid){return list(CFG.collections.reactions,[Query.equal("postId",pid)])}
function postHTML(p,prof){return `<article class="post" data-post="${esc(p.$id)}"><div class="post-head">${avatar(prof)}<div class="post-meta"><div class="username">${esc(prof?.username||"nova_user")} ${prof?.verified?"✓":""}</div><div class="time">${fmt(p.createdAt)}</div></div><button class="icon-btn more" data-more="${esc(p.$id)}">${svg.more}</button></div><div class="media-wrap">${mediaHTML(p)}</div><div class="post-actions"><button class="icon-btn" data-like="${esc(p.$id)}">${svg.heart}</button><button class="icon-btn" data-comment="${esc(p.$id)}">${svg.comment}</button><button class="icon-btn" data-share="${esc(p.$id)}">${svg.send}</button><button class="icon-btn save">${svg.bookmark}</button></div><div class="count-row" id="likes-${esc(p.$id)}">— likes</div><div class="caption"><b>${esc(prof?.username||"nova_user")}</b>${esc(p.content||"")}</div><div class="comments-link" data-comment="${esc(p.$id)}">View comments</div></article>`}
function bindPostActions(){document.querySelectorAll("[data-like]").forEach(b=>b.onclick=async()=>{const pid=b.dataset.like;try{const old=await list(CFG.collections.reactions,[Query.equal("postId",pid),Query.equal("userId",S.user.$id)]);if(old[0]){await db.deleteDocument(CFG.databaseId,CFG.collections.reactions,old[0].$id)}else await create(CFG.collections.reactions,{postId:pid,userId:S.user.$id,reaction:"❤️",createdAt:new Date().toISOString()});const c=await countReactions(pid);document.getElementById("likes-"+pid).textContent=c.length+" likes"}catch(e){toast("Couldn't update like")}});document.querySelectorAll("[data-comment]").forEach(b=>b.onclick=()=>openComments(b.dataset.comment));document.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>openMore(b.dataset.more));document.querySelectorAll("[data-share]").forEach(b=>b.onclick=async()=>{const p=S.posts.find(x=>x.$id===b.dataset.share);if(navigator.share){try{await navigator.share({title:"NOVA",text:p?.content||"Check this post on NOVA"})}catch{}}else toast("Post ready to share")});S.posts.forEach(async p=>{const c=await countReactions(p.$id);const e=document.getElementById("likes-"+p.$id);if(e)e.textContent=c.length+" likes"})}
function openComments(pid){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="sheet"><h3>Comments</h3><div id="commentsList" class="muted">Loading…</div><div style="display:flex;gap:8px;margin-top:10px"><input id="commentInput" class="create-input" placeholder="Add a comment…"><button class="send-btn" data-action="sendComment" data-pid="${esc(pid)}">${svg.send}</button></div></div></div>`);loadComments(pid)}
async function loadComments(pid){const cs=await list(CFG.collections.comments,[Query.equal("postId",pid),Query.orderDesc("createdAt")]);const e=document.getElementById("commentsList");if(!e)return;e.innerHTML=cs.length?cs.map(c=>`<div style="padding:9px 0"><b>${esc(c.userId===S.user.$id?"You":c.userId)}</b> ${esc(c.content)}</div>`).join(""):`<div class="muted">No comments yet.</div>`;document.querySelector("[data-action=sendComment]")?.addEventListener("click",async()=>{const i=document.getElementById("commentInput");if(!i.value.trim())return;try{await create(CFG.collections.comments,{postId:pid,userId:S.user.$id,content:i.value.trim(),createdAt:new Date().toISOString()});i.value="";loadComments(pid)}catch{toast("Couldn't comment")}})}
function openMore(pid){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="sheet"><h3>Post</h3><button data-action="report" data-pid="${esc(pid)}">Report</button><button data-action="closeModal">Cancel</button></div></div>`);bind()}
async function searchPage(){return `<div class="section-head"><span class="section-title">Search</span></div><div class="search-box">${svg.search}<input id="searchInput" value="${esc(S.search)}" placeholder="Search"></div><div class="search-results" id="searchResults"><div class="muted">Search for people</div></div>`}
async function doSearch(v){S.search=v.trim();const out=document.getElementById("searchResults");if(!out)return;if(!S.search){out.innerHTML=`<div class="muted">Search for people</div>`;return}const ps=await list(CFG.collections.profiles,[Query.search("username",S.search)]);out.innerHTML=ps.map(p=>`<div class="user-row">${avatar(p)}<div class="info"><b>${esc(p.username)}</b><div class="muted">${esc(p.displayName||"")}</div></div><button class="follow" data-profile="${esc(p.userId)}">View</button></div>`).join("")||`<div class="muted">No users found.</div>`;document.querySelectorAll("[data-profile]").forEach(b=>b.onclick=()=>{S.route="profile";renderProfileId=b.dataset.profile;renderProfileId&&profileRoute(renderProfileId)})}
let renderProfileId=null;function profileRoute(id){render().then(()=>{})}
async function profilePage(uid){const p=uid===S.user.$id?S.profile:await getProfile(uid);const posts=await list(CFG.collections.posts,[Query.equal("userId",uid),Query.orderDesc("createdAt")]);return `<div class="profile-head"><div class="profile-title"><button class="icon-btn" data-route="home">${svg.back}</button><div class="name">${esc(p?.username||"profile")}</div><div class="profile-actions"><button class="icon-btn">${svg.more}</button></div></div><div class="profile-summary">${avatar(p,"profile-avatar")}<div class="stats"><div class="stat"><b>${posts.length}</b><span>posts</span></div><div class="stat"><b id="followersCount">—</b><span>followers</span></div><div class="stat"><b id="followingCount">—</b><span>following</span></div></div></div><div class="bio">${esc(p?.bio||"")}</div>${uid===S.user.$id?`<div class="profile-buttons"><button data-action="editProfile">Edit profile</button><button data-action="shareProfile">Share profile</button><button>${svg.plus}</button></div>`:`<div class="profile-buttons" style="grid-template-columns:1fr 44px"><button data-follow="${esc(uid)}">Follow</button><button data-action="messageUser" data-uid="${esc(uid)}">${svg.send}</button></div>`}<div class="highlights"><div class="highlight"><div class="new">+</div><div>New</div></div></div></div><div class="tabs"><button class="active" data-tab="grid">${svg.image}</button><button data-tab="reels">${svg.play}</button><button data-tab="tagged">${svg.user||svg.image}</button></div><div class="grid">${posts.map(x=>`<div class="grid-item">${mediaHTML(x).split("</video>")[0]||""}</div>`).join("")}</div>`}
async function activity(){const ns=await list(CFG.collections.notifications,[Query.equal("userId",S.user.$id),Query.orderDesc("createdAt")]);return `<div class="section-head"><span class="section-title">Activity</span></div>${ns.map(n=>`<div class="activity-item">${avatar(S.profile)}<div class="text"><b>${esc(n.fromUserId||"Someone")}</b> ${esc(n.message||n.type||"interacted with you")}<div class="muted">${fmt(n.createdAt)}</div></div></div>`).join("")||`<div class="section-head"><span class="muted">No activity yet.</span></div>`}`}
async function inbox(){const members=await list(CFG.collections.members,[Query.equal("userId",S.user.$id)]);const convs=[];for(const m of members){const c=await list(CFG.collections.conversations,[Query.equal("$id",m.conversationId)]);if(c[0])convs.push(c[0])}return `<div class="inbox-head"><div class="inbox-title"><h2>${esc(S.profile?.username||"NOVA")}</h2><button class="icon-btn" data-action="newchat">${svg.edit}</button></div><div class="inbox-search"><input placeholder="Search"></div><div class="note-row">${avatar(S.profile,"note")}</div><div style="display:flex;justify-content:space-between;align-items:center"><b>Messages</b><span class="muted">Requests</span></div></div><div id="inboxList">${convs.length?convs.map(c=>`<div class="message-row" data-conv="${esc(c.$id)}">${avatar(S.profile)}<div class="m-info"><div class="m-name">Conversation</div><div class="m-preview">${esc(c.lastMessage||"Start chatting")}</div></div></div>`).join(""):`<div class="section-head"><span class="muted">No conversations yet.</span></div>`}</div>`}
async function loadInbox(){document.querySelectorAll("[data-conv]").forEach(b=>b.onclick=async()=>{S.chat=b.dataset.conv;S.chatUser=null;S.route="chat";render()})}
async function newChat(){const users=await list(CFG.collections.profiles,[Query.limit(20)]);document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="sheet"><h3>New message</h3><div id="people">${users.filter(p=>p.userId!==S.user.$id).map(p=>`<div class="user-row" data-newuid="${esc(p.userId)}">${avatar(p)}<div class="info"><b>${esc(p.username)}</b><div class="muted">${esc(p.displayName||"")}</div></div></div>`).join("")}</div></div></div>`);document.querySelectorAll("[data-newuid]").forEach(x=>x.onclick=()=>startConversation(x.dataset.newuid))}
async function startConversation(uid){try{const existingMembers=await list(CFG.collections.members,[Query.equal("userId",S.user.$id)]);for(const m of existingMembers){const others=await list(CFG.collections.members,[Query.equal("conversationId",m.conversationId),Query.equal("userId",uid)]);if(others[0]){S.chat=m.conversationId;S.chatUser=uid;document.getElementById("modal")?.remove();S.route="chat";render();return}}const c=await create(CFG.collections.conversations,{createdAt:new Date().toISOString(),type:"direct",lastMessage:"",lastMessageAt:new Date().toISOString()});await create(CFG.collections.members,{conversationId:c.$id,userId:S.user.$id,joinedAt:new Date().toISOString(),isAdmin:true});await create(CFG.collections.members,{conversationId:c.$id,userId:uid,joinedAt:new Date().toISOString(),isAdmin:false});S.chat=c.$id;S.chatUser=uid;document.getElementById("modal")?.remove();S.route="chat";render()}catch(e){console.error(e);toast("Couldn't start chat")}}
async function chatPage(){let user=S.chatUser?await getProfile(S.chatUser):null;const msgs=S.chat?await list(CFG.collections.messages,[Query.equal("conversationId",S.chat),Query.orderDesc("createdAt")]):[];msgs.reverse();return `<div class="chat"><div class="chat-head"><button class="icon-btn" data-route="inbox">${svg.back}</button>${user?avatar(user):avatar(S.profile)}<div class="info"><b>${esc(user?.username||"Conversation")}</b><div class="muted">NOVA</div></div><button class="icon-btn">${svg.more}</button></div><div class="chat-body" id="chatBody">${msgs.map(messageHTML).join("")}</div><div class="chat-compose">${svg.image}<label class="icon-btn media-btn">${svg.image}<input id="chatMedia" type="file" accept="image/*,video/*"></label><input id="chatInput" placeholder="Message..."><button class="icon-btn" id="recordBtn">${svg.mic}</button><button class="send-btn" data-action="sendMessage">${svg.send}</button></div></div>`}
function messageHTML(m){const mine=m.senderId===S.user.$id;let media="";if(m.media){let src=fileUrl(m.media)||m.media;media=m.mediaType==="video"?`<video src="${esc(src)}" controls playsinline></video>`:m.mediaType==="audio"?`<div class="voice"><button data-playvoice="${esc(src)}">▶</button><div class="voicebar"></div></div>`:`<img src="${esc(src)}" alt="">`}return `<div class="bubble-row ${mine?"mine":""}" data-message="${esc(m.$id)}"><div class="bubble">${m.replyTo?`<div class="reply-mini">Replying to a message</div>`:""}${media}${m.content?`<div>${esc(m.content)}</div>`:""}</div></div>`}
async function sendMessage(){const input=document.getElementById("chatInput"),text=input?.value.trim();const mf=document.getElementById("chatMedia");if(!text&&!mf?.files?.[0])return;if(!S.chat)return;try{let media="",type="";if(mf?.files?.[0]){const f=await upload(mf.files[0]);media=f.$id;type=mf.files[0].type.startsWith("video")?"video":"image"}await create(CFG.collections.messages,{conversationId:S.chat,senderId:S.user.$id,content:text||"",media,mediaType:type,replyTo:S.replyTo||"",createdAt:new Date().toISOString(),deleted:false});S.replyTo=null;render()}catch(e){console.error(e);toast("Message failed to send")}}
async function startRecording(){if(!navigator.mediaDevices?.getUserMedia){toast("Voice recording is not supported");return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const r=new MediaRecorder(stream);S.recording=r;S.recChunks=[];r.ondataavailable=e=>{if(e.data.size)S.recChunks.push(e.data)};r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(S.recChunks,{type:r.mimeType||"audio/webm"});try{const f=new File([blob],"voice-"+Date.now()+".webm",{type:blob.type});const up=await upload(f);await create(CFG.collections.messages,{conversationId:S.chat,senderId:S.user.$id,content:"",media:up.$id,mediaType:"audio",replyTo:S.replyTo||"",createdAt:new Date().toISOString(),deleted:false});S.replyTo=null;render()}catch(e){console.error(e);toast("Voice message failed")}};r.start();const btn=document.getElementById("recordBtn");btn?.classList.add("recording");toast("Recording… tap again to send");}catch(e){toast("Microphone permission is required")}}
function stopRecording(){if(S.recording&&S.recording.state!=="inactive"){S.recording.stop();S.recording=null}}
async function reels(){const posts=await list(CFG.collections.posts,[Query.orderDesc("createdAt")]);const vids=posts.filter(p=>/mp4|webm|mov/i.test(p.media||""));return `<div style="min-height:calc(100vh - 62px);background:#000">${vids.map(p=>`<div style="height:calc(100vh - 128px);position:relative"><video src="${esc(fileUrl(p.media)||p.media)}" controls playsinline loop style="width:100%;height:100%;object-fit:cover"></video></div>`).join("")||`<div class="section-head"><span class="muted">No videos yet.</span></div>`}</div>`}
async function publish(){const text=document.getElementById("postText")?.value.trim()||"";const files=[...(document.getElementById("postMedia")?.files||[])];if(!text&&!files.length){toast("Add text or media");return}try{const ids=[];for(const f of files.slice(0,10)){const up=await upload(f);ids.push(up.$id)}await create(CFG.collections.posts,{userId:S.user.$id,content:text,media:JSON.stringify(ids),createdAt:new Date().toISOString()});toast("Posted");S.route="home";render()}catch(e){console.error(e);toast("Couldn't publish")}}
async function newStory(){const input=document.createElement("input");input.type="file";input.accept="image/*,video/*";input.onchange=async()=>{const f=input.files?.[0];if(!f)return;try{const up=await upload(f);const exp=new Date(Date.now()+86400000).toISOString();await create(CFG.collections.stories,{userId:S.user.$id,content:"",media:up.$id,mediaType:f.type.startsWith("video")?"video":"image",createdAt:new Date().toISOString(),expiresAt:exp});toast("Story added");render()}catch{toast("Couldn't add story")}};input.click()}
async function openStory(id){const s=S.stories.find(x=>x.$id===id);if(!s)return;const p=s.userId===S.user.$id?S.profile:await getProfile(s.userId);const src=fileUrl(s.media)||s.media;document.body.insertAdjacentHTML("beforeend",`<div class="story-viewer" id="storyViewer"><div class="story-stage">${s.mediaType==="video"?`<video src="${esc(src)}" autoplay playsinline controls></video>`:`<img src="${esc(src)}" alt="">`}<div class="story-top"><div class="progresses"><span class="active"></span></div><div class="story-user">${avatar(p)}<b>${esc(p?.username||"NOVA")}</b><span class="muted">${fmt(s.createdAt)}</span></div></div><button class="icon-btn story-close" data-action="closeStory">${svg.close}</button><div class="story-bottom"><input class="story-reply" placeholder="Send message"><button>${svg.heart}</button><button>${svg.send}</button></div></div></div>`);try{await create(CFG.collections.storyViews,{storyId:id,userId:S.user.$id,createdAt:new Date().toISOString()})}catch{}bind()}
async function editProfile(){const p=S.profile||{};document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="sheet"><h3>Edit profile</h3><div class="field"><label>Username</label><input id="epUser" value="${esc(p.username)}"></div><div class="field"><label>Display name</label><input id="epName" value="${esc(p.displayName)}"></div><div class="field"><label>Bio</label><textarea id="epBio">${esc(p.bio)}</textarea></div><button class="primary" data-action="saveProfile">Save</button><button data-action="logout">Log out</button></div></div>`);bind()}
async function saveProfile(){try{S.profile=await update(CFG.collections.profiles,S.profile.$id,{username:document.getElementById("epUser").value.trim(),displayName:document.getElementById("epName").value.trim(),bio:document.getElementById("epBio").value});document.getElementById("modal")?.remove();render()}catch{toast("Couldn't save profile")}}
function bind(){document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{S.route=b.dataset.route;render()});document.querySelectorAll("[data-action]").forEach(b=>b.onclick=async()=>{const a=b.dataset.action;try{if(a==="login")await login();else if(a==="toggleAuth")toggleAuth();else if(a==="create"){S.route="create";render()}else if(a==="publish")await publish();else if(a==="newstory")await newStory();else if(a==="closeStory")document.getElementById("storyViewer")?.remove();else if(a==="closeModal")document.getElementById("modal")?.remove();else if(a==="newchat")await newChat();else if(a==="sendMessage")await sendMessage();else if(a==="editProfile")await editProfile();else if(a==="saveProfile")await saveProfile();else if(a==="logout")await logout();else if(a==="report"){document.getElementById("modal")?.remove();toast("Report flow ready")};}catch(e){console.error(e);toast("Something went wrong")}});const si=document.getElementById("searchInput");if(si){let t;si.oninput=()=>{clearTimeout(t);t=setTimeout(()=>doSearch(si.value),250)}}const pm=document.getElementById("postMedia");if(pm)pm.onchange=()=>previewFiles(pm.files);const rb=document.getElementById("recordBtn");if(rb)rb.onclick=()=>S.recording?stopRecording():startRecording();document.querySelectorAll("[data-playvoice]").forEach(b=>b.onclick=()=>{const a=new Audio(b.dataset.playvoice);a.play()})}
function previewFiles(files){const e=document.getElementById("mediaPreview");if(!e)return;e.innerHTML=[...files].slice(0,10).map(f=>f.type.startsWith("video")?`<video src="${URL.createObjectURL(f)}" controls></video>`:`<img src="${URL.createObjectURL(f)}">`).join("")}
function toggleAuth(){const f=document.getElementById("loginForm");if(!f)return;const create=!f.dataset.create;f.dataset.create=create?"1":"";f.innerHTML=create?`<div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password (8+ characters)</label><input id="password" type="password"></div><button class="primary" data-action="register">Create account</button><button class="secondary" data-action="toggleAuth">I already have an account</button>`:`<div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" data-action="login">Log in</button><button class="secondary" data-action="toggleAuth">Create new account</button>`;bind();const old=document.querySelector("[data-action=register]");if(old)old.onclick=register}
async function register(){const name=document.getElementById("name")?.value.trim(),email=document.getElementById("email")?.value.trim(),pass=document.getElementById("password")?.value;if(!email||!pass||pass.length<8){showAuthError("Enter a valid email and 8+ character password.");return}try{const u=await account.create(ID.unique(),email,pass,name||"NOVA user");await account.createEmailPasswordSession(email,pass);S.user=u;S.profile=await ensureProfile(u);S.route="home";render()}catch(e){showAuthError(e?.message||"Registration failed")}}
async function login(){const email=document.getElementById("email")?.value.trim(),pass=document.getElementById("password")?.value;if(!email||!pass){showAuthError("Enter email and password.");return}try{await account.createEmailPasswordSession(email,pass);S.user=await account.get();S.profile=await ensureProfile(S.user);S.route="home";render()}catch(e){showAuthError(e?.message||"Login failed")}}
function showAuthError(m){const e=document.getElementById("authError");if(e)e.textContent=m}
async function logout(){try{await account.deleteSession("current")}catch{}S.user=null;S.profile=null;S.route="home";render()}
(async()=>{S.user=await current();if(S.user)S.profile=await ensureProfile(S.user);await render()})();
</script>
</body>
</html>
