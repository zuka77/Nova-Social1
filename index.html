<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>NOVA Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#08080d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.app{
  width:100%;
  min-height:100vh;
  padding-bottom:80px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(8,8,13,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1px;
  background:linear-gradient(90deg,#9b5cff,#ff4fa3);
  -webkit-background-clip:text;
  color:transparent;
}

.top-action{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#15151e;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

svg{
  width:22px;
  height:22px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.screen{
  width:100%;
  max-width:680px;
  margin:auto;
}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:#111119;
  border:1px solid rgba(255,255,255,.08);
  border-radius:25px;
  padding:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.auth-logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  margin-bottom:8px;
  background:linear-gradient(90deg,#9b5cff,#ff4fa3);
  -webkit-background-clip:text;
  color:transparent;
}

.auth-sub{
  text-align:center;
  color:#9999a7;
  margin-bottom:25px;
}

.field{
  width:100%;
  margin-bottom:13px;
}

.field input,
.field textarea{
  width:100%;
  background:#191923;
  border:1px solid #292936;
  color:#fff;
  border-radius:15px;
  padding:14px;
  outline:none;
}

.field input:focus,
.field textarea:focus{
  border-color:#9b5cff;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:15px;
  color:white;
  font-weight:800;
  background:linear-gradient(90deg,#814cff,#ec4f9f);
}

.auth-switch{
  margin-top:18px;
  text-align:center;
  color:#9999a7;
}

.auth-switch button{
  background:none;
  color:#b77cff;
  font-weight:700;
}

.error{
  color:#ff6b7c;
  font-size:14px;
  margin-bottom:12px;
}

.success{
  color:#61e6a2;
  font-size:14px;
  margin-bottom:12px;
}

/* FEED */

.stories{
  padding:14px 12px;
  display:flex;
  gap:12px;
  overflow-x:auto;
  scrollbar-width:none;
}

.stories::-webkit-scrollbar{
  display:none;
}

.story{
  min-width:70px;
  text-align:center;
}

.story-ring{
  width:64px;
  height:64px;
  padding:2px;
  border-radius:50%;
  background:linear-gradient(135deg,#814cff,#ff4fa3);
}

.story-avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#22222c;
  border:3px solid #08080d;
}

.story-name{
  margin-top:5px;
  font-size:11px;
  color:#aaa;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.create-story{
  min-width:70px;
  text-align:center;
}

.add-story{
  width:64px;
  height:64px;
  border-radius:50%;
  background:#171720;
  border:1px solid #30303c;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#bd88ff;
}

/* POST */

.post{
  border-top:1px solid rgba(255,255,255,.07);
  padding-bottom:12px;
}

.post-head{
  padding:13px 14px;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#22222c;
}

.post-user{
  flex:1;
}

.username{
  font-weight:800;
  font-size:14px;
}

.display{
  color:#888894;
  font-size:12px;
  margin-top:2px;
}

.time{
  color:#777784;
  font-size:11px;
}

.post-body{
  padding:0 14px 12px;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  width:100%;
  max-height:650px;
  object-fit:cover;
  display:block;
  background:#111;
}

.post-actions{
  display:flex;
  align-items:center;
  gap:5px;
  padding:8px 10px 0;
}

.action-btn{
  width:42px;
  height:42px;
  background:none;
  color:#a4a4b1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

.action-btn:active{
  background:#191923;
}

.reaction-active{
  color:#ff557d;
}

.count{
  color:#9999a5;
  font-size:13px;
  margin-right:8px;
}

/* NAV */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  height:72px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(10,10,15,.95);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:center;
}

.nav-inner{
  width:100%;
  max-width:680px;
  display:flex;
  justify-content:space-around;
}

.nav-btn{
  flex:1;
  max-width:120px;
  background:none;
  color:#777784;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:4px;
  position:relative;
}

.nav-btn.active{
  color:#b879ff;
}

.nav-label{
  font-size:10px;
}

.badge{
  position:absolute;
  top:7px;
  right:22%;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:20px;
  background:#ff405f;
  color:white;
  font-size:9px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SEARCH */

.search-box{
  padding:15px;
}

.search-box input{
  width:100%;
  border:0;
  outline:none;
  background:#181820;
  color:#fff;
  padding:14px 16px;
  border-radius:15px;
}

.user-result{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 15px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.user-info{
  flex:1;
}

.follow-btn{
  background:#8b55ff;
  color:#fff;
  padding:9px 15px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
}

/* CREATE */

.create-card{
  padding:18px;
}

.create-card textarea{
  min-height:150px;
  resize:none;
  margin-bottom:12px;
}

.file-label{
  width:100%;
  min-height:70px;
  border:1px dashed #444452;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#9999a6;
  margin-bottom:12px;
}

#mediaInput{
  display:none;
}

/* PROFILE */

.profile{
  padding-bottom:30px;
}

.profile-head{
  padding:25px 18px;
  text-align:center;
}

.profile-avatar{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  background:#22222c;
}

.profile-name{
  margin-top:12px;
  font-size:22px;
  font-weight:900;
}

.profile-username{
  color:#9999a7;
}

.profile-bio{
  margin:12px auto;
  max-width:450px;
  color:#c5c5ce;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin:18px 0;
}

.stat strong{
  display:block;
  font-size:19px;
}

.stat span{
  color:#888894;
  font-size:12px;
}

.profile-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
}

.profile-btn{
  padding:11px 20px;
  border-radius:13px;
  background:#8c56ff;
  color:#fff;
  font-weight:800;
}

.profile-btn.secondary{
  background:#1b1b25;
}

/* LOADING */

.loading{
  padding:35px;
  text-align:center;
  color:#888894;
}

.empty{
  padding:45px 20px;
  text-align:center;
  color:#777784;
}
</style>
</head>

<body>

<div id="authScreen" class="auth">
  <div class="auth-card">

    <div class="auth-logo">NOVA</div>

    <div class="auth-sub">
      Connect. Share. Discover.
    </div>

    <div id="authError" class="error hidden"></div>
    <div id="authSuccess" class="success hidden"></div>

    <div id="loginForm">

      <div class="field">
        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="Email">
      </div>

      <div class="field">
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Password">
      </div>

      <button
        class="primary"
        onclick="login()">
        Log In
      </button>

      <div class="auth-switch">
        Don't have an account?
        <button onclick="showRegister()">
          Create account
        </button>
      </div>

    </div>

    <div id="registerForm" class="hidden">

      <div class="field">
        <input
          id="registerUsername"
          type="text"
          maxlength="30"
          placeholder="Username">
      </div>

      <div class="field">
        <input
          id="registerDisplay"
          type="text"
          maxlength="60"
          placeholder="Display name">
      </div>

      <div class="field">
        <input
          id="registerEmail"
          type="email"
          autocomplete="email"
          placeholder="Email">
      </div>

      <div class="field">
        <input
          id="registerPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Password">
      </div>

      <button
        class="primary"
        onclick="register()">
        Create Account
      </button>

      <div class="auth-switch">
        Already have an account?
        <button onclick="showLogin()">
          Log in
        </button>
      </div>

    </div>

  </div>
</div>


<div id="app" class="app hidden">

  <header class="topbar">

    <div class="logo">NOVA</div>

    <button
      class="top-action"
      onclick="logout()"
      title="Logout">

      <svg viewBox="0 0 24 24">
        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M21 3v18"/>
      </svg>

    </button>

  </header>


  <main class="screen">

    <!-- HOME -->

    <section id="homeScreen">

      <div id="stories" class="stories"></div>

      <div id="feed">
        <div class="loading">
          Loading NOVA...
        </div>
      </div>

    </section>


    <!-- SEARCH -->

    <section
      id="searchScreen"
      class="hidden">

      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          placeholder="Search people..."
          oninput="searchUsers(this.value)">
      </div>

      <div id="searchResults"></div>

    </section>


    <!-- CREATE -->

    <section
      id="createScreen"
      class="hidden">

      <div class="create-card">

        <div class="field">
          <textarea
            id="postText"
            maxlength="5000"
            placeholder="What's happening?"></textarea>
        </div>

        <label class="file-label">

          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>

          <span>Select photo or video</span>

          <input
            id="mediaInput"
            type="file"
            accept="image/*,video/*"

            onchange="previewMedia(event)">

        </label>

        <div id="mediaPreview"></div>

        <button
          class="primary"
          onclick="createPost()">
          Publish
        </button>

      </div>

    </section>


    <!-- NOTIFICATIONS -->

    <section
      id="notificationsScreen"
      class="hidden">

      <div id="notifications">
        <div class="loading">
          Loading notifications...
        </div>
      </div>

    </section>


    <!-- PROFILE -->

    <section
      id="profileScreen"
      class="hidden">

      <div id="profileContent"></div>

    </section>

  </main>


  <nav class="bottom-nav">

    <div class="nav-inner">

      <button
        class="nav-btn active"
        onclick="openScreen('home',this)">

        <svg viewBox="0 0 24 24">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V21h14V9.5"/>
        </svg>

        <span class="nav-label">HOME</span>

      </button>


      <button
        class="nav-btn"
        onclick="openScreen('search',this)">

        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-4-4"/>
        </svg>

        <span class="nav-label">SEARCH</span>

      </button>


      <button
        class="nav-btn"
        onclick="openScreen('create',this)">

        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <path d="M12 8v8M8 12h8"/>
        </svg>

        <span class="nav-label">CREATE</span>

      </button>


      <button
        id="notificationNav"
        class="nav-btn"
        onclick="openScreen('notifications',this)">

        <svg viewBox="0 0 24 24">
          <path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M10 21h4"/>
        </svg>

        <span
          id="notificationBadge"
          class="badge hidden">
          0
        </span>

        <span class="nav-label">NOTIFICATIONS</span>

      </button>


      <button
        class="nav-btn"
        onclick="openScreen('profile',this)">

        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21a8 8 0 0116 0"/>
        </svg>

        <span class="nav-label">PROFILE</span>

      </button>

    </div>

  </nav>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://javjnzzayduoegtagysy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YD7Dmrt2NExlCgwvXLJ06g_SVUFvtNw";

const { createClient } =
  supabase;

const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;
let currentProfile = null;
let selectedMedia = [];


/* =========================================
   HELPERS
========================================= */

function $(id){
  return document.getElementById(id);
}


function showError(message){

  $("authError").textContent = message;
  $("authError").classList.remove("hidden");

  $("authSuccess").classList.add("hidden");
}


function showSuccess(message){

  $("authSuccess").textContent = message;
  $("authSuccess").classList.remove("hidden");

  $("authError").classList.add("hidden");
}


function clearMessages(){

  $("authError").classList.add("hidden");
  $("authSuccess").classList.add("hidden");
}


function escapeHTML(value){

  if(value === null || value === undefined)
    return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function timeAgo(date){

  const seconds =
    Math.floor(
      (Date.now() - new Date(date).getTime()) / 1000
    );

  if(seconds < 60)
    return seconds + "s";

  if(seconds < 3600)
    return Math.floor(seconds / 60) + "m";

  if(seconds < 86400)
    return Math.floor(seconds / 3600) + "h";

  if(seconds < 604800)
    return Math.floor(seconds / 86400) + "d";

  return new Date(date).toLocaleDateString();
}


/* =========================================
   AUTH UI
========================================= */

function showRegister(){

  clearMessages();

  $("loginForm").classList.add("hidden");
  $("registerForm").classList.remove("hidden");
}


function showLogin(){

  clearMessages();

  $("registerForm").classList.add("hidden");
  $("loginForm").classList.remove("hidden");
}


/* =========================================
   REGISTER
========================================= */

async function register(){

  clearMessages();

  const username =
    $("registerUsername").value
      .trim()
      .toLowerCase();

  const display =
    $("registerDisplay").value.trim();

  const email =
    $("registerEmail").value.trim();

  const password =
    $("registerPassword").value;

  if(!/^[a-zA-Z0-9_.]{3,30}$/.test(username)){
    showError(
      "Username must be 3-30 characters and use only letters, numbers, _ or ."
    );
    return;
  }

  if(password.length < 6){
    showError("Password must contain at least 6 characters.");
    return;
  }

  if(!email){
    showError("Enter your email.");
    return;
  }

  try{

    const {data,error} =
      await db.auth.signUp({

        email,

        password,

        options:{
          data:{
            username,
            display_name:
              display || username
          }
        }

      });

    if(error)
      throw error;

    showSuccess(
      "Account created. Check your email if confirmation is required."
    );

    $("registerPassword").value = "";

  }catch(error){

    showError(error.message);

  }

}


/* =========================================
   LOGIN
========================================= */

async function login(){

  clearMessages();

  const email =
    $("loginEmail").value.trim();

  const password =
    $("loginPassword").value;

  if(!email || !password){
    showError("Enter your email and password.");
    return;
  }

  try{

    const {error} =
      await db.auth.signInWithPassword({

        email,
        password

      });

    if(error)
      throw error;

  }catch(error){

    showError(error.message);

  }

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

  await db.auth.signOut();

}


/* =========================================
   SESSION
========================================= */

async function init(){

  const {
    data:{
      session
    }
  } =
    await db.auth.getSession();

  if(session){

    currentUser =
      session.user;

    await startApp();

  }else{

    $("authScreen")
      .classList
      .remove("hidden");

    $("app")
      .classList
      .add("hidden");

  }


  db.auth.onAuthStateChange(
    async (event,session)=>{

      if(session){

        currentUser =
          session.user;

        await startApp();

      }else{

        currentUser = null;
        currentProfile = null;

        $("authScreen")
          .classList
          .remove("hidden");

        $("app")
          .classList
          .add("hidden");

      }

    }
  );

}


/* =========================================
   START APP
========================================= */

async function startApp(){

  $("authScreen")
    .classList
    .add("hidden");

  $("app")
    .classList
    .remove("hidden");

  await loadProfile();

  await Promise.all([
    loadFeed(),
    loadStories(),
    loadNotifications(),
    loadProfileScreen()
  ]);

  setupRealtime();

}


/* =========================================
   PROFILE
========================================= */

async function loadProfile(){

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select("*")
      .eq("id",currentUser.id)
      .single();

  if(error){

    console.error(error);

    return;

  }

  currentProfile = data;

}


async function loadProfileScreen(){

  if(!currentProfile)
    return;

  const {
    count:followers
  } =
    await db
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq(
        "following_id",
        currentUser.id
      );

  const {
    count:following
  } =
    await db
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq(
        "follower_id",
        currentUser.id
      );

  const {
    count:posts
  } =
    await db
      .from("posts")
      .select("*",{count:"exact",head:true})
      .eq(
        "author_id",
        currentUser.id
      );

  $("profileContent").innerHTML = `

    <div class="profile">

      <div class="profile-head">

        <img
          class="profile-avatar"
          src="${escapeHTML(
            currentProfile.avatar_url ||
            "https://placehold.co/200x200/171720/ffffff?text=N"
          )}">

        <div class="profile-name">
          ${escapeHTML(currentProfile.display_name)}
        </div>

        <div class="profile-username">
          @${escapeHTML(currentProfile.username)}
          ${currentProfile.verified ? " ✓" : ""}
        </div>

        <div class="profile-bio">
          ${escapeHTML(currentProfile.bio)}
        </div>

        <div class="stats">

          <div class="stat">
            <strong>${posts || 0}</strong>
            <span>Posts</span>
          </div>

          <div class="stat">
            <strong>${followers || 0}</strong>
            <span>Followers</span>
          </div>

          <div class="stat">
            <strong>${following || 0}</strong>
            <span>Following</span>
          </div>

        </div>

        <div class="profile-buttons">

          <button
            class="profile-btn secondary"
            onclick="editProfile()">
            Edit Profile
          </button>

        </div>

      </div>

    </div>

  `;

}


async function editProfile(){

/* =========================================
   FEED
========================================= */

async function loadFeed(){

  $("feed").innerHTML =
    `<div class="loading">Loading...</div>`;

  const {
    data,
    error
  } =
    await db
      .from("posts")
      .select(`
        id,
        author_id,
        body,
        created_at,
        profiles:author_id(
          id,
          username,
          display_name,
          avatar_url,
          verified
        ),
        post_media(
          id,
          storage_path,
          media_type,
          sort_order
        ),
        reactions(
          user_id,
          reaction
        ),
        comments(
          id
        )
      `)
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(50);

  if(error){

    console.error(error);

    $("feed").innerHTML =
      `<div class="empty">
        Could not load feed.
      </div>`;

    return;
  }

  if(!data || !data.length){

    $("feed").innerHTML =
      `<div class="empty">
        No posts yet.
      </div>`;

    return;

  }

  $("feed").innerHTML =
    data.map(renderPost).join("");

}


function renderPost(post){

  const profile =
    post.profiles;

  const reactions =
    post.reactions || [];

  const comments =
    post.comments || [];

  const mine =
    reactions.find(
      r => r.user_id === currentUser.id
    );

  let mediaHTML = "";

  const media =
    (post.post_media || [])
      .sort(
        (a,b)=>
          a.sort_order-b.sort_order
      );

  if(media.length){

    const first =
      media[0];

    const url =
      `${SUPABASE_URL}/storage/v1/object/public/nova-media/${first.storage_path}`;

    if(first.media_type === "video"){

      mediaHTML = `
        <video
          class="post-media"
          controls
          playsinline
          src="${escapeHTML(url)}">
        </video>
      `;

    }else{

      mediaHTML = `
        <img
          class="post-media"
          loading="lazy"
          src="${escapeHTML(url)}">
      `;

    }

  }

  const avatar =
    profile?.avatar_url ||
    "https://placehold.co/100x100/171720/ffffff?text=N";

  return `

    <article
      class="post"
      id="post-${post.id}">

      <div class="post-head">

        <img
          class="avatar"
          src="${escapeHTML(avatar)}"
          onclick="openUser('${post.author_id}')">

        <div
          class="post-user"
          onclick="openUser('${post.author_id}')">

          <div class="username">
            ${escapeHTML(profile?.display_name || "NOVA User")}
            ${profile?.verified ? " ✓" : ""}
          </div>

          <div class="display">
            @${escapeHTML(profile?.username || "user")}
          </div>

        </div>

        <div class="time">
          ${timeAgo(post.created_at)}
        </div>

      </div>

      ${
        post.body
        ?
        `<div class="post-body">
          ${escapeHTML(post.body)}
        </div>`
        :
        ""
      }

      ${mediaHTML}

      <div class="post-actions">

        <button
          class="action-btn ${mine ? "reaction-active":""}"
          onclick="toggleReaction('${post.id}')">

          <svg viewBox="0 0 24 24">
            <path d="M20.8 8.6c0 5.2-8.8 10-8.8 10S3.2 13.8 3.2 8.6A4.6 4.6 0 017.8 4c1.7 0 3.3.9 4.2 2.2A5 5 0 0116.2 4a4.6 4.6 0 014.6 4.6z"/>
          </svg>

        </button>

        <span class="count">
          ${reactions.length}
        </span>

        <button
          class="action-btn"
          onclick="commentPost('${post.id}')">

          <svg viewBox="0 0 24 24">
            <path d="M20 11.5a7.5 7.5 0 01-8 7.5 9.8 9.8 0 01-4-.8L4 20l1.5-3A7.3 7.3 0 014 11.5 7.5 7.5 0 0112 4a7.5 7.5 0 018 7.5z"/>
          </svg>

        </button>

        <span class="count">
          ${comments.length}
        </span>

        ${
          post.author_id === currentUser.id
          ?
          `
          <button
            class="action-btn"
            onclick="deletePost('${post.id}')">

            <svg viewBox="0 0 24 24">
              <path d="M4 7h16"/>
              <path d="M10 11v6M14 11v6"/>
              <path d="M6 7l1 14h10l1-14"/>
              <path d="M9 7V4h6v3"/>
            </svg>

          </button>
          `
          :
          ""
        }

      </div>

    </article>

  `;

}


/* =========================================
   REACTION
========================================= */

async function toggleReaction(postId){

  const {
    data:existing
  } =
    await db
      .from("reactions")
      .select("*")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .maybeSingle();

  if(existing){

    await db
      .from("reactions")
      .delete()
      .eq("post_id",postId)
      .eq("user_id",currentUser.id);

  }else{

    await db
      .from("reactions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        reaction:"❤️"
      });

  }

  await loadFeed();

}


/* =========================================
   COMMENTS
========================================= */

async function commentPost(postId){

  const text =
    prompt("Write a comment:");

  if(!text || !text.trim())
    return;

  const {
    error
  } =
    await db
      .from("comments")
      .insert({
        post_id:postId,
        author_id:currentUser.id,
        body:text.trim()
      });

  if(error){

    alert(error.message);
    return;

  }

  await createNotificationForPost(
    postId,
    "comment"
  );

  await loadFeed();

}

   DELETE POST
========================================= */

async function deletePost(postId){

  if(!confirm("Delete this post?"))
    return;

  const {
    error
  } =
    await db
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("author_id",currentUser.id);

  if(error){

    alert(error.message);
    return;

  }

  await loadFeed();

}


/* =========================================
   CREATE POST
========================================= */

function previewMedia(event){

  selectedMedia =
    Array.from(
      event.target.files || []
    );

  const container =
    $("mediaPreview");

  container.innerHTML = "";

  selectedMedia.forEach(file=>{

    const url =
      URL.createObjectURL(file);

    if(file.type.startsWith("video")){

      container.innerHTML += `
        <video
          class="post-media"
          controls
          src="${url}">
        </video>
      `;

    }else{

      container.innerHTML += `
        <img
          class="post-media"
          src="${url}">
      `;

    }

  });

}


async function createPost(){

  const body =
    $("postText").value.trim();

  if(!body && !selectedMedia.length){

    alert("Write something or select media.");
    return;

  }

  try{

    const {
      data:post,
      error:postError
    } =
      await db
        .from("posts")
        .insert({
          author_id:currentUser.id,
          body
        })
        .select()
        .single();

    if(postError)
      throw postError;


    for(let i=0;i<selectedMedia.length;i++){

      const file =
        selectedMedia[i];

      const safeName =
        file.name
          .replace(/[^a-zA-Z0-9._-]/g,"_");

      const path =
        `${currentUser.id}/posts/${post.id}/${Date.now()}_${i}_${safeName}`;

      const {
        error:uploadError
      } =
        await db.storage
          .from("nova-media")
          .upload(
            path,
            file,
            {
              cacheControl:"3600",
              upsert:false
            }
          );

      if(uploadError)
        throw uploadError;


      const mediaType =
        file.type.startsWith("video")
          ? "video"
          : "image";


      const {
        error:mediaError
      } =
        await db
          .from("post_media")
          .insert({

            post_id:post.id,
            storage_path:path,
            media_type:mediaType,
            sort_order:i

          });

      if(mediaError)
        throw mediaError;

    }


    $("postText").value = "";

    $("mediaInput").value = "";

    $("mediaPreview").innerHTML = "";

    selectedMedia = [];

    openScreen(
      "home",
      document.querySelector(".nav-btn")
    );

    await loadFeed();


  }catch(error){

    alert(
      "Could not publish post: " +
      error.message
    );

  }

}


/* =========================================
   SEARCH
========================================= */

let searchTimer = null;

function searchUsers(value){

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(
      ()=>performSearch(value),
      350
    );

}


async function performSearch(value){

  const q =
    value.trim().toLowerCase();

  if(!q){

    $("searchResults").innerHTML = "";
    return;

  }

  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(`
        id,
        username,
        display_name,
        avatar_url,
        verified
      `)
      .or(
        `username.ilike.%${q}%,display_name.ilike.%${q}%`
      )
      .eq("disabled",false)
      .limit(30);

  if(error){

    $("searchResults").innerHTML =
      `<div class="empty">${escapeHTML(error.message)}</div>`;

    return;

  }

  if(!data.length){

    $("searchResults").innerHTML =
      `<div class="empty">No users found.</div>`;

    return;

  }

  $("searchResults").innerHTML =
    data.map(user=>`

      <div
        class="user-result"
        onclick="openUser('${user.id}')">

        <img
          class="avatar"
          src="${escapeHTML(
            user.avatar_url ||
            "https://placehold.co/100x100/171720/ffffff?text=N"
          )}">

        <div class="user-info">

          <div class="username">
            ${escapeHTML(user.display_name)}
            ${user.verified ? " ✓" : ""}
          </div>

          <div class="display">
            @${escapeHTML(user.username)}
          </div>

        </div>

      </div>

    `).join("");

}

   FOLLOW

async function followUser(userId){

  if(userId === currentUser.id)
    return;

  const {
    data:existing
  } =
    await db
      .from("follows")
      .select("*")
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        userId
      )
      .maybeSingle();

  if(existing){

    await db
      .from("follows")
      .delete()
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        userId
      );

  }else{

    await db
      .from("follows")
      .insert({
        follower_id:currentUser.id,

      });

    await db
      .from("notifications")

      });

}


/* =========================================
   OPEN USER
========================================= */

    error
  } =

      .select("*")
      .eq("id",userId)
      .single();

    alert(error.message);
    return;

  }

  const {
    count:followers
  } =
    await db
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq(
        "following_id",
        userId
      );

  const {
    count:following
  } =
    await db
      .from("follows")
      .select("*",{count:"exact",head:true})
      .eq(
        "follower_id",
        userId
      );

  const {
    count:posts
  } =
    await db
      .from("posts")
      .select("*",{count:"exact",head:true})
      .eq(
        "author_id",
        userId
      );

  const {
    data:follow
  } =
    await db
      .from("follows")
      .select("*")
      .eq(
        "follower_id",
        currentUser.id
      )
      .eq(
        "following_id",
        userId
      )
      .maybeSingle();


  $("profileContent").innerHTML = `

    <div class="profile">

      <div class="profile-head">

        <img
          class="profile-avatar"
          src="${escapeHTML(
            user.avatar_url ||
            "https://placehold.co/200x200/171720/ffffff?text=N"
          )}">

        <div class="profile-name">
          ${escapeHTML(user.display_name)}
          ${user.verified ? " ✓" : ""}
        </div>

        <div class="profile-username">
          @${escapeHTML(user.username)}
        </div>

        <div class="profile-bio">
          ${escapeHTML(user.bio)}
        </div>

        <div class="stats">

          <div class="stat">
            <strong>${posts || 0}</strong>
            <span>Posts</span>
          </div>

          <div class="stat">
            <strong>${followers || 0}</strong>
            <span>Followers</span>
          </div>

          <div class="stat">
            <strong>${following || 0}</strong>
            <span>Following</span>
          </div>

        </div>

        ${
          user.id !== currentUser.id
          ?
          `
          <div class="profile-buttons">

        }

/* =========================================
   STORIES
========================================= */

async function loadStories(){

  const {
    data,
    error
  } =
    await db
      .from("stories")
      .select(`
        id,
        author_id,
        created_at,
        expires_at,
        profiles:author_id(
          username,
          avatar_url
        ),
        story_media(
          storage_path,
          media_type,
          sort_order
        )
      `)
      .gt(
        "expires_at",
        new Date().toISOString()
      )
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(50);

  const container =
    $("stories");

  container.innerHTML = `

    <div class="create-story">

      <button
        class="add-story"
        onclick="createStory()">

        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="4"/>
          <path d="M12 8v8M8 12h8"/>
        </svg>

      </button>

      <div class="story-name">
        Add story
      </div>

    </div>

  `;

  if(error)
    return;

  (data || []).forEach(story=>{

    const media =
      (story.story_media || [])
        .sort(
          (a,b)=>
            a.sort_order-b.sort_order
        )[0];

    if(!media)
      return;

    const url =
      `${SUPABASE_URL}/storage/v1/object/public/nova-media/${media.storage_path}`;

    container.innerHTML += `

      <div
        class="story"
        onclick="openStory('${story.id}')">

        <div class="story-ring">

          <img
            class="story-avatar"
            src="${escapeHTML(
              story.profiles?.avatar_url ||
              url
            )}">

        </div>

        <div class="story-name">
          ${escapeHTML(
            story.profiles?.username || "User"
          )}
        </div>

      </div>

    `;

  });

}


/* =========================================
   STORY CREATION
========================================= */

async function createStory(){

  const input =
    document.createElement("input");

  input.type = "file";
  input.accept = "image/*,video/*";

  input.onchange =
    async ()=>{
      const file = input.files[0];

      if(!file)
        return;

      try{

        const storyResult =
          await db
            .from("stories")
            .insert({
              author_id:currentUser.id
            })
            .select()
            .single();

        if(storyResult.error)
          throw storyResult.error;

        const story =
          storyResult.data;

        const safeName =
          file.name
            .replace(/[^a-zA-Z0-9._-]/g,"_");

        const path =
          `${currentUser.id}/stories/${story.id}/${Date.now()}_${safeName}`;

        const upload =
          await db.storage
            .from("nova-media")
            .upload(
              path,
              file
            );

        if(upload.error)
          throw upload.error;

        const mediaType =
          file.type.startsWith("video")
            ? "video"
            : "image";

        const media =
          await db
            .from("story_media")
            .insert({
              story_id:story.id,
              storage_path:path,
              media_type:mediaType,
              sort_order:0
            });

        if(media.error)
          throw media.error;

        await loadStories();

      }catch(error){

        alert(error.message);

      }

    };

  input.click();

}


function openStory(id){

  alert(
    "Story viewer is the next NOVA module."
  );

}


/* =========================================
   NOTIFICATIONS
========================================= */

async function loadNotifications(){

  const {
    data,
    error
  } =
    await db
      .from("notifications")
      .select(`
        id,
        type,
        is_read,
        created_at,
        actor:actor_id(
          username,
          display_name
        )
      `)
      .eq(
        "recipient_id",
        currentUser.id
      )
      .order(
        "created_at",
        {ascending:false}
      )
      .limit(50);

  if(error)
    return;

  const unread =
    (data || [])
      .filter(n=>!n.is_read)
      .length;

  updateBadge(unread);

  if(!data?.length){

    $("notifications").innerHTML =
      `<div class="empty">
        No notifications.
      </div>`;

    return;

  }

  $("notifications").innerHTML =
    data.map(n=>`

      <div class="user-result">

        <div class="user-info">

          <div class="username">
            ${notificationText(n)}
          </div>

          <div class="display">
            ${timeAgo(n.created_at)}
          </div>

        </div>

      </div>

    `).join("");

}


function notificationText(n){

  const name =
    escapeHTML(
      n.actor?.display_name ||
      n.actor?.username ||
      "Someone"
    );

  if(n.type === "follow")
    return `${name} followed you.`;

  if(n.type === "comment")
    return `${name} commented on your post.`;

  if(n.type === "reaction")
    return `${name} reacted to your post.`;

  return `${name} interacted with you.`;

}


function updateBadge(count){

  const badge =
    $("notificationBadge");

  if(!count){

    badge.classList.add("hidden");
    return;

  }

  badge.classList.remove("hidden");

  badge.textContent =
    count > 99
      ? "99+"
      : count;

}


async function createNotificationForPost(
  postId,
  type
){

  const {
    data:post
  } =
    await db
      .from("posts")
      .select("author_id")
      .eq("id",postId)
      .single();

  if(!post)
    return;

  if(post.author_id === currentUser.id)
    return;

  await db
    .from("notifications")
    .insert({

      recipient_id:post.author_id,
      actor_id:currentUser.id,
      type,
      post_id:postId

    });

}


/* =========================================
   NAVIGATION
========================================= */

function openScreen(
  screen,
  button
){

  const screens = [
    "homeScreen",
    "searchScreen",
    "createScreen",
    "notificationsScreen",
    "profileScreen"
  ];

  screens.forEach(id=>{

    $(id)
      .classList
      .add("hidden");

  });

  const map = {
    home:"homeScreen",
    search:"searchScreen",
    create:"createScreen",
    notifications:"notificationsScreen",
    profile:"profileScreen"
  };

  $(map[screen])
    .classList
    .remove("hidden");

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>
      btn.classList.remove("active")
    );

  if(button)
    button.classList.add("active");

  if(screen === "notifications"){

    markNotificationsRead();

  }

}


async function markNotificationsRead(){

  await db
    .from("notifications")
    .update({
      is_read:true
    })
    .eq(
      "recipient_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );

  updateBadge(0);

}


/* =========================================
   REALTIME
========================================= */

function setupRealtime(){

  db.channel("nova-live")

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"messages"
      },
      payload=>{
        console.log(
          "Realtime message:",
          payload
        );
      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"notifications",
        filter:
          `recipient_id=eq.${currentUser.id}`
      },
      async ()=>{
        await loadNotifications();
      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      async ()=>{
        await loadFeed();
      }
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"follows"
      },
      async ()=>{
        await loadProfileScreen();
      }
    )

    .subscribe();

}
