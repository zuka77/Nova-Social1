<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NewGen Messages</title>

<script src="https://cdn.jsdelivr.net/npm/appwrite@23.0.0/dist/iife/sdk.js"></script>

<style>
:root{
 --bg:#070709;--panel:#101014;--panel2:#17171c;--line:#292931;
 --muted:#9696a3;--text:#fff;--accent:#2499e8;--accent2:#7557ff;
 --danger:#ff4668;--ok:#35d98b
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
body{min-height:100dvh}
button,input,textarea{font:inherit}
button{border:0;color:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.app{min-height:100dvh}
.top{height:66px;border-bottom:1px solid var(--line);display:flex;
align-items:center;justify-content:space-between;padding:0 18px;
position:sticky;top:0;background:#070709ee;backdrop-filter:blur(18px);z-index:20}
.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}
.topActions{display:flex;gap:8px}
.iconBtn{width:42px;height:42px;border-radius:50%;background:var(--panel2);
display:grid;place-items:center;font-size:20px}
.page{max-width:1180px;margin:auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px}
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px}
.authBox{width:min(430px,100%);padding:30px}
.logo{font-size:34px;font-weight:900;text-align:center;margin-bottom:8px}
.sub{text-align:center;color:var(--muted);margin-bottom:25px}
input,textarea{width:100%;background:#19191f;border:1px solid #303039;
color:white;border-radius:13px;padding:13px 14px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.field{margin-bottom:13px}
.btn{width:100%;padding:13px;border-radius:13px;background:var(--accent);
font-weight:700;margin-top:6px}
.btn.secondary{background:#222229}
.btn.danger{background:var(--danger)}
.switch{text-align:center;color:var(--muted);margin-top:18px}
.switch span{color:var(--accent);cursor:pointer}
.error{background:#38141d;color:#ff8ca1;padding:11px;border-radius:12px;margin-bottom:13px}
.home{display:grid;grid-template-columns:340px 1fr;gap:16px}
.sidebar{overflow:hidden}
.search{padding:14px;border-bottom:1px solid var(--line)}
.chatList{min-height:300px}
.chatRow{display:flex;align-items:center;gap:12px;padding:13px 15px;
border-bottom:1px solid #202027;cursor:pointer}
.chatRow:hover{background:#18181e}
.avatar{width:48px;height:48px;border-radius:50%;background:#292931;
object-fit:cover;flex:none}
.avatar.big{width:88px;height:88px}
.avatar.sm{width:38px;height:38px}
.chatInfo{min-width:0;flex:1}
.name{font-weight:750;display:flex;align-items:center;gap:5px}
.preview{color:var(--muted);font-size:14px;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.time{font-size:11px;color:var(--muted)}
.badge{display:inline-grid;place-items:center;width:16px;height:16px;
border-radius:50%;background:#168cff;color:#fff;font-size:10px;font-weight:900}
.empty{text-align:center;color:var(--muted);padding:45px 20px}
.chat{height:calc(100dvh - 102px);display:flex;flex-direction:column;overflow:hidden}
.chatHead{height:68px;display:flex;align-items:center;gap:11px;
padding:10px 14px;border-bottom:1px solid var(--line)}
.back{font-size:24px;background:none}
.chatHeadInfo{flex:1;min-width:0}
.messages{flex:1;overflow:auto;padding:18px 12px;display:flex;
flex-direction:column;gap:6px}
.msgLine{display:flex;max-width:85%}
.msgLine.me{margin-left:auto;justify-content:flex-end}
.bubble{padding:9px 12px;border-radius:18px;background:#202027;
position:relative;word-break:break-word}
.me .bubble{background:#168cff}
.bubble img,.bubble video{display:block;max-width:min(300px,70vw);
max-height:400px;border-radius:13px;margin-top:3px}
.msgTime{font-size:9px;opacity:.55;margin-top:3px}
.replyBox{margin:0 10px 7px;padding:8px 12px;background:#19191f;
border-left:3px solid var(--accent);border-radius:10px;font-size:12px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px;
border-top:1px solid var(--line);background:#0d0d10}
.composer textarea{resize:none;max-height:100px}
.send{width:45px;height:45px;border-radius:50%;background:var(--accent)}
.mediaBtn,.voiceBtn{width:45px;height:45px;border-radius:50%;background:#202027;
display:grid;place-items:center;font-size:20px}
.voiceBtn.recording{background:var(--danger)}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tab{padding:10px 15px;border-radius:12px;background:#1b1b21;color:var(--muted)}
.tab.active{background:var(--accent);color:#fff}
.profile{text-align:center;padding:28px}
.profileName{font-size:25px;font-weight:850;margin-top:13px}
.bio{color:var(--muted);margin:8px 0 18px}
.profileActions{display:flex;gap:8px;justify-content:center}
.profileActions button{padding:10px 18px;border-radius:12px;background:#202027}
.profileActions .primary{background:var(--accent)}
.post{margin-top:16px;overflow:hidden}
.postHead{display:flex;align-items:center;gap:10px;padding:13px}
.postBody{padding:0 15px 14px}
.postMedia{width:100%;max-height:600px;object-fit:cover}
.settings{display:grid;gap:10px}
.setting{padding:17px;background:var(--panel);border:1px solid var(--line);
border-radius:15px;display:flex;align-items:center;justify-content:space-between}
.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(12px);
z-index:100;display:grid;place-items:center;padding:18px}
.modalBox{width:min(480px,100%);max-height:90dvh;overflow:auto;
background:#15151b;border:1px solid #34343e;border-radius:22px;padding:20px}
.modalTitle{font-size:20px;font-weight:800;margin-bottom:16px}
.previewMedia{width:100%;max-height:400px;object-fit:contain;border-radius:14px;margin:10px 0}
.longMenu{position:fixed;z-index:200;left:50%;top:50%;transform:translate(-50%,-50%);
width:min(300px,90vw);background:#17171d;border:1px solid #393943;
border-radius:20px;padding:8px;box-shadow:0 25px 80px #000b}
.longMenu button{width:100%;padding:13px;text-align:left;background:none;border-radius:12px}
.longMenu button:hover{background:#24242c}
.reactions{display:flex;gap:4px;margin-top:4px}
.reaction{background:#25252d;border-radius:10px;padding:2px 6px;font-size:12px}
.storyGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.story{height:230px;border-radius:18px;overflow:hidden;position:relative;
background:#202027;cursor:pointer}
.story img,.story video{width:100%;height:100%;object-fit:cover}
.storyLabel{position:absolute;left:10px;bottom:10px;font-weight:700;
text-shadow:0 2px 8px #000}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);
background:#fff;color:#111;padding:12px 17px;border-radius:13px;
z-index:300;box-shadow:0 8px 30px #0008}
@media(max-width:760px){
 .home{display:block}
 .sidebar{display:block}
 .home.chatOpen .sidebar{display:none}
 .home.chatOpen .chatWrap{display:block}
 .chatWrap{display:none}
 .chat{height:calc(100dvh - 66px)}
 .page{padding:10px}
 .top{height:58px}
}
</style>
</head>

<body>

<div id="app">
  <div class="auth">
    <div class="card authBox">
      <div class="logo">NewGen Messages</div>
      <div class="sub">Connect. Message. Share.</div>
      <div id="authError" class="error hidden"></div>

      <div id="loginForm">
        <div class="field">
          <input id="loginEmail" type="email" placeholder="Email">
        </div>
        <div class="field">
          <input id="loginPassword" type="password" placeholder="Password">
        </div>
        <button class="btn" onclick="login()">Log in</button>
        <div class="switch">Don't have an account?
          <span onclick="showSignup()">Create account</span>
        </div>
      </div>

      <div id="signupForm" class="hidden">
        <div class="field">
          <input id="signupName" placeholder="Display name">
        </div>
        <div class="field">
          <input id="signupUsername" placeholder="Username">
        </div>
        <div class="field">
          <input id="signupEmail" type="email" placeholder="Email">
        </div>
        <div class="field">
          <input id="signupPassword" type="password" placeholder="Password">
        </div>
        <button class="btn" onclick="signup()">Create account</button>
        <div class="switch">Already have an account?
          <span onclick="showLogin()">Log in</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================
   NEWGEN MESSAGES
   ========================= */

const CFG={
 endpoint:"https://fra.cloud.appwrite.io/v1",
 projectId:"6aa242bf00012f890e92",
 databaseId:"6aa41332002b049743d5",
 bucketId:"6aa421b20025a1b4aac8",
 ownerCode:"Carlos-2839",
 ownerFunction:"https://6aa476550001ca179b26.fra.appwrite.run/"
};

const TABLES={
 profiles:"profiles",
 posts:"posts",
 conversations:"conversations",
 conversation_members:"conversation_members",
 messages:"messages",
 message_reactions:"message_reactions",
 comments:"comments",
 reactions:"reactions",
 follows:"follows",
 notifications:"notifications",
 stories:"stories",
 story_views:"story_views",
 story_reactions:"story_reactions",
 story_replies:"story_replies",
 user_presence:"user_presence",
 reports:"reports",
 post_media:"post_media",
 story_media:"story_media",
 verification:"verification",
 admin_actions:"admin_actions",
 user_blocks:"user_blocks",
 comment_reactions:"comment_reactions"
};

let client=null;
let account=null;
let db=null;
let storage=null;
let realtime=null;
let me=null;
let activeChat=null;
let activeProfile=null;
let chatCache=[];
let subs=[];
let recording=false;
let recorder=null;
let recordedChunks=[];
let replyTarget=null;
let currentPage="home";

function $(id){
 return document.getElementById(id);
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function avatarUrl(p){
 if(!p?.avatar)return "";
 if(p.avatar.startsWith("http"))return p.avatar;
 try{
  return storage.getFileView(CFG.bucketId,p.avatar).toString();
 }catch{
  return "";
 }
}

function badge(p){
 return p?.verified?'<span class="badge">✓</span>':"";
}

function timeAgo(date){
 if(!date)return "";
 const d=new Date(date);
 if(Number.isNaN(d.getTime()))return "";
 const s=Math.floor((Date.now()-d.getTime())/1000);
 if(s<60)return "now";
 if(s<3600)return Math.floor(s/60)+"m";
 if(s<86400)return Math.floor(s/3600)+"h";
 if(s<604800)return Math.floor(s/86400)+"d";
 return d.toLocaleDateString();
}

function toast(text){
 $("toastRoot").innerHTML=`<div class="toast">${esc(text)}</div>`;
 setTimeout(()=>{$("toastRoot").innerHTML=""},2200);
}

function showError(text){
 const el=$("authError");
 if(!el)return;
 el.textContent=text;
 el.classList.remove("hidden");
}

function clearError(){
 $("authError")?.classList.add("hidden");
}

function showLogin(){
 $("loginForm")?.classList.remove("hidden");
 $("signupForm")?.classList.add("hidden");
 clearError();
}

function showSignup(){
 $("loginForm")?.classList.add("hidden");
 $("signupForm")?.classList.remove("hidden");
 clearError();
}

/* ---------- APPWRITE INIT ---------- */

function initAppwrite(){
 if(!window.Appwrite){
  document.body.innerHTML=`
  <div style="min-height:100vh;background:#070709;color:white;
  display:grid;place-items:center;padding:30px;font-family:Arial">
   <div style="max-width:450px;text-align:center">
    <h2>NewGen Messages</h2>
    <p style="color:#aaa">Appwrite SDK could not be loaded.</p>
    <button onclick="location.reload()"
    style="padding:12px 20px;border:0;border-radius:12px">
    Reload
    </button>
   </div>
  </div>`;
  return false;
 }

 try{
  const {
   Client,Account,TablesDB,Storage,Realtime,ID,Query,Channel
  }=Appwrite;

  client=new Client()
   .setEndpoint(CFG.endpoint)
   .setProject(CFG.projectId);

  account=new Account(client);
  db=new TablesDB(client);
  storage=new Storage(client);
  realtime=new Realtime(client);

  window.ID=ID;
  window.Query=Query;
  window.Channel=Channel;

  return true;
 }catch(e){
  console.error(e);
  return false;
}

/* ---------- AUTH ---------- */

async function signup(){
 clearError();

 const name=$("signupName").value.trim();
 const username=$("signupUsername").value.trim().toLowerCase();
 const email=$("signupEmail").value.trim();
 const password=$("signupPassword").value;

 if(!name||!username||!email||!password){
  showError("Please fill in all fields.");
  return;
 }

 if(password.length<8){
  showError("Password must be at least 8 characters.");
  return;
 }

 try{
  await account.create(ID.unique(),email,password,name);

  await account.createEmailPasswordSession(email,password);

  me=await account.get();

  try{
   await db.createRow(
    CFG.databaseId,
    TABLES.profiles,
    ID.unique(),
    {
     userId:me.$id,
     username,
     displayName:name,
     avatar:"",
     bio:"",
     email,
     verified:false,
     createdAt:new Date().toISOString()
    }
   );
  }catch(e){
   console.warn("profile create",e);
  }

  await startApp();

 }catch(e){
  console.error(e);
  showError(e?.message||"Registration failed.");
 }
}

async function login(){
 clearError();

 const email=$("loginEmail").value.trim();
 const password=$("loginPassword").value;

 if(!email||!password){
  showError("Enter email and password.");
  return;
 }

 try{
  await account.createEmailPasswordSession(email,password);
  await startApp();
 }catch(e){
  console.error(e);
  showError(e?.message||"Login failed.");
 }
}

async function logout(){
 try{
  await account.deleteSession("current");
 }catch{}
 location.reload();
}

async function startApp(){
 try{
  me=await account.get();
  await ensureProfile();
  renderShell();
  await loadHome();
  subscribeGlobal();
 }catch(e){
  console.error(e);
  showError(e?.message||"Could not start app.");
 }
}

async function ensureProfile(){
 try{
  const r=await db.listRows(
   CFG.databaseId,
   TABLES.profiles,
   [Query.equal("userId",me.$id),Query.limit(1)]
  );

  if(!r.rows.length){
   await db.createRow(
    CFG.databaseId,
    TABLES.profiles,
    ID.unique(),
    {
     userId:me.$id,
     username:(me.name||"user").toLowerCase().replace(/\s+/g,""),
     displayName:me.name||"User",
     avatar:"",
     bio:"",
     email:me.email||"",
     verified:false,
     createdAt:new Date().toISOString()
    }
   );
  }
 }catch(e){
  console.warn(e);
 }
}

async function getProfile(userId){
 try{
  const r=await db.listRows(
   CFG.databaseId,
   TABLES.profiles,
   [Query.equal("userId",userId),Query.limit(1)]
  );
  return r.rows[0]||null;
 }catch{
  return null;
 }
}

async function refreshProfiles(){
 return true;
}

/* ---------- SHELL ---------- */

function renderShell(){
 document.getElementById("app").innerHTML=`
 <div class="app">
  <header class="top">
   <div class="brand">NewGen Messages</div>
   <div class="topActions">
    <button class="iconBtn" onclick="openSearch()">⌕</button>
    <button class="iconBtn" onclick="openSettings()">⚙</button>
   </div>
  </header>

  <main class="page">
   <div id="mainContent"></div>
  </main>
 </div>`;
}

async function loadHome(){
 currentPage="home";

 $("mainContent").innerHTML=`
 <div class="home" id="homeLayout">
  <section class="card sidebar">
   <div class="search">
    <input id="chatSearch" placeholder="Search messages or people"
    oninput="filterChats(this.value)">
   </div>
   <div id="chatList" class="chatList">
    <div class="empty">Loading chats...</div>
   </div>
  </section>

  <section class="chatWrap">
   <div id="chatArea" class="card chat">
    <div class="empty">
     <div style="font-size:42px">💬</div>
     <h2>NewGen Messages</h2>
     <p>Choose a chat or search for someone to start messaging.</p>
    </div>
   </div>
  </section>
 </div>`;

 chatCache=await getChatRows();
 renderChatList();
}

async function getChatRows(){
 const out=[];

 try{
  const mem=await db.listRows(
   CFG.databaseId,
   TABLES.conversation_members,
   [Query.equal("userId",me.$id),Query.limit(100)]
  );

  for(const m of mem.rows||[]){
   try{
    const conv=await db.getRow(
     CFG.databaseId,
     TABLES.conversations,
     m.conversationId
    );

    const members=await db.listRows(
     CFG.databaseId,
     TABLES.conversation_members,
     [Query.equal("conversationId",m.conversationId),Query.limit(20)]
    );

    const other=members.rows.find(x=>x.userId!==me.$id);
    if(!other)continue;

    const profile=await getProfile(other.userId);
    if(!profile)continue;

    out.push({
     conversation:conv,
     member:m,
     profile
    });
   }catch(e){
    console.warn(e);
   }
  }
 }catch(e){
  console.warn(e);
 }

 return out.sort((a,b)=>{
  return new Date(b.conversation?.lastMessageAt||0)-
         new Date(a.conversation?.lastMessageAt||0);
 });
}

function renderChatList(list=chatCache){
 const el=$("chatList");
 if(!el)return;

 if(!list.length){
  el.innerHTML=`
   <div class="empty">
    <div style="font-size:35px">💬</div>
    <p>No chats yet.</p>
    <button class="btn" style="width:auto;padding:10px 18px"
    onclick="openSearch()">Find people</button>
   </div>`;
  return;
 }

 el.innerHTML=list.map(x=>{
  const p=x.profile;
  const av=avatarUrl(p);

  return`
  <div class="chatRow" onclick='openChat(${JSON.stringify(x.conversation).replace(/'/g,"&#39;")})'>
   ${av
    ?`<img class="avatar" src="${esc(av)}">`
    :`<div class="avatar"></div>`}
   <div class="chatInfo">
    <div class="name">${esc(p.displayName||p.username)} ${badge(p)}</div>
    <div class="preview">${esc(x.conversation?.lastMessage||"No messages yet")}</div>
   </div>
   <div class="time">${timeAgo(x.conversation?.lastMessageAt)}</div>
  </div>`;
 }).join("");
}

function filterChats(q){
 q=q.toLowerCase().trim();
 renderChatList(
  chatCache.filter(x=>
   (x.profile.displayName||"").toLowerCase().includes(q)||
   (x.profile.username||"").toLowerCase().includes(q)||
   (x.conversation.lastMessage||"").toLowerCase().includes(q)
  )
 );
}

/* ---------- SEARCH ---------- */

async function openSearch(){
 modal(`
  <div class="modalTitle">Find people</div>
  <input id="peopleSearch" placeholder="Search username or name"
   oninput="searchPeople(this.value)">
  <div id="peopleResults" style="margin-top:15px"></div>
 `);
}

async function searchPeople(q){
 const el=$("peopleResults");
 if(!el)return;

 q=q.trim().toLowerCase();

 if(q.length<2){
  el.innerHTML=`<div class="empty">Type at least 2 characters.</div>`;
  return;
 }

 try{
  const r=await db.listRows(
   CFG.databaseId,
   TABLES.profiles,
   [Query.limit(100)]
  );

  const rows=r.rows.filter(p=>
   p.userId!==me.$id &&
   ((p.username||"").toLowerCase().includes(q)||
    (p.displayName||"").toLowerCase().includes(q))
  );

  if(!rows.length){
   el.innerHTML=`<div class="empty">No users found.</div>`;
   return;
  }

  el.innerHTML=rows.map(p=>{
   const av=avatarUrl(p);

   return`
   <div class="chatRow" onclick="startChat('${esc(p.userId)}')">
    ${av?`<img class="avatar" src="${esc(av)}">`:`<div class="avatar"></div>`}
    <div class="chatInfo">
     <div class="name">${esc(p.displayName||p.username)} ${badge(p)}</div>
     <div class="preview">@${esc(p.username)}</div>
    </div>
   </div>`;
  }).join("");

 }catch(e){
  el.innerHTML=`<div class="empty">${esc(e.message||"Search failed")}</div>`;
 }
}

/* ---------- CONVERSATIONS ---------- */

async function startChat(userId){
 closeModal();

 try{
  const myM=await db.listRows(
   CFG.databaseId,
   TABLES.conversation_members,
   [Query.equal("userId",me.$id),Query.limit(100)]
  );

  for(const m of myM.rows||[]){
   const other=await db.listRows(
    CFG.databaseId,
    TABLES.conversation_members,
    [Query.equal("conversationId",m.conversationId),
     Query.equal("userId",userId),Query.limit(1)]
   );

   if(other.rows.length){
    const conv=await db.getRow(
     CFG.databaseId,
     TABLES.conversations,
     m.conversationId
    );
    await openChat(conv);
    return;
   }
  }

  const conv=await db.createRow(
   CFG.databaseId,
   TABLES.conversations,
   ID.unique(),
   {
    createdAt:new Date().toISOString(),
    type:"direct",
    lastMessage:"",
    lastMessageAt:new Date().toISOString()
   }
  );

  await db.createRow(
   CFG.databaseId,
   TABLES.conversation_members,
   ID.unique(),
   {
    conversationId:conv.$id,
    userId:me.$id,
    joinedAt:new Date().toISOString(),
    isAdmin:false
   }
  );

  await db.createRow(
   CFG.databaseId,
   TABLES.conversation_members,
   ID.unique(),
   {
    conversationId:conv.$id,
    userId,
    joinedAt:new Date().toISOString(),
    isAdmin:false
   }
  );

  await openChat(conv);

 }catch(e){
  console.error(e);
  toast(e.message||"Could not create chat");
 }
}

async function openChat(conv){
 activeChat=conv;

 $("homeLayout")?.classList.add("chatOpen");

 const members=await db.listRows(
  CFG.databaseId,
  TABLES.conversation_members,

async function loadMessages(){
 if(!activeChat)return;

 const el=$("messages");
 if(!el)return;

 try{
  const r=await db.listRows(
   CFG.databaseId,

   [
    Query.equal("conversationId",activeChat.$id),
    Query.orderAsc("createdAt"),
    Query.limit(100)

function msg(m){
 const mine=m.senderId===me.$id;
 let media="";

 if(m.media){
  const url=m.media.startsWith("http")
   ?m.media
   :storage.getFileView(CFG.bucketId,m.media).toString();

  if(m.mediaType==="video"){
   media=`<video src="${esc(url)}" controls playsinline></video>`;
  }else{
   media=`<img src="${esc(url)}" loading="lazy">`;
  }
 }

 const content=m.deleted
  ?`<i style="opacity:.5">Message deleted</i>`
  :esc(m.content||"");

 return`
 <div class="msgLine ${mine?"me":""}" data-id="${esc(m.$id)}"
  ontouchstart="touchStart(event,'${esc(m.$id)}')"
  ontouchend="touchEnd(event,'${esc(m.$id)}')"
  oncontextmenu="longPress(event,'${esc(m.$id)}');return false">

  <div class="bubble">
   ${m.replyTo?`<div style="font-size:11px;opacity:.55;margin-bottom:4px">↪ Reply</div>`:""}

async function toggleVoice(){
 if(recording){
  recorder?.stop();
  return;
 }

 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});

  recordedChunks=[];
  recorder=new MediaRecorder(stream);
  recording=true;

  $("voiceButton").classList.add("recording");
  $("voiceButton").textContent="■";

  recorder.ondataavailable=e=>{
   if(e.data.size)recordedChunks.push(e.data);
  };

  recorder.onstop=async()=>{
   recording=false;
   $("voiceButton").classList.remove("recording");
   $("voiceButton").textContent="🎙";

   stream.getTracks().forEach(t=>t.stop());

   const blob=new Blob(recordedChunks,{type:"audio/webm"});
   await sendVoice(blob);
  };

  recorder.start();

 }catch(e){
  toast("Microphone permission is required.");
 }
}

let touchInfo={};

function touchStart(e,id){
 const t=e.touches?.[0];
 if(!t)return;

 touchInfo={
  id,
  x:t.clientX,
  y:t.clientY,
  time:Date.now()
 };
}

function touchEnd(e,id){
 if(!touchInfo.id)return;

 const t=e.changedTouches?.[0];
 if(!t)return;

 const dx=t.clientX-touchInfo.x;
 const duration=Date.now()-touchInfo.time;

 if(dx>65){
  setReply(id);
 }

 touchInfo={};
}

/* ---------- REALTIME ---------- */

function unsubscribeAll(){
 subs.forEach(s=>{
  try{s.unsubscribe()}catch{}
 });
 subs=[];
}

function subscribeGlobal(){
 unsubscribeAll();

 if(!realtime)return;

 try{
  const channels=[
   Channel.tablesdb(CFG.databaseId).table(TABLES.profiles).row().create(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.profiles).row().update(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.notifications).row().create(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.stories).row().create(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.messages).row().create(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.messages).row().update(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.conversations).row().update(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.conversation_members).row().create()
  ];

  const s=realtime.subscribe(channels,async()=>{
   try{
    if($("chatList")){
     chatCache=await getChatRows();
     renderChatList();
    }
   }catch{}
  });

  subs.push(s);

 }catch(e){
  console.warn("Realtime global",e);
 }
}

function subscribeChatAndList(){
 unsubscribeAll();

 if(!realtime||!activeChat)return;

 try{
  const channels=[
   Channel.tablesdb(CFG.databaseId).table(TABLES.messages).row().create(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.messages).row().update(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.message_reactions).row().create(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.message_reactions).row().update(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.conversations).row().update(),
   Channel.tablesdb(CFG.databaseId).table(TABLES.conversation_members).row().create()
  ];

  const s=realtime.subscribe(channels,async p=>{
   const r=p?.payload;

   if(r?.conversationId===activeChat?.$id){
    await loadMessages();
   }

   if($("chatList")){
    chatCache=await getChatRows();
    renderChatList();
   }
  });

  subs.push(s);

 }catch(e){
  console.warn("Realtime chat",e);
 }
}

/* ---------- MODAL ---------- */

function modal(html){
 $("modalRoot").innerHTML=`
  <div class="modal" onclick="modalOutside(event)">
   <div class="modalBox" onclick="event.stopPropagation()">
    ${html}
   </div>
  </div>`;
}

function modalOutside(e){
 if(e.target.classList.contains("modal")){
  closeModal();
 }
}

function closeModal(){
 $("modalRoot").innerHTML="";
 window.__pendingMedia=null;
}
