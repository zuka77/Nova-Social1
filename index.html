<body>
<div id="app"></div>

<script>
(()=>{
'use strict';

/* =========================================================
   NEWGEN MESSAGES
   APPWRITE CONFIG
========================================================= */

const CFG={
 endpoint:'https://fra.cloud.appwrite.io/v1',
 projectId:'6aa242bf00012f890e92',
 databaseId:'6aa41332002b049743d5',
 bucketId:'6aa421b20025a1b4aac8'
};

const OWNER_CODE='Carlos-2839';

const T={
 profiles:'profiles',
 posts:'posts',
 conversations:'conversations',
 conversation_members:'conversation_members',
 messages:'messages',
 message_reactions:'message_reactions',
 comments:'comments',
 reactions:'reactions',
 follows:'follows',
 notifications:'notifications',
 stories:'stories',
 story_views:'story_views',
 story_reactions:'story_reactions',
 story_replies:'story_replies',
 user_presence:'user_presence',
 reports:'reports',
 post_media:'post_media',
 story_media:'story_media',
 verification:'verification',
 user_blocks:'user_blocks',
 comment_reactions:'comment_reactions'
};

const {
 Client,
 Account,
 TablesDB,
 Storage,
 ID,
 Query,
 Realtime,
 Channel
}=Appwrite;

const client=
 new Client()
 .setEndpoint(CFG.endpoint)
 .setProject(CFG.projectId);

const account=new Account(client);
const db=new TablesDB(client);
const storage=new Storage(client);
const realtime=new Realtime(client);

let me=null;
let myProfile=null;
let profiles=[];
let activeChat=null;
let activeUser=null;
let replyingTo=null;
let recording=null;
let chunks=[];
let subscriptions=[];

/* =========================================================
   HELPERS
========================================================= */

const $=s=>document.querySelector(s);

const esc=s=>
 String(s??'')
 .replace(
  /[&<>"']/g,
  c=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[c])
 );

function toast(message){
 const x=document.createElement('div');
 x.className='toast';
 x.textContent=message;
 document.body.appendChild(x);
 setTimeout(()=>x.remove(),2800);
}

function fail(error){
 console.error(error);
 toast(error?.message||'Something went wrong');
}

function ago(value){
 const n=Math.max(
  0,
  Date.now()-new Date(value).getTime()
 );

 const m=Math.floor(n/60000);

 if(m<1)return'now';
 if(m<60)return m+'m';

 const h=Math.floor(m/60);

 if(h<24)return h+'h';

 return Math.floor(h/24)+'d';
}

function badge(){
 return`<span class="verified-badge" title="Verified">✓</span>`;
}

function verifiedFor(profile){
 return !!profile?.verified;
}

function avatar(profile,cls=''){
 profile=profile||{};

 const letter=esc(
  (
   profile.displayName||
   profile.username||
   '?'
  )
  .slice(0,1)
  .toUpperCase()
 );

 if(profile.avatar){
  return`
   <img
    class="avatar ${cls}"
    src="${esc(profile.avatar)}"
    onerror="
     this.outerHTML='<span class=&quot;avatar ${cls}&quot;>${letter}</span>'
    ">
  `;
 }

 return`
  <span class="avatar ${cls}">
   ${letter}
  </span>
 `;
}

function icon(name){

 const paths={

  home:
   '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

  search:
   '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',

  plus:
   '<path d="M12 5v14M5 12h14"/>',

  heart:
   '<path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6A4.6 4.6 0 0 1 12 6.3a4.6 4.6 0 0 1 8.8 2.3Z"/>',

  comment:
   '<path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.8 8.8 0 0 1-4-.9L4 19l.9-3.8A7.5 7.5 0 1 1 20 11.5Z"/>',

  send:
   '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',

  bell:
   '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',

  user:
   '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

  back:
   '<path d="m15 18-6-6 6-6"/>',

  image:
   '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/>',

  mic:
   '<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',

  more:
   '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',

  close:
   '<path d="M6 6l12 12M18 6 6 18"/>',

  settings:
   '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V22h-2.5v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8.1 15a1.7 1.7 0 0 0-1.6-1H6v-2.5h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V5h2.5v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1V14h-.1a1.7 1.7 0 0 0-1.6 1Z"/>'
 };

 return`
  <svg viewBox="0 0 24 24">
   ${paths[name]||paths.more}
  </svg>
 `;
}

/* =========================================================
   APPWRITE
========================================================= */

async function list(table,queries=[]){

 const result=
  await db.listRows({
   databaseId:CFG.databaseId,
   tableId:table,
   queries
  });

 return result.rows||[];
}

async function one(table,rowId){

 return db.getRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId
 });
}

async function create(table,data){

 return db.createRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId:ID.unique(),
  data
 });
}

async function update(table,rowId,data){

 return db.updateRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId,
  data
 });
}

async function remove(table,rowId){

 return db.deleteRow({
  databaseId:CFG.databaseId,
  tableId:table,
  rowId
 });
}

async function upload(file){

 if(!file){
  throw new Error('No file selected');
 }

 const result=
  await storage.createFile({
   bucketId:CFG.bucketId,
   fileId:ID.unique(),
   file
  });

 const url=
  storage.getFileView({
   bucketId:CFG.bucketId,
   fileId:result.$id
  }).toString();

 return{
  id:result.$id,
  url,
  type:file.type,
  name:file.name
 };
}

function parseMedia(value){

 if(!value)return null;

 if(typeof value==='object'){
  return value;
 }

 try{
  return JSON.parse(value);
 }catch{
  return{
   url:value,
   type:'image'
  };
 }
}

function mediaMarkup(value){

 const m=parseMedia(value);

 if(!m?.url)return'';

 const type=m.type||'';

 if(
  type.startsWith('video')||
  type==='video'
 ){
  return`
   <video
    class="postvideo"
    src="${esc(m.url)}"
    controls
    playsinline>
   </video>
  `;
 }

 return`
  <img
   class="postmedia"
   src="${esc(m.url)}"
   alt="">
 `;
}

/* =========================================================
   PROFILE
========================================================= */

async function getProfile(uid){

 try{

  const rows=
   await list(
    T.profiles,
    [
     Query.equal('userId',uid),
     Query.limit(1)
    ]
   );

  return rows[0]||null;

 }catch{
  return null;
 }
}

async function ensureProfile(){

 myProfile=
  await getProfile(me.$id);

 if(myProfile)return;

 let base=
  (
   me.name||
   me.email.split('@')[0]
  )
  .replace(/[^a-zA-Z0-9_]/g,'')
  .slice(0,25)
  ||'user';

 let username=base;
 let number=1;

 while(
  (
   await list(
    T.profiles,
    [
     Query.equal('username',username),
     Query.limit(1)
    ]
   )
  ).length
 ){

  username=base+number++;
 }

 myProfile=
  await create(
   T.profiles,
   {
    userId:me.$id,
    username,
    displayName:me.name||username,
    email:me.email,
    avatar:'',
    bio:'',
    verified:false,
    createdAt:new Date().toISOString()
   }
  );
}

async function drawHomeChats(){

 const box=$('#homeChats');

 if(!box)return;

 const query=
  $('#homeChatSearch')
  ?.value
  .trim()
  .toLowerCase()||'';

 const users=
  profiles.filter(
   p=>
    p.userId!==me.$id&&
    (
     p.username+
     ' '+
     (p.displayName||'')
    )
    .toLowerCase()
    .includes(query)
  );

 const mine=
  await list(
   T.conversation_members,
   [
    Query.equal(
     'userId',
     me.$id
    ),
    Query.limit(300)
   ]
  ).catch(()=>[]);

 const ids=
  new Set(
   mine.map(
    x=>x.conversationId
   )
  );

 let conversations=
  await list(
   T.conversations,
   [
    Query.orderDesc(
     'lastMessageAt'
    ),
    Query.limit(300)
   ]
  ).catch(()=>[]);

 conversations=
  conversations.filter(
   x=>ids.has(x.$id)
  );

 const ordered=[];

 for(
  const conversation of conversations
 ){

  const members=
   await list(
    T.conversation_members,
    [
     Query.equal(
      'conversationId',
      conversation.$id
     ),
     Query.limit(10)
    ]
   ).catch(()=>[]);

  const other=
   members.find(
    x=>x.userId!==me.$id
   );

  if(!other)continue;

  const p=
   profiles.find(
    x=>x.userId===other.userId
   )
   ||await getProfile(other.userId);

  if(!p)continue;

  ordered.push({
   conversation,
   profile:p
  });
 }

 const shownIds=
  new Set(
   ordered.map(
    x=>x.profile.userId
   )
  );

 const extras=
  users
   .filter(
    p=>!shownIds.has(p.userId)
   )
   .map(
    p=>({
     conversation:null,
     profile:p
    })
   );

 const all=
  ordered.concat(extras);

 box.innerHTML=
  all.map(
   x=>`

    <button
     class="userrow"
     onclick="go('chat','${x.profile.userId}')">

     ${avatar(x.profile)}

     <div class="userinfo">

      <b>
       ${esc(
        x.profile.displayName||
        x.profile.username
       )}

       ${
        verifiedFor(x.profile)
        ?badge()
        :''
       }
      </b>

      <small>
       ${
        x.conversation
        ?esc(
         x.conversation.lastMessage||
         'Open chat'
        )
        :'Start a conversation'
       }
      </small>

     </div>

     ${
      x.conversation
      ?`
       <small style="color:var(--muted)">
        ${ago(
         x.conversation.lastMessageAt||
         x.conversation.$updatedAt||
         x.conversation.$createdAt
        )}
       </small>
      `
      :''
     }

    </button>

   `
  )
  .join('')
  ||
  '<div class="empty">No users yet.</div>';
}

async function editProfile(){

 const name=
  prompt(
   'Display name',
   myProfile.displayName||''
  );

 if(name===null)return;

 const bio=
  prompt(
   'Bio',
   myProfile.bio||''
  );

 if(bio===null)return;

 try{

  let avatarUrl=
   myProfile.avatar||'';

  const choose=
   confirm(
    'Do you want to change your profile photo?'
   );

  if(choose){

   const input=
    document.createElement('input');

   input.type='file';
   input.accept='image/*';

   await new Promise(resolve=>{

    input.onchange=
     async()=>{

      if(input.files[0]){

       try{

        const m=
         await upload(
          input.files[0]
         );

        avatarUrl=m.url;

       }catch(error){

        fail(error);
       }
      }

      resolve();
     };

    input.click();
   });
  }

  myProfile=
   await update(
    T.profiles,
    myProfile.$id,
    {
     displayName:name,
     bio,
     avatar:avatarUrl
    }
   );

  await refreshProfiles();

  toast('Profile updated');

  profile(me.$id);

 }catch(error){
  fail(error);
 }
}

function bindMessageGestures(){

 document
  .querySelectorAll('.msgrow')
  .forEach(
   element=>{

    let startX=0;
    let timer=null;

    element.ontouchstart=
     e=>{
      startX=
       e.touches[0].clientX;
     };

    element.ontouchend=
     e=>{

      const dx=
       e.changedTouches[0].clientX-
       startX;

      if(Math.abs(dx)>55){

       setReply(
        element.dataset.id
       );
      }
    };

    element.onpointerdown=
     ()=>{
      timer=
       setTimeout(
        ()=>{
         setReply(
          element.dataset.id
         );
        },
        600
       );
    };

    element.onpointerup=
     ()=>{
      clearTimeout(timer);
     };

    element.onpointercancel=
     ()=>{
      clearTimeout(timer);
     };
   }
  );
}

async function toggleVoice(){

 if(recording){

  recording.stop();

  return;
 }

 if(
  !navigator.mediaDevices||
  !navigator.mediaDevices.getUserMedia
 ){

  return toast(
   'Microphone is not available'
  );
 }

 try{

  const stream=
   await navigator.mediaDevices
    .getUserMedia({
     audio:true
    });

  chunks=[];

  recording=
   new MediaRecorder(
    stream
   );

  recording.ondataavailable=
   e=>{
    chunks.push(e.data);
   };

  recording.onstop=
   async()=>{

    stream
     .getTracks()
     .forEach(
      track=>track.stop()
     );

    const blob=
     new Blob(
      chunks,
      {
       type:
        recording.mimeType||
        'audio/webm'
      }
     );

    recording=null;

    $('#micBtn')
     ?.classList
     .remove('recording');

    try{

     const file=
      new File(
       [blob],
       'voice-'+
       Date.now()+
       '.webm',
       {
        type:blob.type
       }
      );

     const media=
      await upload(file);

     await create(
      T.messages,
      {
       conversationId:
        activeChat.$id,

       senderId:
        me.$id,

       content:'',

       media:
        JSON.stringify(media),

       mediaType:'audio',

       replyTo:
        replyingTo?.$id||'',

       createdAt:
        new Date().toISOString(),

       deleted:false
      }
     );

     cancelReply();

     await loadMessages();

    }catch(error){
     fail(error);
    }
   };

  recording.start();

  $('#micBtn')
   .classList
   .add('recording');

  toast(
   'Recording… tap again to send'
  );

 }catch(error){
  fail(error);
 }
}

function unsubscribeAll(){

  sub=>{
   try{
    sub.unsubscribe();
   }catch{}
  }
 );

}

function subscribeChat(){

 unsubscribeAll();

 if(!activeChat)return;

 try{

  const sub=
   realtime.subscribe(
    [
     Channel
      .tablesdb(
       CFG.databaseId
      )
      .table(
       T.messages
      )
      .row()
      .create(),

     Channel
      .tablesdb(
       CFG.databaseId
      )
      .table(
       T.messages
      )
      .row()
      .update(),

     Channel
      .tablesdb(
       CFG.databaseId
      )
      .table(
       T.message_reactions
      )
      .row()
    ],
    payload=>{

     const data=
      payload?.payload;

     if(
      data?.conversationId===
      activeChat?.$id
     ){

      loadMessages();
     }
    }
   );

  subscriptions.push(sub);

 }catch(error){

  console.warn(
   'Realtime chat unavailable',
   error
  );
 }
}

function subscribeGlobal(){

 try{

  const sub=
   realtime.subscribe(
    [
     Channel
      .tablesdb(
       CFG.databaseId
      )
      .table(
       T.posts
      )
      .row(),

     Channel
      .tablesdb(
       CFG.databaseId
      )
      .table(
       T.notifications
      )
      .row(),

     Channel
      .tablesdb(
       CFG.databaseId
      )
      .table(
       T.profiles
      )
      .row(),

     Channel
      .tablesdb(
       CFG.databaseId
      )
      .table(
       T.stories
      )
      .row()
    ],
    ()=>{
     refreshProfiles();
    }
   );

  subscriptions.push(sub);

 }catch(error){

  console.warn(
   'Global realtime unavailable',
   error
  );
 }
}

/* =========================================================
   LOGOUT / BOOT
========================================================= */

async function logout(){

 try{

  unsubscribeAll();

  try{
   await realtime.disconnect();
  }catch{}

  await account.deleteSession({
   sessionId:'current'
  });

  location.reload();

 }catch(error){
  fail(error);
 }
}

async function boot(){

 try{

  me=
   await account.get();

 }catch{

  auth();

  return;
 }

 try{

  await ensureProfile();

  await refreshProfiles();

  shell();

  await home();

  subscribeGlobal();

 }catch(error){

  console.error(error);

  $('#main').innerHTML=`

   <div class="card empty">

    <b>
     Appwrite error
    </b>

    <br><br>

    ${esc(
     error?.message||
     String(error)
    )}

   </div>
  `;
 }
}
